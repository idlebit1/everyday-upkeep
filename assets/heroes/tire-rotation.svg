<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a friendly flat-style green car raised on jack stands with one wheel removed, leaning against the car beside a torque wrench, while two terracotta arrows arc between the front and rear wheel positions to show them trading places">
      <ellipse cx="285" cy="398" rx="248" ry="22" fill="#efe7d8"/>
      <circle cx="72" cy="66" r="24" fill="#f2cf7a"/>
      <ellipse cx="452" cy="68" rx="46" ry="22" fill="#dce8ee"/>
      <ellipse cx="410" cy="80" rx="28" ry="15" fill="#dce8ee"/>
      <ellipse cx="120" cy="120" rx="32" ry="15" fill="#dce8ee"/>
      <!-- swap arrows above the car -->
      <path d="M196 156 q90 -64 188 -2" stroke="#d9663f" stroke-width="7" fill="none" stroke-linecap="round"/>
      <polygon points="384,140 402,158 376,164" fill="#d9663f"/>
      <path d="M396 188 q-94 60 -190 4" stroke="#d98e3b" stroke-width="7" fill="none" stroke-linecap="round"/>
      <polygon points="214,202 192,190 218,178" fill="#d98e3b"/>
      <!-- car body, raised -->
      <path d="M118 308 q0 -52 46 -56 l28 -3 q22 -36 70 -38 l92 0 q48 2 70 38 l36 5 q42 8 42 54 l0 22 q0 12 -12 12 l-360 0 q-12 0 -12 -12 z" fill="#3e7c59"/>
      <path d="M194 252 q20 -30 64 -32 l88 0 q44 2 64 32 z" fill="#2c5a40"/>
      <path d="M210 250 q16 -22 50 -24 l38 0 0 24 z" fill="#cfe3ec"/>
      <path d="M310 226 l36 0 q34 2 50 24 l-86 0 z" fill="#cfe3ec"/>
      <rect x="118" y="310" width="384" height="14" fill="#2c5a40"/>
      <circle cx="484" cy="296" r="10" fill="#e0a93d"/>
      <circle cx="134" cy="296" r="8" fill="#c96f4a"/>
      <!-- front hub exposed: wheel removed -->
      <circle cx="206" cy="338" r="20" fill="#b9b1a3"/>
      <circle cx="206" cy="338" r="11" fill="#8a6a4f"/>
      <g fill="#fffdf8">
        <circle cx="206" cy="328" r="2.6"/>
        <circle cx="215" cy="335" r="2.6"/>
        <circle cx="212" cy="346" r="2.6"/>
        <circle cx="200" cy="346" r="2.6"/>
        <circle cx="197" cy="335" r="2.6"/>
      </g>
      <!-- rear wheel still on -->
      <circle cx="434" cy="346" r="36" fill="#33393b"/>
      <circle cx="434" cy="346" r="35" fill="none" stroke="#2c3234" stroke-width="4" stroke-dasharray="9 8"/>
      <circle cx="434" cy="346" r="16" fill="#b9b1a3"/>
      <circle cx="434" cy="346" r="5" fill="#8a6a4f"/>
      <!-- jack stands front and rear -->
      <path d="M170 332 l40 0 -8 50 -24 0 z" fill="#d9663f"/>
      <rect x="160" y="382" width="60" height="9" rx="4.5" fill="#c96f4a"/>
      <path d="M360 350 l36 0 -7 32 -22 0 z" fill="#d9663f"/>
      <rect x="352" y="382" width="52" height="9" rx="4.5" fill="#c96f4a"/>
      <!-- removed wheel leaning by the car -->
      <circle cx="86" cy="350" r="40" fill="#33393b"/>
      <circle cx="86" cy="350" r="39" fill="none" stroke="#2c3234" stroke-width="4" stroke-dasharray="10 8"/>
      <circle cx="86" cy="350" r="18" fill="#dce8ee"/>
      <circle cx="86" cy="350" r="6" fill="#7fb3c8"/>
      <!-- chalk mark on the loose wheel -->
      <path d="M70 336 l8 8 M78 336 l-8 8" stroke="#e0a93d" stroke-width="3.5" stroke-linecap="round"/>
      <!-- torque wrench on the ground -->
      <g transform="rotate(12 502 388)">
        <rect x="466" y="384" width="56" height="8" rx="4" fill="#8a6a4f"/>
        <rect x="506" y="382" width="18" height="12" rx="4" fill="#e0a93d"/>
        <circle cx="462" cy="388" r="9" fill="#b9b1a3"/>
        <circle cx="462" cy="388" r="4" fill="#fffdf8"/>
      </g>
      <!-- wheel chock -->
      <path d="M474 392 l20 0 0 -16 z" fill="#8a6a4f"/>
      <!-- shrubs -->
      <circle cx="540" cy="380" r="13" fill="#5e9a78"/>
      <circle cx="520" cy="388" r="10" fill="#3e7c59"/>
      <ellipse cx="146" cy="396" rx="6" ry="3.5" fill="#c96f4a" transform="rotate(16 146 396)"/>
    </svg>
