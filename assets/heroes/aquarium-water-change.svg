<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of an aquarium water change in a living room: a planted glass fish tank with healthy fish swimming, a gravel-vacuum siphon pulling water out into a bucket on the floor, a bottle of water conditioner and a fresh bucket of clean water standing beside it, the heater and filter visible inside the tank, a window and houseplant in the background">
      <ellipse cx="285" cy="404" rx="255" ry="22" fill="#efe7d8"/>

      <!-- background window for the living room feel -->
      <rect x="40" y="30" width="96" height="120" rx="6" fill="#fffdf8" stroke="#8a6a4f" stroke-width="5"/>
      <rect x="48" y="38" width="80" height="104" rx="3" fill="#dce8ee"/>
      <line x1="88" y1="38" x2="88" y2="142" stroke="#8a6a4f" stroke-width="4"/>
      <line x1="48" y1="90" x2="128" y2="90" stroke="#8a6a4f" stroke-width="4"/>
      <!-- houseplant on the floor by the window -->
      <path d="M62 340 h30 l-5 30 h-20 z" fill="#c96f4a"/>
      <path d="M77 340 q-4 -26 -16 -36" stroke="#3e7c59" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M77 340 q5 -24 18 -30" stroke="#3e7c59" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="58" cy="300" rx="8" ry="13" fill="#5e9a78" transform="rotate(-30 58 300)"/>
      <ellipse cx="96" cy="306" rx="8" ry="13" fill="#3e7c59" transform="rotate(28 96 306)"/>

      <!-- stand / cabinet under the tank -->
      <rect x="180" y="300" width="250" height="70" rx="6" fill="#8a6a4f"/>
      <rect x="180" y="300" width="250" height="10" rx="4" fill="#b9b1a3"/>
      <rect x="196" y="320" width="100" height="40" rx="4" fill="#7a5d44"/>
      <rect x="314" y="320" width="100" height="40" rx="4" fill="#7a5d44"/>

      <!-- the aquarium -->
      <rect x="186" y="120" width="238" height="186" rx="8" fill="#dce8ee" stroke="#b9b1a3" stroke-width="6"/>
      <!-- water (lowered a little, mid-change) -->
      <rect x="192" y="150" width="226" height="150" rx="4" fill="#7fb3c8" opacity="0.55"/>
      <!-- old water surface line -->
      <line x1="192" y1="150" x2="418" y2="150" stroke="#9cc3d4" stroke-width="3"/>
      <!-- gravel substrate -->
      <rect x="192" y="282" width="226" height="18" rx="3" fill="#c9a06b"/>
      <g fill="#b9b1a3">
        <circle cx="210" cy="290" r="3"/>
        <circle cx="240" cy="293" r="2.6"/>
        <circle cx="280" cy="289" r="3.2"/>
        <circle cx="330" cy="293" r="2.8"/>
        <circle cx="380" cy="290" r="3"/>
      </g>

      <!-- live plants in the tank -->
      <g stroke="#3e7c59" stroke-width="5" fill="none" stroke-linecap="round">
        <path d="M214 282 q-6 -40 6 -72"/>
        <path d="M226 282 q6 -34 -4 -60"/>
      </g>
      <g stroke="#5e9a78" stroke-width="5" fill="none" stroke-linecap="round">
        <path d="M398 282 q8 -44 -4 -74"/>
        <path d="M386 282 q-6 -30 4 -54"/>
      </g>

      <!-- heater inside the tank, right wall -->
      <rect x="404" y="168" width="9" height="92" rx="4" fill="#c96f4a"/>
      <rect x="404" y="168" width="9" height="14" rx="4" fill="#d9663f"/>
      <line x1="408" y1="186" x2="408" y2="252" stroke="#fffdf8" stroke-width="2" opacity="0.7"/>
      <!-- hang-on-back filter, top right, with outflow -->
      <rect x="418" y="138" width="22" height="34" rx="4" fill="#5e9a78"/>
      <path d="M420 172 q2 8 -4 14" fill="none" stroke="#7fb3c8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

      <!-- healthy fish -->
      <g>
        <ellipse cx="262" cy="200" rx="20" ry="11" fill="#d98e3b"/>
        <path d="M242 200 l-12 -8 l0 16 z" fill="#e0a93d"/>
        <circle cx="274" cy="197" r="2.4" fill="#33393b"/>
        <path d="M258 200 q6 -3 12 0" stroke="#c96f4a" stroke-width="1.6" fill="none"/>
      </g>
      <g>
        <ellipse cx="330" cy="235" rx="16" ry="9" fill="#c96f4a"/>
        <path d="M314 235 l-10 -6 l0 12 z" fill="#d9663f"/>
        <circle cx="340" cy="233" r="2" fill="#33393b"/>
      </g>
      <g>
        <ellipse cx="300" cy="178" rx="12" ry="7" fill="#e0a93d"/>
        <path d="M289 178 l-8 -5 l0 10 z" fill="#d98e3b"/>
        <circle cx="308" cy="176" r="1.7" fill="#33393b"/>
      </g>

      <!-- gravel-vacuum siphon: wide tube in the gravel, hose over the rim to the bucket -->
      <rect x="346" y="156" width="16" height="40" rx="6" fill="#dce8ee" stroke="#9cc3d4" stroke-width="2"/>
      <!-- water + debris being pulled up the wide tube -->
      <g fill="#8a6a4f" opacity="0.6">
        <circle cx="354" cy="190" r="2"/>
        <circle cx="352" cy="180" r="1.6"/>
        <circle cx="356" cy="172" r="1.8"/>
      </g>
      <!-- thin hose rising out of the tank, over the rim, down to the bucket on the floor -->
      <path d="M354 156 q4 -28 28 -34 q40 -10 44 60 q3 70 -36 96" fill="none" stroke="#9cc3d4" stroke-width="7" stroke-linecap="round"/>
      <!-- draining water arriving in the bucket -->
      <path d="M434 274 q-2 30 -6 50" fill="none" stroke="#7fb3c8" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

      <!-- DIRTY bucket on the floor (water being removed) -->
      <path d="M404 326 h70 l-9 56 h-52 z" fill="#b9b1a3"/>
      <path d="M400 322 h78 l-3 10 h-72 z" fill="#8a6a4f"/>
      <!-- tinted, slightly dirty water in it -->
      <path d="M410 338 h58 l-6 40 h-46 z" fill="#7fb3c8" opacity="0.6"/>
      <path d="M428 290 q22 -14 50 0" fill="none" stroke="#9cc3d4" stroke-width="3" stroke-linecap="round"/>

      <!-- FRESH bucket of clean water, front left -->
      <path d="M150 330 h66 l-8 52 h-50 z" fill="#5e9a78"/>
      <path d="M146 326 h74 l-3 9 h-68 z" fill="#3e7c59"/>
      <!-- clean blue water -->
      <path d="M156 340 h54 l-6 38 h-42 z" fill="#7fb3c8" opacity="0.55"/>
      <path d="M158 340 h52" stroke="#dce8ee" stroke-width="3" stroke-linecap="round"/>

      <!-- bottle of water conditioner / dechlorinator beside the fresh bucket -->
      <rect x="116" y="316" width="26" height="46" rx="5" fill="#c96f4a"/>
      <rect x="121" y="304" width="16" height="14" rx="3" fill="#8a6a4f"/>
      <rect x="119" y="330" width="20" height="20" rx="3" fill="#fffdf8" opacity="0.9"/>
      <!-- drop glyph on the label -->
      <path d="M129 335 q4 5 0 9 q-4 -4 0 -9 z" fill="#7fb3c8"/>
    </svg>
