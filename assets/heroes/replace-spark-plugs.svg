<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a friendly flat-style green engine with a fresh spark plug being lowered into a cylinder on a beam of golden spark, an ignition coil pack set aside, and a worn, sooty old spark plug resting nearby">
      <ellipse cx="280" cy="402" rx="250" ry="22" fill="#efe7d8"/>
      <circle cx="70" cy="64" r="22" fill="#f2cf7a"/>
      <ellipse cx="468" cy="70" rx="44" ry="20" fill="#dce8ee"/>
      <ellipse cx="424" cy="82" rx="26" ry="14" fill="#dce8ee"/>
      <!-- engine block slab -->
      <rect x="64" y="186" width="432" height="120" rx="18" fill="#3e7c59"/>
      <rect x="64" y="282" width="432" height="24" rx="10" fill="#2c5a40"/>
      <!-- valve-cover ribs -->
      <g stroke="#5e9a78" stroke-width="6" stroke-linecap="round">
        <line x1="96" y1="204" x2="96" y2="270"/>
        <line x1="116" y1="204" x2="116" y2="270"/>
        <line x1="136" y1="204" x2="136" y2="270"/>
        <line x1="156" y1="204" x2="156" y2="270"/>
      </g>
      <!-- spark-plug wells across the head -->
      <g>
        <rect x="208" y="196" width="34" height="26" rx="6" fill="#26302c"/>
        <rect x="262" y="196" width="34" height="26" rx="6" fill="#26302c"/>
        <rect x="316" y="196" width="34" height="26" rx="6" fill="#26302c"/>
      </g>
      <!-- coil pack set aside (right) -->
      <g transform="rotate(-8 420 252)">
        <rect x="402" y="214" width="36" height="60" rx="8" fill="#2c5a40"/>
        <rect x="408" y="206" width="24" height="14" rx="5" fill="#5e9a78"/>
        <rect x="412" y="274" width="16" height="20" rx="4" fill="#1d2521"/>
        <rect x="436" y="222" width="18" height="10" rx="4" fill="#b9b1a3"/>
      </g>
      <!-- fresh spark plug dropping into the center well on a golden spark beam -->
      <g>
        <!-- ceramic insulator -->
        <rect x="266" y="96" width="26" height="46" rx="6" fill="#fffdf8" stroke="#d8cfbe" stroke-width="2.5"/>
        <!-- ribs on insulator -->
        <g stroke="#e9e2d8" stroke-width="2.4">
          <line x1="268" y1="108" x2="290" y2="108"/>
          <line x1="268" y1="118" x2="290" y2="118"/>
          <line x1="268" y1="128" x2="290" y2="128"/>
        </g>
        <!-- metal hex shell -->
        <rect x="263" y="142" width="32" height="20" rx="3" fill="#b9b1a3"/>
        <!-- threaded body -->
        <rect x="270" y="162" width="18" height="22" rx="3" fill="#dce8ee"/>
        <g stroke="#7fb3c8" stroke-width="2">
          <line x1="270" y1="167" x2="288" y2="167"/>
          <line x1="270" y1="173" x2="288" y2="173"/>
          <line x1="270" y1="179" x2="288" y2="179"/>
        </g>
        <!-- electrode tip -->
        <rect x="277" y="184" width="4" height="8" fill="#8a6a4f"/>
        <path d="M275 192 l8 0 0 4 -4 0" fill="#8a6a4f"/>
        <!-- golden spark beam down into the well -->
        <path d="M279 192 L274 204 L282 204 L276 218" stroke="#e0a93d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- sparkle on the fresh plug -->
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="304" y1="100" x2="304" y2="110"/>
        <line x1="298" y1="105" x2="310" y2="105"/>
      </g>
      <!-- OLD worn, sooty plug resting on the ground (left) -->
      <g transform="rotate(-18 150 352)">
        <rect x="120" y="318" width="20" height="36" rx="5" fill="#8a6a4f" stroke="#6e5333" stroke-width="2"/>
        <g stroke="#6e5333" stroke-width="2"><line x1="122" y1="328" x2="138" y2="328"/><line x1="122" y1="336" x2="138" y2="336"/></g>
        <rect x="117" y="354" width="26" height="16" rx="3" fill="#6e5333"/>
        <rect x="123" y="370" width="14" height="16" rx="3" fill="#5a544a"/>
        <!-- soot blobs -->
        <circle cx="130" cy="380" r="4" fill="#33393b"/>
        <circle cx="124" cy="362" r="3" fill="#33393b"/>
      </g>
      <text x="150" y="404" font-size="14" font-weight="700" fill="#8a6a4f" text-anchor="middle">60k miles of wear</text>
      <!-- torque wrench leaning at right -->
      <g transform="rotate(20 502 360)">
        <rect x="470" y="356" width="64" height="9" rx="4.5" fill="#c96f4a"/>
        <rect x="528" y="354" width="14" height="13" rx="3" fill="#8a6a4f"/>
        <circle cx="470" cy="360" r="9" fill="#b9b1a3"/>
        <circle cx="470" cy="360" r="3.5" fill="#fffdf8"/>
      </g>
      <!-- shrubs -->
      <circle cx="70" cy="384" r="14" fill="#5e9a78"/>
      <circle cx="92" cy="390" r="11" fill="#3e7c59"/>
      <circle cx="520" cy="392" r="10" fill="#5e9a78"/>
    </svg>
