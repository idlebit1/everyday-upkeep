      <rect x="204" y="242" width="48" height="7" rx="3.5" fill="#e9e2d8"/>
      <rect x="204" y="255" width="56" height="7" rx="3.5" fill="#e9e2d8"/>
      <rect x="132" y="282" width="136" height="9" rx="4.5" fill="#e3efe8"/>
