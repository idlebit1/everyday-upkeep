      <!-- phone -->
      <rect x="396" y="196" width="78" height="146" rx="14" fill="#2c5a40"/>
      <rect x="404" y="210" width="62" height="112" rx="6" fill="#fffdf8"/>
      <rect x="410" y="218" width="23" height="23" rx="3" fill="#e0a93d"/>
      <rect x="437" y="218" width="23" height="23" rx="3" fill="#c96f4a"/>
      <rect x="410" y="245" width="23" height="23" rx="3" fill="#5e9a78"/>
      <rect x="437" y="245" width="23" height="23" rx="3" fill="#7fb3c8"/>
      <rect x="410" y="276" width="50" height="7" rx="3.5" fill="#e9e2d8"/>
