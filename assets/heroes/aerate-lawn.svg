<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a green lawn with a walk-behind core aerator pulling small soil plugs onto the surface, leaving rows of holes, under a bright sun with a fence and shrubs behind">
      <ellipse cx="290" cy="402" rx="250" ry="22" fill="#efe7d8"/>
      <circle cx="478" cy="64" r="26" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="4" stroke-linecap="round">
        <line x1="478" y1="20" x2="478" y2="30"/>
        <line x1="478" y1="98" x2="478" y2="108"/>
        <line x1="434" y1="64" x2="444" y2="64"/>
        <line x1="512" y1="64" x2="522" y2="64"/>
        <line x1="447" y1="33" x2="454" y2="40"/>
        <line x1="502" y1="88" x2="509" y2="95"/>
        <line x1="509" y1="33" x2="502" y2="40"/>
      </g>
      <ellipse cx="120" cy="78" rx="46" ry="22" fill="#dce8ee"/>
      <ellipse cx="170" cy="92" rx="30" ry="16" fill="#dce8ee"/>
      <ellipse cx="330" cy="56" rx="34" ry="17" fill="#dce8ee"/>
      <!-- fence -->
      <g fill="#b9b1a3">
        <rect x="36" y="196" width="14" height="74" rx="4"/>
        <rect x="76" y="196" width="14" height="74" rx="4"/>
        <rect x="116" y="196" width="14" height="74" rx="4"/>
        <rect x="156" y="196" width="14" height="74" rx="4"/>
        <rect x="196" y="196" width="14" height="74" rx="4"/>
      </g>
      <rect x="28" y="208" width="190" height="10" rx="5" fill="#8a6a4f"/>
      <rect x="28" y="240" width="190" height="10" rx="5" fill="#8a6a4f"/>
      <!-- shrubs -->
      <circle cx="262" cy="248" r="28" fill="#2c5a40"/>
      <circle cx="296" cy="258" r="22" fill="#3e7c59"/>
      <circle cx="510" cy="262" r="26" fill="#5e9a78"/>
      <circle cx="540" cy="272" r="18" fill="#3e7c59"/>
      <!-- lawn -->
      <path d="M10 290 Q280 262 550 290 L550 392 Q280 412 10 392 Z" fill="#3e7c59"/>
      <path d="M10 322 Q280 298 550 322 L550 392 Q280 412 10 392 Z" fill="#5e9a78" opacity="0.45"/>
      <!-- grass tufts -->
      <g stroke="#2c5a40" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M60 340 v-12 M67 340 l4 -10 M53 340 l-4 -10"/>
        <path d="M460 350 v-12 M467 350 l4 -10 M453 350 l-4 -10"/>
        <path d="M520 376 v-12 M527 376 l4 -10 M513 376 l-4 -10"/>
        <path d="M90 384 v-11 M97 384 l4 -9 M83 384 l-4 -9"/>
      </g>
      <!-- rows of aeration holes pulled across the lawn -->
      <g fill="#5a4632" opacity="0.55">
        <ellipse cx="150" cy="346" rx="5" ry="3"/>
        <ellipse cx="180" cy="350" rx="5" ry="3"/>
        <ellipse cx="210" cy="354" rx="5" ry="3"/>
        <ellipse cx="160" cy="370" rx="5" ry="3"/>
        <ellipse cx="190" cy="374" rx="5" ry="3"/>
        <ellipse cx="130" cy="372" rx="5" ry="3"/>
      </g>
      <!-- soil plugs sitting on the surface -->
      <g fill="#8a6a4f">
        <rect x="146" y="338" width="8" height="6" rx="2"/>
        <rect x="176" y="342" width="8" height="6" rx="2"/>
        <rect x="206" y="346" width="8" height="6" rx="2"/>
        <rect x="126" y="364" width="8" height="6" rx="2"/>
        <rect x="186" y="366" width="8" height="6" rx="2"/>
      </g>
      <g fill="#6f543d">
        <rect x="156" y="362" width="8" height="6" rx="2"/>
        <rect x="216" y="380" width="8" height="6" rx="2"/>
        <rect x="106" y="382" width="8" height="6" rx="2"/>
      </g>
      <!-- core aerator (walk-behind) -->
      <g>
        <!-- handle -->
        <line x1="330" y1="332" x2="408" y2="262" stroke="#8a6a4f" stroke-width="9" stroke-linecap="round"/>
        <line x1="396" y1="254" x2="420" y2="274" stroke="#8a6a4f" stroke-width="9" stroke-linecap="round"/>
        <!-- engine deck -->
        <rect x="300" y="300" width="74" height="34" rx="8" fill="#c96f4a"/>
        <rect x="306" y="288" width="40" height="18" rx="5" fill="#d9663f"/>
        <circle cx="362" cy="296" r="7" fill="#fffdf8" stroke="#8a6a4f" stroke-width="2"/>
        <!-- coring drum with tines -->
        <rect x="298" y="338" width="78" height="22" rx="6" fill="#33393b"/>
        <g stroke="#b9b1a3" stroke-width="4" stroke-linecap="round">
          <line x1="312" y1="360" x2="312" y2="376"/>
          <line x1="330" y1="360" x2="330" y2="378"/>
          <line x1="348" y1="360" x2="348" y2="378"/>
          <line x1="366" y1="360" x2="366" y2="376"/>
        </g>
        <!-- wheels -->
        <circle cx="300" cy="372" r="14" fill="#33393b"/>
        <circle cx="300" cy="372" r="5" fill="#b9b1a3"/>
        <circle cx="376" cy="372" r="14" fill="#33393b"/>
        <circle cx="376" cy="372" r="5" fill="#b9b1a3"/>
      </g>
      <circle cx="120" cy="392" r="13" fill="#5e9a78"/>
      <circle cx="142" cy="396" r="10" fill="#3e7c59"/>
    </svg>
