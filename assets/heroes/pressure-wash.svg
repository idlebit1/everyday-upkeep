<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a backyard deck being pressure washed: the left half of the boards is freshly cleaned light wood, the right half is still dark with green algae, and a wand sprays a blue fan of water at the dividing line while an electric pressure washer sits on the grass with its hose, next to a shrub and a watering can">
      <ellipse cx="285" cy="400" rx="248" ry="22" fill="#efe7d8"/>
      <!-- sun -->
      <circle cx="492" cy="58" r="22" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="492" y1="22" x2="492" y2="30"/>
        <line x1="528" y1="58" x2="520" y2="58"/>
        <line x1="518" y1="32" x2="512" y2="38"/>
        <line x1="518" y1="84" x2="512" y2="78"/>
      </g>
      <!-- house corner with siding -->
      <rect x="22" y="92" width="128" height="158" fill="#fffdf8" stroke="#e6dccb" stroke-width="2"/>
      <g stroke="#efe7d8" stroke-width="3">
        <line x1="24" y1="118" x2="148" y2="118"/>
        <line x1="24" y1="144" x2="148" y2="144"/>
        <line x1="24" y1="170" x2="148" y2="170"/>
        <line x1="24" y1="196" x2="148" y2="196"/>
        <line x1="24" y1="222" x2="148" y2="222"/>
      </g>
      <polygon points="12,94 86,40 160,94" fill="#c96f4a"/>
      <rect x="52" y="120" width="34" height="34" rx="3" fill="#dce8ee" stroke="#e6dccb" stroke-width="2"/>
      <line x1="69" y1="120" x2="69" y2="154" stroke="#fffdf8" stroke-width="2"/>
      <!-- deck platform -->
      <g>
        <!-- clean half: boards -->
        <g fill="#c9a06b">
          <polygon points="60,262 290,262 280,278 46,278"/>
          <polygon points="44,282 278,282 268,298 30,298"/>
          <polygon points="28,302 266,302 256,318 14,318"/>
        </g>
        <g stroke="#b9874f" stroke-width="2" opacity="0.5">
          <line x1="170" y1="264" x2="160" y2="276"/>
          <line x1="150" y1="284" x2="140" y2="296"/>
          <line x1="132" y1="304" x2="122" y2="316"/>
        </g>
        <!-- dirty half: darker boards with algae -->
        <g fill="#8a6a4f">
          <polygon points="290,262 522,262 530,278 280,278"/>
          <polygon points="278,282 528,282 536,298 268,298"/>
          <polygon points="266,302 534,302 542,318 256,318"/>
        </g>
        <g fill="#2c5a40" opacity="0.55">
          <ellipse cx="356" cy="270" rx="14" ry="4"/>
          <ellipse cx="430" cy="290" rx="18" ry="4.5"/>
          <ellipse cx="492" cy="272" rx="12" ry="3.5"/>
          <ellipse cx="330" cy="310" rx="16" ry="4"/>
          <ellipse cx="470" cy="310" rx="20" ry="4.5"/>
          <ellipse cx="392" cy="306" rx="10" ry="3"/>
        </g>
        <!-- deck skirt -->
        <polygon points="14,318 256,318 256,344 14,344" fill="#b9874f"/>
        <polygon points="256,318 542,318 542,344 256,344" fill="#6f543e"/>
        <g stroke="#8a6a4f" stroke-width="2" opacity="0.6">
          <line x1="70" y1="320" x2="70" y2="342"/>
          <line x1="140" y1="320" x2="140" y2="342"/>
          <line x1="210" y1="320" x2="210" y2="342"/>
        </g>
      </g>
      <!-- clean/dirty contrast line -->
      <line x1="290" y1="258" x2="258" y2="320" stroke="#dce8ee" stroke-width="5" stroke-linecap="round"/>
      <!-- wand spraying at the line -->
      <g>
        <rect x="356" y="158" width="64" height="13" rx="6" transform="rotate(38 356 158)" fill="#33393b"/>
        <rect x="398" y="186" width="34" height="10" rx="5" transform="rotate(38 398 186)" fill="#c96f4a"/>
        <!-- spray fan -->
        <polygon points="352,172 268,260 310,276" fill="#7fb3c8" opacity="0.55"/>
        <polygon points="352,172 282,262 300,270" fill="#dce8ee" opacity="0.8"/>
        <!-- mist droplets -->
        <g fill="#7fb3c8">
          <circle cx="262" cy="244" r="3.5"/>
          <circle cx="252" cy="270" r="3"/>
          <circle cx="286" cy="232" r="3"/>
          <circle cx="304" cy="284" r="3.5"/>
          <circle cx="274" cy="296" r="2.5"/>
        </g>
        <!-- hose draping from the wand handle to the machine -->
        <path d="M428 212 q44 36 36 84 q-6 44 -56 56" stroke="#33393b" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>
      <!-- electric pressure washer unit -->
      <g>
        <rect x="338" y="346" width="70" height="46" rx="10" fill="#c96f4a"/>
        <rect x="348" y="330" width="40" height="20" rx="6" fill="#d9663f"/>
        <rect x="352" y="356" width="30" height="9" rx="4" fill="#fbe9e1"/>
        <circle cx="396" cy="368" r="8" fill="#fffdf8" stroke="#8a6a4f" stroke-width="2.5"/>
        <line x1="396" y1="368" x2="401" y2="362" stroke="#33393b" stroke-width="2" stroke-linecap="round"/>
        <circle cx="350" cy="396" r="9" fill="#33393b"/>
        <circle cx="398" cy="396" r="9" fill="#33393b"/>
        <!-- handle -->
        <path d="M344 330 v-16 h48 v16" stroke="#8a6a4f" stroke-width="6" fill="none" stroke-linecap="round"/>
      </g>
      <!-- shrub + watering can set aside -->
      <circle cx="528" cy="368" r="22" fill="#2c5a40"/>
      <circle cx="546" cy="380" r="14" fill="#3e7c59"/>
      <g>
        <path d="M452 372 h34 v22 h-34 z" fill="#5e9a78"/>
        <path d="M452 378 l-14 -10 v6 l14 10" fill="#5e9a78"/>
        <path d="M468 372 q0 -8 10 -8" stroke="#5e9a78" stroke-width="4" fill="none"/>
      </g>
      <!-- runoff puddle with grime -->
      <ellipse cx="170" cy="382" rx="58" ry="9" fill="#7fb3c8" opacity="0.45"/>
      <ellipse cx="150" cy="384" rx="20" ry="4" fill="#8a6a4f" opacity="0.4"/>
      <!-- a couple of leaves swept off -->
      <ellipse cx="92" cy="370" rx="7" ry="4" fill="#d98e3b" transform="rotate(-20 92 370)"/>
      <ellipse cx="248" cy="392" rx="7" ry="4" fill="#c96f4a" transform="rotate(24 248 392)"/>
    </svg>
