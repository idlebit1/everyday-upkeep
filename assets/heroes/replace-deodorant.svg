<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of deodorant upkeep on a bathroom shelf: a nearly-used-up deodorant stick twisted down to the bottom of its tube stands next to a fresh, full backup stick still capped, a small wall calendar with a reminder circled hangs behind them, and a folded towel and a little plant sit on the tidy shelf">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- bathroom shelf -->
      <rect x="70" y="330" width="430" height="16" rx="5" fill="#b9b1a3"/>
      <rect x="78" y="346" width="414" height="10" rx="4" fill="#8a6a4f"/>
      <!-- shelf brackets -->
      <path d="M96 346 l0 26 l14 0 z" fill="#8a6a4f" opacity="0.7"/>
      <path d="M464 346 l0 26 l-14 0 z" fill="#8a6a4f" opacity="0.7"/>

      <!-- calendar / reminder on the wall behind -->
      <rect x="322" y="70" width="150" height="130" rx="10" fill="#fffdf8" stroke="#8a6a4f" stroke-width="5"/>
      <rect x="322" y="70" width="150" height="30" rx="10" fill="#3e7c59"/>
      <rect x="352" y="58" width="10" height="22" rx="4" fill="#8a6a4f"/>
      <rect x="432" y="58" width="10" height="22" rx="4" fill="#8a6a4f"/>
      <!-- calendar grid -->
      <g stroke="#e9e2d8" stroke-width="2">
        <line x1="322" y1="130" x2="472" y2="130"/>
        <line x1="322" y1="160" x2="472" y2="160"/>
        <line x1="360" y1="100" x2="360" y2="200"/>
        <line x1="397" y1="100" x2="397" y2="200"/>
        <line x1="434" y1="100" x2="434" y2="200"/>
      </g>
      <g fill="#b9b1a3">
        <circle cx="341" cy="145" r="3"/>
        <circle cx="378" cy="145" r="3"/>
        <circle cx="341" cy="175" r="3"/>
        <circle cx="453" cy="145" r="3"/>
        <circle cx="453" cy="175" r="3"/>
        <circle cx="415" cy="175" r="3"/>
      </g>
      <!-- circled "restock" reminder day -->
      <circle cx="415" cy="145" r="12" fill="none" stroke="#d9663f" stroke-width="3.5"/>
      <circle cx="415" cy="145" r="3.4" fill="#c96f4a"/>
      <text x="397" y="215" font-size="12" fill="#d9663f" font-weight="700">restock</text>

      <!-- NEARLY-EMPTY stick, twisted to the bottom, uncapped -->
      <g>
        <!-- tube body -->
        <rect x="150" y="212" width="66" height="118" rx="12" fill="#c96f4a"/>
        <rect x="150" y="212" width="66" height="118" rx="12" fill="#8a6a4f" opacity="0.12"/>
        <!-- dial base -->
        <rect x="146" y="316" width="74" height="16" rx="6" fill="#8a6a4f"/>
        <ellipse cx="183" cy="316" rx="6" ry="3" fill="#efe7d8"/>
        <!-- inner well showing the twist-up platform pushed near the TOP (product used up) -->
        <rect x="160" y="220" width="46" height="96" rx="8" fill="#efe7d8"/>
        <!-- tiny nub of product left at the very top -->
        <rect x="164" y="222" width="38" height="12" rx="5" fill="#fffdf8"/>
        <path d="M164 228 q19 -8 38 0" fill="none" stroke="#e9e2d8" stroke-width="2"/>
        <text x="183" y="352" font-size="12" fill="#6b7376" text-anchor="middle" font-weight="700">almost out</text>
      </g>

      <!-- FRESH backup stick, full and capped -->
      <g>
        <!-- cap -->
        <rect x="248" y="176" width="70" height="58" rx="12" fill="#3e7c59"/>
        <rect x="248" y="176" width="70" height="18" rx="10" fill="#5e9a78"/>
        <!-- tube body -->
        <rect x="252" y="230" width="62" height="100" rx="12" fill="#5e9a78"/>
        <rect x="252" y="230" width="62" height="100" rx="12" fill="#2c5a40" opacity="0.1"/>
        <!-- label band -->
        <rect x="252" y="262" width="62" height="34" fill="#fffdf8"/>
        <rect x="260" y="272" width="46" height="5" rx="2.5" fill="#5e9a78"/>
        <rect x="260" y="282" width="32" height="4" rx="2" fill="#b9b1a3"/>
        <!-- dial base -->
        <rect x="248" y="318" width="70" height="14" rx="5" fill="#2c5a40"/>
        <text x="283" y="352" font-size="12" fill="#3e7c59" text-anchor="middle" font-weight="700">backup</text>
      </g>

      <!-- folded towel on the shelf, right -->
      <path d="M356 300 h96 l-8 30 h-80 z" fill="#7fb3c8"/>
      <path d="M356 300 h96 l-5 10 h-86 z" fill="#9cc3d4"/>
      <g stroke="#dce8ee" stroke-width="2">
        <line x1="372" y1="316" x2="436" y2="316"/>
        <line x1="370" y1="323" x2="434" y2="323"/>
      </g>

      <!-- small plant for warmth, left -->
      <path d="M92 300 h32 l-4 30 h-24 z" fill="#c96f4a"/>
      <path d="M108 300 q-4 -24 -14 -32" stroke="#3e7c59" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <path d="M108 300 q5 -22 16 -28" stroke="#3e7c59" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="90" cy="264" rx="8" ry="12" fill="#5e9a78" transform="rotate(-30 90 264)"/>
      <ellipse cx="124" cy="270" rx="8" ry="12" fill="#3e7c59" transform="rotate(28 124 270)"/>
    </svg>
