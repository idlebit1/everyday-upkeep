<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a person at a bathroom mirror trimming their beard: they hold a beard trimmer to one cheek while a neat cheek line and clean neckline take shape, a comb in the other hand, and beard oil, scissors, and a folded towel sit on the counter below the mirror">
      <ellipse cx="280" cy="404" rx="250" ry="22" fill="#efe7d8"/>

      <!-- bathroom mirror frame -->
      <rect x="150" y="34" width="260" height="246" rx="14" fill="#dce8ee" stroke="#c9a06b" stroke-width="9"/>
      <rect x="160" y="44" width="240" height="226" rx="8" fill="#eef4f7"/>
      <!-- mirror shine streaks -->
      <g stroke="#fffdf8" stroke-width="7" stroke-linecap="round" opacity="0.8">
        <line x1="176" y1="232" x2="236" y2="138"/>
        <line x1="200" y1="240" x2="250" y2="168"/>
      </g>

      <!-- counter / vanity below the mirror -->
      <rect x="120" y="300" width="320" height="18" rx="5" fill="#b9b1a3"/>
      <rect x="128" y="318" width="304" height="14" rx="4" fill="#8a6a4f"/>

      <!-- the person, reflected: head and shoulders in the mirror -->
      <!-- shoulders -->
      <path d="M198 270 q82 -40 164 0 v0 h-164 z" fill="#3e7c59"/>
      <rect x="206" y="252" width="148" height="26" rx="10" fill="#3e7c59"/>
      <!-- neck -->
      <rect x="262" y="214" width="36" height="32" rx="10" fill="#c9a06b"/>
      <!-- head -->
      <ellipse cx="280" cy="158" rx="54" ry="60" fill="#c9a06b"/>
      <!-- hair on top -->
      <path d="M226 142 q4 -52 54 -52 q50 0 54 52 q-18 -20 -54 -20 q-36 0 -54 20 z" fill="#5a4632"/>
      <!-- ears -->
      <ellipse cx="227" cy="160" rx="8" ry="12" fill="#b9885f"/>
      <ellipse cx="333" cy="160" rx="8" ry="12" fill="#b9885f"/>
      <!-- eyes -->
      <circle cx="262" cy="152" r="3.6" fill="#33393b"/>
      <circle cx="298" cy="152" r="3.6" fill="#33393b"/>
      <!-- brows -->
      <path d="M251 142 q9 -6 19 -2 M291 140 q10 -4 19 2" fill="none" stroke="#5a4632" stroke-width="3" stroke-linecap="round"/>
      <!-- nose -->
      <path d="M280 158 q5 14 0 22" fill="none" stroke="#b9885f" stroke-width="3" stroke-linecap="round"/>

      <!-- the BEARD: full, framed by a clean cheek line and neckline -->
      <path d="M232 168
               q-2 36 18 64
               q14 22 30 24
               q16 -2 30 -24
               q20 -28 18 -64
               q-10 18 -48 18
               q-38 0 -48 -18 z" fill="#4a3826"/>
      <!-- beard texture strokes -->
      <g stroke="#5a4632" stroke-width="2" stroke-linecap="round" opacity="0.6">
        <path d="M246 196 q2 22 8 38"/>
        <path d="M266 200 q1 26 4 44"/>
        <path d="M294 200 q-1 26 -4 44"/>
        <path d="M314 196 q-2 22 -8 38"/>
      </g>
      <!-- mustache, trimmed off the lip -->
      <path d="M258 196 q22 10 44 0 q-10 8 -22 8 q-12 0 -22 -8 z" fill="#4a3826"/>
      <!-- lips just below -->
      <path d="M266 206 q14 7 28 0" fill="none" stroke="#a8674f" stroke-width="2.6" stroke-linecap="round"/>
      <!-- crisp cheek line highlight on the left cheek -->
      <path d="M236 174 q14 8 40 8" fill="none" stroke="#5e9a78" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="4 3"/>

      <!-- clean neckline indicator (two-fingers above Adam's apple, curving ear to ear) -->
      <path d="M236 232 q44 30 88 0" fill="none" stroke="#5e9a78" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="5 4"/>
      <text x="266" y="252" font-size="10" fill="#3e7c59" font-weight="700" text-anchor="middle">neckline</text>

      <!-- trimmer in hand at the right cheek -->
      <rect x="338" y="176" width="46" height="20" rx="6" fill="#5e9a78" transform="rotate(-18 361 186)"/>
      <rect x="326" y="182" width="14" height="14" rx="3" fill="#3e7c59" transform="rotate(-18 333 189)"/>
      <g stroke="#2c5a40" stroke-width="1.6">
        <line x1="332" y1="183" x2="340" y2="180"/>
        <line x1="334" y1="188" x2="342" y2="185"/>
      </g>
      <!-- hand on the trimmer -->
      <ellipse cx="384" cy="200" rx="16" ry="13" fill="#c9a06b"/>
      <path d="M374 196 q-5 6 -1 13" stroke="#b9885f" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <!-- little snip sparkle near the cheek -->
      <g stroke="#e0a93d" stroke-width="2.4" stroke-linecap="round">
        <path d="M330 168 l0 9 M325.5 172.5 l9 0"/>
      </g>

      <!-- beard oil bottle on the counter, left -->
      <rect x="150" y="282" width="22" height="40" rx="5" fill="#c96f4a"/>
      <rect x="155" y="272" width="12" height="12" rx="3" fill="#8a6a4f"/>
      <path d="M161 272 l0 -8" stroke="#8a6a4f" stroke-width="3" stroke-linecap="round"/>
      <circle cx="161" cy="262" r="3.4" fill="#e0a93d"/>
      <rect x="153" y="296" width="16" height="14" rx="3" fill="#faf0da" opacity="0.85"/>

      <!-- a comb on the counter, center-left -->
      <rect x="190" y="306" width="58" height="9" rx="3" fill="#8a6a4f"/>
      <g stroke="#5a4632" stroke-width="1.6">
        <line x1="196" y1="315" x2="196" y2="324"/>
        <line x1="202" y1="315" x2="202" y2="324"/>
        <line x1="208" y1="315" x2="208" y2="324"/>
        <line x1="214" y1="315" x2="214" y2="324"/>
        <line x1="220" y1="315" x2="220" y2="324"/>
        <line x1="226" y1="315" x2="226" y2="324"/>
        <line x1="232" y1="315" x2="232" y2="324"/>
        <line x1="238" y1="315" x2="238" y2="324"/>
      </g>

      <!-- scissors on the counter, right -->
      <g transform="rotate(20 372 300)">
        <line x1="350" y1="298" x2="386" y2="298" stroke="#7fb3c8" stroke-width="4" stroke-linecap="round"/>
        <line x1="350" y1="306" x2="386" y2="306" stroke="#5e9a78" stroke-width="4" stroke-linecap="round"/>
        <circle cx="348" cy="296" r="6.5" fill="none" stroke="#5e9a78" stroke-width="3.5"/>
        <circle cx="348" cy="308" r="6.5" fill="none" stroke="#7fb3c8" stroke-width="3.5"/>
        <circle cx="352" cy="302" r="2.4" fill="#8a6a4f"/>
      </g>

      <!-- folded towel front-left of the counter -->
      <path d="M104 332 h74 l-6 24 h-62 z" fill="#7fb3c8"/>
      <path d="M104 332 h74 l-4 9 h-66 z" fill="#9cc3d4"/>
      <g stroke="#cdd9de" stroke-width="1.6">
        <line x1="118" y1="346" x2="160" y2="346"/>
        <line x1="116" y1="352" x2="158" y2="352"/>
      </g>

      <!-- small plant for warmth, right -->
      <path d="M474 332 h26 l-4 26 h-18 z" fill="#c96f4a"/>
      <path d="M486 332 q-3 -20 -12 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M486 332 q4 -18 14 -24" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="471" cy="300" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 471 300)"/>
      <ellipse cx="501" cy="304" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 501 304)"/>
    </svg>
