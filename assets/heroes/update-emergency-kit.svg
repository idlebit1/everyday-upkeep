<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of an open emergency go-bag with supplies laid out beside it: a water jug, stacked canned food, a flashlight shining, a hand-crank radio, a first aid box, batteries, and document copies">
      <ellipse cx="285" cy="400" rx="245" ry="22" fill="#efe7d8"/>
      <circle cx="66" cy="62" r="23" fill="#f2cf7a"/>
      <ellipse cx="452" cy="64" rx="46" ry="22" fill="#dce8ee"/>
      <ellipse cx="408" cy="76" rx="28" ry="16" fill="#dce8ee"/>
      <ellipse cx="130" cy="112" rx="34" ry="16" fill="#dce8ee"/>
      <!-- backpack -->
      <path d="M158 196 q62 -34 124 0 l10 168 q-72 24 -144 0 z" fill="#c96f4a"/>
      <path d="M168 178 q52 -28 104 0 l-6 28 q-46 -22 -92 0 z" fill="#d9663f"/>
      <rect x="186" y="262" width="68" height="74" rx="12" fill="#d9663f"/>
      <rect x="186" y="288" width="68" height="9" rx="4.5" fill="#8a6a4f"/>
      <circle cx="220" cy="292" r="7" fill="#e0a93d"/>
      <!-- first aid patch on flap -->
      <circle cx="220" cy="226" r="17" fill="#fffdf8"/>
      <rect x="215.5" y="215" width="9" height="22" rx="2.5" fill="#c96f4a"/>
      <rect x="209" y="221.5" width="22" height="9" rx="2.5" fill="#c96f4a"/>
      <!-- straps -->
      <path d="M158 210 q-22 60 -8 150" stroke="#8a6a4f" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M282 210 q22 60 8 150" stroke="#8a6a4f" stroke-width="10" fill="none" stroke-linecap="round"/>
      <!-- rolled blanket on top -->
      <rect x="166" y="158" width="108" height="26" rx="13" fill="#7fb3c8"/>
      <line x1="196" y1="158" x2="196" y2="184" stroke="#dce8ee" stroke-width="5"/>
      <line x1="244" y1="158" x2="244" y2="184" stroke="#dce8ee" stroke-width="5"/>
      <!-- water jug -->
      <rect x="332" y="262" width="78" height="112" rx="10" fill="#7fb3c8"/>
      <rect x="352" y="244" width="38" height="22" rx="5" fill="#5f93ad"/>
      <rect x="358" y="234" width="26" height="14" rx="4" fill="#2c5a40"/>
      <rect x="344" y="296" width="54" height="40" rx="6" fill="#dce8ee"/>
      <path d="M371 304 c5 7 7 10.5 0 15.5 c-7 -5 -5 -8.5 0 -15.5" fill="#5f93ad"/>
      <rect x="352" y="324" width="38" height="5" rx="2.5" fill="#5f93ad"/>
      <!-- cans -->
      <rect x="430" y="330" width="46" height="44" rx="6" fill="#e0a93d"/>
      <ellipse cx="453" cy="330" rx="23" ry="7" fill="#f2cf7a"/>
      <rect x="436" y="344" width="34" height="16" rx="4" fill="#fffdf8"/>
      <rect x="444" y="282" width="46" height="44" rx="6" fill="#5e9a78"/>
      <ellipse cx="467" cy="282" rx="23" ry="7" fill="#9cc8ad"/>
      <rect x="450" y="296" width="34" height="16" rx="4" fill="#fffdf8"/>
      <!-- flashlight with beam -->
      <polygon points="96,300 18,272 18,330" fill="#faf0da"/>
      <rect x="92" y="288" width="26" height="28" rx="5" fill="#d98e3b"/>
      <rect x="114" y="294" width="48" height="16" rx="8" fill="#e0a93d"/>
      <circle cx="152" cy="302" r="4" fill="#8a6a4f"/>
      <!-- radio -->
      <rect x="56" y="338" width="92" height="50" rx="9" fill="#3e7c59"/>
      <circle cx="84" cy="363" r="13" fill="#e3efe8"/>
      <circle cx="84" cy="363" r="5" fill="#2c5a40"/>
      <rect x="106" y="352" width="32" height="7" rx="3.5" fill="#5e9a78"/>
      <rect x="106" y="365" width="32" height="7" rx="3.5" fill="#5e9a78"/>
      <line x1="132" y1="338" x2="156" y2="304" stroke="#2c5a40" stroke-width="5" stroke-linecap="round"/>
      <circle cx="156" cy="304" r="4" fill="#2c5a40"/>
      <!-- first aid box -->
      <rect x="306" y="160" width="80" height="58" rx="9" fill="#fffdf8" stroke="#e6dccb" stroke-width="2"/>
      <rect x="332" y="148" width="28" height="14" rx="6" fill="#b9b1a3"/>
      <rect x="341" y="174" width="10" height="30" rx="3" fill="#d9663f"/>
      <rect x="331" y="184" width="30" height="10" rx="3" fill="#d9663f"/>
      <!-- batteries -->
      <rect x="416" y="200" width="18" height="36" rx="5" fill="#e0a93d"/>
      <rect x="420" y="194" width="10" height="8" rx="2.5" fill="#8a6a4f"/>
      <rect x="440" y="208" width="18" height="36" rx="5" fill="#d98e3b"/>
      <rect x="444" y="202" width="10" height="8" rx="2.5" fill="#8a6a4f"/>
      <!-- documents -->
      <rect x="486" y="180" width="52" height="66" rx="5" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2" transform="rotate(6 512 213)"/>
      <g stroke="#d8cfbe" stroke-width="4" stroke-linecap="round" transform="rotate(6 512 213)">
        <line x1="496" y1="196" x2="528" y2="196"/>
        <line x1="496" y1="210" x2="528" y2="210"/>
        <line x1="496" y1="224" x2="518" y2="224"/>
      </g>
      <!-- shrubs -->
      <circle cx="38" cy="392" r="13" fill="#5e9a78"/>
      <circle cx="520" cy="388" r="14" fill="#5e9a78"/>
      <circle cx="538" cy="394" r="10" fill="#3e7c59"/>
    </svg>
