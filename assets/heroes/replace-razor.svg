<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a bright bathroom sink: a clean cartridge razor rests blade-up on a dry stand beside the sink, away from the wet shower, a hand clicks a fresh cartridge onto a second handle, and a can of shaving cream and a folded towel sit on the counter">
      <ellipse cx="280" cy="404" rx="250" ry="22" fill="#efe7d8"/>

      <!-- bright bathroom wall panel behind the sink -->
      <rect x="120" y="34" width="320" height="150" rx="10" fill="#dce8ee"/>
      <g stroke="#fffdf8" stroke-width="6" stroke-linecap="round" opacity="0.7">
        <line x1="150" y1="150" x2="206" y2="64"/>
        <line x1="176" y1="158" x2="224" y2="88"/>
      </g>

      <!-- counter surface -->
      <rect x="90" y="278" width="380" height="18" rx="5" fill="#b9b1a3"/>
      <rect x="98" y="296" width="364" height="14" rx="4" fill="#8a6a4f"/>

      <!-- the SINK basin set into the counter -->
      <ellipse cx="280" cy="282" rx="86" ry="20" fill="#eef4f7" stroke="#9cc3d4" stroke-width="3"/>
      <ellipse cx="280" cy="282" rx="60" ry="12" fill="#dce8ee"/>
      <!-- faucet -->
      <path d="M280 222 q0 -26 26 -26 h6" fill="none" stroke="#9cc3d4" stroke-width="8" stroke-linecap="round"/>
      <rect x="270" y="218" width="20" height="10" rx="4" fill="#7fb3c8"/>

      <!-- a DRY stand beside the sink, holding the clean razor blade-up, out of the wet -->
      <rect x="118" y="232" width="62" height="46" rx="8" fill="#fffdf8" stroke="#c9a06b" stroke-width="3"/>
      <rect x="128" y="252" width="42" height="8" rx="4" fill="#e0a93d"/>
      <text x="149" y="272" font-size="10" fill="#3e7c59" font-weight="700" text-anchor="middle">DRY</text>
      <!-- the resting razor, standing blade-up on the stand -->
      <rect x="144" y="150" width="11" height="86" rx="5" fill="#5e9a78"/>
      <rect x="138" y="138" width="23" height="18" rx="4" fill="#3e7c59"/>
      <!-- cartridge head, blade-up (fins on top) -->
      <rect x="132" y="124" width="35" height="14" rx="3" fill="#cdd9de"/>
      <g stroke="#7fb3c8" stroke-width="1.6">
        <line x1="138" y1="126" x2="161" y2="126"/>
        <line x1="138" y1="130" x2="161" y2="130"/>
        <line x1="138" y1="134" x2="161" y2="134"/>
      </g>
      <!-- sparkle: it's fresh & clean -->
      <g stroke="#e0a93d" stroke-width="2.4" stroke-linecap="round">
        <path d="M178 116 l0 10 M173 121 l10 0"/>
      </g>

      <!-- a hand clicking a FRESH cartridge onto a second handle, center-right -->
      <!-- the handle being loaded -->
      <rect x="332" y="176" width="12" height="74" rx="5" fill="#5e9a78" transform="rotate(12 338 213)"/>
      <rect x="338" y="240" width="22" height="18" rx="5" fill="#3e7c59" transform="rotate(12 349 249)"/>
      <!-- the fresh cartridge clicking on at the top -->
      <rect x="312" y="150" width="40" height="16" rx="3" fill="#eef4f7" stroke="#9cc3d4" stroke-width="2" transform="rotate(12 332 158)"/>
      <g stroke="#7fb3c8" stroke-width="1.8" transform="rotate(12 332 158)">
        <line x1="318" y1="153" x2="346" y2="153"/>
        <line x1="318" y1="158" x2="346" y2="158"/>
        <line x1="318" y1="163" x2="346" y2="163"/>
      </g>
      <!-- little "click" sparkle where it snaps on -->
      <g stroke="#e0a93d" stroke-width="2.2" stroke-linecap="round">
        <path d="M360 138 l5 -4 M363 146 l6 -2 M357 130 l2 -6"/>
      </g>
      <text x="372" y="128" font-size="11" fill="#3e7c59" font-weight="700">click — fresh</text>
      <!-- the hand on the handle -->
      <ellipse cx="356" cy="262" rx="17" ry="13" fill="#e8b48f"/>
      <path d="M346 258 q-5 6 -1 13" stroke="#d99c73" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <!-- arm -->
      <path d="M356 274 q16 26 50 30" stroke="#3e7c59" stroke-width="12" fill="none" stroke-linecap="round"/>

      <!-- can of shaving cream on the counter, right -->
      <rect x="404" y="222" width="40" height="56" rx="8" fill="#7fb3c8"/>
      <rect x="404" y="222" width="40" height="12" rx="6" fill="#9cc3d4"/>
      <rect x="412" y="206" width="24" height="18" rx="5" fill="#5e9a78"/>
      <ellipse cx="424" cy="204" rx="13" ry="6" fill="#fffdf8"/>
      <ellipse cx="421" cy="200" rx="6" ry="4" fill="#eef4f7"/>
      <text x="424" y="256" font-size="9.5" fill="#fffdf8" font-weight="700" text-anchor="middle">SHAVE</text>

      <!-- folded towel front-left of the counter -->
      <path d="M96 310 h74 l-6 24 h-62 z" fill="#7fb3c8"/>
      <path d="M96 310 h74 l-4 9 h-66 z" fill="#9cc3d4"/>
      <g stroke="#cdd9de" stroke-width="1.6">
        <line x1="110" y1="324" x2="152" y2="324"/>
        <line x1="108" y1="330" x2="150" y2="330"/>
      </g>

      <!-- small plant for warmth, right -->
      <path d="M478 310 h26 l-4 26 h-18 z" fill="#c96f4a"/>
      <path d="M490 310 q-3 -20 -12 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M490 310 q4 -18 14 -24" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="475" cy="278" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 475 278)"/>
      <ellipse cx="505" cy="282" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 505 282)"/>
    </svg>
