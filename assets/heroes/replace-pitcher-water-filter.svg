<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of replacing a water pitcher filter: a clear filter pitcher sits on a kitchen counter with its lid off, a hand lowers a fresh white-and-blue filter cartridge into the open reservoir, an old grey spent filter lies on the counter beside it, a glass of clear filtered water stands nearby, and the lid resting alongside shows a filter-change indicator">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- kitchen counter -->
      <rect x="30" y="358" width="500" height="14" rx="4" fill="#c9a06b"/>
      <rect x="30" y="372" width="500" height="10" rx="3" fill="#8a6a4f"/>

      <!-- ===== the pitcher (clear body, lid off) ===== -->
      <!-- pitcher body -->
      <path d="M188 150 q-6 0 -6 8 l8 188 q1 14 15 14 h120 q14 0 15 -14 l8 -188 q0 -8 -6 -8 z" fill="#dce8ee" opacity="0.55" stroke="#7fb3c8" stroke-width="4"/>
      <!-- filtered water level inside -->
      <path d="M192 258 l3 84 q1 10 11 10 h108 q10 0 11 -10 l3 -84 z" fill="#7fb3c8" opacity="0.45"/>
      <!-- highlight streak on the glass -->
      <path d="M206 168 l5 168" stroke="#fffdf8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
      <!-- reservoir funnel inside the top -->
      <path d="M196 150 h128 l-22 64 h-84 z" fill="#eef4f7" stroke="#9cc3d4" stroke-width="3"/>
      <!-- spout/pour lip -->
      <path d="M324 158 q22 -2 26 12 l-26 4 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="3"/>
      <!-- handle -->
      <path d="M330 196 q44 6 40 70 q-3 40 -34 50" fill="none" stroke="#7fb3c8" stroke-width="7" stroke-linecap="round"/>

      <!-- ===== new filter cartridge being lowered in ===== -->
      <!-- cartridge body (white/blue) -->
      <rect x="234" y="118" width="52" height="74" rx="8" fill="#fffdf8" stroke="#5e9a78" stroke-width="3"/>
      <rect x="234" y="118" width="52" height="22" rx="8" fill="#5e9a78"/>
      <!-- mesh dots on the cartridge cap -->
      <g fill="#2c5a40" opacity="0.8">
        <circle cx="246" cy="129" r="1.8"/>
        <circle cx="256" cy="129" r="1.8"/>
        <circle cx="266" cy="129" r="1.8"/>
        <circle cx="276" cy="129" r="1.8"/>
      </g>
      <!-- carbon fill texture -->
      <g fill="#b9b1a3" opacity="0.55">
        <circle cx="246" cy="158" r="2.4"/>
        <circle cx="262" cy="166" r="2"/>
        <circle cx="274" cy="156" r="2.2"/>
        <circle cx="254" cy="178" r="2"/>
      </g>
      <text x="260" y="112" font-size="11" fill="#3e7c59" font-weight="700" text-anchor="middle">fresh</text>

      <!-- hand lowering the cartridge -->
      <path d="M260 96 q40 -14 70 6" stroke="#3e7c59" stroke-width="12" fill="none" stroke-linecap="round"/>
      <ellipse cx="262" cy="104" rx="17" ry="13" fill="#e8b48f"/>
      <path d="M250 100 q-5 7 0 14" stroke="#d99c73" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M258 96 q-3 8 1 15" stroke="#d99c73" stroke-width="2.6" fill="none" stroke-linecap="round"/>

      <!-- ===== old grey spent filter on the counter ===== -->
      <rect x="78" y="318" width="48" height="40" rx="7" fill="#b9b1a3" stroke="#8a6a4f" stroke-width="3" transform="rotate(-12 102 338)"/>
      <rect x="78" y="318" width="48" height="14" rx="7" fill="#8a6a4f" transform="rotate(-12 102 338)"/>
      <!-- a little drip of standing water under it -->
      <ellipse cx="98" cy="360" rx="20" ry="4" fill="#7fb3c8" opacity="0.4"/>
      <text x="100" y="392" font-size="11" fill="#6b7376" text-anchor="middle">old · spent</text>

      <!-- ===== glass of clear filtered water ===== -->
      <path d="M414 280 l6 76 q1 6 8 6 h22 q7 0 8 -6 l6 -76 z" fill="#dce8ee" opacity="0.6" stroke="#7fb3c8" stroke-width="3"/>
      <path d="M418 318 l3 36 q0 4 6 4 h18 q6 0 6 -4 l3 -36 z" fill="#7fb3c8" opacity="0.45"/>
      <path d="M424 292 l3 58" stroke="#fffdf8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <!-- sparkle on the clear water -->
      <g stroke="#5e9a78" stroke-width="2.2" stroke-linecap="round">
        <path d="M452 268 l0 9 M447.5 272.5 l9 0"/>
      </g>

      <!-- ===== lid resting with change indicator ===== -->
      <rect x="360" y="324" width="118" height="20" rx="8" fill="#9cc3d4" transform="rotate(6 419 334)"/>
      <rect x="360" y="324" width="118" height="9" rx="6" fill="#7fb3c8" transform="rotate(6 419 334)"/>
      <!-- the electronic filter-change indicator panel -->
      <g transform="rotate(6 419 334)">
        <rect x="430" y="318" width="34" height="18" rx="4" fill="#fffdf8" stroke="#5e9a78" stroke-width="2"/>
        <rect x="436" y="323" width="9" height="8" rx="2" fill="#3e7c59"/>
        <rect x="447" y="323" width="9" height="8" rx="2" fill="#e0a93d"/>
      </g>
      <text x="419" y="362" font-size="11" fill="#6b7376" text-anchor="middle">lid · change indicator</text>

      <!-- a small leafy plant for warmth, far right -->
      <path d="M500 330 h26 l-4 28 h-18 z" fill="#c96f4a"/>
      <path d="M513 330 q-3 -20 -12 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M513 330 q4 -18 14 -24" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="498" cy="298" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 498 298)"/>
      <ellipse cx="528" cy="302" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 528 302)"/>
    </svg>
