<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a whole-house furnace humidifier mounted on ductwork with its cover off in a basement utility area: a hand slides a crusty, white mineral-scaled evaporator pad out of the unit while a fresh clean honeycomb water panel waits beside it, a water feed line runs down to the unit and a round humidistat dial is mounted on the duct">
      <ellipse cx="285" cy="404" rx="250" ry="22" fill="#efe7d8"/>

      <!-- large supply duct behind, vertical -->
      <rect x="60" y="40" width="150" height="300" rx="8" fill="#cdd9de" stroke="#b9b1a3" stroke-width="4"/>
      <!-- duct seams -->
      <g stroke="#b9b1a3" stroke-width="3" opacity="0.7">
        <line x1="60" y1="118" x2="210" y2="118"/>
        <line x1="60" y1="200" x2="210" y2="200"/>
        <line x1="60" y1="282" x2="210" y2="282"/>
      </g>
      <!-- furnace body to the left, partly seen -->
      <rect x="40" y="250" width="46" height="120" rx="6" fill="#b9b1a3"/>
      <rect x="46" y="262" width="34" height="10" rx="2" fill="#8a6a4f"/>

      <!-- humidifier unit housing (cover off) mounted on the duct -->
      <rect x="222" y="150" width="150" height="170" rx="10" fill="#fffdf8" stroke="#8a6a4f" stroke-width="6"/>
      <!-- inner cavity -->
      <rect x="236" y="166" width="122" height="138" rx="6" fill="#dce8ee"/>
      <!-- the removed cover, leaning to the right of the unit -->
      <rect x="386" y="196" width="20" height="120" rx="6" fill="#e6ddcd" stroke="#b9b1a3" stroke-width="4"/>
      <g stroke="#b9b1a3" stroke-width="2.4" opacity="0.7">
        <line x1="391" y1="220" x2="401" y2="220"/>
        <line x1="391" y1="248" x2="401" y2="248"/>
        <line x1="391" y1="276" x2="401" y2="276"/>
      </g>

      <!-- CRUSTY OLD PAD being slid out (to the right) -->
      <!-- pad frame -->
      <rect x="300" y="182" width="92" height="106" rx="4" fill="#c9a06b" stroke="#8a6a4f" stroke-width="3"/>
      <!-- honeycomb, scaled white -->
      <rect x="306" y="188" width="80" height="94" rx="2" fill="#e6ddcd"/>
      <g stroke="#b9b1a3" stroke-width="2" opacity="0.85">
        <line x1="306" y1="212" x2="386" y2="212"/>
        <line x1="306" y1="236" x2="386" y2="236"/>
        <line x1="306" y1="260" x2="386" y2="260"/>
        <line x1="326" y1="188" x2="326" y2="282"/>
        <line x1="346" y1="188" x2="346" y2="282"/>
        <line x1="366" y1="188" x2="366" y2="282"/>
      </g>
      <!-- crusty mineral scale blotches -->
      <g fill="#fffdf8" opacity="0.9">
        <ellipse cx="322" cy="204" rx="9" ry="7"/>
        <ellipse cx="356" cy="224" rx="11" ry="8"/>
        <ellipse cx="336" cy="252" rx="10" ry="7"/>
        <ellipse cx="372" cy="268" rx="8" ry="6"/>
        <ellipse cx="316" cy="270" rx="7" ry="6"/>
      </g>
      <text x="300" y="176" font-size="11" fill="#d9663f" font-weight="700">crusty · scaled</text>

      <!-- hand sliding the old pad out -->
      <ellipse cx="404" cy="236" rx="17" ry="13" fill="#e8b48f"/>
      <path d="M394 231 q-5 6 -1 13" stroke="#d99c73" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M410 246 q22 22 52 26" stroke="#3e7c59" stroke-width="12" fill="none" stroke-linecap="round"/>

      <!-- FRESH new honeycomb pad waiting on the floor -->
      <rect x="404" y="322" width="92" height="70" rx="4" fill="#5e9a78" stroke="#2c5a40" stroke-width="3"/>
      <rect x="410" y="328" width="80" height="58" rx="2" fill="#e3efe8"/>
      <g stroke="#5e9a78" stroke-width="2" opacity="0.9">
        <line x1="410" y1="347" x2="490" y2="347"/>
        <line x1="410" y1="366" x2="490" y2="366"/>
        <line x1="428" y1="328" x2="428" y2="386"/>
        <line x1="448" y1="328" x2="448" y2="386"/>
        <line x1="468" y1="328" x2="468" y2="386"/>
      </g>
      <!-- up-arrow orientation mark on the fresh pad -->
      <path d="M450 380 l0 -22 m-7 9 l7 -9 l7 9" stroke="#d9663f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="404" y="318" font-size="11" fill="#3e7c59" font-weight="700">fresh honeycomb</text>

      <!-- water feed line running down into the top of the unit -->
      <path d="M300 60 q0 40 -14 62 q-14 22 -14 28" fill="none" stroke="#7fb3c8" stroke-width="6" stroke-linecap="round"/>
      <!-- saddle valve up on the line -->
      <rect x="290" y="52" width="22" height="16" rx="4" fill="#5e9a78"/>
      <rect x="298" y="40" width="6" height="14" rx="3" fill="#3e7c59"/>
      <!-- solenoid / feed at the unit top -->
      <rect x="262" y="140" width="34" height="18" rx="4" fill="#5e9a78"/>
      <!-- even drip across the pad -->
      <g fill="#7fb3c8">
        <circle cx="322" cy="196" r="2.2"/>
        <circle cx="346" cy="196" r="2.2"/>
        <circle cx="370" cy="196" r="2.2"/>
      </g>
      <!-- drain line at the bottom of the unit -->
      <path d="M236 300 q-20 20 -20 46" fill="none" stroke="#8a6a4f" stroke-width="6" stroke-linecap="round"/>

      <!-- humidistat dial on the duct above the unit -->
      <circle cx="150" cy="90" r="30" fill="#fffdf8" stroke="#8a6a4f" stroke-width="5"/>
      <circle cx="150" cy="90" r="20" fill="#dce8ee"/>
      <!-- dial ticks -->
      <g stroke="#8a6a4f" stroke-width="2" stroke-linecap="round">
        <line x1="150" y1="72" x2="150" y2="78"/>
        <line x1="168" y1="90" x2="162" y2="90"/>
        <line x1="132" y1="90" x2="138" y2="90"/>
      </g>
      <!-- pointer -->
      <line x1="150" y1="90" x2="163" y2="80" stroke="#d9663f" stroke-width="3" stroke-linecap="round"/>
      <circle cx="150" cy="90" r="4" fill="#c96f4a"/>
      <text x="120" y="140" font-size="11" fill="#6b7376">humidistat</text>
    </svg>
