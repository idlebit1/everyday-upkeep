<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a bathroom toilet with the tank lid removed, showing the rubber flapper lifting off the flush valve at the bottom of the tank, a few drops of food coloring being added to confirm a leak, and a replacement flapper resting on the floor beside the toilet">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>
      <!-- wall shelf with supplies -->
      <rect x="40" y="70" width="146" height="10" rx="5" fill="#8a6a4f"/>
      <rect x="54" y="40" width="24" height="30" rx="4" fill="#c96f4a"/>
      <rect x="86" y="46" width="34" height="24" rx="4" fill="#7fb3c8"/>
      <rect x="130" y="38" width="20" height="32" rx="4" fill="#e0a93d"/>
      <!-- bottle of food coloring on shelf -->
      <rect x="158" y="44" width="16" height="26" rx="4" fill="#5e9a78"/>
      <rect x="161" y="38" width="10" height="8" rx="2" fill="#8a6a4f"/>
      <!-- toilet tank -->
      <rect x="300" y="96" width="172" height="158" rx="16" fill="#fffdf8" stroke="#e6dccb" stroke-width="3"/>
      <!-- water line inside tank -->
      <rect x="312" y="150" width="148" height="92" rx="8" fill="#dce8ee"/>
      <!-- overflow tube -->
      <rect x="376" y="160" width="16" height="74" rx="6" fill="#b9b1a3"/>
      <rect x="372" y="156" width="24" height="10" rx="5" fill="#8a6a4f"/>
      <!-- flush valve seat at tank bottom -->
      <ellipse cx="384" cy="236" rx="26" ry="9" fill="#8a6a4f"/>
      <!-- flapper lifted, leaking -->
      <path d="M360 224 q24 -16 48 -2 q4 12 -8 18 q-22 8 -40 -2 q-6 -8 0 -14" fill="#c96f4a" stroke="#8a6a4f" stroke-width="2"/>
      <!-- flapper chain to lever -->
      <path d="M384 222 L420 168" stroke="#b9b1a3" stroke-width="2.5" fill="none" stroke-dasharray="2 3"/>
      <!-- flush lever -->
      <rect x="300" y="118" width="22" height="9" rx="4" fill="#e0a93d"/>
      <rect x="316" y="120" width="30" height="6" rx="3" fill="#b9b1a3" transform="rotate(8 316 123)"/>
      <!-- fill valve column on left -->
      <rect x="326" y="150" width="12" height="86" rx="5" fill="#b9b1a3"/>
      <ellipse cx="332" cy="150" rx="14" ry="7" fill="#7fb3c8"/>
      <!-- dropper adding food coloring -->
      <g transform="rotate(20 420 130)">
        <rect x="414" y="108" width="10" height="30" rx="4" fill="#dce8ee"/>
        <rect x="412" y="100" width="14" height="12" rx="4" fill="#c96f4a"/>
      </g>
      <!-- colored drops falling into tank water -->
      <g fill="#5e9a78">
        <circle cx="436" cy="158" r="3"/>
        <circle cx="440" cy="172" r="2.5"/>
        <circle cx="434" cy="186" r="2"/>
      </g>
      <!-- toilet bowl base -->
      <path d="M312 254 h150 q10 0 8 18 l-14 78 q-2 16 -18 16 h-104 q-16 0 -18 -16 l-14 -78 q-2 -18 8 -18" fill="#fffdf8" stroke="#e6dccb" stroke-width="3"/>
      <ellipse cx="387" cy="298" rx="58" ry="20" fill="#dce8ee"/>
      <!-- color sneaking into the bowl (the leak proof) -->
      <path d="M387 298 q-4 10 2 18" stroke="#5e9a78" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="392" cy="312" r="2.5" fill="#5e9a78"/>
      <!-- supply line + shutoff valve at floor -->
      <rect x="296" y="300" width="10" height="60" rx="4" fill="#b9b1a3"/>
      <rect x="278" y="320" width="30" height="10" rx="5" fill="#d9663f"/>
      <circle cx="278" cy="325" r="9" fill="#e0a93d"/>
      <!-- replacement flapper on the floor (new part) -->
      <g transform="rotate(-10 150 360)">
        <path d="M120 350 q28 -20 56 -2 q6 14 -8 22 q-26 10 -48 -2 q-8 -10 0 -18" fill="#3e7c59" stroke="#2c5a40" stroke-width="2"/>
        <circle cx="148" cy="345" r="5" fill="#5e9a78"/>
        <path d="M148 348 L170 372" stroke="#b9b1a3" stroke-width="2.5" fill="none"/>
      </g>
      <text x="118" y="392" font-size="12" fill="#6b7376">new flapper</text>
      <!-- gloves on the floor -->
      <g transform="rotate(8 226 384)">
        <path d="M214 372 h18 v14 q0 6 -9 6 q-9 0 -9 -6 z" fill="#7fb3c8"/>
        <rect x="214" y="366" width="5" height="9" rx="2" fill="#7fb3c8"/>
        <rect x="221" y="364" width="5" height="11" rx="2" fill="#7fb3c8"/>
        <rect x="227" y="366" width="5" height="9" rx="2" fill="#7fb3c8"/>
      </g>
      <!-- small plant for warmth -->
      <path d="M512 268 q-2 -18 -10 -26" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M512 268 q4 -16 12 -22" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="499" cy="238" rx="7" ry="11" fill="#5e9a78" transform="rotate(-28 499 238)"/>
      <ellipse cx="527" cy="242" rx="7" ry="11" fill="#3e7c59" transform="rotate(26 527 242)"/>
      <path d="M500 268 h26 l-4 24 h-18 z" fill="#c96f4a"/>
    </svg>
