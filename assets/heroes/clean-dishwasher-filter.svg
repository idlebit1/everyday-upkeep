<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of an open dishwasher with the bottom rack pulled out onto the door, revealing the round twist-out filter glowing in the tub floor, with sparkles, a soap bottle, and a brush nearby">
