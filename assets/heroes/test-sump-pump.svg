<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of testing a sump pump: a basement sump pit set into a dry concrete floor holds a submersible pump with a rising float switch, a hand pours a bucket of water into the pit, the float has lifted and the pump has switched on, water is discharging up and out through a pipe that carries it away from the house, and the basement floor stays dry">
      <ellipse cx="285" cy="404" rx="250" ry="22" fill="#efe7d8"/>

      <!-- dry basement floor -->
      <rect x="40" y="300" width="480" height="100" fill="#dcd3c2"/>
      <rect x="40" y="300" width="480" height="10" fill="#c9bfa9"/>
      <!-- concrete floor seams -->
      <g stroke="#c9bfa9" stroke-width="2.4">
        <line x1="140" y1="310" x2="140" y2="400"/>
        <line x1="420" y1="310" x2="420" y2="400"/>
        <line x1="40" y1="356" x2="180" y2="356"/>
        <line x1="380" y1="356" x2="520" y2="356"/>
      </g>
      <text x="60" y="388" font-size="12" fill="#3e7c59" font-weight="700">dry floor ✓</text>

      <!-- basement wall behind -->
      <rect x="40" y="120" width="480" height="180" fill="#efe7d8"/>
      <g stroke="#e1d8c6" stroke-width="2">
        <line x1="40" y1="160" x2="520" y2="160"/>
        <line x1="40" y1="210" x2="520" y2="210"/>
        <line x1="40" y1="260" x2="520" y2="260"/>
      </g>

      <!-- ===== sump pit cut into the floor ===== -->
      <!-- pit opening + walls -->
      <path d="M210 300 L250 388 H360 L390 300 Z" fill="#8a6a4f"/>
      <path d="M218 300 L254 380 H356 L382 300 Z" fill="#6b5440"/>
      <!-- water in the pit -->
      <path d="M236 340 L256 380 H354 L368 340 Z" fill="#7fb3c8"/>
      <path d="M236 340 L368 340" stroke="#9cc3d4" stroke-width="4"/>
      <!-- pit rim / lid edge -->
      <rect x="200" y="294" width="200" height="10" rx="3" fill="#b9b1a3"/>

      <!-- submersible pump body in the pit -->
      <rect x="276" y="320" width="48" height="56" rx="6" fill="#5e9a78"/>
      <rect x="276" y="320" width="48" height="12" rx="6" fill="#3e7c59"/>
      <ellipse cx="300" cy="376" rx="24" ry="6" fill="#2c5a40"/>
      <!-- pump power cord -->
      <path d="M318 326 q40 -10 56 -40" fill="none" stroke="#33393b" stroke-width="3" stroke-linecap="round"/>

      <!-- float switch on its arm — lifted up (ON) -->
      <rect x="262" y="330" width="6" height="40" rx="3" fill="#8a6a4f"/>
      <ellipse cx="252" cy="332" rx="15" ry="12" fill="#e0a93d"/>
      <ellipse cx="248" cy="329" rx="5" ry="4" fill="#faf0da"/>
      <!-- "up" arrow showing the float rising -->
      <path d="M252 360 l0 -16 m-5 6 l5 -6 l5 6" stroke="#3e7c59" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="206" y="332" font-size="11" fill="#3e7c59" font-weight="700">float ↑</text>

      <!-- discharge pipe rising from pump up and out -->
      <rect x="312" y="150" width="16" height="172" fill="#b9b1a3"/>
      <rect x="312" y="150" width="16" height="172" fill="#cdcabf" opacity="0.4"/>
      <!-- check valve bulge on the pipe -->
      <rect x="306" y="246" width="28" height="22" rx="6" fill="#8a6a4f"/>
      <text x="338" y="262" font-size="10" fill="#6b7376">check valve</text>
      <!-- pipe elbow turning out through the wall -->
      <path d="M312 150 q0 -16 16 -16 h120 v16 h-104 v16 h-32 z" fill="#b9b1a3"/>
      <rect x="440" y="134" width="40" height="16" rx="4" fill="#8a6a4f"/>
      <!-- water discharging out of the pipe, away from the house -->
      <g fill="#7fb3c8">
        <path d="M480 140 q24 4 36 22 q-6 -22 -30 -30 z"/>
        <circle cx="520" cy="170" r="5"/>
        <circle cx="510" cy="184" r="4"/>
        <circle cx="528" cy="186" r="3.5"/>
      </g>
      <text x="436" y="184" font-size="11" fill="#3e7c59" font-weight="700">out &amp; away →</text>

      <!-- hand pouring the test bucket of water into the pit -->
      <!-- bucket -->
      <path d="M126 132 h70 l-9 64 h-52 z" fill="#c96f4a"/>
      <path d="M122 130 h78 l-3 10 h-72 z" fill="#d9663f"/>
      <path d="M130 128 q35 -18 64 0" fill="none" stroke="#8a6a4f" stroke-width="3.5" stroke-linecap="round"/>
      <!-- the pour: a stream of water arcing into the pit -->
      <path d="M182 196 q30 50 70 100 q14 22 38 36" fill="none" stroke="#7fb3c8" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
      <g fill="#9cc3d4">
        <circle cx="262" cy="320" r="4"/>
        <circle cx="276" cy="336" r="3.4"/>
        <circle cx="290" cy="350" r="3"/>
      </g>
      <!-- hand gripping the bucket handle -->
      <ellipse cx="150" cy="120" rx="16" ry="12" fill="#e8b48f"/>
      <path d="M140 116 q-5 6 -1 13" stroke="#d99c73" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <!-- arm -->
      <path d="M150 108 q-24 -10 -52 6" stroke="#3e7c59" stroke-width="12" fill="none" stroke-linecap="round"/>

      <!-- battery backup box on the floor, right -->
      <rect x="430" y="320" width="64" height="56" rx="6" fill="#c9a06b"/>
      <rect x="430" y="320" width="64" height="14" rx="6" fill="#b9b1a3"/>
      <rect x="438" y="342" width="48" height="8" rx="3" fill="#fffdf8"/>
      <g stroke="#3e7c59" stroke-width="3" stroke-linecap="round">
        <path d="M456 358 l0 10 M451 363 l10 0"/>
      </g>
      <text x="430" y="392" font-size="10.5" fill="#6b7376">backup</text>
    </svg>
