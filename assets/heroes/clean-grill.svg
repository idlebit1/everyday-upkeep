          <line x1="56" y1="296" x2="128" y2="296"/>
          <line x1="46" y1="312" x2="138" y2="312"/>
          <line x1="46" y1="328" x2="138" y2="328"/>
          <line x1="56" y1="344" x2="128" y2="344"/>
