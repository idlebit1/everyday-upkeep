<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a backyard kettle grill with gentle smoke wisps rising from the lid vent, a spare grate with grill marks leaning beside it, and a caddy of cleaning tools on the patio">
      <ellipse cx="290" cy="398" rx="240" ry="22" fill="#efe7d8"/>
      <circle cx="78" cy="66" r="24" fill="#f2cf7a"/>
      <ellipse cx="462" cy="70" rx="44" ry="22" fill="#dce8ee"/>
      <ellipse cx="424" cy="82" rx="28" ry="16" fill="#dce8ee"/>
      <!-- fence -->
      <g fill="#c9a06b">
        <rect x="376" y="208" width="14" height="96" rx="4"/>
        <rect x="402" y="208" width="14" height="96" rx="4"/>
        <rect x="428" y="208" width="14" height="96" rx="4"/>
        <rect x="454" y="208" width="14" height="96" rx="4"/>
        <rect x="480" y="208" width="14" height="96" rx="4"/>
      </g>
      <rect x="368" y="228" width="134" height="10" rx="5" fill="#b9886a" opacity="0.9"/>
