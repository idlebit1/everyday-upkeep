      <line x1="250" y1="306" x2="208" y2="372" stroke="#5a544a" stroke-width="8" stroke-linecap="round"/>
      <line x1="250" y1="306" x2="292" y2="372" stroke="#5a544a" stroke-width="8" stroke-linecap="round"/>
      <line x1="250" y1="308" x2="250" y2="376" stroke="#5a544a" stroke-width="8" stroke-linecap="round"/>
      <circle cx="208" cy="378" r="10" fill="#33393b"/>
      <circle cx="208" cy="378" r="4" fill="#b9b1a3"/>
      <circle cx="292" cy="378" r="10" fill="#33393b"/>
      <circle cx="292" cy="378" r="4" fill="#b9b1a3"/>
      <circle cx="250" cy="380" r="6" fill="#33393b"/>
      <!-- spare grate with grill marks, leaning -->
