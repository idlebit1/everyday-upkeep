      <rect x="236" y="96" width="28" height="10" rx="5" fill="#8a6a4f"/>
      <ellipse cx="296" cy="150" rx="9" ry="5" fill="#5e9a78" transform="rotate(24 296 150)"/>
      <rect x="150" y="192" width="200" height="14" rx="7" fill="#3e7c59"/>
      <path d="M160 206 h180 a90 76 0 0 1 -180 0 z" fill="#3e7c59"/>
