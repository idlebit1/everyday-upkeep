<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a person raking matted winter debris into a pile on a greening spring lawn, with a wheelbarrow and leaf bag nearby, garden beds being cleared, crocus and tulip shoots coming up, and budding bare trees under a bright spring sun">
      <ellipse cx="290" cy="402" rx="250" ry="22" fill="#efe7d8"/>
      <circle cx="478" cy="64" r="24" fill="#e0a93d"/>
