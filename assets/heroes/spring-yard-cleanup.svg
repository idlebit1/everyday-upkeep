        <line x1="256" y1="326" x2="220" y2="372" stroke="#8a6a4f" stroke-width="7" stroke-linecap="round"/>
        <path d="M202 388 L236 360" stroke="#b9b1a3" stroke-width="4" stroke-linecap="round"/>
        <g stroke="#b9b1a3" stroke-width="3" stroke-linecap="round">
          <line x1="204" y1="386" x2="198" y2="394"/>
          <line x1="212" y1="380" x2="207" y2="389"/>
          <line x1="220" y1="374" x2="216" y2="384"/>
          <line x1="228" y1="368" x2="225" y2="378"/>
          <line x1="236" y1="362" x2="234" y2="372"/>
