        <circle cx="430" cy="156" r="7" fill="#3e7c59"/>
        <circle cx="408" cy="166" r="6" fill="#5e9a78"/>
        <circle cx="452" cy="170" r="6" fill="#3e7c59"/>
        <circle cx="418" cy="186" r="5" fill="#5e9a78"/>
