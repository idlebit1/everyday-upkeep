      <!-- fresh grass tufts -->
      <g stroke="#5e9a78" stroke-width="3" stroke-linecap="round">
        <line x1="120" y1="396" x2="120" y2="386"/>
        <line x1="128" y1="396" x2="130" y2="386"/>
        <line x1="500" y1="392" x2="500" y2="382"/>
        <line x1="508" y1="392" x2="510" y2="382"/>
