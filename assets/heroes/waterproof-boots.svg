<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a boot-waterproofing setup on spread newspaper: a pair of brown leather hiking boots, one freshly treated with water beading up and rolling off its surface, an aerosol waterproofing spray can and a round tin of wax open beside them, a soft application brush, and a folded cloth, all warm and outdoorsy">
      <ellipse cx="285" cy="404" rx="252" ry="22" fill="#efe7d8"/>

      <!-- spread newspaper under everything -->
      <rect x="56" y="244" width="450" height="156" rx="6" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5" transform="rotate(-2 281 322)"/>
      <g stroke="#b9b1a3" stroke-width="2" opacity="0.5" stroke-linecap="round" transform="rotate(-2 281 322)">
        <line x1="78" y1="266" x2="198" y2="266"/>
        <line x1="78" y1="276" x2="188" y2="276"/>
        <line x1="78" y1="286" x2="198" y2="286"/>
        <line x1="300" y1="266" x2="430" y2="266"/>
        <line x1="300" y1="276" x2="420" y2="276"/>
        <line x1="300" y1="286" x2="436" y2="286"/>
        <line x1="78" y1="380" x2="208" y2="380"/>
        <line x1="320" y1="380" x2="436" y2="380"/>
      </g>

      <!-- LEFT boot: freshly treated, water beading up -->
      <!-- sole -->
      <path d="M84 372 q-6 -10 4 -14 l132 0 q14 0 14 12 l0 10 q0 8 -12 8 h-122 q-14 0 -16 -16 z" fill="#5e4326"/>
      <rect x="86" y="386" width="148" height="10" rx="5" fill="#4a3520"/>
      <!-- tread blocks on the sole -->
      <g fill="#3a2a18">
        <rect x="98" y="388" width="9" height="7" rx="1.5"/>
        <rect x="120" y="388" width="9" height="7" rx="1.5"/>
        <rect x="142" y="388" width="9" height="7" rx="1.5"/>
        <rect x="164" y="388" width="9" height="7" rx="1.5"/>
        <rect x="186" y="388" width="9" height="7" rx="1.5"/>
        <rect x="208" y="388" width="9" height="7" rx="1.5"/>
      </g>
      <!-- upper / body of the boot -->
      <path d="M96 372 q-10 -96 26 -120 q12 -8 22 4 l4 30 q26 4 50 14 q40 16 44 50 l2 22 z" fill="#8a6a4f"/>
      <!-- ankle collar / cuff -->
      <path d="M118 256 q-6 -14 6 -20 q16 -8 26 2 l4 26 q-18 6 -36 -8 z" fill="#a07a52"/>
      <!-- toe cap highlight -->
      <path d="M180 320 q40 8 48 44 l-66 0 q4 -36 18 -44 z" fill="#7a5c3f"/>
      <!-- tongue + laces -->
      <path d="M132 286 l22 2 l-4 60 l-16 -2 z" fill="#9a7448"/>
      <g stroke="#5e4326" stroke-width="3.5" stroke-linecap="round">
        <line x1="124" y1="300" x2="150" y2="308"/>
        <line x1="122" y1="318" x2="148" y2="326"/>
        <line x1="122" y1="336" x2="148" y2="344"/>
      </g>
      <!-- eyelets -->
      <g fill="#e0a93d">
        <circle cx="124" cy="300" r="3"/>
        <circle cx="150" cy="308" r="3"/>
        <circle cx="122" cy="318" r="3"/>
        <circle cx="148" cy="326" r="3"/>
      </g>
      <!-- water BEADING on the treated leather -->
      <g>
        <circle cx="150" cy="350" r="7" fill="#7fb3c8"/>
        <ellipse cx="148" cy="347" rx="2.4" ry="1.6" fill="#dce8ee"/>
        <circle cx="172" cy="338" r="5.5" fill="#9cc3d4"/>
        <ellipse cx="170" cy="336" rx="1.8" ry="1.2" fill="#dce8ee"/>
        <circle cx="132" cy="332" r="4.5" fill="#7fb3c8"/>
        <circle cx="194" cy="356" r="6" fill="#9cc3d4"/>
        <ellipse cx="192" cy="353" rx="2" ry="1.4" fill="#dce8ee"/>
        <circle cx="164" cy="362" r="4" fill="#7fb3c8"/>
      </g>
      <!-- a drop rolling off, with a little splash below -->
      <path d="M210 360 q4 8 0 16" stroke="#7fb3c8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="210" cy="380" r="3.5" fill="#7fb3c8"/>
      <text x="96" y="240" font-size="11" fill="#3e7c59" font-weight="700">water beads &amp; rolls off</text>

      <!-- RIGHT boot, behind: untreated, dull, slightly turned -->
      <path d="M300 372 q-6 -10 4 -14 l120 0 q12 0 12 11 l0 9 q0 8 -11 8 h-110 q-13 0 -15 -14 z" fill="#6d5238"/>
      <path d="M308 364 q-8 -84 24 -104 q10 -7 20 3 l4 26 q22 4 42 12 q34 14 38 44 l2 18 z" fill="#9a8470" opacity="0.92"/>
      <!-- dry, slightly cracked look on the untreated boot -->
      <g stroke="#7a6450" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
        <path d="M340 320 q8 4 4 14"/>
        <path d="M362 332 q6 6 0 14"/>
        <path d="M352 350 l10 4"/>
      </g>
      <g stroke="#5e4326" stroke-width="3" stroke-linecap="round">
        <line x1="332" y1="296" x2="356" y2="304"/>
        <line x1="330" y1="314" x2="354" y2="322"/>
      </g>
      <text x="332" y="262" font-size="11" fill="#6b7376">dull &amp; thirsty</text>

      <!-- waterproofing SPRAY CAN, right -->
      <rect x="452" y="296" width="40" height="86" rx="10" fill="#3e7c59"/>
      <rect x="452" y="296" width="40" height="26" rx="10" fill="#2c5a40"/>
      <rect x="456" y="328" width="32" height="40" rx="4" fill="#e3efe8" opacity="0.85"/>
      <!-- water-drop label glyph -->
      <path d="M472 338 q7 9 0 16 q-7 -7 0 -16 z" fill="#7fb3c8"/>
      <!-- cap + nozzle -->
      <rect x="462" y="278" width="20" height="20" rx="4" fill="#5e9a78"/>
      <rect x="468" y="270" width="8" height="10" rx="2" fill="#2c5a40"/>
      <!-- a light mist from the nozzle -->
      <g fill="#9cc3d4" opacity="0.55">
        <circle cx="450" cy="276" r="2"/>
        <circle cx="442" cy="282" r="1.6"/>
        <circle cx="446" cy="270" r="1.4"/>
        <circle cx="438" cy="276" r="1.2"/>
      </g>

      <!-- WAX TIN, open, front-right -->
      <ellipse cx="392" cy="372" rx="34" ry="13" fill="#b9b1a3"/>
      <ellipse cx="392" cy="368" rx="34" ry="13" fill="#c9a06b"/>
      <ellipse cx="392" cy="368" rx="26" ry="9" fill="#8a6a4f"/>
      <!-- tin lid leaning behind it -->
      <ellipse cx="436" cy="356" rx="13" ry="30" fill="#b9b1a3" transform="rotate(18 436 356)"/>
      <ellipse cx="436" cy="356" rx="9" ry="24" fill="#d8cfbe" transform="rotate(18 436 356)"/>

      <!-- application BRUSH, front-center -->
      <rect x="236" y="356" width="70" height="14" rx="6" fill="#c96f4a" transform="rotate(-8 271 363)"/>
      <rect x="296" y="352" width="22" height="20" rx="4" fill="#8a6a4f" transform="rotate(-8 307 362)"/>
      <g stroke="#c9a06b" stroke-width="2" stroke-linecap="round" transform="rotate(-8 314 364)">
        <line x1="314" y1="356" x2="328" y2="354"/>
        <line x1="314" y1="362" x2="329" y2="361"/>
        <line x1="314" y1="368" x2="328" y2="370"/>
      </g>

      <!-- folded CLOTH, front-left -->
      <path d="M70 360 h72 l-6 26 h-60 z" fill="#5e9a78"/>
      <path d="M70 360 h72 l-4 9 h-64 z" fill="#7fb3c8" opacity="0.9"/>
      <g stroke="#3e7c59" stroke-width="1.6" opacity="0.6">
        <line x1="84" y1="374" x2="124" y2="374"/>
        <line x1="82" y1="380" x2="122" y2="380"/>
      </g>
    </svg>
