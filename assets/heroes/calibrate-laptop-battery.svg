<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a laptop on a clean desk: the screen shows a battery meter reading 20 percent in text while the drawn battery bar looks nearly two-thirds full, highlighting a mismatched, inaccurate readout; a charging cable runs to the side, and a small twenty-to-eighty percent charge-range indicator sits nearby">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- desk -->
      <rect x="40" y="330" width="480" height="16" rx="8" fill="#c9a06b"/>
      <rect x="70" y="346" width="14" height="44" rx="6" fill="#8a6a4f"/>
      <rect x="476" y="346" width="14" height="44" rx="6" fill="#8a6a4f"/>

      <!-- laptop base -->
      <path d="M150 320 h260 l26 22 h-312 z" fill="#b9b1a3"/>
      <rect x="152" y="316" width="256" height="8" rx="3" fill="#8a6a4f"/>
      <!-- keyboard hint on the base -->
      <g fill="#8a6a4f" opacity="0.55">
        <rect x="176" y="326" width="208" height="4" rx="2"/>
        <rect x="200" y="334" width="160" height="4" rx="2"/>
      </g>
      <!-- trackpad notch -->
      <rect x="256" y="333" width="48" height="5" rx="2.5" fill="#8a6a4f" opacity="0.4"/>

      <!-- laptop screen / lid -->
      <rect x="158" y="70" width="244" height="250" rx="12" fill="#2c5a40"/>
      <rect x="170" y="82" width="220" height="226" rx="6" fill="#fffdf8"/>

      <!-- screen: battery settings header -->
      <rect x="184" y="98" width="120" height="9" rx="4.5" fill="#b9b1a3"/>
      <circle cx="372" cy="102" r="6" fill="#e3efe8"/>
      <path d="M369 102 l2.5 2.5 l4.5 -5" stroke="#3e7c59" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- big drawn battery, looks mostly full -->
      <rect x="196" y="130" width="150" height="70" rx="10" fill="#fff" stroke="#8a6a4f" stroke-width="4"/>
      <rect x="346" y="150" width="10" height="30" rx="3" fill="#8a6a4f"/>
      <!-- fill: nearly two-thirds full, contradicting the 20% text -->
      <rect x="204" y="138" width="90" height="54" rx="5" fill="#5e9a78"/>
      <!-- charge bolt over the fill -->
      <path d="M262 146 l-14 22 h11 l-9 20 l24 -28 h-13 z" fill="#e0a93d"/>

      <!-- the mismatched text readout -->
      <text x="271" y="234" font-size="34" font-weight="800" fill="#d9663f" text-anchor="middle" font-family="Georgia, serif">20%</text>
      <text x="271" y="256" font-size="12" fill="#6b7376" text-anchor="middle">reads 20% — but look at the bar</text>
      <!-- little "mismatch" marker -->
      <g stroke="#d9663f" stroke-width="2.4" stroke-linecap="round">
        <path d="M348 218 q10 6 20 0"/>
        <circle cx="358" cy="212" r="1.6" fill="#d9663f" stroke="none"/>
      </g>
      <text x="360" y="200" font-size="11" fill="#d9663f" font-weight="700" text-anchor="middle">?!</text>

      <!-- screen: little inaccurate-gauge note row -->
      <rect x="184" y="274" width="176" height="16" rx="8" fill="#fbe9e1"/>
      <circle cx="194" cy="282" r="4" fill="#d9663f"/>
      <rect x="204" y="278" width="120" height="6" rx="3" fill="#d98e3b"/>

      <!-- charging cable running off to the wall -->
      <path d="M402 250 q46 -6 60 20 q12 22 -14 30" stroke="#b9b1a3" stroke-width="6" fill="none" stroke-linecap="round"/>
      <rect x="396" y="242" width="18" height="14" rx="4" fill="#8a6a4f"/>
      <rect x="490" y="298" width="18" height="26" rx="4" fill="#5e9a78"/>
      <line x1="496" y1="292" x2="496" y2="298" stroke="#8a6a4f" stroke-width="3" stroke-linecap="round"/>
      <line x1="502" y1="292" x2="502" y2="298" stroke="#8a6a4f" stroke-width="3" stroke-linecap="round"/>

      <!-- 20–80% charge-range indicator card on the desk -->
      <rect x="66" y="292" width="82" height="46" rx="8" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5" transform="rotate(-4 107 315)"/>
      <!-- mini range bar -->
      <rect x="76" y="304" width="62" height="10" rx="5" fill="#e9e2d8" transform="rotate(-4 107 309)"/>
      <rect x="88" y="304" width="37" height="10" rx="5" fill="#3e7c59" transform="rotate(-4 107 309)"/>
      <text x="107" y="331" font-size="11" font-weight="700" fill="#2c5a40" text-anchor="middle" transform="rotate(-4 107 327)">20–80%</text>

      <!-- coffee mug for warmth -->
      <rect x="408" y="298" width="34" height="34" rx="6" fill="#c96f4a"/>
      <path d="M442 306 q14 4 0 18" stroke="#c96f4a" stroke-width="6" fill="none"/>
      <path d="M418 288 q3 -7 0 -12" stroke="#b9b1a3" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- small plant -->
      <path d="M512 388 q-2 -20 -12 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M512 388 q4 -18 14 -24" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="497" cy="356" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 497 356)"/>
      <ellipse cx="527" cy="360" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 527 360)"/>
      <path d="M500 388 h26 l-4 26 h-18 z" fill="#c96f4a"/>
    </svg>
