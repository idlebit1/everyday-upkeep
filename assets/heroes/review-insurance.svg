<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a large umbrella sheltering a small house, a car, and a heart from falling rain — a metaphor for insurance coverage protecting home, auto, and life">
      <ellipse cx="290" cy="398" rx="250" ry="24" fill="#efe7d8"/>
      <circle cx="70" cy="64" r="24" fill="#f2cf7a"/>
      <ellipse cx="468" cy="60" rx="46" ry="22" fill="#dce8ee"/>
      <ellipse cx="426" cy="72" rx="28" ry="16" fill="#dce8ee"/>
      <ellipse cx="120" cy="118" rx="36" ry="18" fill="#dce8ee"/>
      <!-- rain falling outside the umbrella -->
      <g stroke="#7fb3c8" stroke-width="3.5" stroke-linecap="round">
        <line x1="56" y1="160" x2="50" y2="182"/>
        <line x1="86" y1="200" x2="80" y2="222"/>
        <line x1="62" y1="256" x2="56" y2="278"/>
        <line x1="92" y1="310" x2="86" y2="332"/>
        <line x1="486" y1="170" x2="480" y2="192"/>
        <line x1="512" y1="226" x2="506" y2="248"/>
        <line x1="482" y1="284" x2="476" y2="306"/>
        <line x1="510" y1="334" x2="504" y2="356"/>
      </g>
      <!-- umbrella canopy -->
      <path d="M126 196 Q280 56 434 196 Q396 168 357 196 Q318 162 280 196 Q242 162 203 196 Q164 168 126 196 Z" fill="#d9663f"/>
      <path d="M203 196 Q242 162 280 196 Q318 162 357 196 Q318 178 280 196 Q242 178 203 196 Z" fill="#c96f4a"/>
      <circle cx="280" cy="86" r="8" fill="#e0a93d"/>
      <!-- umbrella pole and handle -->
      <rect x="276" y="196" width="8" height="178" rx="4" fill="#8a6a4f"/>
      <path d="M284 374 q0 18 -16 18 q-12 0 -12 -12" stroke="#8a6a4f" stroke-width="8" fill="none" stroke-linecap="round"/>
      <!-- sheltered house -->
      <rect x="150" y="282" width="92" height="92" fill="#fffdf8" stroke="#e6dccb" stroke-width="2"/>
      <polygon points="142,284 196,238 250,284" fill="#c96f4a"/>
      <rect x="183" y="330" width="26" height="44" rx="2" fill="#3e7c59"/>
      <circle cx="204" cy="352" r="2" fill="#f2cf7a"/>
      <rect x="162" y="300" width="22" height="20" rx="2" fill="#cfe3ec" stroke="#e6dccb" stroke-width="2"/>
      <rect x="214" y="300" width="22" height="20" rx="2" fill="#cfe3ec" stroke="#e6dccb" stroke-width="2"/>
      <!-- sheltered car -->
      <path d="M312 344 q6 -20 26 -20 h44 q20 0 26 20 z" fill="#5e9a78"/>
      <rect x="300" y="342" width="120" height="26" rx="12" fill="#3e7c59"/>
      <rect x="326" y="330" width="26" height="12" rx="3" fill="#cfe3ec"/>
      <rect x="360" y="330" width="26" height="12" rx="3" fill="#cfe3ec"/>
      <circle cx="328" cy="370" r="11" fill="#33393b"/>
      <circle cx="328" cy="370" r="4.5" fill="#b9b1a3"/>
      <circle cx="394" cy="370" r="11" fill="#33393b"/>
      <circle cx="394" cy="370" r="4.5" fill="#b9b1a3"/>
      <!-- sheltered heart -->
      <path d="M280 268 c10 -14 30 -10 30 4 c0 12 -16 22 -30 30 c-14 -8 -30 -18 -30 -30 c0 -14 20 -18 30 -4" fill="#d9663f"/>
      <path d="M268 268 q4 -6 10 -6" stroke="#fbe9e1" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- shrubs -->
      <circle cx="132" cy="384" r="13" fill="#5e9a78"/>
      <circle cx="448" cy="386" r="14" fill="#5e9a78"/>
      <circle cx="468" cy="390" r="10" fill="#3e7c59"/>
    </svg>
