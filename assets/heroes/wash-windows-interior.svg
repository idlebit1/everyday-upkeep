<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of someone washing an interior window: a tall double-hung window is half-washed, sparkling clean glass on one side and a dusty, fingerprinted pane on the other, a hand pulls a squeegee down the wet glass in an S-shaped path, a bucket of soapy water and a spray bottle sit on the sill, microfiber cloths are folded nearby, and a small plant adds warmth">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- window frame -->
      <rect x="150" y="40" width="270" height="300" rx="10" fill="#fffdf8" stroke="#8a6a4f" stroke-width="6"/>
      <!-- outer sill / apron below -->
      <rect x="140" y="336" width="290" height="20" rx="5" fill="#b9b1a3"/>
      <rect x="148" y="352" width="274" height="12" rx="4" fill="#8a6a4f"/>
      <!-- center mullion (double-hung divide) -->
      <rect x="278" y="46" width="14" height="288" fill="#8a6a4f"/>
      <!-- top rail of lower sash -->
      <rect x="156" y="186" width="258" height="12" fill="#8a6a4f"/>

      <!-- LEFT pane: clean & sparkling -->
      <rect x="160" y="50" width="114" height="130" rx="3" fill="#dce8ee"/>
      <rect x="160" y="202" width="114" height="128" rx="3" fill="#dce8ee"/>
      <!-- bright diagonal shine streaks on the clean glass -->
      <g stroke="#fffdf8" stroke-width="6" stroke-linecap="round" opacity="0.85">
        <line x1="178" y1="160" x2="240" y2="74"/>
        <line x1="198" y1="166" x2="252" y2="92"/>
        <line x1="176" y1="312" x2="236" y2="230"/>
      </g>
      <!-- sparkle on the clean pane -->
      <g stroke="#5e9a78" stroke-width="2.4" stroke-linecap="round">
        <path d="M224 118 l0 10 M219 123 l10 0"/>
      </g>
      <text x="166" y="64" font-size="11" fill="#3e7c59" font-weight="700">clean</text>

      <!-- RIGHT pane: dusty, smudged, fingerprinted -->
      <rect x="296" y="50" width="114" height="130" rx="3" fill="#cdd9de"/>
      <rect x="296" y="202" width="114" height="128" rx="3" fill="#cdd9de"/>
      <!-- film / haze overlay -->
      <rect x="296" y="50" width="114" height="130" rx="3" fill="#d8cfbe" opacity="0.45"/>
      <rect x="296" y="202" width="114" height="128" rx="3" fill="#d8cfbe" opacity="0.45"/>
      <!-- fingerprint smudges -->
      <ellipse cx="330" cy="250" rx="9" ry="12" fill="#b9b1a3" opacity="0.6"/>
      <ellipse cx="346" cy="262" rx="8" ry="11" fill="#b9b1a3" opacity="0.55"/>
      <ellipse cx="360" cy="252" rx="8" ry="11" fill="#b9b1a3" opacity="0.5"/>
      <!-- pet nose-print low on the pane -->
      <ellipse cx="340" cy="310" rx="7" ry="5" fill="#8a6a4f" opacity="0.5"/>
      <circle cx="336" cy="312" r="1.6" fill="#8a6a4f"/>
      <circle cx="344" cy="312" r="1.6" fill="#8a6a4f"/>
      <!-- dust specks -->
      <g fill="#b9b1a3" opacity="0.7">
        <circle cx="318" cy="80" r="2.2"/>
        <circle cx="386" cy="96" r="1.8"/>
        <circle cx="358" cy="120" r="2"/>
        <circle cx="332" cy="150" r="1.6"/>
      </g>
      <text x="302" y="64" font-size="11" fill="#6b7376">filmy</text>

      <!-- hand pulling a squeegee down the clean side in an S path -->
      <!-- the wet S-trail behind the squeegee -->
      <path d="M196 92 q42 24 0 48 q-42 24 0 48" fill="none" stroke="#7fb3c8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
      <!-- squeegee blade + handle -->
      <rect x="178" y="180" width="70" height="9" rx="3" fill="#5e9a78"/>
      <rect x="180" y="189" width="66" height="6" rx="2" fill="#3e7c59"/>
      <rect x="206" y="195" width="14" height="34" rx="5" fill="#8a6a4f"/>
      <!-- hand on the handle -->
      <ellipse cx="213" cy="236" rx="16" ry="12" fill="#e8b48f"/>
      <path d="M203 232 q-5 6 -1 13" stroke="#d99c73" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <!-- arm -->
      <path d="M213 248 q14 28 44 36" stroke="#3e7c59" stroke-width="12" fill="none" stroke-linecap="round"/>

      <!-- bucket of soapy water on the sill, right -->
      <path d="M438 296 h62 l-8 56 h-46 z" fill="#7fb3c8"/>
      <path d="M434 294 h70 l-3 10 h-64 z" fill="#9cc3d4"/>
      <path d="M440 290 q29 -16 56 0" fill="none" stroke="#5e9a78" stroke-width="3" stroke-linecap="round"/>
      <!-- soap suds -->
      <circle cx="452" cy="298" r="6" fill="#eef4f7"/>
      <circle cx="466" cy="294" r="7" fill="#fffdf8"/>
      <circle cx="480" cy="299" r="5" fill="#eef4f7"/>

      <!-- spray bottle on the sill, left of bucket -->
      <rect x="60" y="300" width="30" height="48" rx="6" fill="#5e9a78"/>
      <rect x="66" y="288" width="18" height="14" rx="3" fill="#3e7c59"/>
      <path d="M84 290 l16 -6 l0 6 l-16 4 z" fill="#2c5a40"/>
      <rect x="64" y="318" width="22" height="16" rx="3" fill="#dce8ee" opacity="0.8"/>

      <!-- folded microfiber cloths front-left -->
      <path d="M104 360 h70 l-6 22 h-58 z" fill="#7fb3c8"/>
      <path d="M104 360 h70 l-4 8 h-62 z" fill="#9cc3d4"/>
      <g stroke="#cdd9de" stroke-width="1.6">
        <line x1="118" y1="372" x2="158" y2="372"/>
        <line x1="116" y1="378" x2="156" y2="378"/>
      </g>

      <!-- small plant for warmth, right -->
      <path d="M508 348 h26 l-4 26 h-18 z" fill="#c96f4a"/>
      <path d="M520 348 q-3 -20 -12 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M520 348 q4 -18 14 -24" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="505" cy="316" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 505 316)"/>
      <ellipse cx="535" cy="320" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 535 320)"/>
    </svg>
