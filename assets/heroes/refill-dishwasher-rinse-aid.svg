<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of an open dishwasher door in a kitchen with the rinse-aid dispenser cap flipped open next to the detergent cup, a bottle of rinse aid pouring blue liquid into the well, the low-level indicator window showing full, and a rack of spot-free sparkling glasses above">
      <ellipse cx="285" cy="404" rx="255" ry="22" fill="#efe7d8"/>

      <!-- kitchen cabinets / counter behind -->
      <rect x="30" y="36" width="500" height="70" rx="8" fill="#c9a06b"/>
      <rect x="30" y="98" width="500" height="10" fill="#8a6a4f"/>
      <rect x="70" y="52" width="60" height="40" rx="4" fill="#b9863f" opacity="0.5"/>
      <rect x="150" y="52" width="60" height="40" rx="4" fill="#b9863f" opacity="0.5"/>
      <circle cx="126" cy="72" r="2.6" fill="#8a6a4f"/>
      <circle cx="154" cy="72" r="2.6" fill="#8a6a4f"/>

      <!-- dishwasher tub body -->
      <rect x="120" y="108" width="320" height="196" rx="8" fill="#dce8ee" stroke="#b9b1a3" stroke-width="4"/>
      <rect x="128" y="116" width="304" height="180" rx="5" fill="#eef4f7"/>

      <!-- upper rack of sparkling glasses -->
      <line x1="140" y1="150" x2="420" y2="150" stroke="#b9b1a3" stroke-width="3"/>
      <g>
        <!-- glass 1 (upside-down) -->
        <path d="M162 150 l6 -34 h20 l6 34 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
        <path d="M170 146 l3 -22" stroke="#fffdf8" stroke-width="3" stroke-linecap="round"/>
        <!-- glass 2 -->
        <path d="M212 150 l6 -34 h20 l6 34 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
        <path d="M220 146 l3 -22" stroke="#fffdf8" stroke-width="3" stroke-linecap="round"/>
        <!-- glass 3 -->
        <path d="M262 150 l6 -34 h20 l6 34 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
        <path d="M270 146 l3 -22" stroke="#fffdf8" stroke-width="3" stroke-linecap="round"/>
        <!-- mug -->
        <rect x="316" y="118" width="26" height="32" rx="3" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
        <path d="M342 124 q10 2 0 16" fill="none" stroke="#7fb3c8" stroke-width="3"/>
        <!-- glass 4 -->
        <path d="M366 150 l6 -34 h20 l6 34 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
        <path d="M374 146 l3 -22" stroke="#fffdf8" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- sparkles over the clean glasses -->
      <g stroke="#5e9a78" stroke-width="2.4" stroke-linecap="round">
        <path d="M200 128 l0 9 M195.5 132.5 l9 0"/>
        <path d="M304 130 l0 8 M300 134 l8 0"/>
        <path d="M400 124 l0 8 M396 128 l8 0"/>
      </g>

      <!-- lower rack line -->
      <line x1="140" y1="230" x2="420" y2="230" stroke="#b9b1a3" stroke-width="3"/>
      <g stroke="#b9b1a3" stroke-width="2.4">
        <line x1="164" y1="230" x2="164" y2="248"/>
        <line x1="188" y1="230" x2="188" y2="248"/>
        <line x1="212" y1="230" x2="212" y2="248"/>
        <line x1="236" y1="230" x2="236" y2="248"/>
      </g>

      <!-- OPEN DOOR, dropped down at front -->
      <rect x="112" y="304" width="336" height="96" rx="8" fill="#fffdf8" stroke="#b9b1a3" stroke-width="4"/>
      <rect x="122" y="314" width="316" height="76" rx="5" fill="#f2ede2"/>

      <!-- detergent cup (on the door) -->
      <rect x="150" y="330" width="70" height="46" rx="5" fill="#dce8ee" stroke="#8a6a4f" stroke-width="3"/>
      <rect x="150" y="330" width="70" height="12" rx="4" fill="#c96f4a"/>
      <text x="185" y="368" font-size="10" fill="#6b7376" text-anchor="middle" font-weight="700">detergent</text>

      <!-- rinse-aid dispenser well, cap flipped OPEN, beside the detergent cup -->
      <circle cx="300" cy="352" r="26" fill="#dce8ee" stroke="#8a6a4f" stroke-width="3"/>
      <circle cx="300" cy="352" r="17" fill="#7fb3c8"/>
      <!-- blue rinse aid already in the well -->
      <path d="M285 352 a15 15 0 0 0 30 0 z" fill="#5e9a78" opacity="0.75"/>
      <!-- flipped-open cap hinged to the side -->
      <rect x="326" y="330" width="30" height="10" rx="4" fill="#c96f4a" transform="rotate(-32 326 335)"/>
      <text x="300" y="392" font-size="10" fill="#3e7c59" text-anchor="middle" font-weight="700">rinse aid</text>

      <!-- low-level indicator window (dark dot = full) -->
      <rect x="360" y="342" width="22" height="20" rx="4" fill="#fffdf8" stroke="#8a6a4f" stroke-width="2.5"/>
      <circle cx="371" cy="352" r="5" fill="#2c5a40"/>
      <text x="371" y="336" font-size="8.5" fill="#6b7376" text-anchor="middle">full</text>

      <!-- rinse-aid bottle pouring blue liquid into the well -->
      <g transform="rotate(38 300 300)">
        <rect x="270" y="228" width="46" height="78" rx="10" fill="#7fb3c8"/>
        <rect x="270" y="228" width="46" height="20" rx="10" fill="#5e9a78"/>
        <rect x="284" y="212" width="18" height="20" rx="4" fill="#3e7c59"/>
        <rect x="278" y="256" width="30" height="30" rx="4" fill="#dce8ee" opacity="0.7"/>
      </g>
      <!-- pour stream of blue rinse aid into the dispenser -->
      <path d="M320 300 q-8 22 -16 40" fill="none" stroke="#5e9a78" stroke-width="6" stroke-linecap="round"/>
      <circle cx="303" cy="344" r="3.4" fill="#5e9a78"/>

      <!-- small potted herb on the counter for warmth -->
      <path d="M472 78 h30 l-4 26 h-22 z" fill="#c96f4a"/>
      <path d="M486 78 q-4 -22 -14 -30" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M486 78 q5 -20 16 -26" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="470" cy="44" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 470 44)"/>
      <ellipse cx="502" cy="48" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 502 48)"/>
    </svg>
