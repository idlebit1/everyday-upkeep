<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a rolled and unrolled yoga mat in flat friendly style with a spray bottle misting it, a soft cloth, and water droplets, all in greens and water blues">
      <ellipse cx="280" cy="400" rx="250" ry="22" fill="#efe7d8"/>
      <circle cx="70" cy="62" r="24" fill="#f2cf7a"/>
      <ellipse cx="462" cy="66" rx="44" ry="20" fill="#dce8ee"/>
      <ellipse cx="420" cy="78" rx="26" ry="14" fill="#dce8ee"/>
      <ellipse cx="120" cy="110" rx="30" ry="15" fill="#dce8ee"/>
      <!-- clean glow under the mat -->
      <ellipse cx="280" cy="324" rx="218" ry="46" fill="#e3efe8"/>
      <!-- unrolled mat lying flat -->
      <path d="M70 320 L408 300 L470 322 L132 342 Z" fill="#5e9a78"/>
      <path d="M70 320 L408 300 L412 318 L74 338 Z" fill="#3e7c59"/>
      <!-- mat texture lines -->
      <g stroke="#2c5a40" stroke-width="2" opacity="0.45">
        <line x1="120" y1="316" x2="124" y2="332"/>
        <line x1="180" y1="312" x2="184" y2="328"/>
        <line x1="240" y1="308" x2="244" y2="324"/>
        <line x1="300" y1="305" x2="304" y2="321"/>
        <line x1="360" y1="302" x2="364" y2="318"/>
      </g>
      <!-- rolled mat on the right -->
      <g transform="translate(430 250)">
        <ellipse cx="40" cy="44" rx="30" ry="44" fill="#3e7c59"/>
        <ellipse cx="40" cy="44" rx="17" ry="26" fill="#5e9a78"/>
        <ellipse cx="40" cy="44" rx="7" ry="12" fill="#2c5a40"/>
        <path d="M40 0 a30 44 0 0 1 0 88 l8 0 a30 44 0 0 0 0 -88 z" fill="#5e9a78"/>
        <rect x="36" y="86" width="24" height="10" rx="5" fill="#c96f4a"/>
      </g>
      <!-- spray bottle -->
      <g transform="translate(150 130)">
        <rect x="0" y="60" width="58" height="78" rx="12" fill="#7fb3c8"/>
        <rect x="8" y="80" width="42" height="40" rx="8" fill="#dce8ee" opacity="0.7"/>
        <rect x="14" y="42" width="30" height="22" rx="5" fill="#2c5a40"/>
        <path d="M14 42 h-18 v-10 h18" fill="#3e7c59"/>
        <rect x="22" y="28" width="14" height="18" rx="4" fill="#2c5a40"/>
        <!-- spray mist -->
        <g fill="#7fb3c8">
          <circle cx="-26" cy="22" r="3.5"/>
          <circle cx="-40" cy="14" r="3"/>
          <circle cx="-38" cy="30" r="2.6"/>
          <circle cx="-52" cy="22" r="2.4"/>
          <circle cx="-30" cy="40" r="2.2"/>
        </g>
      </g>
      <!-- soft cloth -->
      <g transform="translate(250 250)">
        <path d="M0 0 q40 -14 80 0 q-6 34 0 56 q-40 14 -80 0 q6 -30 0 -56 z" fill="#dce8ee"/>
        <path d="M14 14 q30 -8 56 0" stroke="#7fb3c8" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M12 34 q30 -8 60 0" stroke="#7fb3c8" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <!-- water droplets -->
      <g fill="#7fb3c8">
        <path d="M120 196 c5 7 7 11 0 15 c-7 -4 -5 -8 0 -15" />
        <path d="M360 150 c4 6 6 9 0 13 c-6 -4 -4 -7 0 -13" />
      </g>
      <!-- soap suds -->
      <g fill="#fffdf8" opacity="0.9">
        <circle cx="324" cy="288" r="9"/>
        <circle cx="340" cy="282" r="6"/>
        <circle cx="312" cy="282" r="5"/>
      </g>
      <!-- greenery -->
      <circle cx="42" cy="386" r="14" fill="#5e9a78"/>
      <circle cx="62" cy="392" r="11" fill="#3e7c59"/>
      <circle cx="524" cy="392" r="10" fill="#5e9a78"/>
    </svg>
