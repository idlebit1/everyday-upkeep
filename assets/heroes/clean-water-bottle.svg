<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a kitchen sink scene for deep-cleaning a water bottle: a disassembled bottle with its body, flip-top straw lid, straw, and silicone gasket laid out, a bottle brush and narrow straw brush, dish soap and baking soda, and parts air-drying upside down on a rack">
      <ellipse cx="280" cy="400" rx="245" ry="22" fill="#efe7d8"/>
      <!-- window -->
      <rect x="60" y="40" width="120" height="120" rx="10" fill="#dce8ee" stroke="#e6dccb" stroke-width="3"/>
      <line x1="120" y1="43" x2="120" y2="157" stroke="#fffdf8" stroke-width="4"/>
      <line x1="63" y1="100" x2="177" y2="100" stroke="#fffdf8" stroke-width="4"/>
      <circle cx="148" cy="70" r="14" fill="#5e9a78"/>
      <circle cx="92" cy="128" r="12" fill="#3e7c59"/>
      <rect x="48" y="34" width="144" height="10" rx="5" fill="#8a6a4f"/>
      <!-- counter + sink lip -->
      <rect x="40" y="300" width="480" height="16" rx="8" fill="#b9b1a3"/>
      <rect x="60" y="316" width="440" height="10" rx="5" fill="#a59c8c"/>
      <!-- faucet -->
      <path d="M420 196 v-26 q0 -14 14 -14 h26" stroke="#8a6a4f" stroke-width="9" fill="none" stroke-linecap="round"/>
      <rect x="408" y="196" width="24" height="14" rx="5" fill="#8a6a4f"/>
      <g stroke="#7fb3c8" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
        <line x1="420" y1="212" x2="420" y2="244"/>
        <line x1="426" y1="212" x2="426" y2="240"/>
      </g>
      <!-- bottle body (open, no lid) -->
      <rect x="96" y="150" width="64" height="150" rx="20" fill="#5e9a78"/>
      <rect x="104" y="142" width="48" height="16" rx="6" fill="#3e7c59"/>
      <rect x="104" y="142" width="48" height="6" rx="3" fill="#2c5a40"/>
      <rect x="108" y="190" width="40" height="80" rx="10" fill="#7fb3c8" opacity="0.45"/>
      <!-- bottle brush leaning in body -->
      <rect x="126" y="92" width="7" height="64" rx="3.5" fill="#c96f4a"/>
      <ellipse cx="129.5" cy="180" rx="15" ry="26" fill="#dce8ee"/>
      <g stroke="#7fb3c8" stroke-width="2" stroke-linecap="round">
        <line x1="116" y1="166" x2="108" y2="160"/><line x1="116" y1="180" x2="106" y2="180"/><line x1="116" y1="194" x2="108" y2="200"/>
        <line x1="143" y1="166" x2="151" y2="160"/><line x1="143" y1="180" x2="153" y2="180"/><line x1="143" y1="194" x2="151" y2="200"/>
      </g>
      <!-- flip-top straw lid laid on counter -->
      <rect x="206" y="276" width="78" height="24" rx="10" fill="#c96f4a"/>
      <rect x="206" y="276" width="78" height="9" rx="5" fill="#d9663f"/>
      <rect x="236" y="258" width="18" height="22" rx="5" fill="#d9663f"/>
      <path d="M236 258 q9 -14 18 0 z" fill="#c96f4a"/>
      <!-- silicone gasket ring popped out -->
      <circle cx="320" cy="288" r="17" fill="none" stroke="#e0a93d" stroke-width="7"/>
      <text x="320" y="266" font-size="11" fill="#8a6a4f" text-anchor="middle" font-weight="700">gasket</text>
      <!-- straw + narrow straw brush -->
      <rect x="356" y="206" width="9" height="92" rx="4.5" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
      <rect x="384" y="200" width="6" height="98" rx="3" fill="#8a6a4f"/>
      <g stroke="#5e9a78" stroke-width="1.8" stroke-linecap="round">
        <line x1="384" y1="214" x2="378" y2="210"/><line x1="390" y1="214" x2="396" y2="210"/>
        <line x1="384" y1="230" x2="378" y2="226"/><line x1="390" y1="230" x2="396" y2="226"/>
        <line x1="384" y1="246" x2="378" y2="242"/><line x1="390" y1="246" x2="396" y2="242"/>
        <line x1="384" y1="262" x2="378" y2="258"/><line x1="390" y1="262" x2="396" y2="258"/>
      </g>
      <!-- dish soap bottle -->
      <rect x="430" y="232" width="40" height="66" rx="10" fill="#7fb3c8"/>
      <rect x="430" y="258" width="40" height="22" fill="#fffdf8"/>
      <path d="M438 268 q6 -5 12 0 q6 5 12 0" stroke="#7fb3c8" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <rect x="442" y="216" width="16" height="18" rx="4" fill="#2c5a40"/>
      <rect x="445" y="208" width="10" height="10" rx="3" fill="#2c5a40"/>
      <!-- baking soda box -->
      <rect x="478" y="252" width="34" height="46" rx="4" fill="#e0a93d"/>
      <rect x="478" y="252" width="34" height="14" rx="4" fill="#d98e3b"/>
      <rect x="484" y="272" width="22" height="6" rx="3" fill="#faf0da"/>
      <rect x="484" y="282" width="16" height="5" rx="2.5" fill="#faf0da"/>
      <!-- drying rack with inverted lid -->
      <rect x="210" y="372" width="120" height="8" rx="4" fill="#b9b1a3"/>
      <g stroke="#b9b1a3" stroke-width="4" stroke-linecap="round">
        <line x1="224" y1="372" x2="224" y2="344"/>
        <line x1="246" y1="372" x2="246" y2="340"/>
        <line x1="294" y1="372" x2="294" y2="340"/>
        <line x1="316" y1="372" x2="316" y2="344"/>
      </g>
      <path d="M252 344 q18 -18 36 0 z" fill="#5e9a78"/>
      <!-- water drips drying -->
      <path d="M270 348 q-2 6 2 8 q4 -2 2 -8 l-2 -5 z" fill="#7fb3c8" opacity="0.7"/>
      <!-- sparkles -->
      <g stroke="#e0a93d" stroke-width="2.5" stroke-linecap="round">
        <line x1="180" y1="170" x2="180" y2="182"/>
        <line x1="174" y1="176" x2="186" y2="176"/>
        <line x1="346" y1="172" x2="346" y2="182"/>
        <line x1="341" y1="177" x2="351" y2="177"/>
      </g>
      <circle cx="200" cy="210" r="3" fill="#7fb3c8"/>
      <circle cx="404" cy="170" r="3" fill="#7fb3c8"/>
    </svg>
