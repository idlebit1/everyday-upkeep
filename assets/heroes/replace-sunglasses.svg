<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of sunglasses as eye-health equipment: on the left an old, scratched, sun-faded pair of sunglasses with cracked lenses; on the right a fresh pair with a tag reading UV400 100% UVA-UVB next to a hard protective case, with a bright sun overhead and a sunny outdoor setting">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- bright sun overhead -->
      <circle cx="470" cy="70" r="40" fill="#faf0da" stroke="#e0a93d" stroke-width="5"/>
      <g stroke="#e0a93d" stroke-width="5" stroke-linecap="round">
        <line x1="470" y1="10" x2="470" y2="24"/>
        <line x1="470" y1="116" x2="470" y2="130"/>
        <line x1="410" y1="70" x2="424" y2="70"/>
        <line x1="516" y1="70" x2="530" y2="70"/>
        <line x1="427" y1="27" x2="437" y2="37"/>
        <line x1="503" y1="103" x2="513" y2="113"/>
        <line x1="427" y1="113" x2="437" y2="103"/>
        <line x1="503" y1="37" x2="513" y2="27"/>
      </g>

      <!-- LEFT: old, scratched, faded pair -->
      <text x="66" y="130" font-size="13" fill="#d9663f" font-weight="700">retire this</text>
      <!-- left lens -->
      <ellipse cx="112" cy="200" rx="46" ry="40" fill="#cdd9de" stroke="#8a6a4f" stroke-width="6"/>
      <!-- faded haze overlay -->
      <ellipse cx="112" cy="200" rx="46" ry="40" fill="#d8cfbe" opacity="0.5"/>
      <!-- right lens -->
      <ellipse cx="212" cy="200" rx="46" ry="40" fill="#cdd9de" stroke="#8a6a4f" stroke-width="6"/>
      <ellipse cx="212" cy="200" rx="46" ry="40" fill="#d8cfbe" opacity="0.5"/>
      <!-- bridge -->
      <path d="M158 190 q12 -10 24 0" fill="none" stroke="#8a6a4f" stroke-width="6" stroke-linecap="round"/>
      <!-- temple arm, bent -->
      <path d="M258 202 q22 -2 34 14" fill="none" stroke="#8a6a4f" stroke-width="6" stroke-linecap="round"/>
      <!-- scratches on the lenses -->
      <g stroke="#8a6a4f" stroke-width="2" stroke-linecap="round" opacity="0.75">
        <line x1="84" y1="182" x2="132" y2="216"/>
        <line x1="96" y1="220" x2="128" y2="194"/>
        <line x1="188" y1="178" x2="234" y2="214"/>
        <line x1="200" y1="224" x2="228" y2="188"/>
      </g>
      <!-- little crack mark -->
      <path d="M110 172 l6 10 l-4 8" fill="none" stroke="#6b7376" stroke-width="2" stroke-linecap="round"/>

      <!-- RIGHT: fresh pair -->
      <text x="352" y="130" font-size="13" fill="#3e7c59" font-weight="700">buy this</text>
      <!-- left lens -->
      <ellipse cx="392" cy="200" rx="46" ry="40" fill="#7fb3c8" stroke="#2c5a40" stroke-width="6"/>
      <!-- right lens -->
      <ellipse cx="492" cy="200" rx="46" ry="40" fill="#7fb3c8" stroke="#2c5a40" stroke-width="6"/>
      <!-- bridge -->
      <path d="M438 190 q12 -10 24 0" fill="none" stroke="#2c5a40" stroke-width="6" stroke-linecap="round"/>
      <!-- temple arm -->
      <path d="M538 200 q18 0 26 14" fill="none" stroke="#2c5a40" stroke-width="6" stroke-linecap="round"/>
      <!-- clean shine streaks -->
      <g stroke="#fffdf8" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <line x1="368" y1="216" x2="404" y2="176"/>
        <line x1="382" y1="222" x2="410" y2="190"/>
        <line x1="468" y1="216" x2="504" y2="176"/>
      </g>
      <!-- UV400 tag hanging off the fresh pair -->
      <line x1="492" y1="238" x2="500" y2="266" stroke="#b9b1a3" stroke-width="2.5"/>
      <rect x="470" y="266" width="86" height="42" rx="8" fill="#fffdf8" stroke="#3e7c59" stroke-width="3"/>
      <text x="513" y="284" font-size="13" fill="#2c5a40" font-weight="700" text-anchor="middle">UV400</text>
      <text x="513" y="299" font-size="8.5" fill="#3e7c59" font-weight="700" text-anchor="middle">100% UVA-UVB</text>

      <!-- hard protective case, front center -->
      <path d="M196 322 q84 -34 168 0 l0 46 q-84 26 -168 0 z" fill="#3e7c59"/>
      <path d="M196 322 q84 -34 168 0 q-84 22 -168 0 z" fill="#5e9a78"/>
      <!-- case clasp -->
      <rect x="272" y="336" width="16" height="12" rx="3" fill="#e0a93d"/>
      <text x="280" y="360" font-size="11" fill="#fffdf8" font-weight="700" text-anchor="middle">store in a case</text>

      <!-- microfiber cloth, front left -->
      <path d="M96 356 h64 l-6 20 h-52 z" fill="#7fb3c8"/>
      <path d="M96 356 h64 l-4 8 h-56 z" fill="#9cc3d4"/>
      <g stroke="#cdd9de" stroke-width="1.6">
        <line x1="108" y1="366" x2="146" y2="366"/>
        <line x1="106" y1="372" x2="144" y2="372"/>
      </g>
    </svg>
