<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a bright bathroom vanity shelf of skincare: a pump cleanser, a moisturizer jar, and a dropper serum stand in a row beside an open-jar PAO symbol reading 6M and 12M, a browned separated old serum bottle tips into a wastebasket next to a fresh green bottle, and a window lets in daylight above">
      <ellipse cx="280" cy="402" rx="248" ry="22" fill="#efe7d8"/>

      <!-- bright bathroom window -->
      <rect x="44" y="40" width="132" height="128" rx="10" fill="#dce8ee" stroke="#e6dccb" stroke-width="3"/>
      <line x1="110" y1="43" x2="110" y2="165" stroke="#fffdf8" stroke-width="4"/>
      <line x1="47" y1="104" x2="173" y2="104" stroke="#fffdf8" stroke-width="4"/>
      <g stroke="#fffdf8" stroke-width="6" stroke-linecap="round" opacity="0.8">
        <line x1="60" y1="150" x2="118" y2="70"/>
        <line x1="80" y1="156" x2="132" y2="82"/>
      </g>
      <rect x="32" y="32" width="156" height="10" rx="5" fill="#8a6a4f"/>

      <!-- vanity shelf -->
      <rect x="212" y="262" width="316" height="13" rx="6" fill="#c9a06b"/>
      <rect x="234" y="275" width="11" height="22" rx="4" fill="#8a6a4f"/>
      <rect x="494" y="275" width="11" height="22" rx="4" fill="#8a6a4f"/>

      <!-- pump cleanser -->
      <rect x="222" y="164" width="42" height="98" rx="8" fill="#5e9a78"/>
      <rect x="230" y="180" width="26" height="38" rx="4" fill="#fffdf8"/>
      <text x="243" y="203" font-size="10" fill="#3e7c59" font-weight="700" text-anchor="middle">wash</text>
      <!-- pump top -->
      <rect x="236" y="150" width="14" height="16" rx="3" fill="#3e7c59"/>
      <path d="M236 150 h-14 v6 h14 z" fill="#2c5a40"/>

      <!-- moisturizer jar (open-jar style) -->
      <rect x="286" y="212" width="60" height="50" rx="8" fill="#7fb3c8"/>
      <rect x="284" y="200" width="64" height="16" rx="6" fill="#9cc3d4"/>
      <ellipse cx="316" cy="200" rx="30" ry="7" fill="#dce8ee"/>
      <rect x="296" y="226" width="40" height="26" rx="4" fill="#fffdf8"/>
      <text x="316" y="244" font-size="10" fill="#2c5a40" font-weight="700" text-anchor="middle">jar</text>

      <!-- dropper serum bottle -->
      <rect x="368" y="182" width="34" height="80" rx="7" fill="#c96f4a"/>
      <rect x="376" y="200" width="18" height="42" rx="3" fill="#fffdf8"/>
      <ellipse cx="385" cy="221" rx="5" ry="16" fill="#d9663f" opacity="0.5"/>
      <!-- dropper cap + bulb -->
      <rect x="378" y="160" width="14" height="24" rx="3" fill="#8a6a4f"/>
      <ellipse cx="385" cy="156" rx="9" ry="7" fill="#e0a93d"/>
      <text x="385" y="256" font-size="9" fill="#8a6a4f" font-weight="700" text-anchor="middle">serum</text>

      <!-- PAO open-jar symbol tag -->
      <rect x="414" y="176" width="72" height="86" rx="10" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5"/>
      <path d="M432 198 h34 v20 q0 8 -8 8 h-18 q-8 0 -8 -8 z" fill="none" stroke="#8a6a4f" stroke-width="2.6"/>
      <path d="M430 196 q19 -12 38 0" fill="none" stroke="#8a6a4f" stroke-width="2.6" stroke-linecap="round"/>
      <text x="449" y="244" font-size="12" fill="#2c5a40" font-weight="700" text-anchor="middle">6M · 12M</text>
      <text x="449" y="188" font-size="8.5" fill="#6b7376" font-weight="700" text-anchor="middle">open-jar (PAO)</text>

      <!-- wastebasket with browned, separated old bottle -->
      <path d="M452 300 h74 l-8 76 q-1 8 -9 8 h-40 q-8 0 -9 -8 z" fill="#b9b1a3"/>
      <path d="M452 300 h74 l-2 14 h-70 z" fill="#8a6a4f"/>
      <g transform="rotate(28 490 288)">
        <rect x="470" y="250" width="36" height="70" rx="7" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5"/>
        <rect x="480" y="236" width="16" height="16" rx="4" fill="#b9b1a3"/>
        <!-- browned / oxidized separated contents -->
        <rect x="476" y="272" width="24" height="42" rx="3" fill="#c9a06b" opacity="0.7"/>
        <path d="M476 288 q6 5 12 0 q6 -5 12 0 v22 q0 3 -3 3 h-18 q-3 0 -3 -3 z" fill="#8a6a4f" opacity="0.55"/>
        <circle cx="483" cy="300" r="2.2" fill="#c96f4a"/>
        <circle cx="494" cy="306" r="2" fill="#d98e3b"/>
      </g>
      <!-- old vs fresh arrow -->
      <path d="M412 302 q22 -8 40 -2" stroke="#d9663f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <polygon points="452,300 444,294 445,306" fill="#d9663f"/>
      <text x="410" y="294" font-size="10" fill="#d9663f" font-weight="700" text-anchor="end">toss the old</text>

      <!-- fresh replacement bottle, standing ready -->
      <rect x="196" y="298" width="30" height="76" rx="8" fill="#5e9a78"/>
      <rect x="203" y="286" width="16" height="14" rx="3" fill="#2c5a40"/>
      <circle cx="211" cy="336" r="7" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="1.6" stroke-linecap="round">
        <line x1="211" y1="324" x2="211" y2="327"/>
        <line x1="211" y1="345" x2="211" y2="348"/>
        <line x1="199" y1="336" x2="202" y2="336"/>
        <line x1="220" y1="336" x2="223" y2="336"/>
      </g>
      <text x="211" y="390" font-size="10" fill="#2c5a40" font-weight="700" text-anchor="middle">fresh</text>

      <!-- sparkles by the fresh row -->
      <g stroke="#e0a93d" stroke-width="2.5" stroke-linecap="round">
        <line x1="272" y1="146" x2="272" y2="156"/>
        <line x1="267" y1="151" x2="277" y2="151"/>
        <line x1="404" y1="150" x2="404" y2="160"/>
        <line x1="399" y1="155" x2="409" y2="155"/>
      </g>
    </svg>
