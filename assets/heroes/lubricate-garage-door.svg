<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of someone lubricating a sectional garage door: the paneled door sits on its vertical tracks with rollers and hinges, the torsion spring runs across the top with the opener rail overhead, a hand on a step stool sprays white-lithium grease onto a roller and hinge, and a can of garage-door lube sits nearby">
      <ellipse cx="285" cy="404" rx="255" ry="22" fill="#efe7d8"/>

      <!-- ceiling line / opener rail overhead -->
      <rect x="120" y="40" width="320" height="10" rx="3" fill="#b9b1a3"/>
      <rect x="250" y="50" width="200" height="9" rx="3" fill="#8a6a4f"/>
      <!-- opener motor head -->
      <rect x="438" y="40" width="46" height="32" rx="5" fill="#5e9a78"/>
      <rect x="444" y="46" width="34" height="10" rx="2" fill="#3e7c59"/>
      <!-- trolley on the rail -->
      <rect x="300" y="52" width="22" height="12" rx="3" fill="#c96f4a"/>

      <!-- torsion spring across the top (DO NOT TOUCH zone) -->
      <rect x="150" y="66" width="260" height="14" rx="4" fill="#b9b1a3"/>
      <g stroke="#8a6a4f" stroke-width="3.4" stroke-linecap="round">
        <line x1="170" y1="66" x2="178" y2="80"/>
        <line x1="182" y1="66" x2="190" y2="80"/>
        <line x1="194" y1="66" x2="202" y2="80"/>
        <line x1="206" y1="66" x2="214" y2="80"/>
        <line x1="218" y1="66" x2="226" y2="80"/>
        <line x1="230" y1="66" x2="238" y2="80"/>
        <line x1="242" y1="66" x2="250" y2="80"/>
        <line x1="254" y1="66" x2="262" y2="80"/>
        <line x1="266" y1="66" x2="274" y2="80"/>
        <line x1="278" y1="66" x2="286" y2="80"/>
        <line x1="290" y1="66" x2="298" y2="80"/>
        <line x1="302" y1="66" x2="310" y2="80"/>
        <line x1="314" y1="66" x2="322" y2="80"/>
        <line x1="326" y1="66" x2="334" y2="80"/>
        <line x1="338" y1="66" x2="346" y2="80"/>
        <line x1="350" y1="66" x2="358" y2="80"/>
        <line x1="362" y1="66" x2="370" y2="80"/>
        <line x1="374" y1="66" x2="382" y2="80"/>
        <line x1="386" y1="66" x2="394" y2="80"/>
      </g>
      <!-- center bearing plate -->
      <rect x="272" y="62" width="22" height="22" rx="3" fill="#8a6a4f"/>
      <circle cx="283" cy="73" r="5" fill="#c9a06b"/>
      <!-- warning tag on the spring -->
      <rect x="196" y="86" width="48" height="16" rx="4" fill="#d9663f"/>
      <text x="220" y="98" font-size="9.5" fill="#fffdf8" font-weight="700" text-anchor="middle">DON'T</text>

      <!-- vertical tracks -->
      <rect x="150" y="88" width="12" height="252" rx="3" fill="#b9b1a3"/>
      <rect x="398" y="88" width="12" height="252" rx="3" fill="#b9b1a3"/>

      <!-- sectional garage door panels -->
      <rect x="166" y="92" width="228" height="248" rx="4" fill="#fffdf8" stroke="#8a6a4f" stroke-width="4"/>
      <!-- horizontal section divides -->
      <g stroke="#b9b1a3" stroke-width="3">
        <line x1="166" y1="154" x2="394" y2="154"/>
        <line x1="166" y1="216" x2="394" y2="216"/>
        <line x1="166" y1="278" x2="394" y2="278"/>
      </g>
      <!-- recessed panel rectangles -->
      <g fill="#f3ece0" stroke="#dce8ee" stroke-width="1.5">
        <rect x="178" y="102" width="96" height="42" rx="3"/>
        <rect x="286" y="102" width="96" height="42" rx="3"/>
        <rect x="178" y="164" width="96" height="42" rx="3"/>
        <rect x="286" y="164" width="96" height="42" rx="3"/>
        <rect x="178" y="226" width="96" height="42" rx="3"/>
        <rect x="286" y="226" width="96" height="42" rx="3"/>
        <rect x="178" y="288" width="96" height="42" rx="3"/>
        <rect x="286" y="288" width="96" height="42" rx="3"/>
      </g>

      <!-- hinges along the right edge -->
      <g fill="#8a6a4f">
        <rect x="386" y="148" width="16" height="14" rx="2"/>
        <rect x="386" y="210" width="16" height="14" rx="2"/>
        <rect x="386" y="272" width="16" height="14" rx="2"/>
      </g>
      <!-- rollers on the left track -->
      <g>
        <circle cx="158" cy="150" r="9" fill="#c9a06b" stroke="#8a6a4f" stroke-width="2.4"/>
        <circle cx="158" cy="150" r="3" fill="#8a6a4f"/>
        <circle cx="158" cy="244" r="9" fill="#c9a06b" stroke="#8a6a4f" stroke-width="2.4"/>
        <circle cx="158" cy="244" r="3" fill="#8a6a4f"/>
      </g>
      <!-- roller being sprayed (right track), highlighted -->
      <circle cx="402" cy="186" r="11" fill="#e0a93d" stroke="#d98e3b" stroke-width="2.6"/>
      <circle cx="402" cy="186" r="3.4" fill="#8a6a4f"/>

      <!-- step stool -->
      <path d="M452 300 h60 l-6 64 h-48 z" fill="#c96f4a"/>
      <rect x="448" y="298" width="68" height="10" rx="3" fill="#d9663f"/>
      <rect x="456" y="330" width="52" height="8" rx="3" fill="#b9551f" opacity="0.5"/>
      <rect x="466" y="298" width="6" height="64" fill="#b9551f" opacity="0.4"/>
      <rect x="492" y="298" width="6" height="64" fill="#b9551f" opacity="0.4"/>

      <!-- arm + hand spraying the highlighted roller -->
      <path d="M470 296 q-22 -40 -46 -100" stroke="#3e7c59" stroke-width="12" fill="none" stroke-linecap="round"/>
      <!-- spray can in hand -->
      <rect x="416" y="188" width="20" height="40" rx="5" fill="#5e9a78"/>
      <rect x="420" y="178" width="12" height="12" rx="3" fill="#3e7c59"/>
      <path d="M416 184 l-8 -4 l0 6 l8 2 z" fill="#2c5a40"/>
      <!-- hand on the can -->
      <ellipse cx="426" cy="232" rx="14" ry="11" fill="#e8b48f"/>
      <path d="M417 228 q-5 6 -1 12" stroke="#d99c73" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <!-- spray mist hitting the roller -->
      <g fill="#dce8ee" opacity="0.85">
        <circle cx="408" cy="190" r="2.4"/>
        <circle cx="412" cy="186" r="2"/>
        <circle cx="409" cy="182" r="1.6"/>
        <circle cx="405" cy="194" r="1.8"/>
      </g>

      <!-- can of garage-door lube on the floor, front-left -->
      <rect x="86" y="338" width="34" height="56" rx="6" fill="#e0a93d"/>
      <rect x="86" y="354" width="34" height="9" fill="#d98e3b"/>
      <rect x="93" y="324" width="20" height="16" rx="4" fill="#c96f4a"/>
      <path d="M113 328 l16 -6 l0 6 l-16 4 z" fill="#b9551f"/>
      <text x="103" y="378" font-size="9" fill="#8a6a4f" font-weight="700" text-anchor="middle">LUBE</text>

      <!-- rag on the floor for wiping excess -->
      <path d="M150 372 h64 l-6 20 h-52 z" fill="#7fb3c8"/>
      <path d="M150 372 h64 l-3 7 h-58 z" fill="#9cc3d4"/>
    </svg>
