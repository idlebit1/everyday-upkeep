<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of replacing an ice maker filter: a hand twists a cylindrical water filter cartridge out of its slot inside a refrigerator, an old grey saturated filter sits beside a fresh green one, a tray of clear ice cubes contrasts with a tray of cloudy ones, and the water supply line runs into the fridge in a bright kitchen">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- fridge body -->
      <rect x="60" y="34" width="230" height="330" rx="14" fill="#dce8ee" stroke="#8a6a4f" stroke-width="6"/>
      <!-- door split -->
      <rect x="170" y="40" width="6" height="318" fill="#b9b1a3"/>
      <!-- handles -->
      <rect x="150" y="90" width="8" height="90" rx="4" fill="#8a6a4f"/>
      <rect x="188" y="90" width="8" height="90" rx="4" fill="#8a6a4f"/>
      <!-- ice/water dispenser recess on the left door -->
      <rect x="82" y="118" width="66" height="96" rx="8" fill="#c9d7dd"/>
      <rect x="92" y="128" width="46" height="40" rx="4" fill="#7fb3c8"/>
      <path d="M104 150 l6 8 l14 -16" stroke="#fffdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="98" y="180" width="34" height="20" rx="4" fill="#b9b1a3"/>

      <!-- open filter compartment at top-right interior, cutaway -->
      <rect x="196" y="60" width="80" height="70" rx="8" fill="#fffdf8" stroke="#b9b1a3" stroke-width="3"/>
      <!-- filter slot -->
      <rect x="222" y="66" width="30" height="58" rx="10" fill="#eef4f7" stroke="#b9b1a3" stroke-width="2"/>

      <!-- cylindrical filter being twisted out of the slot -->
      <g transform="rotate(-16 237 92)">
        <rect x="222" y="52" width="30" height="72" rx="14" fill="#5e9a78"/>
        <rect x="222" y="52" width="30" height="16" rx="8" fill="#3e7c59"/>
        <rect x="228" y="46" width="18" height="12" rx="5" fill="#2c5a40"/>
        <!-- twist arrow around the cap -->
        <path d="M256 58 q10 6 2 16" fill="none" stroke="#e0a93d" stroke-width="3" stroke-linecap="round"/>
        <path d="M258 74 l0 -8 l-7 5 z" fill="#e0a93d"/>
      </g>

      <!-- hand gripping and twisting the filter -->
      <ellipse cx="238" cy="128" rx="18" ry="13" fill="#e8b48f"/>
      <path d="M226 124 q-5 6 -1 13" stroke="#d99c73" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M238 140 q10 26 -6 44" stroke="#3e7c59" stroke-width="12" fill="none" stroke-linecap="round"/>

      <!-- water supply line entering the fridge from behind -->
      <path d="M290 300 q40 0 52 -30 q10 -24 40 -24" fill="none" stroke="#7fb3c8" stroke-width="6" stroke-linecap="round"/>
      <circle cx="382" cy="246" r="6" fill="#5e9a78"/>
      <text x="316" y="322" font-size="11" fill="#7fb3c8" font-weight="700">water line</text>

      <!-- OLD grey saturated filter lying on the counter -->
      <g transform="rotate(90 388 356)">
        <rect x="360" y="342" width="56" height="28" rx="12" fill="#b9b1a3"/>
        <rect x="360" y="342" width="14" height="28" rx="7" fill="#8a6a4f"/>
        <!-- gunk specks on the old one -->
        <circle cx="392" cy="352" r="1.8" fill="#8a6a4f"/>
        <circle cx="400" cy="360" r="1.6" fill="#8a6a4f"/>
      </g>
      <text x="356" y="392" font-size="11" fill="#6b7376">old (clogged)</text>

      <!-- NEW fresh filter standing beside it -->
      <rect x="442" y="316" width="30" height="66" rx="14" fill="#5e9a78"/>
      <rect x="442" y="316" width="30" height="15" rx="8" fill="#3e7c59"/>
      <rect x="448" y="310" width="18" height="11" rx="5" fill="#2c5a40"/>
      <g stroke="#e0a93d" stroke-width="2.2" stroke-linecap="round">
        <path d="M457 344 l0 8 M453 348 l8 0"/>
      </g>
      <text x="440" y="398" font-size="11" fill="#3e7c59" font-weight="700">new</text>

      <!-- CLEAR ice cube tray, top-right -->
      <rect x="330" y="60" width="94" height="44" rx="6" fill="#eef4f7" stroke="#7fb3c8" stroke-width="2.5"/>
      <g fill="#dce8ee" stroke="#7fb3c8" stroke-width="1.6">
        <rect x="338" y="68" width="20" height="28" rx="3"/>
        <rect x="364" y="68" width="20" height="28" rx="3"/>
        <rect x="390" y="68" width="20" height="28" rx="3"/>
      </g>
      <g stroke="#fffdf8" stroke-width="3" stroke-linecap="round" opacity="0.9">
        <line x1="342" y1="90" x2="352" y2="74"/>
        <line x1="368" y1="90" x2="378" y2="74"/>
      </g>
      <text x="336" y="116" font-size="11" fill="#3e7c59" font-weight="700">clear ice</text>

      <!-- CLOUDY ice cube tray below it -->
      <rect x="330" y="140" width="94" height="44" rx="6" fill="#e6e0d5" stroke="#b9b1a3" stroke-width="2.5"/>
      <g fill="#cdc7ba" stroke="#b9b1a3" stroke-width="1.6">
        <rect x="338" y="148" width="20" height="28" rx="3"/>
        <rect x="364" y="148" width="16" height="24" rx="3"/>
        <rect x="390" y="148" width="14" height="22" rx="3"/>
      </g>
      <!-- cloudy specks -->
      <g fill="#b9b1a3" opacity="0.7">
        <circle cx="346" cy="160" r="2"/>
        <circle cx="372" cy="158" r="1.6"/>
        <circle cx="396" cy="160" r="1.6"/>
      </g>
      <text x="336" y="196" font-size="11" fill="#6b7376">cloudy, small ice</text>

      <!-- little plant on the counter for warmth -->
      <path d="M508 358 h26 l-4 24 h-18 z" fill="#c96f4a"/>
      <path d="M520 358 q-3 -18 -12 -25" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M520 358 q4 -16 14 -22" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="506" cy="330" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 506 330)"/>
      <ellipse cx="534" cy="334" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 534 334)"/>
    </svg>
