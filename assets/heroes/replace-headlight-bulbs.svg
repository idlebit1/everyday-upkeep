<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration at dusk of the front of a car with its hood propped open: a gloved hand fits a new bulb into the back of the headlight housing, holding it by the base so as not to touch the glass; one headlight glows bright gold while the other is dim and out, and the evening sky is deepening behind the car">
      <!-- dusk sky backdrop -->
      <rect x="0" y="0" width="560" height="300" rx="0" fill="#dce8ee"/>
      <rect x="0" y="0" width="560" height="120" fill="#7fb3c8" opacity="0.4"/>
      <!-- distant low sun glow near horizon -->
      <circle cx="470" cy="150" r="38" fill="#faf0da" opacity="0.7"/>
      <circle cx="470" cy="150" r="22" fill="#e0a93d" opacity="0.45"/>
      <ellipse cx="285" cy="406" rx="252" ry="22" fill="#efe7d8"/>
      <!-- ground / driveway -->
      <rect x="0" y="300" width="560" height="130" fill="#efe7d8"/>

      <!-- ===== car front (three-quarter view, hood up) ===== -->
      <!-- car body / front fascia -->
      <path d="M60 300 q0 -70 70 -84 l300 0 q70 14 70 84 l0 30 l-440 0 z" fill="#c96f4a"/>
      <!-- lower bumper -->
      <rect x="56" y="318" width="448" height="34" rx="12" fill="#8a6a4f"/>
      <!-- grille -->
      <rect x="232" y="272" width="96" height="46" rx="8" fill="#33393b"/>
      <g stroke="#6b7376" stroke-width="3">
        <line x1="240" y1="284" x2="320" y2="284"/>
        <line x1="240" y1="294" x2="320" y2="294"/>
        <line x1="240" y1="304" x2="320" y2="304"/>
      </g>
      <!-- propped-open hood -->
      <path d="M118 222 l324 0 q24 0 24 -22 l-2 -60 q-1 -16 -18 -16 l-300 0 q-18 0 -22 18 l-12 64 q-3 14 6 14 z" fill="#d9663f"/>
      <path d="M132 210 l296 0 q16 0 16 -16 l-2 -44 q-1 -10 -12 -10 l-280 0 q-12 0 -14 12 l-10 48 q-2 10 6 10 z" fill="#b9b1a3" opacity="0.35"/>
      <!-- hood prop rod -->
      <line x1="150" y1="226" x2="138" y2="300" stroke="#6b7376" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== RIGHT headlight: bright, working (gold glow) ===== -->
      <g>
        <!-- glow halo -->
        <circle cx="408" cy="290" r="46" fill="#faf0da" opacity="0.85"/>
        <circle cx="408" cy="290" r="32" fill="#e0a93d" opacity="0.55"/>
        <!-- housing -->
        <path d="M372 274 q40 -14 76 0 l4 30 q-42 12 -84 0 z" fill="#fffdf8" stroke="#8a6a4f" stroke-width="4"/>
        <!-- lit lens -->
        <path d="M378 278 q32 -10 64 0 l3 22 q-35 9 -70 0 z" fill="#e0a93d"/>
        <!-- light rays -->
        <g stroke="#e0a93d" stroke-width="4" stroke-linecap="round" opacity="0.8">
          <line x1="408" y1="246" x2="408" y2="232"/>
          <line x1="380" y1="252" x2="372" y2="240"/>
          <line x1="436" y1="252" x2="444" y2="240"/>
          <line x1="458" y1="278" x2="472" y2="272"/>
        </g>
        <text x="408" y="332" font-size="11" fill="#3e7c59" font-weight="700" text-anchor="middle">bright</text>
      </g>

      <!-- ===== LEFT headlight: dim / out, hand fitting a bulb behind it ===== -->
      <g>
        <!-- housing (no glow) -->
        <path d="M108 274 q40 -14 76 0 l4 30 q-42 12 -84 0 z" fill="#fffdf8" stroke="#8a6a4f" stroke-width="4"/>
        <!-- dim/dark lens -->
        <path d="M114 278 q32 -10 64 0 l3 22 q-35 9 -70 0 z" fill="#b9b1a3"/>
        <text x="146" y="332" font-size="11" fill="#6b7376" text-anchor="middle">dim / out</text>
      </g>

      <!-- back of the LEFT housing, opened, with the new bulb going in -->
      <!-- the bulb socket / cylinder at the back of the housing -->
      <ellipse cx="150" cy="252" rx="18" ry="12" fill="#dce8ee" stroke="#8a6a4f" stroke-width="3"/>
      <!-- new bulb: glass envelope (clean) -->
      <path d="M150 244 q-9 -2 -9 -14 q0 -16 9 -22 q9 6 9 22 q0 12 -9 14 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
      <!-- bulb filament hint -->
      <path d="M147 218 q3 6 6 0" fill="none" stroke="#e0a93d" stroke-width="1.8" stroke-linecap="round"/>
      <!-- bulb metal base (held by the hand) -->
      <rect x="142" y="244" width="16" height="14" rx="3" fill="#c9a06b"/>
      <!-- gloved hand holding the bulb by the BASE -->
      <ellipse cx="124" cy="252" rx="20" ry="15" fill="#5e9a78"/>
      <path d="M138 244 q8 -2 14 2" fill="none" stroke="#3e7c59" stroke-width="3" stroke-linecap="round"/>
      <path d="M138 258 q8 4 16 2" fill="none" stroke="#3e7c59" stroke-width="3" stroke-linecap="round"/>
      <!-- glove cuff -->
      <rect x="98" y="244" width="18" height="18" rx="4" fill="#3e7c59"/>
      <!-- arm -->
      <path d="M100 254 q-30 8 -54 30" stroke="#2c5a40" stroke-width="13" fill="none" stroke-linecap="round"/>
      <!-- "don't touch glass" cue: small no-fingers mark above the glass -->
      <g opacity="0.9">
        <circle cx="172" cy="214" r="9" fill="none" stroke="#d9663f" stroke-width="2.4"/>
        <line x1="166" y1="220" x2="178" y2="208" stroke="#d9663f" stroke-width="2.4" stroke-linecap="round"/>
      </g>

      <!-- spare matched bulb in a box on the ground (replace in pairs) -->
      <rect x="430" y="372" width="74" height="30" rx="5" fill="#7fb3c8"/>
      <rect x="430" y="372" width="74" height="10" rx="4" fill="#9cc3d4"/>
      <path d="M452 372 q-6 -2 -6 -10 q0 -10 6 -14 q6 4 6 14 q0 8 -6 10 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="1.6"/>
      <rect x="448" y="372" width="10" height="8" rx="2" fill="#c9a06b"/>
      <text x="467" y="396" font-size="9.5" fill="#2c5a40" font-weight="700" text-anchor="middle">spare pair</text>

      <!-- wheels peeking at the bottom corners -->
      <ellipse cx="118" cy="350" rx="26" ry="12" fill="#33393b"/>
      <ellipse cx="442" cy="350" rx="26" ry="12" fill="#33393b"/>
    </svg>
