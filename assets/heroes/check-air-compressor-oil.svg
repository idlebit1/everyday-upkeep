<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of checking an oil-lubricated air compressor in a shop: a belt-drive compressor sits on a horizontal tank, its pump has a round oil sight glass with the amber oil at the fill line, a hand points at the sight glass to read it, a bottle of compressor oil stands beside it, and the tank's bottom drain valve is open letting water condensate drip into a pan on the shop floor">
      <ellipse cx="285" cy="404" rx="255" ry="22" fill="#efe7d8"/>

      <!-- horizontal tank -->
      <rect x="96" y="256" width="330" height="86" rx="43" fill="#7fb3c8"/>
      <rect x="96" y="256" width="330" height="30" rx="15" fill="#9cc3d4"/>
      <!-- tank end caps -->
      <ellipse cx="96" cy="299" rx="20" ry="43" fill="#5e9a78"/>
      <ellipse cx="426" cy="299" rx="20" ry="43" fill="#5e9a78"/>
      <!-- tank feet -->
      <rect x="128" y="342" width="20" height="34" rx="4" fill="#8a6a4f"/>
      <rect x="372" y="342" width="20" height="34" rx="4" fill="#8a6a4f"/>

      <!-- motor (left) -->
      <rect x="120" y="188" width="96" height="70" rx="12" fill="#b9b1a3"/>
      <circle cx="168" cy="223" r="24" fill="#8a6a4f"/>
      <circle cx="168" cy="223" r="10" fill="#c9a06b"/>
      <!-- motor cooling fins -->
      <g stroke="#8a6a4f" stroke-width="2.2">
        <line x1="128" y1="198" x2="128" y2="248"/>
        <line x1="136" y1="198" x2="136" y2="248"/>
        <line x1="144" y1="198" x2="144" y2="248"/>
      </g>

      <!-- pump (right) with cast body -->
      <rect x="286" y="176" width="94" height="82" rx="10" fill="#5e9a78"/>
      <rect x="286" y="176" width="94" height="20" rx="8" fill="#3e7c59"/>
      <!-- pump cooling fins on head -->
      <g stroke="#2c5a40" stroke-width="2.4">
        <line x1="300" y1="180" x2="300" y2="196"/>
        <line x1="312" y1="180" x2="312" y2="196"/>
        <line x1="324" y1="180" x2="324" y2="196"/>
        <line x1="336" y1="180" x2="336" y2="196"/>
        <line x1="348" y1="180" x2="348" y2="196"/>
        <line x1="360" y1="180" x2="360" y2="196"/>
      </g>
      <!-- air filter on top of pump -->
      <circle cx="366" cy="164" r="14" fill="#c96f4a"/>
      <circle cx="366" cy="164" r="6" fill="#d9663f"/>

      <!-- belt guard between motor and pump -->
      <path d="M216 200 q52 -18 78 8 q-6 40 0 44 q-58 22 -84 -6 z" fill="#e0a93d" opacity="0.55"/>
      <ellipse cx="234" cy="224" rx="16" ry="16" fill="none" stroke="#d98e3b" stroke-width="4"/>
      <ellipse cx="276" cy="224" rx="12" ry="12" fill="none" stroke="#d98e3b" stroke-width="4"/>

      <!-- OIL SIGHT GLASS on the pump, oil at fill line -->
      <circle cx="312" cy="232" r="18" fill="#fffdf8" stroke="#2c5a40" stroke-width="3"/>
      <!-- amber oil filling to the middle dot -->
      <path d="M295 232 a17 17 0 0 0 34 0 z" fill="#e0a93d"/>
      <!-- fill-line dot at center -->
      <circle cx="312" cy="232" r="3" fill="#c96f4a"/>
      <line x1="298" y1="232" x2="326" y2="232" stroke="#8a6a4f" stroke-width="1.4" opacity="0.6"/>

      <!-- hand pointing at / reading the sight glass -->
      <path d="M420 244 q-40 4 -78 -6" stroke="#e8b48f" stroke-width="12" fill="none" stroke-linecap="round"/>
      <ellipse cx="352" cy="238" rx="15" ry="11" fill="#e8b48f"/>
      <!-- index finger toward the glass -->
      <path d="M340 236 q-10 -1 -18 -3" stroke="#e8b48f" stroke-width="7" fill="none" stroke-linecap="round"/>

      <!-- pressure gauge on top -->
      <circle cx="272" cy="150" r="16" fill="#fffdf8" stroke="#8a6a4f" stroke-width="3"/>
      <line x1="272" y1="150" x2="280" y2="140" stroke="#d9663f" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="272" cy="150" r="2" fill="#33393b"/>
      <rect x="268" y="164" width="8" height="14" fill="#8a6a4f"/>

      <!-- bottle of compressor oil (right, on floor) -->
      <rect x="470" y="300" width="46" height="72" rx="8" fill="#e0a93d"/>
      <rect x="470" y="300" width="46" height="20" rx="8" fill="#d98e3b"/>
      <rect x="482" y="282" width="22" height="20" rx="4" fill="#2c5a40"/>
      <rect x="478" y="330" width="30" height="30" rx="4" fill="#fffdf8" opacity="0.85"/>
      <text x="493" y="342" font-size="8" fill="#8a6a4f" font-weight="700" text-anchor="middle">SAE</text>
      <text x="493" y="352" font-size="7.5" fill="#6b7376" text-anchor="middle">comp.</text>

      <!-- tank drain valve at bottom, open, water dripping -->
      <rect x="250" y="342" width="10" height="22" rx="2" fill="#8a6a4f"/>
      <rect x="242" y="360" width="26" height="8" rx="3" fill="#c96f4a"/>
      <!-- petcock handle -->
      <rect x="266" y="356" width="18" height="5" rx="2.5" fill="#d9663f" transform="rotate(24 275 358)"/>
      <!-- dripping water condensate -->
      <path d="M255 370 q-2 8 0 12" stroke="#7fb3c8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="255" cy="388" r="3" fill="#7fb3c8"/>
      <!-- drip pan on the floor -->
      <path d="M228 392 h56 l-6 12 h-44 z" fill="#b9b1a3"/>
      <ellipse cx="256" cy="393" rx="28" ry="4" fill="#7fb3c8" opacity="0.8"/>

      <!-- shop pegboard hint upper left -->
      <rect x="20" y="60" width="70" height="90" rx="6" fill="#c9a06b" opacity="0.55"/>
      <g fill="#8a6a4f" opacity="0.5">
        <circle cx="34" cy="74" r="2"/>
        <circle cx="52" cy="74" r="2"/>
        <circle cx="70" cy="74" r="2"/>
        <circle cx="34" cy="94" r="2"/>
        <circle cx="52" cy="94" r="2"/>
        <circle cx="70" cy="94" r="2"/>
      </g>
      <!-- a wrench hanging on the pegboard -->
      <path d="M44 100 l0 34 m-5 0 l10 0" stroke="#5e9a78" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="44" cy="100" r="6" fill="none" stroke="#5e9a78" stroke-width="4"/>
    </svg>
