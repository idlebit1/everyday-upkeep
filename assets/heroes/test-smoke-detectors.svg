<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a person on a step stool reaching up to press the test button on a ceiling smoke detector, with sound arcs ringing out, a wall clock, a window, and a pack of fresh batteries waiting on a side table">
      <ellipse cx="280" cy="402" rx="240" ry="22" fill="#efe7d8"/>
      <!-- ceiling -->
      <rect x="36" y="14" width="488" height="16" rx="4" fill="#efe7d8"/>
      <line x1="36" y1="30" x2="524" y2="30" stroke="#d8cfbe" stroke-width="3"/>
      <!-- smoke detector on ceiling -->
      <rect x="288" y="30" width="24" height="8" fill="#b9b1a3"/>
      <circle cx="300" cy="72" r="36" fill="#fffdf8" stroke="#b9b1a3" stroke-width="3.5"/>
      <circle cx="300" cy="72" r="22" fill="#dce8ee"/>
      <g stroke="#9cc0d4" stroke-width="2.5" stroke-linecap="round">
        <line x1="288" y1="64" x2="312" y2="64"/>
        <line x1="286" y1="72" x2="314" y2="72"/>
        <line x1="288" y1="80" x2="312" y2="80"/>
      </g>
      <circle cx="300" cy="72" r="8" fill="#e0a93d"/>
      <circle cx="322" cy="88" r="3.5" fill="#d9663f"/>
      <!-- sound arcs -->
      <g stroke="#d9663f" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M244 50 q-12 22 0 44"/>
        <path d="M356 50 q12 22 0 44"/>
      </g>
      <g stroke="#e0a93d" stroke-width="3.5" fill="none" stroke-linecap="round">
        <path d="M222 42 q-18 30 0 60"/>
        <path d="M378 42 q18 30 0 60"/>
      </g>
      <!-- window, left -->
      <rect x="64" y="96" width="96" height="116" rx="4" fill="#cfe3ec" stroke="#e6dccb" stroke-width="3"/>
      <line x1="112" y1="96" x2="112" y2="212" stroke="#fffdf8" stroke-width="3"/>
      <line x1="64" y1="154" x2="160" y2="154" stroke="#fffdf8" stroke-width="3"/>
      <circle cx="88" cy="120" r="12" fill="#f2cf7a"/>
      <!-- side table with battery pack -->
      <rect x="70" y="320" width="104" height="10" rx="5" fill="#8a6a4f"/>
      <rect x="82" y="330" width="10" height="62" fill="#8a6a4f"/>
      <rect x="152" y="330" width="10" height="62" fill="#8a6a4f"/>
      <rect x="92" y="290" width="40" height="30" rx="4" fill="#e0a93d"/>
      <rect x="92" y="290" width="40" height="9" rx="4" fill="#d98e3b"/>
      <text x="112" y="313" font-size="13" font-weight="800" fill="#fffdf8" text-anchor="middle">9V</text>
      <rect x="140" y="300" width="14" height="20" rx="3" fill="#c96f4a"/>
      <rect x="144" y="296" width="6" height="4" fill="#8a6a4f"/>
      <!-- wall clock, right (clock-change cue) -->
      <circle cx="468" cy="140" r="34" fill="#fffdf8" stroke="#b9b1a3" stroke-width="3.5"/>
      <line x1="468" y1="140" x2="468" y2="118" stroke="#2c5a40" stroke-width="4" stroke-linecap="round"/>
      <line x1="468" y1="140" x2="484" y2="148" stroke="#2c5a40" stroke-width="4" stroke-linecap="round"/>
      <circle cx="468" cy="140" r="4" fill="#d9663f"/>
      <path d="M508 116 q10 -8 6 -20" stroke="#e0a93d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <polygon points="510,92 520,100 506,104" fill="#e0a93d"/>
      <!-- person on step stool, reaching up -->
      <rect x="246" y="358" width="84" height="12" rx="5" fill="#c96f4a"/>
      <rect x="252" y="370" width="9" height="28" fill="#9a4f33"/>
      <rect x="315" y="370" width="9" height="28" fill="#9a4f33"/>
      <rect x="262" y="380" width="52" height="9" rx="4" fill="#c96f4a"/>
      <!-- legs -->
      <rect x="272" y="294" width="14" height="66" rx="6" fill="#2c5a40"/>
      <rect x="292" y="294" width="14" height="66" rx="6" fill="#2c5a40"/>
      <!-- torso -->
      <rect x="264" y="216" width="50" height="86" rx="18" fill="#3e7c59"/>
      <!-- reaching arm -->
      <path d="M298 232 Q292 170 288 122" stroke="#3e7c59" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle cx="288" cy="114" r="7" fill="#c9a06b"/>
      <!-- other arm -->
      <path d="M268 240 Q252 262 258 284" stroke="#3e7c59" stroke-width="13" fill="none" stroke-linecap="round"/>
      <circle cx="259" cy="290" r="6.5" fill="#c9a06b"/>
      <!-- head -->
      <circle cx="284" cy="192" r="18" fill="#c9a06b"/>
      <path d="M266 188 q4 -16 20 -16 q12 0 16 10 q-10 -4 -18 -2 q-12 2 -18 8" fill="#8a6a4f"/>
      <!-- plant, right -->
      <circle cx="430" cy="346" r="17" fill="#5e9a78"/>
      <circle cx="448" cy="334" r="14" fill="#3e7c59"/>
      <circle cx="452" cy="354" r="11" fill="#5e9a78"/>
      <rect x="426" y="362" width="30" height="28" rx="4" fill="#c96f4a"/>
    </svg>
