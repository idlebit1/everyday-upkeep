<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="A reassuring, non-clinical scene: a screening-appointment reminder card pinned to a calendar marked for the day before, a mug of clear broth and a glass of water and a dish of plain gelatin standing in for the clear-liquid prep day, a friend waiting by a car keys in hand to give a ride home, and a friendly note reading done — see you in about ten years">
      <ellipse cx="285" cy="404" rx="252" ry="22" fill="#efe7d8"/>

      <!-- calendar / appointment card, upper left -->
      <rect x="52" y="44" width="196" height="176" rx="14" fill="#fffdf8" stroke="#8a6a4f" stroke-width="5"/>
      <rect x="52" y="44" width="196" height="40" rx="14" fill="#3e7c59"/>
      <rect x="52" y="70" width="196" height="14" fill="#3e7c59"/>
      <circle cx="90" cy="42" r="7" fill="#8a6a4f"/>
      <circle cx="210" cy="42" r="7" fill="#8a6a4f"/>
      <text x="150" y="72" font-size="15" fill="#fffdf8" font-weight="700" text-anchor="middle">Screening</text>
      <!-- calendar grid -->
      <g fill="#e9e2d8">
        <rect x="70" y="98" width="24" height="20" rx="3"/>
        <rect x="100" y="98" width="24" height="20" rx="3"/>
        <rect x="130" y="98" width="24" height="20" rx="3"/>
        <rect x="160" y="98" width="24" height="20" rx="3"/>
        <rect x="190" y="98" width="24" height="20" rx="3"/>
        <rect x="70" y="124" width="24" height="20" rx="3"/>
        <rect x="100" y="124" width="24" height="20" rx="3"/>
        <rect x="160" y="124" width="24" height="20" rx="3"/>
        <rect x="190" y="124" width="24" height="20" rx="3"/>
        <rect x="70" y="150" width="24" height="20" rx="3"/>
        <rect x="100" y="150" width="24" height="20" rx="3"/>
        <rect x="130" y="150" width="24" height="20" rx="3"/>
        <rect x="160" y="150" width="24" height="20" rx="3"/>
      </g>
      <!-- "prep — clear liquids" day before, highlighted gold -->
      <rect x="130" y="124" width="24" height="20" rx="3" fill="#e0a93d"/>
      <!-- appointment day, highlighted accent with a check -->
      <rect x="130" y="176" width="24" height="20" rx="3" fill="#3e7c59"/>
      <path d="M135 186 l4 4 l7 -8" stroke="#fffdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="150" y="212" font-size="10.5" fill="#6b7376" text-anchor="middle">prep day · then the exam</text>

      <!-- clear-liquid prep tray, upper right -->
      <rect x="300" y="120" width="212" height="14" rx="4" fill="#b9b1a3"/>
      <!-- mug of clear broth -->
      <path d="M318 70 h44 v42 a10 10 0 0 1 -10 10 h-24 a10 10 0 0 1 -10 -10 z" fill="#faf0da" stroke="#e0a93d" stroke-width="3"/>
      <path d="M362 80 q16 6 0 24" fill="none" stroke="#e0a93d" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="340" cy="72" rx="22" ry="5" fill="#f5e2b0"/>
      <path d="M332 58 q3 -8 0 -14 M340 58 q3 -8 0 -14 M348 58 q3 -8 0 -14" stroke="#cdb98a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
      <text x="340" y="112" font-size="9.5" fill="#8a6a4f" text-anchor="middle">broth</text>
      <!-- glass of water -->
      <path d="M394 66 h34 l-4 50 h-26 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2.5"/>
      <rect x="398" y="80" width="26" height="30" rx="2" fill="#c7dde6" opacity="0.7"/>
      <ellipse cx="411" cy="66" rx="17" ry="4" fill="#eef4f7"/>
      <text x="411" y="112" font-size="9.5" fill="#7a8f96" text-anchor="middle">water</text>
      <!-- dish of plain gelatin (clear/yellow, nothing red) -->
      <path d="M452 92 h46 l-6 22 h-34 z" fill="#f5e2b0" stroke="#e0a93d" stroke-width="2.5"/>
      <path d="M452 92 h46 l-2 7 h-42 z" fill="#faf0da"/>
      <circle cx="470" cy="102" r="2" fill="#fffdf8" opacity="0.8"/>
      <circle cx="482" cy="105" r="1.6" fill="#fffdf8" opacity="0.8"/>
      <text x="475" y="112" font-size="9.5" fill="#8a6a4f" text-anchor="middle">gelatin</text>

      <!-- friend waiting by the car with keys, for the ride home -->
      <!-- car -->
      <path d="M78 320 q10 -34 40 -34 h56 q30 0 40 34 z" fill="#7fb3c8"/>
      <rect x="70" y="318" width="188" height="40" rx="12" fill="#5e9a78"/>
      <rect x="98" y="294" width="44" height="26" rx="6" fill="#dce8ee"/>
      <rect x="150" y="294" width="44" height="26" rx="6" fill="#dce8ee"/>
      <circle cx="112" cy="360" r="18" fill="#33393b"/>
      <circle cx="112" cy="360" r="7" fill="#b9b1a3"/>
      <circle cx="216" cy="360" r="18" fill="#33393b"/>
      <circle cx="216" cy="360" r="7" fill="#b9b1a3"/>
      <!-- friend figure holding keys -->
      <circle cx="300" cy="272" r="16" fill="#e8b48f"/>
      <path d="M300 288 q-22 6 -22 40 h44 q0 -34 -22 -40 z" fill="#3e7c59"/>
      <!-- friendly arm raised in a wave -->
      <path d="M282 300 q-16 -8 -20 -24" stroke="#e8b48f" stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- keys in the other hand -->
      <path d="M320 306 q16 4 22 18" stroke="#e8b48f" stroke-width="9" fill="none" stroke-linecap="round"/>
      <circle cx="346" cy="328" r="6" fill="none" stroke="#e0a93d" stroke-width="3"/>
      <path d="M350 330 l10 8 l-3 4 l3 3" stroke="#e0a93d" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="230" y="392" font-size="10.5" fill="#6b7376">a ride home — you'll be sedated</text>

      <!-- "done — see you in ~10 years" note, lower right -->
      <g transform="rotate(-4 430 300)">
        <rect x="360" y="250" width="150" height="98" rx="10" fill="#e3efe8" stroke="#3e7c59" stroke-width="3"/>
        <circle cx="435" cy="266" r="9" fill="#3e7c59"/>
        <path d="M430 266 l4 4 l7 -8" stroke="#fffdf8" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="435" y="298" font-size="14" fill="#2c5a40" font-weight="700" text-anchor="middle">Done!</text>
        <text x="435" y="320" font-size="11" fill="#3e7c59" text-anchor="middle">See you in</text>
        <text x="435" y="336" font-size="11" fill="#3e7c59" text-anchor="middle">~10 years</text>
      </g>

      <!-- small plant for warmth, far left -->
      <path d="M32 356 h26 l-4 26 h-18 z" fill="#c96f4a"/>
      <path d="M44 356 q-3 -20 -12 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M44 356 q4 -18 14 -24" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="29" cy="324" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 29 324)"/>
      <ellipse cx="59" cy="328" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 59 328)"/>
    </svg>
