<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a reassuring optometry scene: a wall-mounted eye chart with big letters descending to small ones, a phoropter — the which-is-better lens device you look through — a pair of glasses and a small contact-lens case on a table, and a calendar with a marked reminder, all in warm, calm colors">
      <ellipse cx="285" cy="404" rx="252" ry="22" fill="#efe7d8"/>

      <!-- eye chart on the wall, left -->
      <rect x="40" y="46" width="150" height="230" rx="10" fill="#fffdf8" stroke="#8a6a4f" stroke-width="5"/>
      <!-- chart lines, big to small -->
      <text x="115" y="86" font-size="30" fill="#33393b" font-weight="800" text-anchor="middle" font-family="Georgia, serif">E</text>
      <text x="115" y="120" font-size="22" fill="#33393b" font-weight="700" text-anchor="middle" font-family="Georgia, serif">F P</text>
      <text x="115" y="150" font-size="17" fill="#33393b" font-weight="700" text-anchor="middle" font-family="Georgia, serif">T O Z</text>
      <text x="115" y="176" font-size="13" fill="#6b7376" font-weight="700" text-anchor="middle" font-family="Georgia, serif">L P E D</text>
      <text x="115" y="198" font-size="10" fill="#6b7376" font-weight="700" text-anchor="middle" font-family="Georgia, serif">P E C F D</text>
      <text x="115" y="216" font-size="8" fill="#a8aeb0" font-weight="700" text-anchor="middle" font-family="Georgia, serif">E D F C Z P</text>
      <text x="115" y="230" font-size="6.5" fill="#a8aeb0" font-weight="700" text-anchor="middle" font-family="Georgia, serif">F E L O P Z D</text>
      <!-- little pointer resting on the chart -->
      <rect x="150" y="150" width="56" height="4" rx="2" fill="#c96f4a" transform="rotate(14 178 152)"/>

      <!-- phoropter — the "which is better, 1 or 2?" lens device, center -->
      <!-- support arm from the ceiling -->
      <rect x="288" y="40" width="8" height="46" rx="3" fill="#b9b1a3"/>
      <!-- main body -->
      <rect x="236" y="86" width="118" height="70" rx="12" fill="#5e9a78"/>
      <rect x="236" y="86" width="118" height="18" rx="9" fill="#3e7c59"/>
      <!-- two eye lens discs -->
      <circle cx="266" cy="126" r="20" fill="#2c5a40"/>
      <circle cx="266" cy="126" r="12" fill="#7fb3c8"/>
      <circle cx="266" cy="126" r="5" fill="#dce8ee"/>
      <circle cx="324" cy="126" r="20" fill="#2c5a40"/>
      <circle cx="324" cy="126" r="12" fill="#7fb3c8"/>
      <circle cx="324" cy="126" r="5" fill="#dce8ee"/>
      <!-- dial knobs on the sides -->
      <circle cx="234" cy="120" r="8" fill="#e0a93d"/>
      <circle cx="356" cy="120" r="8" fill="#e0a93d"/>
      <!-- "1 or 2?" note card floating beside it -->
      <rect x="360" y="150" width="72" height="34" rx="7" fill="#fffdf8" stroke="#e9e2d8" stroke-width="2"/>
      <text x="396" y="172" font-size="13" fill="#3e7c59" font-weight="700" text-anchor="middle">1 or 2?</text>

      <!-- table / counter surface -->
      <rect x="150" y="300" width="330" height="16" rx="5" fill="#b9b1a3"/>
      <rect x="158" y="312" width="314" height="10" rx="4" fill="#8a6a4f"/>

      <!-- glasses on the table, left -->
      <g>
        <circle cx="210" cy="288" r="18" fill="none" stroke="#33393b" stroke-width="5"/>
        <circle cx="256" cy="288" r="18" fill="none" stroke="#33393b" stroke-width="5"/>
        <path d="M228 288 q6 -8 10 0" fill="none" stroke="#33393b" stroke-width="5" stroke-linecap="round"/>
        <path d="M192 282 l-16 -8" stroke="#33393b" stroke-width="5" stroke-linecap="round"/>
        <path d="M274 282 l16 -8" stroke="#33393b" stroke-width="5" stroke-linecap="round"/>
        <!-- lens tint / shine -->
        <circle cx="210" cy="288" r="14" fill="#dce8ee" opacity="0.55"/>
        <circle cx="256" cy="288" r="14" fill="#dce8ee" opacity="0.55"/>
      </g>

      <!-- contact lens case, right -->
      <rect x="360" y="272" width="60" height="28" rx="8" fill="#7fb3c8"/>
      <circle cx="378" cy="286" r="9" fill="#5e9a78"/>
      <circle cx="378" cy="286" r="4" fill="#e3efe8"/>
      <text x="378" y="290" font-size="7" fill="#2c5a40" font-weight="700" text-anchor="middle">L</text>
      <circle cx="402" cy="286" r="9" fill="#3e7c59"/>
      <circle cx="402" cy="286" r="4" fill="#e3efe8"/>
      <text x="402" y="290" font-size="7" fill="#2c5a40" font-weight="700" text-anchor="middle">R</text>

      <!-- calendar reminder, far right -->
      <rect x="452" y="196" width="86" height="78" rx="9" fill="#fffdf8" stroke="#e9e2d8" stroke-width="2"/>
      <rect x="452" y="196" width="86" height="20" rx="9" fill="#c96f4a"/>
      <rect x="466" y="190" width="6" height="12" rx="3" fill="#8a6a4f"/>
      <rect x="518" y="190" width="6" height="12" rx="3" fill="#8a6a4f"/>
      <!-- grid dots -->
      <g fill="#e9e2d8">
        <circle cx="468" cy="230" r="3"/><circle cx="484" cy="230" r="3"/><circle cx="500" cy="230" r="3"/><circle cx="516" cy="230" r="3"/>
        <circle cx="468" cy="246" r="3"/><circle cx="500" cy="246" r="3"/><circle cx="516" cy="246" r="3"/>
        <circle cx="468" cy="262" r="3"/><circle cx="484" cy="262" r="3"/><circle cx="516" cy="262" r="3"/>
      </g>
      <!-- circled exam day -->
      <circle cx="484" cy="246" r="9" fill="none" stroke="#3e7c59" stroke-width="3"/>
      <path d="M480 246 l3 3 l6 -7" stroke="#3e7c59" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="495" y="290" font-size="10" fill="#3e7c59" font-weight="700" text-anchor="middle">exam day</text>

      <!-- a friendly plant on the counter for warmth -->
      <path d="M150 276 h26 l-4 24 h-18 z" fill="#c96f4a"/>
      <path d="M162 276 q-3 -18 -12 -25" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M162 276 q4 -16 14 -22" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="147" cy="248" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 147 248)"/>
      <ellipse cx="177" cy="252" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 177 252)"/>
    </svg>
