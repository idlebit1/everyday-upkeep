<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration comparing two fragrance bottles: a fresh clear-gold cologne stored in a cool, dark drawer beside a darkened, oxidized amber bottle left on a sunny windowsill with a crossed-out sun, a little batch code printed on the base of each, standing on a vanity">
      <ellipse cx="280" cy="402" rx="248" ry="22" fill="#efe7d8"/>

      <!-- ===== LEFT: cool dark drawer with the fresh bottle ===== -->
      <!-- drawer / cabinet body -->
      <rect x="34" y="150" width="212" height="216" rx="12" fill="#c9a06b"/>
      <rect x="46" y="162" width="188" height="192" rx="8" fill="#8a6a4f"/>
      <!-- drawer pull -->
      <rect x="120" y="170" width="40" height="9" rx="4.5" fill="#e0a93d"/>
      <!-- soft interior shadow, "dark & cool" -->
      <rect x="56" y="188" width="168" height="158" rx="6" fill="#5b4633" opacity="0.55"/>
      <!-- fresh bottle inside -->
      <rect x="112" y="212" width="56" height="118" rx="9" fill="#faf0da" stroke="#e0a93d" stroke-width="2.5"/>
      <!-- clear golden liquid, bright and true -->
      <rect x="120" y="242" width="40" height="80" rx="6" fill="#f2d27a"/>
      <g stroke="#fffdf8" stroke-width="5" stroke-linecap="round" opacity="0.85">
        <line x1="128" y1="308" x2="150" y2="262"/>
      </g>
      <!-- shoulders + cap -->
      <path d="M112 216 q28 -18 56 0" fill="#faf0da" stroke="#e0a93d" stroke-width="2.5"/>
      <rect x="130" y="188" width="20" height="26" rx="4" fill="#c9a06b"/>
      <rect x="126" y="182" width="28" height="12" rx="3" fill="#8a6a4f"/>
      <!-- batch code on the base -->
      <rect x="120" y="322" width="40" height="9" rx="2" fill="#fffdf8" opacity="0.9"/>
      <path d="M126 327 h6 M136 327 h4 M144 327 h8" stroke="#8a6a4f" stroke-width="1.6" stroke-linecap="round"/>
      <text x="140" y="352" font-size="11" fill="#faf0da" font-weight="700" text-anchor="middle">cool &amp; dark</text>
      <!-- snowflake-ish cool marker -->
      <g stroke="#9cc3d4" stroke-width="2" stroke-linecap="round" opacity="0.9">
        <path d="M198 210 v14 M191 217 h14 M193 213 l10 8 M203 213 l-10 8"/>
      </g>

      <!-- ===== RIGHT: sunny windowsill with the turned bottle ===== -->
      <!-- window -->
      <rect x="330" y="46" width="176" height="150" rx="8" fill="#dce8ee" stroke="#e6dccb" stroke-width="3"/>
      <line x1="418" y1="49" x2="418" y2="193" stroke="#fffdf8" stroke-width="4"/>
      <line x1="333" y1="120" x2="503" y2="120" stroke="#fffdf8" stroke-width="4"/>
      <!-- warm sun glare through the glass -->
      <g stroke="#f2d27a" stroke-width="7" stroke-linecap="round" opacity="0.85">
        <line x1="348" y1="176" x2="418" y2="82"/>
        <line x1="372" y1="184" x2="436" y2="96"/>
      </g>
      <!-- sill -->
      <rect x="318" y="196" width="200" height="12" rx="4" fill="#c9a06b"/>
      <rect x="318" y="208" width="200" height="8" rx="3" fill="#8a6a4f"/>

      <!-- crossed-out sun (do NOT store in sun) -->
      <circle cx="470" cy="80" r="16" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="2.6" stroke-linecap="round">
        <line x1="470" y1="54" x2="470" y2="60"/>
        <line x1="470" y1="100" x2="470" y2="106"/>
        <line x1="444" y1="80" x2="450" y2="80"/>
        <line x1="490" y1="80" x2="496" y2="80"/>
        <line x1="452" y1="62" x2="456" y2="66"/>
        <line x1="484" y1="94" x2="488" y2="98"/>
        <line x1="452" y1="98" x2="456" y2="94"/>
        <line x1="484" y1="66" x2="488" y2="62"/>
      </g>
      <g stroke="#d9663f" stroke-width="4" stroke-linecap="round">
        <line x1="456" y1="66" x2="484" y2="94"/>
        <line x1="484" y1="66" x2="456" y2="94"/>
      </g>

      <!-- turned bottle on the sill -->
      <rect x="360" y="104" width="60" height="92" rx="9" fill="#e6dccb" stroke="#b9b1a3" stroke-width="2.5"/>
      <!-- darkened, oxidized amber liquid -->
      <rect x="368" y="128" width="44" height="62" rx="6" fill="#8a6a4f"/>
      <rect x="368" y="128" width="44" height="62" rx="6" fill="#5b4633" opacity="0.45"/>
      <!-- shoulders + cap -->
      <path d="M360 108 q30 -16 60 0" fill="#e6dccb" stroke="#b9b1a3" stroke-width="2.5"/>
      <rect x="380" y="82" width="20" height="24" rx="4" fill="#b9b1a3"/>
      <rect x="376" y="76" width="28" height="12" rx="3" fill="#8a6a4f"/>
      <!-- batch code on the base -->
      <rect x="368" y="182" width="44" height="9" rx="2" fill="#fffdf8" opacity="0.85"/>
      <path d="M374 187 h6 M384 187 h5 M393 187 h4 M401 187 h6" stroke="#8a6a4f" stroke-width="1.6" stroke-linecap="round"/>
      <!-- "off" smell squiggles rising -->
      <path d="M392 70 q5 -8 0 -16 M400 72 q6 -9 0 -18" stroke="#d9663f" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="390" y="176" font-size="11" fill="#d9663f" font-weight="700" text-anchor="middle">turned</text>

      <!-- vanity surface + a small dish/tray for warmth -->
      <rect x="212" y="366" width="316" height="13" rx="6" fill="#c9a06b"/>
      <ellipse cx="470" cy="352" rx="46" ry="10" fill="#e3efe8"/>
      <rect x="452" y="330" width="14" height="24" rx="4" fill="#7fb3c8"/>
      <rect x="474" y="336" width="12" height="18" rx="4" fill="#5e9a78"/>

      <!-- fresh vs turned label sparkles -->
      <g stroke="#e0a93d" stroke-width="2.5" stroke-linecap="round">
        <line x1="176" y1="200" x2="176" y2="210"/>
        <line x1="171" y1="205" x2="181" y2="205"/>
      </g>
    </svg>
