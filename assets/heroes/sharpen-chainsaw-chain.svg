<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a chainsaw with its bar clamped in a vise on a stump, a round file resting against a freshly sharpened cutter that throws a gleam, with coarse wood chips scattered below">
      <ellipse cx="280" cy="398" rx="250" ry="24" fill="#efe7d8"/>
      <circle cx="78" cy="66" r="24" fill="#f2cf7a"/>
      <ellipse cx="452" cy="68" rx="46" ry="22" fill="#dce8ee"/>
      <ellipse cx="406" cy="80" rx="28" ry="15" fill="#dce8ee"/>
      <ellipse cx="172" cy="108" rx="30" ry="14" fill="#dce8ee"/>
      <!-- stump the saw is clamped to -->
      <rect x="86" y="320" width="120" height="78" rx="10" fill="#8a6a4f"/>
      <ellipse cx="146" cy="320" rx="60" ry="16" fill="#b9b1a3"/>
      <ellipse cx="146" cy="320" rx="40" ry="10" fill="#c9a06b"/>
      <ellipse cx="146" cy="320" rx="18" ry="5" fill="#8a6a4f"/>
      <!-- vise jaws gripping the bar -->
      <rect x="124" y="276" width="44" height="30" rx="5" fill="#2c5a40"/>
      <rect x="118" y="300" width="56" height="14" rx="4" fill="#35684c"/>
      <!-- chainsaw body, powerhead to the right -->
      <rect x="300" y="234" width="150" height="78" rx="18" fill="#c96f4a"/>
      <rect x="300" y="280" width="150" height="14" rx="7" fill="#d9663f"/>
      <!-- top handle -->
      <path d="M338 234 q24 -34 70 -22" stroke="#33393b" stroke-width="12" fill="none" stroke-linecap="round"/>
      <!-- rear handle / trigger area -->
      <rect x="436" y="244" width="40" height="56" rx="12" fill="#33393b"/>
      <!-- pull-cord handle -->
      <rect x="316" y="246" width="20" height="14" rx="5" fill="#e0a93d"/>
      <!-- air filter cover detail -->
      <rect x="360" y="252" width="48" height="30" rx="7" fill="#d98e3b"/>
      <circle cx="384" cy="267" r="9" fill="#b9b1a3"/>
      <circle cx="384" cy="267" r="3.5" fill="#fffdf8"/>
      <!-- chain brake / front handguard -->
      <rect x="296" y="222" width="14" height="60" rx="5" fill="#2c5a40"/>
      <!-- guide bar extending left into the vise -->
      <rect x="150" y="284" width="156" height="20" rx="9" fill="#b9b1a3"/>
      <ellipse cx="156" cy="294" rx="11" ry="10" fill="#8a6a4f"/>
      <!-- chain teeth along the top of the bar -->
      <g fill="#33393b">
        <path d="M168 284 l8 -9 l9 0 l0 9 z"/>
        <path d="M192 284 l8 -9 l9 0 l0 9 z"/>
        <path d="M216 284 l8 -9 l9 0 l0 9 z"/>
        <path d="M240 284 l8 -9 l9 0 l0 9 z"/>
        <path d="M264 284 l8 -9 l9 0 l0 9 z"/>
      </g>
      <!-- chain teeth along the bottom of the bar -->
      <g fill="#33393b">
        <path d="M176 304 l8 9 l9 0 l0 -9 z"/>
        <path d="M200 304 l8 9 l9 0 l0 -9 z"/>
        <path d="M224 304 l8 9 l9 0 l0 -9 z"/>
        <path d="M248 304 l8 9 l9 0 l0 -9 z"/>
      </g>
      <!-- round file resting against the cutter being sharpened -->
      <rect x="214" y="232" width="120" height="9" rx="4.5" fill="#b9b1a3" transform="rotate(-26 214 240)"/>
      <rect x="312" y="216" width="30" height="14" rx="6" fill="#e0a93d" transform="rotate(-26 312 223)"/>
      <!-- gleam / sparkles on the freshly sharpened tooth -->
      <g stroke="#fffdf8" stroke-width="3.5" stroke-linecap="round">
        <line x1="232" y1="262" x2="232" y2="278"/>
        <line x1="224" y1="270" x2="240" y2="270"/>
      </g>
      <g stroke="#e0a93d" stroke-width="2.5" stroke-linecap="round">
        <line x1="258" y1="266" x2="258" y2="274"/>
        <line x1="254" y1="270" x2="262" y2="270"/>
        <line x1="208" y1="272" x2="208" y2="278"/>
        <line x1="205" y1="275" x2="211" y2="275"/>
      </g>
      <circle cx="246" cy="258" r="2.5" fill="#fffdf8"/>
      <!-- coarse wood chips on the ground (sharp chain = chips, not dust) -->
      <g fill="#d98e3b">
        <ellipse cx="300" cy="396" rx="9" ry="4" transform="rotate(-18 300 396)"/>
        <ellipse cx="332" cy="404" rx="8" ry="4" transform="rotate(14 332 404)"/>
        <ellipse cx="262" cy="404" rx="9" ry="4" transform="rotate(22 262 404)"/>
        <ellipse cx="360" cy="394" rx="7" ry="3.5" transform="rotate(-8 360 394)"/>
      </g>
      <g fill="#c9a06b">
        <ellipse cx="318" cy="410" rx="7" ry="3.5" transform="rotate(28 318 410)"/>
        <ellipse cx="284" cy="412" rx="6" ry="3" transform="rotate(-22 284 412)"/>
      </g>
    </svg>
