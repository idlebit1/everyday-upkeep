<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of an HVAC technician kneeling beside an outdoor air-conditioning condenser unit next to a house, holding a gauge and multimeter to check the system, with a small indoor furnace and a fresh air filter shown nearby and a clipboard tune-up checklist propped in the foreground">
      <ellipse cx="285" cy="404" rx="255" ry="22" fill="#efe7d8"/>

      <!-- house exterior behind -->
      <rect x="330" y="70" width="200" height="230" rx="6" fill="#fffdf8" stroke="#b9b1a3" stroke-width="4"/>
      <path d="M320 74 l110 -54 l110 54 z" fill="#c96f4a"/>
      <path d="M320 74 l110 -54 l110 54 z" fill="none" stroke="#8a6a4f" stroke-width="4" stroke-linejoin="round"/>
      <!-- house window -->
      <rect x="452" y="110" width="58" height="62" rx="4" fill="#dce8ee" stroke="#8a6a4f" stroke-width="3"/>
      <line x1="481" y1="110" x2="481" y2="172" stroke="#8a6a4f" stroke-width="3"/>
      <line x1="452" y1="141" x2="510" y2="141" stroke="#8a6a4f" stroke-width="3"/>
      <!-- house door -->
      <rect x="356" y="196" width="52" height="104" rx="4" fill="#8a6a4f"/>
      <circle cx="400" cy="250" r="3" fill="#e0a93d"/>

      <!-- indoor furnace (small, to the right by the door) -->
      <rect x="430" y="214" width="52" height="86" rx="4" fill="#b9b1a3" stroke="#8a6a4f" stroke-width="3"/>
      <rect x="438" y="222" width="36" height="20" rx="3" fill="#8a6a4f"/>
      <g stroke="#d9663f" stroke-width="3" stroke-linecap="round">
        <path d="M446 234 q3 -6 0 -10"/>
        <path d="M456 234 q3 -6 0 -10"/>
        <path d="M466 234 q3 -6 0 -10"/>
      </g>
      <circle cx="440" cy="256" r="3" fill="#5e9a78"/>
      <rect x="438" y="266" width="36" height="26" rx="2" fill="#dce8ee"/>
      <text x="434" y="312" font-size="10" fill="#6b7376">furnace</text>

      <!-- fresh filter shown small, leaning by the furnace -->
      <g transform="rotate(-8 500 250)">
        <rect x="490" y="214" width="30" height="72" rx="3" fill="#e3efe8" stroke="#3e7c59" stroke-width="2.5"/>
        <g stroke="#5e9a78" stroke-width="2">
          <line x1="490" y1="226" x2="520" y2="226"/>
          <line x1="490" y1="238" x2="520" y2="238"/>
          <line x1="490" y1="250" x2="520" y2="250"/>
          <line x1="490" y1="262" x2="520" y2="262"/>
          <line x1="490" y1="274" x2="520" y2="274"/>
        </g>
      </g>
      <text x="486" y="300" font-size="10" fill="#3e7c59" font-weight="700">new filter</text>

      <!-- outdoor AC condenser unit, front-left -->
      <rect x="70" y="230" width="150" height="130" rx="10" fill="#dce8ee" stroke="#8a6a4f" stroke-width="4"/>
      <!-- top grille frame -->
      <rect x="82" y="242" width="126" height="106" rx="6" fill="#c9d6dc"/>
      <!-- fan circle -->
      <circle cx="145" cy="295" r="46" fill="#fffdf8" stroke="#8a6a4f" stroke-width="3"/>
      <g stroke="#7fb3c8" stroke-width="8" stroke-linecap="round">
        <path d="M145 295 q22 -26 30 6" fill="none"/>
        <path d="M145 295 q-26 22 6 30" fill="none"/>
        <path d="M145 295 q26 -22 -6 -30" fill="none" transform="rotate(0 145 295)"/>
      </g>
      <g stroke="#5e9a78" stroke-width="8" stroke-linecap="round">
        <path d="M145 295 q-22 26 -30 -6" fill="none"/>
      </g>
      <circle cx="145" cy="295" r="7" fill="#8a6a4f"/>
      <!-- condenser fins hint on the side -->
      <g stroke="#9cc3d4" stroke-width="2">
        <line x1="80" y1="336" x2="210" y2="336"/>
        <line x1="80" y1="342" x2="210" y2="342"/>
      </g>
      <!-- refrigerant line to house -->
      <path d="M220 300 q56 -6 108 -6" fill="none" stroke="#b9b1a3" stroke-width="7" stroke-linecap="round"/>
      <path d="M220 312 q56 -2 96 -2" fill="none" stroke="#8a6a4f" stroke-width="5" stroke-linecap="round"/>

      <!-- technician kneeling beside the unit -->
      <!-- back leg / kneeling -->
      <path d="M244 360 q-8 -26 6 -44" stroke="#2c5a40" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M250 356 q22 4 44 4" stroke="#2c5a40" stroke-width="16" fill="none" stroke-linecap="round"/>
      <!-- torso -->
      <path d="M250 316 q6 -34 30 -40" stroke="#3e7c59" stroke-width="22" fill="none" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="286" cy="264" r="18" fill="#e8b48f"/>
      <path d="M270 258 q16 -18 34 -2 q-4 -14 -18 -14 q-14 0 -16 16 z" fill="#8a6a4f"/>
      <!-- arm reaching to the unit holding a gauge -->
      <path d="M270 290 q-30 8 -52 8" stroke="#3e7c59" stroke-width="13" fill="none" stroke-linecap="round"/>
      <ellipse cx="216" cy="298" rx="11" ry="9" fill="#e8b48f"/>
      <!-- refrigerant gauge / manifold in hand -->
      <circle cx="200" cy="286" r="15" fill="#fffdf8" stroke="#8a6a4f" stroke-width="3"/>
      <circle cx="200" cy="286" r="9" fill="#e3efe8"/>
      <path d="M200 286 l6 -6" stroke="#d9663f" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M200 300 q-6 12 -14 18" stroke="#c96f4a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- other arm holding a multimeter -->
      <path d="M292 300 q20 10 32 26" stroke="#3e7c59" stroke-width="12" fill="none" stroke-linecap="round"/>
      <ellipse cx="326" cy="330" rx="9" ry="8" fill="#e8b48f"/>
      <rect x="316" y="332" width="30" height="20" rx="4" fill="#e0a93d"/>
      <rect x="320" y="336" width="22" height="8" rx="2" fill="#fffdf8"/>
      <text x="322" y="343" font-size="6.5" fill="#2c5a40" font-weight="700">228V</text>

      <!-- clipboard tune-up checklist in the foreground -->
      <g transform="rotate(-6 96 372)">
        <rect x="60" y="332" width="72" height="88" rx="6" fill="#fffdf8" stroke="#8a6a4f" stroke-width="3"/>
        <rect x="82" y="326" width="28" height="12" rx="4" fill="#b9b1a3"/>
        <g stroke="#3e7c59" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M70 350 l4 4 l7 -8"/>
          <path d="M70 368 l4 4 l7 -8"/>
          <path d="M70 386 l4 4 l7 -8"/>
        </g>
        <g stroke="#b9b1a3" stroke-width="2.4" stroke-linecap="round">
          <line x1="88" y1="352" x2="122" y2="352"/>
          <line x1="88" y1="370" x2="122" y2="370"/>
          <line x1="88" y1="388" x2="118" y2="388"/>
        </g>
        <text x="66" y="410" font-size="8.5" fill="#6b7376">tune-up</text>
      </g>

      <!-- little sun / warmth mark, top-left -->
      <circle cx="70" cy="70" r="18" fill="#faf0da" stroke="#e0a93d" stroke-width="3"/>
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="70" y1="40" x2="70" y2="48"/>
        <line x1="70" y1="92" x2="70" y2="100"/>
        <line x1="40" y1="70" x2="48" y2="70"/>
        <line x1="92" y1="70" x2="100" y2="70"/>
      </g>
    </svg>
