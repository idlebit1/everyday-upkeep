<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a car being hand-washed in a driveway: a sudsy car with foam across the hood and roof, a person mid-wash holding a wash mitt against the door, two buckets on the ground — one full of sudsy wash water and one of clear rinse water — a garden hose snaking across the driveway, and a close-up of a clean wheel">
      <ellipse cx="285" cy="402" rx="252" ry="22" fill="#efe7d8"/>

      <!-- driveway band -->
      <rect x="34" y="356" width="500" height="46" rx="8" fill="#dce8ee" opacity="0.55"/>

      <!-- ===== the car body ===== -->
      <!-- lower body -->
      <path d="M120 300 q4 -56 70 -64 l60 -34 q14 -8 30 -8 h70 q20 0 36 16 l40 38 q40 6 44 52 l0 22 q0 8 -8 8 h-374 q-8 0 -8 -8 z" fill="#c96f4a"/>
      <!-- roof / greenhouse -->
      <path d="M196 240 l54 -30 q12 -6 26 -6 h62 q16 0 30 14 l30 30 z" fill="#d9663f"/>
      <!-- windows -->
      <path d="M214 238 l40 -22 q8 -4 18 -4 h24 l0 26 z" fill="#7fb3c8"/>
      <path d="M312 212 h28 q12 0 22 10 l18 16 h-68 z" fill="#7fb3c8"/>
      <!-- window shine -->
      <g stroke="#dce8ee" stroke-width="4" stroke-linecap="round" opacity="0.9">
        <line x1="228" y1="232" x2="252" y2="220"/>
        <line x1="326" y1="232" x2="350" y2="222"/>
      </g>
      <!-- body shine line -->
      <path d="M150 296 q180 -22 350 4" fill="none" stroke="#e8a07e" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <!-- door seam + handle -->
      <line x1="300" y1="252" x2="300" y2="300" stroke="#a85535" stroke-width="3"/>
      <rect x="262" y="266" width="24" height="7" rx="3.5" fill="#a85535"/>

      <!-- wheels -->
      <circle cx="196" cy="312" r="34" fill="#33393b"/>
      <circle cx="196" cy="312" r="18" fill="#b9b1a3"/>
      <circle cx="196" cy="312" r="7" fill="#8a6a4f"/>
      <g stroke="#8a6a4f" stroke-width="2.4" stroke-linecap="round">
        <path d="M196 297 l0 9 M196 318 l0 9 M181 312 l9 0 M202 312 l9 0"/>
      </g>
      <circle cx="408" cy="312" r="34" fill="#33393b"/>
      <circle cx="408" cy="312" r="18" fill="#b9b1a3"/>
      <circle cx="408" cy="312" r="7" fill="#8a6a4f"/>
      <g stroke="#8a6a4f" stroke-width="2.4" stroke-linecap="round">
        <path d="M408 297 l0 9 M408 318 l0 9 M393 312 l9 0 M414 312 l9 0"/>
      </g>

      <!-- foam suds across hood & roof -->
      <g fill="#fffdf8">
        <circle cx="244" cy="236" r="9"/>
        <circle cx="262" cy="230" r="11"/>
        <circle cx="282" cy="236" r="8"/>
        <circle cx="300" cy="230" r="10"/>
        <circle cx="430" cy="278" r="9"/>
        <circle cx="448" cy="272" r="10"/>
        <circle cx="466" cy="280" r="8"/>
      </g>
      <g fill="#eef4f7">
        <circle cx="252" cy="244" r="6"/>
        <circle cx="292" cy="244" r="6"/>
        <circle cx="440" cy="286" r="6"/>
        <circle cx="458" cy="284" r="5"/>
      </g>
      <!-- a sudsy streak running down the door -->
      <g fill="#eef4f7" opacity="0.85">
        <circle cx="334" cy="270" r="7"/>
        <circle cx="338" cy="282" r="5"/>
        <circle cx="335" cy="292" r="4"/>
      </g>

      <!-- ===== person mid-wash, washing the door ===== -->
      <!-- legs -->
      <rect x="92" y="320" width="13" height="56" rx="5" fill="#2c5a40"/>
      <rect x="110" y="320" width="13" height="56" rx="5" fill="#2c5a40"/>
      <ellipse cx="98" cy="380" rx="13" ry="6" fill="#33393b"/>
      <ellipse cx="118" cy="380" rx="13" ry="6" fill="#33393b"/>
      <!-- torso -->
      <path d="M86 254 q22 -12 44 0 l-4 70 h-36 z" fill="#3e7c59"/>
      <!-- head -->
      <circle cx="108" cy="236" r="19" fill="#c9a06b"/>
      <path d="M90 232 q18 -22 36 0 q0 -18 -18 -18 q-18 0 -18 18 z" fill="#8a6a4f"/>
      <!-- arm reaching to the door with the wash mitt -->
      <path d="M126 274 q56 -4 96 6" stroke="#3e7c59" stroke-width="14" fill="none" stroke-linecap="round"/>
      <!-- wash mitt on the paint -->
      <rect x="220" y="268" width="34" height="26" rx="9" fill="#5e9a78"/>
      <rect x="220" y="268" width="34" height="9" rx="6" fill="#3e7c59"/>
      <!-- foam coming off the mitt -->
      <g fill="#fffdf8">
        <circle cx="226" cy="266" r="4"/>
        <circle cx="238" cy="262" r="5"/>
        <circle cx="248" cy="266" r="4"/>
      </g>

      <!-- ===== two buckets on the ground ===== -->
      <!-- WASH bucket (sudsy) -->
      <path d="M40 318 h54 l-7 56 h-40 z" fill="#5e9a78"/>
      <path d="M37 314 h60 l-3 10 h-54 z" fill="#3e7c59"/>
      <path d="M44 312 q23 -16 46 0" fill="none" stroke="#2c5a40" stroke-width="3" stroke-linecap="round"/>
      <!-- suds on top of wash water -->
      <circle cx="52" cy="320" r="6" fill="#fffdf8"/>
      <circle cx="66" cy="316" r="7" fill="#eef4f7"/>
      <circle cx="80" cy="321" r="5" fill="#fffdf8"/>
      <text x="46" y="350" font-size="10" fill="#fffdf8" font-weight="700">WASH</text>

      <!-- RINSE bucket (clear water) -->
      <path d="M462 322 h54 l-7 54 h-40 z" fill="#7fb3c8"/>
      <path d="M459 318 h60 l-3 10 h-54 z" fill="#9cc3d4"/>
      <path d="M466 316 q23 -16 46 0" fill="none" stroke="#5e9a78" stroke-width="3" stroke-linecap="round"/>
      <rect x="470" y="330" width="38" height="14" rx="3" fill="#dce8ee" opacity="0.85"/>
      <text x="466" y="356" font-size="10" fill="#2c5a40" font-weight="700">RINSE</text>

      <!-- ===== garden hose snaking across the driveway ===== -->
      <path d="M524 372 q-60 18 -160 6 q-90 -10 -190 12 q-60 12 -110 0" fill="none" stroke="#3e7c59" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
      <!-- hose nozzle near the person -->
      <rect x="58" y="384" width="22" height="9" rx="4" fill="#5e9a78"/>
      <rect x="76" y="382" width="10" height="13" rx="3" fill="#2c5a40"/>
      <!-- a couple of water drips from the nozzle -->
      <path d="M86 388 q4 6 0 11" stroke="#7fb3c8" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- sun cue, gentle -->
      <circle cx="498" cy="56" r="20" fill="#faf0da"/>
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="498" y1="22" x2="498" y2="30"/>
        <line x1="528" y1="56" x2="520" y2="56"/>
        <line x1="476" y1="34" x2="481" y2="39"/>
      </g>
    </svg>
