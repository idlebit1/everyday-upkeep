<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a bathroom sink scene for washing makeup brushes: several brushes with bristles pointing down under a running faucet, a beauty sponge, a bottle of gentle shampoo, a silicone cleaning mat, and clean brushes lying flat to dry with the bristles hanging off the edge of the counter">
      <ellipse cx="280" cy="400" rx="245" ry="22" fill="#efe7d8"/>
      <!-- mirror -->
      <rect x="60" y="40" width="120" height="120" rx="10" fill="#dce8ee" stroke="#b9b1a3" stroke-width="4"/>
      <line x1="80" y1="150" x2="150" y2="60" stroke="#fffdf8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
      <line x1="100" y1="154" x2="160" y2="78" stroke="#fffdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
      <!-- counter + sink lip -->
      <rect x="40" y="300" width="480" height="16" rx="8" fill="#b9b1a3"/>
      <rect x="60" y="316" width="440" height="10" rx="5" fill="#a59c8c"/>
      <!-- faucet -->
      <path d="M420 196 v-26 q0 -14 14 -14 h26" stroke="#8a6a4f" stroke-width="9" fill="none" stroke-linecap="round"/>
      <rect x="408" y="196" width="24" height="14" rx="5" fill="#8a6a4f"/>
      <g stroke="#7fb3c8" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
        <line x1="420" y1="212" x2="420" y2="252"/>
        <line x1="426" y1="212" x2="426" y2="248"/>
      </g>
      <!-- big foundation brush, bristles DOWN under tap -->
      <rect x="404" y="150" width="12" height="60" rx="6" fill="#c96f4a"/>
      <rect x="402" y="208" width="16" height="10" rx="4" fill="#b9b1a3"/>
      <path d="M400 218 q10 36 20 0 z" fill="#5e9a78"/>
      <path d="M400 218 q10 22 20 0 z" fill="#3e7c59"/>
      <!-- water drips off bristles -->
      <path d="M410 258 q-2 6 2 8 q4 -2 2 -8 l-2 -5 z" fill="#7fb3c8" opacity="0.7"/>
      <!-- silicone cleaning mat on counter -->
      <rect x="208" y="276" width="96" height="24" rx="8" fill="#7fb3c8" opacity="0.8"/>
      <g fill="#dce8ee" opacity="0.9">
        <circle cx="224" cy="288" r="3"/><circle cx="238" cy="288" r="3"/><circle cx="252" cy="288" r="3"/>
        <circle cx="266" cy="288" r="3"/><circle cx="280" cy="288" r="3"/><circle cx="294" cy="288" r="3"/>
      </g>
      <text x="256" y="270" font-size="11" fill="#8a6a4f" text-anchor="middle" font-weight="700">scrub mat</text>
      <!-- gentle shampoo bottle -->
      <rect x="318" y="234" width="40" height="66" rx="10" fill="#5e9a78"/>
      <rect x="318" y="260" width="40" height="22" fill="#fffdf8"/>
      <path d="M326 271 q6 -5 12 0 q6 5 12 0" stroke="#5e9a78" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <rect x="330" y="218" width="16" height="18" rx="4" fill="#2c5a40"/>
      <rect x="333" y="210" width="10" height="10" rx="3" fill="#2c5a40"/>
      <!-- beauty sponge -->
      <path d="M150 248 q-22 0 -22 26 q0 22 22 22 q22 0 16 -26 q-4 -22 -16 -22 z" fill="#c96f4a"/>
      <ellipse cx="150" cy="296" rx="22" ry="6" fill="#a85638" opacity="0.5"/>
      <text x="150" y="320" font-size="11" fill="#8a6a4f" text-anchor="middle" font-weight="700">sponge</text>
      <!-- clean brushes drying flat, bristles off the counter edge -->
      <rect x="200" y="356" width="92" height="9" rx="4.5" fill="#3e7c59"/>
      <rect x="288" y="354" width="14" height="13" rx="4" fill="#b9b1a3"/>
      <path d="M302 354 q22 7 0 13 z" fill="#5e9a78"/>
      <rect x="200" y="374" width="78" height="8" rx="4" fill="#e0a93d"/>
      <rect x="274" y="372" width="12" height="12" rx="4" fill="#b9b1a3"/>
      <path d="M286 372 q20 6 0 12 z" fill="#d98e3b"/>
      <text x="150" y="364" font-size="11" fill="#6b7376" text-anchor="middle" font-weight="700">dry flat →</text>
      <!-- small eye brush leaning by mat -->
      <rect x="186" y="244" width="7" height="56" rx="3.5" fill="#e0a93d"/>
      <rect x="184.5" y="236" width="10" height="10" rx="3" fill="#b9b1a3"/>
      <path d="M184.5 236 q5 -16 10 0 z" fill="#5e9a78"/>
      <!-- sparkles -->
      <g stroke="#e0a93d" stroke-width="2.5" stroke-linecap="round">
        <line x1="196" y1="206" x2="196" y2="218"/>
        <line x1="190" y1="212" x2="202" y2="212"/>
        <line x1="372" y1="180" x2="372" y2="190"/>
        <line x1="367" y1="185" x2="377" y2="185"/>
      </g>
      <circle cx="340" cy="190" r="3" fill="#7fb3c8"/>
      <circle cx="124" cy="222" r="3" fill="#7fb3c8"/>
    </svg>
