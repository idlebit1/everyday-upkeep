<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a calm at-home manicure setup: a relaxed hand rests on a folded towel with neatly shaped, healthy nails, and beside it sit a nail file, a cuticle pusher, a nail buffer, a small bottle of cuticle oil, and a little bowl of warm soapy water, ready for a relaxed home manicure">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- folded towel surface under the whole scene -->
      <rect x="40" y="250" width="480" height="128" rx="18" fill="#dce8ee"/>
      <rect x="40" y="250" width="480" height="16" rx="8" fill="#cdd9de"/>
      <g stroke="#9cc3d4" stroke-width="2" stroke-linecap="round" opacity="0.6">
        <line x1="60" y1="300" x2="230" y2="300"/>
        <line x1="60" y1="314" x2="230" y2="314"/>
        <line x1="60" y1="328" x2="200" y2="328"/>
      </g>

      <!-- HAND resting on the towel, fingers toward viewer, neat nails -->
      <!-- wrist / back of hand -->
      <path d="M110 300 q4 -40 70 -46 q64 -6 108 6 q40 8 46 30 q6 22 -22 32 q-40 14 -120 12 q-70 -2 -100 -14 q-16 -18 -10 -22 z" fill="#e8b48f"/>
      <!-- knuckle shading -->
      <path d="M150 268 q30 -8 60 0" fill="none" stroke="#dca27d" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
      <!-- four fingers reaching right, big to small, each with a shaped nail -->
      <g fill="#e8b48f">
        <path d="M280 262 q40 -6 78 6 q22 8 20 24 q-2 14 -24 16 q-40 4 -74 -2 z"/>
        <path d="M286 292 q42 0 80 12 q20 8 16 22 q-4 12 -26 12 q-38 2 -70 -4 z"/>
        <path d="M280 320 q40 4 74 16 q18 8 12 20 q-6 10 -26 8 q-34 -2 -60 -8 z"/>
        <path d="M262 344 q34 6 62 18 q16 8 8 18 q-8 8 -24 4 q-28 -6 -46 -12 z"/>
      </g>
      <!-- thumb along the bottom -->
      <path d="M150 320 q-24 4 -34 22 q-6 16 12 22 q22 6 40 -6 q10 -16 2 -32 z" fill="#e8b48f"/>
      <!-- neatly shaped, healthy nails (soft rounded rectangles with a highlight) -->
      <g fill="#fffdf8" stroke="#d99c73" stroke-width="1.4">
        <rect x="352" y="270" width="20" height="15" rx="6" transform="rotate(6 362 277)"/>
        <rect x="360" y="300" width="19" height="14" rx="6" transform="rotate(8 369 307)"/>
        <rect x="348" y="330" width="18" height="13" rx="5.5" transform="rotate(10 357 336)"/>
        <rect x="316" y="356" width="16" height="12" rx="5" transform="rotate(14 324 362)"/>
      </g>
      <!-- thumb nail -->
      <rect x="118" y="334" width="16" height="13" rx="5" transform="rotate(-24 126 340)" fill="#fffdf8" stroke="#d99c73" stroke-width="1.4"/>
      <!-- calm shine on the nails -->
      <g stroke="#e0a93d" stroke-width="2.2" stroke-linecap="round">
        <path d="M300 214 l0 9 M295.5 218.5 l9 0"/>
      </g>

      <!-- NAIL FILE (emery board) leaning front-center -->
      <g transform="rotate(-14 250 360)">
        <rect x="214" y="322" width="20" height="78" rx="9" fill="#c96f4a"/>
        <rect x="214" y="322" width="20" height="10" rx="9" fill="#b9b1a3"/>
        <!-- grit texture on the filing surface -->
        <g stroke="#8a6a4f" stroke-width="1" opacity="0.55">
          <line x1="218" y1="340" x2="230" y2="340"/>
          <line x1="218" y1="350" x2="230" y2="350"/>
          <line x1="218" y1="360" x2="230" y2="360"/>
          <line x1="218" y1="370" x2="230" y2="370"/>
        </g>
      </g>

      <!-- CUTICLE PUSHER leaning front-right -->
      <g transform="rotate(20 330 352)">
        <rect x="294" y="336" width="72" height="9" rx="4.5" fill="#8a6a4f"/>
        <rect x="294" y="336" width="18" height="9" rx="4.5" fill="#cdd9de"/>
        <path d="M294 340 l-8 0 q-3 0.5 0 1 l8 0 z" fill="#b9b1a3"/>
        <ellipse cx="364" cy="340.5" rx="5" ry="4" fill="#cdd9de"/>
      </g>

      <!-- NAIL BUFFER block, center-right on the towel -->
      <g transform="rotate(-6 410 360)">
        <rect x="382" y="348" width="60" height="22" rx="7" fill="#e0a93d"/>
        <rect x="382" y="348" width="60" height="8" rx="7" fill="#d98e3b"/>
        <rect x="382" y="366" width="60" height="6" rx="3" fill="#fffdf8"/>
      </g>

      <!-- CUTICLE OIL bottle, back-right on the towel -->
      <rect x="454" y="214" width="30" height="50" rx="7" fill="#5e9a78"/>
      <rect x="460" y="200" width="18" height="16" rx="4" fill="#3e7c59"/>
      <path d="M478 202 l14 -6 l0 6 l-14 4 z" fill="#2c5a40"/>
      <rect x="458" y="230" width="22" height="20" rx="3" fill="#e3efe8" opacity="0.85"/>
      <text x="469" y="245" font-size="9" fill="#3e7c59" font-weight="700" text-anchor="middle">oil</text>

      <!-- small BOWL of warm soapy water, back-left on the towel -->
      <path d="M60 214 h116 l-14 46 q-44 14 -88 0 z" fill="#7fb3c8"/>
      <ellipse cx="118" cy="214" rx="58" ry="15" fill="#9cc3d4"/>
      <ellipse cx="118" cy="212" rx="47" ry="11" fill="#dce8ee"/>
      <!-- soap suds on the water -->
      <circle cx="96" cy="210" r="6" fill="#eef4f7"/>
      <circle cx="112" cy="206" r="7" fill="#fffdf8"/>
      <circle cx="130" cy="210" r="5" fill="#eef4f7"/>
      <!-- gentle ripple -->
      <path d="M86 216 q10 -5 20 0 q10 5 20 0 q10 -5 20 0" fill="none" stroke="#7fb3c8" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
    </svg>
