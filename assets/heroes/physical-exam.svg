<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a friendly smiling heart with a heartbeat line across it, beside a stethoscope and a calendar marked with a yearly checkup reminder, in a warm sunlit scene">
