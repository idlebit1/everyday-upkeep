<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a warm salon moment: a person sits in a barber chair wearing a cape, a smiling stylist stands beside them mid-snip with scissors in one hand and a comb in the other, a large round mirror reflects the scene, and the fresh, sharp cut looks crisp and intentional">
      <ellipse cx="280" cy="404" rx="250" ry="22" fill="#efe7d8"/>

      <!-- big round mirror behind -->
      <circle cx="150" cy="150" r="92" fill="#dce8ee" stroke="#c9a06b" stroke-width="9"/>
      <circle cx="150" cy="150" r="84" fill="#eef4f7"/>
      <!-- mirror shine streaks -->
      <g stroke="#fffdf8" stroke-width="7" stroke-linecap="round" opacity="0.85">
        <line x1="104" y1="184" x2="160" y2="108"/>
        <line x1="126" y1="194" x2="172" y2="130"/>
      </g>
      <!-- reflected head in the mirror (simple, fresh cut) -->
      <ellipse cx="150" cy="158" rx="34" ry="38" fill="#c9a06b"/>
      <path d="M118 142 q4 -34 32 -34 q28 0 32 34 q-12 -14 -32 -14 q-20 0 -32 14 z" fill="#5a4632"/>
      <circle cx="139" cy="158" r="2.6" fill="#33393b"/>
      <circle cx="161" cy="158" r="2.6" fill="#33393b"/>
      <path d="M142 174 q8 6 16 0" fill="none" stroke="#8a6a4f" stroke-width="2.4" stroke-linecap="round"/>

      <!-- barber chair base -->
      <rect x="296" y="312" width="22" height="74" rx="6" fill="#8a6a4f"/>
      <path d="M278 386 h58 l-8 14 h-42 z" fill="#5a4632"/>
      <!-- chair seat & back -->
      <rect x="262" y="276" width="92" height="44" rx="12" fill="#c96f4a"/>
      <rect x="270" y="186" width="78" height="104" rx="16" fill="#d9663f"/>
      <rect x="278" y="196" width="62" height="88" rx="12" fill="#c96f4a"/>

      <!-- person in the chair (seated, facing right) -->
      <!-- cape -->
      <path d="M286 224 q24 -16 58 0 l18 150 h-94 z" fill="#7fb3c8"/>
      <path d="M286 224 q24 -16 58 0 l4 32 q-32 -16 -66 0 z" fill="#9cc3d4"/>
      <!-- cape fold lines -->
      <g stroke="#6fa6bd" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <line x1="300" y1="276" x2="304" y2="360"/>
        <line x1="328" y1="278" x2="330" y2="362"/>
      </g>
      <!-- neck -->
      <rect x="306" y="206" width="22" height="26" rx="8" fill="#b9885f"/>
      <!-- head -->
      <ellipse cx="318" cy="186" rx="34" ry="38" fill="#c9a06b"/>
      <!-- fresh sharp cut: crisp top, clean taper -->
      <path d="M286 170 q4 -38 32 -38 q28 0 32 38 q-6 -8 -14 -10 q-2 10 -8 12 q-2 -10 -10 -12 q-8 2 -10 12 q-6 -2 -14 -2 z" fill="#3a2c1e"/>
      <!-- clean sideburn line -->
      <rect x="286" y="172" width="6" height="20" rx="2" fill="#3a2c1e"/>
      <!-- face details -->
      <circle cx="308" cy="186" r="2.8" fill="#33393b"/>
      <circle cx="330" cy="186" r="2.8" fill="#33393b"/>
      <path d="M312 202 q6 5 14 0" fill="none" stroke="#8a6a4f" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M303 178 q5 -4 11 -1 M323 177 q6 -3 11 1" fill="none" stroke="#3a2c1e" stroke-width="2" stroke-linecap="round"/>
      <!-- ear -->
      <ellipse cx="300" cy="190" rx="5" ry="7" fill="#b9885f"/>
      <!-- freshly-cut hair clippings falling onto the cape -->
      <g fill="#3a2c1e" opacity="0.7">
        <path d="M312 250 q3 4 -1 7" stroke="#3a2c1e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M328 262 q3 4 -1 7" stroke="#3a2c1e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M300 270 q-3 4 1 7" stroke="#3a2c1e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>

      <!-- stylist standing to the right, mid-snip -->
      <!-- body / smock -->
      <path d="M420 300 q22 -86 52 -86 q30 0 52 86 z" fill="#3e7c59"/>
      <rect x="438" y="262" width="68" height="60" rx="14" fill="#3e7c59"/>
      <!-- apron pocket with comb -->
      <rect x="452" y="288" width="40" height="26" rx="5" fill="#2c5a40"/>
      <rect x="462" y="280" width="6" height="22" rx="2" fill="#e0a93d"/>
      <g stroke="#2c5a40" stroke-width="1.4">
        <line x1="464" y1="282" x2="464" y2="294"/>
        <line x1="467" y1="282" x2="467" y2="294"/>
      </g>
      <!-- stylist head -->
      <ellipse cx="472" cy="190" rx="30" ry="34" fill="#b9885f"/>
      <path d="M444 180 q2 -36 28 -36 q26 0 28 36 q-10 -8 -28 -8 q-18 0 -28 8 z" fill="#5a4632"/>
      <!-- bun -->
      <circle cx="500" cy="166" r="11" fill="#5a4632"/>
      <circle cx="448" cy="190" r="4.4" fill="#a87a52"/>
      <circle cx="465" cy="192" r="2.6" fill="#33393b"/>
      <circle cx="481" cy="192" r="2.6" fill="#33393b"/>
      <path d="M468 204 q6 6 13 0" fill="none" stroke="#8a6a4f" stroke-width="2.4" stroke-linecap="round"/>
      <!-- stylist arm reaching toward the client's head with scissors -->
      <path d="M452 250 q-32 -22 -82 -52" stroke="#3e7c59" stroke-width="14" fill="none" stroke-linecap="round"/>
      <!-- hand -->
      <ellipse cx="372" cy="200" rx="13" ry="10" fill="#b9885f"/>
      <!-- comb in the other hand near the head -->
      <path d="M398 234 q-22 -8 -38 -22" stroke="#3e7c59" stroke-width="13" fill="none" stroke-linecap="round"/>
      <ellipse cx="362" cy="214" rx="11" ry="9" fill="#b9885f"/>
      <rect x="338" y="206" width="26" height="7" rx="2.5" fill="#8a6a4f" transform="rotate(-24 351 209)"/>
      <g stroke="#5a4632" stroke-width="1.4">
        <line x1="342" y1="214" x2="340" y2="220"/>
        <line x1="347" y1="212" x2="345" y2="218"/>
        <line x1="352" y1="210" x2="350" y2="216"/>
      </g>

      <!-- scissors at work near the top of the head -->
      <g transform="rotate(-30 360 190)">
        <line x1="360" y1="182" x2="392" y2="182" stroke="#7fb3c8" stroke-width="4" stroke-linecap="round"/>
        <line x1="360" y1="190" x2="392" y2="190" stroke="#5e9a78" stroke-width="4" stroke-linecap="round"/>
        <circle cx="358" cy="180" r="6.5" fill="none" stroke="#5e9a78" stroke-width="3.5"/>
        <circle cx="358" cy="192" r="6.5" fill="none" stroke="#7fb3c8" stroke-width="3.5"/>
        <circle cx="362" cy="186" r="2.4" fill="#8a6a4f"/>
      </g>
      <!-- little snip sparkle -->
      <g stroke="#e0a93d" stroke-width="2.4" stroke-linecap="round">
        <path d="M340 158 l0 9 M335.5 162.5 l9 0"/>
      </g>

      <!-- small product bottle on a side ledge, front-left -->
      <rect x="64" y="338" width="26" height="48" rx="6" fill="#5e9a78"/>
      <rect x="70" y="326" width="14" height="14" rx="3" fill="#3e7c59"/>
      <rect x="68" y="356" width="18" height="14" rx="3" fill="#dce8ee" opacity="0.8"/>
    </svg>
