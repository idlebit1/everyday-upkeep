<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of caring for a sleeping bag: a lofty mummy-style sleeping bag shown half flat and dingy, half fluffed and clean, going into a front-loading washing machine, with a bottle of gentle down wash and a few dryer balls or tennis balls beside it and a large mesh storage sack hanging on the wall, in a warm outdoorsy setting">
      <ellipse cx="285" cy="404" rx="252" ry="22" fill="#efe7d8"/>

      <!-- mesh storage sack hanging on the wall, top left -->
      <line x1="78" y1="34" x2="78" y2="58" stroke="#8a6a4f" stroke-width="3" stroke-linecap="round"/>
      <circle cx="78" cy="32" r="5" fill="#b9b1a3"/>
      <path d="M52 58 q26 -12 52 0 q8 56 -6 80 q-20 10 -40 0 q-14 -24 -6 -80 z" fill="#e3efe8" stroke="#5e9a78" stroke-width="2.5"/>
      <g stroke="#5e9a78" stroke-width="1.2" opacity="0.7">
        <line x1="56" y1="76" x2="100" y2="76"/>
        <line x1="54" y1="96" x2="102" y2="96"/>
        <line x1="56" y1="116" x2="100" y2="116"/>
        <line x1="68" y1="60" x2="68" y2="134"/>
        <line x1="88" y1="60" x2="88" y2="134"/>
      </g>
      <text x="48" y="152" font-size="10.5" fill="#3e7c59" font-weight="700">store loose</text>

      <!-- the sleeping bag, lofty mummy shape, draped above the washer -->
      <!-- LEFT half: flat & dingy -->
      <path d="M150 196 q-8 -56 36 -78 q40 -18 84 -12 l0 132 q-44 8 -84 -8 q-40 -16 -36 -34 z" fill="#cdd9de"/>
      <path d="M150 196 q-8 -56 36 -78 q40 -18 84 -12 l0 132 q-44 8 -84 -8 q-40 -16 -36 -34 z" fill="#d8cfbe" opacity="0.4"/>
      <!-- flattened, sagging baffle lines on the dingy half -->
      <g stroke="#b9b1a3" stroke-width="2.2" fill="none" stroke-linecap="round">
        <path d="M168 132 q44 -6 96 -2"/>
        <path d="M158 158 q52 -4 112 0"/>
        <path d="M154 184 q56 -2 116 0"/>
        <path d="M156 210 q54 4 114 2"/>
      </g>
      <!-- grime smudges on the dingy half -->
      <ellipse cx="200" cy="150" rx="11" ry="7" fill="#8a6a4f" opacity="0.35"/>
      <ellipse cx="220" cy="200" rx="9" ry="6" fill="#8a6a4f" opacity="0.3"/>
      <text x="160" y="120" font-size="11" fill="#6b7376">flat &amp; dingy</text>

      <!-- RIGHT half: fluffed & clean -->
      <path d="M270 106 q44 -6 84 12 q44 22 36 78 q4 18 -36 34 q-40 16 -84 8 z" fill="#fffdf8" stroke="#dce8ee" stroke-width="2"/>
      <!-- plump, lofted baffle lines on the clean half -->
      <g stroke="#dce8ee" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M276 132 q48 -8 100 4"/>
        <path d="M272 160 q52 -6 110 6"/>
        <path d="M272 188 q52 -4 112 8"/>
        <path d="M276 214 q50 0 106 8"/>
      </g>
      <!-- sparkles on the clean half -->
      <g stroke="#5e9a78" stroke-width="2.4" stroke-linecap="round">
        <path d="M340 130 l0 11 M334 135 l11 0"/>
        <path d="M372 176 l0 9 M367 180 l9 0"/>
      </g>
      <text x="300" y="120" font-size="11" fill="#3e7c59" font-weight="700">fluffed &amp; clean</text>

      <!-- front-loading washing machine -->
      <rect x="206" y="236" width="200" height="160" rx="18" fill="#fffdf8" stroke="#e6dccb" stroke-width="3"/>
      <!-- control panel -->
      <rect x="222" y="250" width="168" height="26" rx="8" fill="#e3efe8"/>
      <circle cx="370" cy="263" r="8" fill="#3e7c59"/>
      <circle cx="370" cy="263" r="3" fill="#fffdf8"/>
      <rect x="236" y="259" width="42" height="6" rx="3" fill="#b9b1a3"/>
      <rect x="236" y="268" width="28" height="5" rx="2.5" fill="#c9a06b"/>
      <!-- big door ring -->
      <circle cx="306" cy="334" r="60" fill="#dce8ee" stroke="#b9b1a3" stroke-width="5"/>
      <circle cx="306" cy="334" r="49" fill="#eaf2f6" stroke="#7fb3c8" stroke-width="2.5"/>
      <!-- bag tumbling gently inside -->
      <path d="M272 314 q34 -16 70 -2 q8 26 -6 44 q-32 14 -64 0 q-12 -22 0 -42 z" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2"/>
      <path d="M288 322 q8 18 0 34 M312 318 q-6 22 0 38" stroke="#dce8ee" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- gentle water swirl -->
      <path d="M280 362 q10 6 20 0 q10 -6 20 0 q10 6 20 0" stroke="#7fb3c8" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <!-- "gentle" label, no agitator -->
      <text x="232" y="304" font-size="10.5" fill="#3e7c59" font-weight="700">gentle, no agitator</text>
      <!-- door latch -->
      <circle cx="360" cy="334" r="5" fill="#b9b1a3"/>
      <!-- machine feet -->
      <rect x="218" y="396" width="16" height="12" rx="4" fill="#b9b1a3"/>
      <rect x="378" y="396" width="16" height="12" rx="4" fill="#b9b1a3"/>

      <!-- gentle down / tech wash bottle, right of machine -->
      <rect x="430" y="312" width="46" height="64" rx="8" fill="#5e9a78"/>
      <rect x="438" y="296" width="20" height="18" rx="4" fill="#3e7c59"/>
      <rect x="434" y="328" width="38" height="28" rx="4" fill="#fffdf8"/>
      <rect x="439" y="335" width="28" height="5" rx="2.5" fill="#5e9a78"/>
      <rect x="439" y="344" width="20" height="4" rx="2" fill="#b9b1a3"/>
      <text x="431" y="392" font-size="9.5" fill="#3e7c59" font-weight="700">down wash</text>

      <!-- dryer / tennis balls, front right -->
      <circle cx="468" cy="386" r="14" fill="#e0a93d"/>
      <circle cx="496" cy="390" r="13" fill="#d98e3b"/>
      <circle cx="450" cy="396" r="11" fill="#c9a06b"/>
      <path d="M460 380 q8 6 16 12 M488 384 q8 6 16 12" stroke="#fffdf8" stroke-width="1.4" fill="none" opacity="0.5" stroke-linecap="round"/>

      <!-- small plant for warmth, far left bottom -->
      <path d="M120 388 q-2 -22 -12 -32" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M120 388 q4 -20 14 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="104" cy="356" rx="7" ry="12" fill="#5e9a78" transform="rotate(-30 104 356)"/>
      <ellipse cx="136" cy="360" rx="7" ry="12" fill="#3e7c59" transform="rotate(28 136 360)"/>
      <path d="M106 388 h28 l-4 16 h-20 z" fill="#c96f4a"/>
    </svg>
