<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a flat-style bicycle clamped in a repair stand with a wrench leaning against the base and sparkle motifs around the freshly tuned bike">
      <ellipse cx="290" cy="400" rx="240" ry="22" fill="#efe7d8"/>
      <circle cx="488" cy="62" r="24" fill="#f2cf7a"/>
      <ellipse cx="92" cy="70" rx="44" ry="22" fill="#dce8ee"/>
      <ellipse cx="138" cy="82" rx="28" ry="16" fill="#dce8ee"/>
      <!-- repair stand -->
      <rect x="300" y="180" width="14" height="216" rx="6" fill="#8a6a4f"/>
      <path d="M307 392 L258 408 M307 392 L356 408" stroke="#8a6a4f" stroke-width="12" stroke-linecap="round"/>
      <rect x="262" y="168" width="74" height="16" rx="8" fill="#b9b1a3"/>
      <circle cx="270" cy="176" r="10" fill="#c96f4a"/>
      <!-- rear wheel -->
      <circle cx="170" cy="262" r="74" fill="none" stroke="#33393b" stroke-width="11"/>
      <circle cx="170" cy="262" r="58" fill="none" stroke="#b9b1a3" stroke-width="5"/>
      <g stroke="#b9b1a3" stroke-width="2.5">
        <line x1="170" y1="206" x2="170" y2="318"/>
        <line x1="114" y1="262" x2="226" y2="262"/>
        <line x1="131" y1="223" x2="209" y2="301"/>
        <line x1="209" y1="223" x2="131" y2="301"/>
      </g>
      <circle cx="170" cy="262" r="9" fill="#2c5a40"/>
      <!-- front wheel -->
      <circle cx="418" cy="262" r="74" fill="none" stroke="#33393b" stroke-width="11"/>
      <circle cx="418" cy="262" r="58" fill="none" stroke="#b9b1a3" stroke-width="5"/>
      <g stroke="#b9b1a3" stroke-width="2.5">
        <line x1="418" y1="206" x2="418" y2="318"/>
        <line x1="362" y1="262" x2="474" y2="262"/>
        <line x1="379" y1="223" x2="457" y2="301"/>
        <line x1="457" y1="223" x2="379" y2="301"/>
      </g>
      <circle cx="418" cy="262" r="9" fill="#2c5a40"/>
      <!-- frame -->
      <g stroke="#3e7c59" stroke-width="11" stroke-linecap="round" fill="none">
        <line x1="170" y1="262" x2="285" y2="262"/>   <!-- chainstay -->
        <line x1="285" y1="262" x2="262" y2="148"/>   <!-- seat tube -->
        <line x1="170" y1="262" x2="262" y2="148"/>   <!-- seat stay -->
        <line x1="285" y1="262" x2="394" y2="150"/>   <!-- down tube -->
        <line x1="268" y1="156" x2="390" y2="146"/>   <!-- top tube -->
        <line x1="394" y1="150" x2="418" y2="262"/>   <!-- fork -->
      </g>
      <!-- crank + chainring -->
      <circle cx="285" cy="262" r="17" fill="none" stroke="#5e9a78" stroke-width="6"/>
      <circle cx="285" cy="262" r="5" fill="#2c5a40"/>
      <line x1="285" y1="262" x2="305" y2="290" stroke="#33393b" stroke-width="7" stroke-linecap="round"/>
      <rect x="299" y="286" width="22" height="9" rx="4.5" fill="#33393b"/>
      <path d="M170 270 q58 22 115 9" stroke="#8a6a4f" stroke-width="4" fill="none"/>
      <!-- seatpost + saddle -->
      <line x1="262" y1="148" x2="255" y2="118" stroke="#33393b" stroke-width="7" stroke-linecap="round"/>
      <path d="M228 116 q26 -12 54 0 q-26 10 -54 0" fill="#c96f4a"/>
      <!-- stem + handlebars -->
      <line x1="394" y1="150" x2="390" y2="116" stroke="#33393b" stroke-width="7" stroke-linecap="round"/>
      <path d="M368 116 h44 q12 0 12 12" stroke="#33393b" stroke-width="7" fill="none" stroke-linecap="round"/>
      <circle cx="424" cy="130" r="5" fill="#d9663f"/>
      <!-- wrench leaning on stand -->
      <g transform="rotate(-32 480 372)">
        <rect x="472" y="312" width="14" height="74" rx="6" fill="#7fb3c8"/>
        <path d="M479 296 a16 16 0 1 0 0.1 0 M471 290 h16 v14 h-16 z" fill="#7fb3c8"/>
        <circle cx="479" cy="306" r="7" fill="#fffdf8"/>
        <circle cx="479" cy="392" r="11" fill="#7fb3c8"/>
        <rect x="473" y="386" width="12" height="12" fill="#fffdf8"/>
      </g>
      <!-- oil can -->
      <rect x="64" y="356" width="34" height="38" rx="6" fill="#e0a93d"/>
      <path d="M76 356 v-12 h12 v12" fill="none" stroke="#d98e3b" stroke-width="6"/>
      <path d="M98 366 l24 -14" stroke="#d98e3b" stroke-width="6" stroke-linecap="round"/>
      <circle cx="128" cy="348" r="3.5" fill="#7fb3c8"/>
      <!-- sparkles -->
      <g fill="#e0a93d">
        <path d="M330 70 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z"/>
        <path d="M212 118 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
        <path d="M468 196 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
      </g>
      <path d="M58 196 l2.5 7.5 7.5 2.5 -7.5 2.5 -2.5 7.5 -2.5 -7.5 -7.5 -2.5 7.5 -2.5 z" fill="#d98e3b"/>
      <!-- grass tufts -->
      <circle cx="510" cy="392" r="14" fill="#5e9a78"/>
      <circle cx="532" cy="396" r="11" fill="#3e7c59"/>
    </svg>
