<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a homeowner inspecting a roof safely from the ground: a person stands in the yard looking up through binoculars at a house roofline, where a couple of shingles are missing or curling and the chimney flashing is visibly damaged, while an extension ladder is leaned safely against the eave — the person is on the ground, not climbing onto the roof">
      <ellipse cx="285" cy="406" rx="255" ry="20" fill="#efe7d8"/>

      <!-- ===== the house ===== -->
      <!-- house body -->
      <rect x="150" y="208" width="300" height="170" fill="#fffdf8" stroke="#8a6a4f" stroke-width="5"/>
      <!-- roof plane (asphalt) -->
      <path d="M132 210 L300 96 L468 210 Z" fill="#b9b1a3" stroke="#8a6a4f" stroke-width="5" stroke-linejoin="round"/>
      <!-- shingle courses on the roof -->
      <g stroke="#8a6a4f" stroke-width="2" opacity="0.55">
        <path d="M168 184 L300 94 L432 184" fill="none"/>
        <path d="M150 196 L300 96 L450 196" fill="none"/>
        <path d="M186 172 L300 92 L414 172" fill="none"/>
      </g>
      <g fill="#a59c8d" opacity="0.7">
        <rect x="206" y="158" width="18" height="9" rx="1"/>
        <rect x="244" y="172" width="18" height="9" rx="1"/>
        <rect x="338" y="172" width="18" height="9" rx="1"/>
        <rect x="376" y="158" width="18" height="9" rx="1"/>
      </g>
      <!-- ridge line -->
      <path d="M132 210 L300 96 L468 210" fill="none" stroke="#8a6a4f" stroke-width="3" opacity="0.6"/>

      <!-- MISSING shingle (dark gap) -->
      <rect x="262" y="150" width="26" height="16" rx="2" fill="#8a6a4f"/>
      <circle cx="275" cy="138" r="11" fill="none" stroke="#d9663f" stroke-width="3"/>
      <line x1="283" y1="146" x2="294" y2="158" stroke="#d9663f" stroke-width="3" stroke-linecap="round"/>

      <!-- CURLING shingles -->
      <path d="M320 168 q10 -10 22 -4 q-4 8 -12 8 q-2 4 -10 -4 z" fill="#8a6a4f"/>
      <path d="M340 158 q9 -9 20 -3" fill="none" stroke="#8a6a4f" stroke-width="4" stroke-linecap="round"/>
      <circle cx="344" cy="160" r="11" fill="none" stroke="#d9663f" stroke-width="3"/>
      <line x1="352" y1="168" x2="363" y2="180" stroke="#d9663f" stroke-width="3" stroke-linecap="round"/>

      <!-- chimney with damaged flashing -->
      <rect x="372" y="118" width="34" height="58" fill="#c96f4a"/>
      <rect x="368" y="114" width="42" height="10" rx="2" fill="#b35a3a"/>
      <g stroke="#8a6a4f" stroke-width="1.6" opacity="0.6">
        <line x1="372" y1="132" x2="406" y2="132"/>
        <line x1="372" y1="146" x2="406" y2="146"/>
        <line x1="372" y1="160" x2="406" y2="160"/>
        <line x1="383" y1="124" x2="383" y2="176"/>
        <line x1="395" y1="124" x2="395" y2="176"/>
      </g>
      <!-- flashing at the chimney base, cracked -->
      <path d="M366 176 l44 0 l8 8 l-60 0 z" fill="#7fb3c8"/>
      <path d="M384 178 l2 8" stroke="#d9663f" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="372" cy="184" r="10" fill="none" stroke="#d9663f" stroke-width="3"/>

      <!-- door & windows -->
      <rect x="220" y="296" width="50" height="82" rx="2" fill="#5e9a78"/>
      <circle cx="260" cy="338" r="3" fill="#e0a93d"/>
      <rect x="328" y="244" width="56" height="48" rx="2" fill="#dce8ee" stroke="#8a6a4f" stroke-width="4"/>
      <line x1="356" y1="244" x2="356" y2="292" stroke="#8a6a4f" stroke-width="3"/>
      <line x1="328" y1="268" x2="384" y2="268" stroke="#8a6a4f" stroke-width="3"/>
      <!-- gutter along the eave -->
      <rect x="148" y="206" width="304" height="9" rx="3" fill="#8a6a4f" opacity="0.8"/>

      <!-- ===== ladder leaned safely at the eave (no one on it) ===== -->
      <g stroke="#c9a06b" stroke-width="6" stroke-linecap="round">
        <line x1="92" y1="380" x2="150" y2="206"/>
        <line x1="112" y1="380" x2="170" y2="206"/>
      </g>
      <g stroke="#c9a06b" stroke-width="4" stroke-linecap="round">
        <line x1="106" y1="356" x2="160" y2="356"/>
        <line x1="111" y1="332" x2="163" y2="332"/>
        <line x1="116" y1="308" x2="166" y2="308"/>
        <line x1="121" y1="284" x2="167" y2="284"/>
        <line x1="126" y1="260" x2="168" y2="260"/>
        <line x1="131" y1="236" x2="166" y2="236"/>
      </g>
      <!-- ladder feet on firm ground -->
      <rect x="88" y="378" width="14" height="6" rx="2" fill="#8a6a4f"/>
      <rect x="108" y="378" width="14" height="6" rx="2" fill="#8a6a4f"/>

      <!-- ===== person on the GROUND with binoculars looking up ===== -->
      <!-- legs -->
      <path d="M486 380 l-6 -44" stroke="#8a6a4f" stroke-width="11" fill="none" stroke-linecap="round"/>
      <path d="M500 380 l4 -44" stroke="#8a6a4f" stroke-width="11" fill="none" stroke-linecap="round"/>
      <!-- shoes -->
      <path d="M476 380 l16 0" stroke="#33393b" stroke-width="7" stroke-linecap="round"/>
      <path d="M500 380 l16 0" stroke="#33393b" stroke-width="7" stroke-linecap="round"/>
      <!-- torso, leaning back to look up -->
      <path d="M492 338 q-6 -34 6 -54" stroke="#3e7c59" stroke-width="20" fill="none" stroke-linecap="round"/>
      <!-- head tilted up -->
      <circle cx="504" cy="276" r="15" fill="#e8b48f"/>
      <path d="M491 270 q13 -12 26 -2" fill="none" stroke="#8a6a4f" stroke-width="6" stroke-linecap="round"/>
      <!-- arms up holding binoculars -->
      <path d="M494 296 q-12 -14 -8 -28" stroke="#3e7c59" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M504 294 q6 -16 -2 -30" stroke="#3e7c59" stroke-width="10" fill="none" stroke-linecap="round"/>
      <!-- binoculars at the eyes -->
      <rect x="478" y="258" width="14" height="13" rx="3" fill="#2c5a40"/>
      <rect x="494" y="258" width="14" height="13" rx="3" fill="#2c5a40"/>
      <rect x="490" y="261" width="6" height="6" fill="#35684c"/>
      <circle cx="485" cy="271" r="3" fill="#7fb3c8"/>
      <circle cx="501" cy="271" r="3" fill="#7fb3c8"/>
      <!-- sight-lines from binoculars up to the roof problems -->
      <g stroke="#e0a93d" stroke-width="2" stroke-dasharray="5 6" opacity="0.8">
        <line x1="486" y1="266" x2="290" y2="146"/>
        <line x1="486" y1="266" x2="382" y2="180"/>
      </g>

      <!-- a little bush for warmth -->
      <ellipse cx="132" cy="376" rx="22" ry="14" fill="#5e9a78"/>
      <ellipse cx="120" cy="370" rx="14" ry="11" fill="#3e7c59"/>

      <!-- sun -->
      <circle cx="70" cy="62" r="20" fill="#faf0da" stroke="#e0a93d" stroke-width="3"/>
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="70" y1="28" x2="70" y2="36"/>
        <line x1="70" y1="88" x2="70" y2="96"/>
        <line x1="36" y1="62" x2="44" y2="62"/>
        <line x1="96" y1="62" x2="104" y2="62"/>
        <line x1="46" y1="38" x2="51" y2="43"/>
        <line x1="89" y1="81" x2="94" y2="86"/>
      </g>
    </svg>
