<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a worn yoga mat rolled up beside a fresh new mat: the old mat has thin worn-smooth patches and flaking, peeling spots and is rolled loosely, while a bright grippy new mat lies unrolled on a sunlit studio floor next to a water bottle and a folded towel">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>
      <!-- warm sun -->
      <circle cx="486" cy="58" r="26" fill="#f2cf7a"/>
      <g stroke="#e0a93d" stroke-width="3.5" stroke-linecap="round" opacity="0.8">
        <line x1="486" y1="16" x2="486" y2="24"/>
        <line x1="524" y1="58" x2="532" y2="58"/>
        <line x1="513" y1="31" x2="519" y2="25"/>
        <line x1="513" y1="85" x2="519" y2="91"/>
      </g>
      <!-- bright studio floor plank lines -->
      <g stroke="#c9a06b" stroke-width="2" opacity="0.35">
        <line x1="60" y1="366" x2="500" y2="366"/>
        <line x1="60" y1="384" x2="500" y2="384"/>
      </g>
      <!-- clean glow under the new mat -->
      <ellipse cx="300" cy="356" rx="210" ry="42" fill="#e3efe8"/>

      <!-- NEW MAT unrolled, fresh & grippy -->
      <path d="M96 348 L430 322 L494 346 L160 372 Z" fill="#5e9a78"/>
      <path d="M96 348 L430 322 L434 340 L100 366 Z" fill="#3e7c59"/>
      <!-- fresh grippy texture dots -->
      <g fill="#2c5a40" opacity="0.45">
        <circle cx="150" cy="346" r="2"/>
        <circle cx="200" cy="342" r="2"/>
        <circle cx="250" cy="338" r="2"/>
        <circle cx="300" cy="335" r="2"/>
        <circle cx="350" cy="332" r="2"/>
        <circle cx="400" cy="329" r="2"/>
        <circle cx="175" cy="356" r="2"/>
        <circle cx="275" cy="349" r="2"/>
        <circle cx="375" cy="342" r="2"/>
      </g>
      <!-- "new" sparkle on the fresh mat -->
      <g stroke="#fffdf8" stroke-width="2.6" stroke-linecap="round">
        <path d="M330 332 l0 10 M325 337 l10 0"/>
      </g>
      <text x="360" y="360" font-size="11" fill="#2c5a40" font-weight="700">fresh grip</text>

      <!-- OLD MAT rolled up, worn -->
      <!-- roll body -->
      <path d="M108 232 q-38 44 0 88 l150 0 q-38 -44 0 -88 z" fill="#b9b1a3"/>
      <ellipse cx="108" cy="276" rx="18" ry="44" fill="#8a6a4f"/>
      <ellipse cx="108" cy="276" rx="10" ry="30" fill="#6b5844"/>
      <!-- loose worn end flap flopping down -->
      <path d="M258 232 q26 6 40 28 q-30 -2 -44 12 z" fill="#c9b7a6"/>
      <!-- worn-smooth thin patches on the roll -->
      <ellipse cx="160" cy="260" rx="20" ry="12" fill="#d8cfbe" opacity="0.8"/>
      <ellipse cx="205" cy="290" rx="16" ry="10" fill="#d8cfbe" opacity="0.75"/>
      <!-- flaking / peeling bits -->
      <path d="M188 240 q6 -6 14 -3 l-3 8 z" fill="#c96f4a" opacity="0.85"/>
      <path d="M225 252 q7 -4 13 1 l-5 7 z" fill="#d9663f" opacity="0.8"/>
      <g fill="#8a6a4f" opacity="0.8">
        <circle cx="176" cy="322" r="2.4"/>
        <circle cx="198" cy="326" r="2"/>
        <circle cx="220" cy="320" r="2.6"/>
        <circle cx="150" cy="326" r="1.8"/>
      </g>
      <!-- little shed crumbs on the floor -->
      <g fill="#b9b1a3" opacity="0.7">
        <circle cx="140" cy="338" r="2.2"/>
        <circle cx="234" cy="336" r="2"/>
        <circle cx="188" cy="340" r="1.6"/>
      </g>
      <text x="120" y="356" font-size="11" fill="#c96f4a" font-weight="700">worn &amp; flaking</text>

      <!-- water bottle -->
      <rect x="452" y="286" width="34" height="66" rx="12" fill="#7fb3c8"/>
      <rect x="452" y="300" width="34" height="30" rx="4" fill="#9cc3d4" opacity="0.7"/>
      <rect x="460" y="272" width="18" height="16" rx="4" fill="#5e9a78"/>
      <rect x="463" y="264" width="12" height="10" rx="3" fill="#3e7c59"/>

      <!-- folded towel -->
      <path d="M388 330 h68 l-6 26 h-56 z" fill="#dce8ee"/>
      <path d="M388 330 h68 l-4 9 h-60 z" fill="#c7d7e0"/>
      <g stroke="#9cc3d4" stroke-width="1.8">
        <line x1="402" y1="344" x2="446" y2="344"/>
        <line x1="400" y1="350" x2="444" y2="350"/>
      </g>

      <!-- small plant for warmth -->
      <path d="M508 356 h26 l-4 26 h-18 z" fill="#c96f4a"/>
      <path d="M520 356 q-3 -20 -12 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M520 356 q4 -18 14 -24" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="505" cy="324" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 505 324)"/>
      <ellipse cx="535" cy="328" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 535 328)"/>
    </svg>
