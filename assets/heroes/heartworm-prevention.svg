<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Reassuring illustration of a happy dog gently taking a heart-shaped chewable tablet from its owner's hand, a wall calendar behind them with one day each month circled for the monthly dose, a framed vet record with a green check on the wall, and a small mosquito drawn faintly in the corner">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- wall calendar behind, monthly dose marked -->
      <rect x="36" y="38" width="104" height="96" rx="8" fill="#fffdf8" stroke="#b9b1a3" stroke-width="4"/>
      <rect x="36" y="38" width="104" height="22" rx="8" fill="#3e7c59"/>
      <rect x="36" y="54" width="104" height="6" fill="#2c5a40"/>
      <rect x="56" y="30" width="6" height="16" rx="3" fill="#8a6a4f"/>
      <rect x="114" y="30" width="6" height="16" rx="3" fill="#8a6a4f"/>
      <g fill="#dce8ee">
        <rect x="46" y="70" width="14" height="11" rx="2"/>
        <rect x="64" y="70" width="14" height="11" rx="2"/>
        <rect x="82" y="70" width="14" height="11" rx="2"/>
        <rect x="100" y="70" width="14" height="11" rx="2"/>
        <rect x="118" y="70" width="14" height="11" rx="2"/>
        <rect x="46" y="86" width="14" height="11" rx="2"/>
        <rect x="64" y="86" width="14" height="11" rx="2"/>
        <rect x="82" y="86" width="14" height="11" rx="2"/>
        <rect x="100" y="86" width="14" height="11" rx="2"/>
        <rect x="118" y="86" width="14" height="11" rx="2"/>
        <rect x="46" y="102" width="14" height="11" rx="2"/>
        <rect x="64" y="102" width="14" height="11" rx="2"/>
      </g>
      <!-- the circled monthly dose day, with a tiny heart inside -->
      <circle cx="71" cy="91.5" r="9" fill="none" stroke="#d9663f" stroke-width="3"/>
      <path d="M71 88 c1.5 -2.6 5 -1.8 5 0.8 c0 2.4 -3 4.2 -5 5.7 c-2 -1.5 -5 -3.3 -5 -5.7 c0 -2.6 3.5 -3.4 5 -0.8 z" fill="#c96f4a"/>
      <text x="40" y="128" font-size="10.5" fill="#6b7376">monthly</text>

      <!-- faint mosquito motif, top right corner -->
      <g opacity="0.5" stroke="#8a6a4f" stroke-width="1.6" fill="none" stroke-linecap="round">
        <ellipse cx="500" cy="64" rx="9" ry="3.5" fill="#b9b1a3" stroke="none"/>
        <circle cx="490" cy="62" r="3" fill="#b9b1a3" stroke="none"/>
        <path d="M509 64 l10 4"/>
        <path d="M506 60 q12 -10 22 -4"/>
        <path d="M506 68 q12 10 22 4"/>
        <path d="M494 66 l-4 8 M498 66 l-2 9 M502 66 l0 9"/>
      </g>

      <!-- framed vet record on the wall, with green check = up to date -->
      <g transform="rotate(4 470 150)">
        <rect x="436" y="110" width="74" height="86" rx="6" fill="#fffdf8" stroke="#b9b1a3" stroke-width="4"/>
        <rect x="458" y="104" width="30" height="10" rx="3" fill="#c96f4a"/>
        <rect x="448" y="128" width="50" height="6" rx="3" fill="#dce8ee"/>
        <rect x="448" y="142" width="50" height="6" rx="3" fill="#dce8ee"/>
        <rect x="448" y="156" width="36" height="6" rx="3" fill="#e9e2d8"/>
        <circle cx="473" cy="178" r="11" fill="#e3efe8"/>
        <path d="M468 178 l4 4 l7 -8" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="442" y="210" font-size="10" fill="#6b7376">tested · negative</text>

      <!-- the owner, kneeling, offering the chewable -->
      <circle cx="392" cy="150" r="28" fill="#f3ddc0"/>
      <path d="M364 144 a28 28 0 0 1 56 0 l-7 0 q-9 -15 -21 -15 q-12 0 -21 15 z" fill="#c96f4a"/>
      <circle cx="384" cy="150" r="3.4" fill="#33393b"/>
      <circle cx="400" cy="150" r="3.4" fill="#33393b"/>
      <path d="M385 162 q7 5 14 0" stroke="#33393b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <rect x="356" y="180" width="72" height="118" rx="20" fill="#5e9a78"/>
      <rect x="378" y="180" width="28" height="14" rx="6" fill="#3e7c59"/>
      <!-- owner's legs kneeling -->
      <rect x="368" y="296" width="22" height="74" rx="10" fill="#2c5a40"/>
      <path d="M392 300 q34 6 64 2" stroke="#2c5a40" stroke-width="22" fill="none" stroke-linecap="round"/>
      <ellipse cx="372" cy="374" rx="17" ry="8" fill="#8a6a4f"/>
      <ellipse cx="452" cy="312" rx="16" ry="8" fill="#8a6a4f"/>
      <!-- owner's arm extending the treat down to the dog -->
      <path d="M360 216 q-30 28 -50 50" stroke="#5e9a78" stroke-width="18" fill="none" stroke-linecap="round"/>
      <circle cx="308" cy="270" r="11" fill="#f3ddc0"/>
      <!-- heart-shaped chewable in the owner's fingertips -->
      <path d="M300 268 c2 -4 7.5 -2.8 7.5 1.2 c0 3.6 -4.5 6.4 -7.5 8.6 c-3 -2.2 -7.5 -5 -7.5 -8.6 c0 -4 5.5 -5.2 7.5 -1.2 z" fill="#d98e3b"/>

      <!-- the happy dog, reaching up for the chewable -->
      <ellipse cx="190" cy="320" rx="64" ry="46" fill="#c9a06b"/>
      <ellipse cx="148" cy="332" rx="26" ry="34" fill="#b98c54"/>
      <!-- front legs -->
      <rect x="170" y="320" width="18" height="62" rx="9" fill="#c9a06b"/>
      <rect x="200" y="320" width="18" height="62" rx="9" fill="#c9a06b"/>
      <ellipse cx="179" cy="382" rx="12" ry="7" fill="#b98c54"/>
      <ellipse cx="209" cy="382" rx="12" ry="7" fill="#b98c54"/>
      <!-- happy wagging tail -->
      <path d="M250 300 q34 -8 40 -34" stroke="#c9a06b" stroke-width="14" fill="none" stroke-linecap="round"/>
      <!-- head, tilted up eagerly toward the treat -->
      <circle cx="222" cy="248" r="42" fill="#c9a06b"/>
      <ellipse cx="188" cy="234" rx="14" ry="26" fill="#8a6a4f" transform="rotate(24 188 234)"/>
      <ellipse cx="256" cy="234" rx="14" ry="26" fill="#8a6a4f" transform="rotate(-24 256 234)"/>
      <!-- muzzle pointed up -->
      <ellipse cx="232" cy="268" rx="18" ry="13" fill="#fffdf8"/>
      <circle cx="240" cy="262" r="6" fill="#33393b"/>
      <path d="M226 246 q4 -3 9 0" stroke="#33393b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M250 246 q4 -3 9 0" stroke="#33393b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="232" cy="248" r="4" fill="#33393b"/>
      <circle cx="256" cy="248" r="4" fill="#33393b"/>
      <!-- happy open-mouth smile -->
      <path d="M226 272 q10 9 22 2" stroke="#33393b" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M232 276 q6 5 12 1" fill="#c96f4a"/>
      <!-- collar with a heart tag -->
      <path d="M194 282 q28 14 56 0" stroke="#3e7c59" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M222 290 c1.6 -2.8 5.5 -2 5.5 0.9 c0 2.6 -3.3 4.6 -5.5 6.2 c-2.2 -1.6 -5.5 -3.6 -5.5 -6.2 c0 -2.9 3.9 -3.7 5.5 -0.9 z" fill="#e0a93d"/>

      <!-- small reassuring greenery in the foreground -->
      <circle cx="510" cy="392" r="14" fill="#5e9a78"/>
      <circle cx="530" cy="396" r="10" fill="#3e7c59"/>
    </svg>
