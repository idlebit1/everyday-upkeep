<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of cleaning a camera sensor: a mirrorless camera body sits on a clean desk with its lens removed and set aside, exposing the square sensor inside the lens mount, a red rocket air blower is aimed at the open sensor, sensor swabs and a small bottle of cleaning fluid lie nearby, and a small inset compares a blue-sky photo speckled with dark dust spots against a clean version">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- camera body -->
      <rect x="118" y="150" width="240" height="150" rx="16" fill="#8a6a4f"/>
      <rect x="118" y="150" width="240" height="40" rx="16" fill="#b9b1a3"/>
      <!-- top plate details: mode dial + shutter button -->
      <circle cx="318" cy="168" r="16" fill="#5e9a78"/>
      <circle cx="318" cy="168" r="7" fill="#3e7c59"/>
      <rect x="150" y="158" width="40" height="14" rx="5" fill="#efe7d8"/>
      <circle cx="206" cy="165" r="7" fill="#d9663f"/>
      <!-- viewfinder hump -->
      <rect x="210" y="128" width="56" height="26" rx="6" fill="#b9b1a3"/>
      <!-- grip -->
      <rect x="118" y="190" width="40" height="110" rx="14" fill="#6b5440"/>

      <!-- lens mount with exposed sensor -->
      <circle cx="262" cy="232" r="62" fill="#efe7d8"/>
      <circle cx="262" cy="232" r="62" fill="none" stroke="#6b5440" stroke-width="6"/>
      <!-- mount index dots / contacts -->
      <g fill="#c9a06b">
        <circle cx="262" cy="178" r="3.5"/>
        <circle cx="216" cy="232" r="3"/>
        <circle cx="308" cy="232" r="3"/>
      </g>
      <!-- the sensor itself, a slightly reflective rectangle -->
      <rect x="230" y="206" width="64" height="48" rx="4" fill="#3e7c59"/>
      <rect x="230" y="206" width="64" height="48" rx="4" fill="#2c5a40" opacity="0.4"/>
      <!-- bluish sensor sheen -->
      <path d="M236 250 l40 -40" stroke="#7fb3c8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <path d="M250 250 l30 -30" stroke="#dce8ee" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
      <!-- a couple of dust specks on the sensor -->
      <circle cx="252" cy="224" r="2.4" fill="#33393b"/>
      <circle cx="276" cy="240" r="2" fill="#33393b"/>

      <!-- the removed lens set aside, rear cap off -->
      <g transform="translate(372 250)">
        <rect x="0" y="0" width="86" height="58" rx="12" fill="#6b5440"/>
        <rect x="0" y="0" width="86" height="22" rx="12" fill="#8a6a4f"/>
        <ellipse cx="43" cy="34" rx="26" ry="18" fill="#b9b1a3"/>
        <ellipse cx="43" cy="34" rx="17" ry="12" fill="#7fb3c8" opacity="0.8"/>
        <ellipse cx="38" cy="29" rx="5" ry="3.5" fill="#dce8ee"/>
      </g>
      <text x="378" y="326" font-size="11" fill="#6b7376">lens off</text>

      <!-- rocket blower aimed at the sensor -->
      <g transform="rotate(-18 120 360)">
        <ellipse cx="92" cy="362" rx="40" ry="32" fill="#c96f4a"/>
        <ellipse cx="78" cy="352" rx="14" ry="10" fill="#d9663f" opacity="0.7"/>
        <!-- one-way intake valve nub at the tail -->
        <circle cx="56" cy="378" r="6" fill="#6b5440"/>
        <!-- nozzle pointing toward the mount -->
        <path d="M128 350 l54 -16 l0 16 l-54 14 z" fill="#a8542f"/>
        <rect x="178" y="332" width="16" height="22" rx="4" fill="#6b5440"/>
      </g>
      <!-- puff of air toward the sensor -->
      <g stroke="#7fb3c8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.7">
        <path d="M214 296 q14 -6 26 -2"/>
        <path d="M218 308 q16 -4 28 2"/>
      </g>
      <text x="96" y="408" font-size="11" fill="#c96f4a" font-weight="700">no contact — just air</text>

      <!-- sensor swabs lying nearby -->
      <g transform="rotate(8 60 196)">
        <rect x="36" y="190" width="78" height="10" rx="3" fill="#dce8ee"/>
        <rect x="36" y="190" width="20" height="10" rx="3" fill="#fffdf8"/>
        <rect x="110" y="188" width="10" height="14" rx="3" fill="#5e9a78"/>
      </g>
      <g transform="rotate(-4 60 214)">
        <rect x="40" y="210" width="78" height="10" rx="3" fill="#cdd9de"/>
        <rect x="40" y="210" width="20" height="10" rx="3" fill="#fffdf8"/>
        <rect x="114" y="208" width="10" height="14" rx="3" fill="#3e7c59"/>
      </g>
      <text x="40" y="240" font-size="11" fill="#6b7376">sensor swabs</text>

      <!-- small bottle of sensor fluid -->
      <rect x="438" y="150" width="34" height="58" rx="6" fill="#dce8ee"/>
      <rect x="438" y="150" width="34" height="20" rx="6" fill="#9cc3d4"/>
      <rect x="446" y="138" width="18" height="16" rx="3" fill="#5e9a78"/>
      <rect x="444" y="176" width="22" height="22" rx="3" fill="#fffdf8" opacity="0.85"/>
      <path d="M449 182 l12 0 M449 188 l8 0" stroke="#7fb3c8" stroke-width="1.6" stroke-linecap="round"/>

      <!-- inset: dusty sky vs clean sky comparison, top right -->
      <g transform="translate(404 18)">
        <rect x="0" y="0" width="142" height="74" rx="8" fill="#fffdf8" stroke="#b9b1a3" stroke-width="3"/>
        <!-- left half: dusty sky -->
        <rect x="8" y="8" width="60" height="58" rx="4" fill="#7fb3c8"/>
        <g fill="#33393b" opacity="0.75">
          <circle cx="22" cy="22" r="3.2"/>
          <circle cx="44" cy="18" r="2.6"/>
          <circle cx="32" cy="40" r="3"/>
          <circle cx="54" cy="48" r="2.4"/>
          <circle cx="20" cy="54" r="2.2"/>
        </g>
        <text x="10" y="62" font-size="8.5" fill="#fffdf8" font-weight="700">dusty</text>
        <!-- right half: clean sky -->
        <rect x="74" y="8" width="60" height="58" rx="4" fill="#7fb3c8"/>
        <text x="78" y="62" font-size="8.5" fill="#fffdf8" font-weight="700">clean</text>
        <g stroke="#2c5a40" stroke-width="2.2" stroke-linecap="round">
          <path d="M118 24 l0 8 M114 28 l8 0"/>
        </g>
      </g>
    </svg>
