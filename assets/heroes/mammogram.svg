<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="A warm, reassuring breast-imaging clinic scene: a friendly technologist stands beside a screening machine, a screening-appointment card and a results letter sit on a small table, a calendar on the wall shows a circled reminder, a small heart with a checkmark adds a supportive touch, and a leafy plant softens the room">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- warm back wall panel -->
      <rect x="60" y="40" width="440" height="330" rx="14" fill="#fbf8f2"/>
      <rect x="60" y="40" width="440" height="330" rx="14" fill="none" stroke="#e9e2d8" stroke-width="4"/>

      <!-- calendar reminder on the wall -->
      <rect x="86" y="70" width="96" height="96" rx="8" fill="#fffdf8" stroke="#8a6a4f" stroke-width="4"/>
      <rect x="86" y="70" width="96" height="22" rx="8" fill="#3e7c59"/>
      <rect x="86" y="82" width="96" height="10" fill="#3e7c59"/>
      <rect x="104" y="62" width="8" height="16" rx="4" fill="#8a6a4f"/>
      <rect x="156" y="62" width="8" height="16" rx="4" fill="#8a6a4f"/>
      <!-- grid dots -->
      <g fill="#cdd9de">
        <circle cx="102" cy="108" r="3"/><circle cx="118" cy="108" r="3"/><circle cx="134" cy="108" r="3"/><circle cx="150" cy="108" r="3"/><circle cx="166" cy="108" r="3"/>
        <circle cx="102" cy="126" r="3"/><circle cx="118" cy="126" r="3"/><circle cx="150" cy="126" r="3"/><circle cx="166" cy="126" r="3"/>
        <circle cx="102" cy="144" r="3"/><circle cx="118" cy="144" r="3"/><circle cx="134" cy="144" r="3"/><circle cx="166" cy="144" r="3"/>
      </g>
      <!-- circled reminder day -->
      <circle cx="134" cy="126" r="9" fill="none" stroke="#d9663f" stroke-width="3"/>

      <!-- supportive heart-with-check motif on the wall -->
      <g transform="translate(392 78)">
        <path d="M28 44 C6 26 8 6 24 6 C32 6 28 14 28 14 C28 14 24 6 32 6 C48 6 50 26 28 44 Z" fill="#e3efe8" stroke="#3e7c59" stroke-width="3"/>
        <path d="M18 24 l7 7 l13 -15" fill="none" stroke="#3e7c59" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- the imaging machine (soft, non-clinical) -->
      <rect x="330" y="150" width="120" height="200" rx="12" fill="#dce8ee"/>
      <rect x="330" y="150" width="120" height="200" rx="12" fill="none" stroke="#9cc3d4" stroke-width="4"/>
      <!-- machine head / arm -->
      <rect x="352" y="176" width="76" height="16" rx="6" fill="#9cc3d4"/>
      <rect x="382" y="192" width="16" height="30" rx="4" fill="#7fb3c8"/>
      <!-- gentle compression plates -->
      <rect x="360" y="222" width="60" height="9" rx="4" fill="#5e9a78"/>
      <rect x="360" y="238" width="60" height="9" rx="4" fill="#3e7c59"/>
      <!-- machine screen with a soft heart -->
      <rect x="348" y="264" width="84" height="60" rx="8" fill="#2c5a40"/>
      <path d="M390 300 c-11 -9 -10 -20 -2 -20 c4 0 2 4 2 4 c0 0 -2 -4 2 -4 c8 0 9 11 -2 20 Z" fill="#e0a93d"/>

      <!-- friendly technologist -->
      <!-- head -->
      <circle cx="196" cy="196" r="26" fill="#e8b48f"/>
      <!-- hair -->
      <path d="M170 190 q4 -34 26 -34 q22 0 26 34 q-8 -14 -26 -14 q-18 0 -26 14 Z" fill="#8a6a4f"/>
      <!-- friendly smile + eyes -->
      <g stroke="#5a4636" stroke-width="2.4" stroke-linecap="round" fill="none">
        <path d="M186 192 q0 3 0 4"/>
        <path d="M206 192 q0 3 0 4"/>
        <path d="M188 206 q8 6 16 0"/>
      </g>
      <!-- body / scrubs (accent green) -->
      <path d="M160 300 q0 -66 36 -66 q36 0 36 66 Z" fill="#3e7c59"/>
      <!-- collar -->
      <path d="M186 236 l10 12 l10 -12" fill="none" stroke="#2c5a40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- lanyard / ID badge -->
      <path d="M196 240 l0 30" stroke="#e0a93d" stroke-width="3"/>
      <rect x="188" y="268" width="18" height="24" rx="3" fill="#fffdf8" stroke="#e0a93d" stroke-width="2"/>
      <!-- welcoming arm gesturing toward the machine -->
      <path d="M228 268 q40 -8 66 -30" stroke="#3e7c59" stroke-width="14" fill="none" stroke-linecap="round"/>
      <ellipse cx="298" cy="238" rx="12" ry="9" fill="#e8b48f"/>

      <!-- small table with appointment card + results letter -->
      <rect x="86" y="318" width="150" height="12" rx="4" fill="#b9b1a3"/>
      <rect x="96" y="330" width="10" height="34" rx="3" fill="#8a6a4f"/>
      <rect x="216" y="330" width="10" height="34" rx="3" fill="#8a6a4f"/>
      <!-- results letter (envelope) -->
      <g transform="rotate(-6 120 300)">
        <rect x="96" y="286" width="70" height="46" rx="5" fill="#fffdf8" stroke="#cdd9de" stroke-width="3"/>
        <path d="M96 290 l35 24 l35 -24" fill="none" stroke="#9cc3d4" stroke-width="3"/>
      </g>
      <!-- screening-appointment card -->
      <g transform="rotate(7 190 300)">
        <rect x="160" y="284" width="72" height="48" rx="6" fill="#e3efe8" stroke="#3e7c59" stroke-width="3"/>
        <rect x="170" y="294" width="42" height="6" rx="3" fill="#5e9a78"/>
        <rect x="170" y="306" width="52" height="5" rx="2.5" fill="#9cc3d4"/>
        <rect x="170" y="316" width="30" height="5" rx="2.5" fill="#9cc3d4"/>
        <circle cx="216" cy="318" r="7" fill="#e0a93d"/>
        <path d="M212 318 l3 3 l5 -6" fill="none" stroke="#fffdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- leafy plant for warmth -->
      <path d="M470 344 h34 l-5 30 h-24 z" fill="#c96f4a"/>
      <path d="M487 344 q-4 -26 -16 -34" stroke="#3e7c59" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <path d="M487 344 q5 -24 18 -30" stroke="#3e7c59" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="468" cy="304" rx="8" ry="13" fill="#5e9a78" transform="rotate(-30 468 304)"/>
      <ellipse cx="506" cy="308" rx="8" ry="13" fill="#3e7c59" transform="rotate(28 506 308)"/>
      <ellipse cx="487" cy="296" rx="7" ry="12" fill="#5e9a78"/>
    </svg>
