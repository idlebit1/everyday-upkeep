<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a person raking fallen autumn leaves into a pile on a green lawn, with a bare-branched tree dropping orange and gold leaves, a wooden fence, and a low autumn sun in the background">
      <ellipse cx="290" cy="402" rx="250" ry="22" fill="#efe7d8"/>
      <circle cx="478" cy="64" r="24" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="4" stroke-linecap="round">
        <line x1="478" y1="24" x2="478" y2="34"/>
        <line x1="478" y1="94" x2="478" y2="104"/>
        <line x1="438" y1="64" x2="448" y2="64"/>
        <line x1="508" y1="64" x2="518" y2="64"/>
        <line x1="449" y1="35" x2="456" y2="42"/>
        <line x1="507" y1="86" x2="500" y2="79"/>
      </g>
      <ellipse cx="120" cy="78" rx="46" ry="22" fill="#dce8ee"/>
      <ellipse cx="170" cy="92" rx="30" ry="16" fill="#dce8ee"/>
