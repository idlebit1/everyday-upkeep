        <rect x="76" y="196" width="14" height="74" rx="4"/>
        <rect x="116" y="196" width="14" height="74" rx="4"/>
        <rect x="156" y="196" width="14" height="74" rx="4"/>
        <rect x="196" y="196" width="14" height="74" rx="4"/>
      </g>
      <rect x="28" y="208" width="190" height="10" rx="5" fill="#8a6a4f"/>
      <rect x="28" y="240" width="190" height="10" rx="5" fill="#8a6a4f"/>
      <!-- bare autumn tree -->
      <g>
        <rect x="426" y="196" width="16" height="92" rx="5" fill="#8a6a4f"/>
        <path d="M434 210 q-24 -22 -42 -30 M434 220 q26 -18 46 -22 M434 200 q-10 -26 -6 -44 M434 204 q18 -22 34 -28" stroke="#8a6a4f" stroke-width="6" fill="none" stroke-linecap="round"/>
        <circle cx="392" cy="178" r="10" fill="#c96f4a"/>
        <circle cx="466" cy="196" r="10" fill="#e0a93d"/>
        <circle cx="430" cy="156" r="10" fill="#d98e3b"/>
        <circle cx="408" cy="166" r="8" fill="#d9663f"/>
        <circle cx="452" cy="170" r="8" fill="#e0a93d"/>
      </g>
      <!-- shrubs -->
      <circle cx="262" cy="248" r="28" fill="#2c5a40"/>
      <circle cx="296" cy="258" r="22" fill="#3e7c59"/>
      <!-- lawn -->
      <path d="M10 290 Q280 262 550 290 L550 392 Q280 412 10 392 Z" fill="#3e7c59"/>
      <path d="M10 322 Q280 298 550 322 L550 392 Q280 412 10 392 Z" fill="#5e9a78" opacity="0.45"/>
      <!-- leaf pile by the rake -->
      <ellipse cx="178" cy="378" rx="68" ry="24" fill="#d98e3b"/>
      <ellipse cx="178" cy="370" rx="52" ry="18" fill="#e0a93d"/>
      <g fill="#c96f4a">
        <ellipse cx="150" cy="372" rx="9" ry="5" transform="rotate(-20 150 372)"/>
        <ellipse cx="200" cy="376" rx="9" ry="5" transform="rotate(18 200 376)"/>
        <ellipse cx="176" cy="362" rx="9" ry="5" transform="rotate(-6 176 362)"/>
      </g>
      <g fill="#d9663f">
        <ellipse cx="166" cy="382" rx="8" ry="4.5" transform="rotate(12 166 382)"/>
        <ellipse cx="194" cy="368" rx="8" ry="4.5" transform="rotate(-14 194 368)"/>
      </g>
      <!-- scattered falling leaves -->
      <g>
        <ellipse cx="360" cy="232" rx="8" ry="4.5" fill="#e0a93d" transform="rotate(-28 360 232)"/>
        <ellipse cx="396" cy="276" rx="8" ry="4.5" fill="#c96f4a" transform="rotate(26 396 276)"/>
        <ellipse cx="332" cy="300" rx="7" ry="4" fill="#d98e3b" transform="rotate(-12 332 300)"/>
        <ellipse cx="430" cy="320" rx="7" ry="4" fill="#d9663f" transform="rotate(20 430 320)"/>
        <ellipse cx="300" cy="344" rx="7" ry="4" fill="#e0a93d" transform="rotate(-22 300 344)"/>
        <ellipse cx="470" cy="356" rx="7" ry="4" fill="#c96f4a" transform="rotate(16 470 356)"/>
