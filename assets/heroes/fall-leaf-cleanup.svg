        <path d="M276 234 q12 -12 24 0 q-2 -8 -12 -8 q-10 0 -12 8" fill="#8a6a4f"/>
        <path d="M282 286 L276 318 L308 318 L302 286 Z" fill="#c96f4a"/>
        <rect x="277" y="316" width="12" height="34" rx="4" fill="#33393b"/>
        <rect x="295" y="316" width="12" height="34" rx="4" fill="#33393b"/>
        <!-- arms reaching down to the rake -->
        <line x1="286" y1="290" x2="240" y2="328" stroke="#3e7c59" stroke-width="9" stroke-linecap="round"/>
        <line x1="300" y1="290" x2="248" y2="320" stroke="#3e7c59" stroke-width="9" stroke-linecap="round"/>
      </g>
      <!-- rake -->
      <g>
        <line x1="244" y1="326" x2="208" y2="372" stroke="#8a6a4f" stroke-width="7" stroke-linecap="round"/>
        <path d="M190 388 L224 360" stroke="#b9b1a3" stroke-width="4" stroke-linecap="round"/>
        <g stroke="#b9b1a3" stroke-width="3" stroke-linecap="round">
          <line x1="192" y1="386" x2="186" y2="394"/>
          <line x1="200" y1="380" x2="195" y2="389"/>
          <line x1="208" y1="374" x2="204" y2="384"/>
          <line x1="216" y1="368" x2="213" y2="378"/>
          <line x1="224" y1="362" x2="222" y2="372"/>
        </g>
      </g>
      <circle cx="120" cy="392" r="13" fill="#5e9a78"/>
      <circle cx="142" cy="396" r="10" fill="#3e7c59"/>
    </svg>
