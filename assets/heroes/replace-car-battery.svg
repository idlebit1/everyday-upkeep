<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of an open car hood showing the engine bay with a fresh battery being lowered into its tray, a wrench loosening the negative terminal first, and a swollen, corroded old battery set aside on the ground">
      <ellipse cx="280" cy="402" rx="250" ry="22" fill="#efe7d8"/>
      <!-- engine bay slab -->
      <rect x="56" y="150" width="448" height="118" rx="18" fill="#3e7c59"/>
      <rect x="56" y="244" width="448" height="24" rx="10" fill="#2c5a40"/>
      <!-- engine valve-cover ribs to the left -->
      <g stroke="#5e9a78" stroke-width="6" stroke-linecap="round">
        <line x1="92" y1="170" x2="92" y2="232"/>
        <line x1="112" y1="170" x2="112" y2="232"/>
        <line x1="132" y1="170" x2="132" y2="232"/>
        <line x1="152" y1="170" x2="152" y2="232"/>
      </g>
      <!-- raised hood overhead -->
      <path d="M90 96 q190 -48 392 6 l0 18 q-196 -50 -384 -4 z" fill="#5e9a78"/>
      <path d="M90 96 q190 -48 392 6" fill="none" stroke="#3e7c59" stroke-width="4"/>
      <!-- battery tray (dark cavity) -->
      <rect x="290" y="150" width="172" height="118" rx="12" fill="#26302c"/>
      <!-- NEW battery being lowered into the tray -->
      <g>
        <rect x="306" y="160" width="140" height="92" rx="8" fill="#2c5a40"/>
        <rect x="306" y="160" width="140" height="20" rx="8" fill="#35684c"/>
        <!-- vent caps row -->
        <rect x="318" y="170" width="116" height="10" rx="5" fill="#26302c"/>
        <!-- terminals -->
        <rect x="328" y="148" width="20" height="18" rx="4" fill="#c96f4a"/>
        <text x="338" y="162" font-size="15" font-weight="800" fill="#fffdf8" text-anchor="middle">+</text>
        <rect x="404" y="148" width="20" height="18" rx="4" fill="#7fb3c8"/>
        <text x="414" y="162" font-size="15" font-weight="800" fill="#fffdf8" text-anchor="middle">−</text>
        <!-- label panel -->
        <rect x="324" y="196" width="104" height="42" rx="6" fill="#dce8ee"/>
        <line x1="334" y1="208" x2="418" y2="208" stroke="#7fb3c8" stroke-width="3" stroke-linecap="round"/>
        <line x1="334" y1="220" x2="404" y2="220" stroke="#7fb3c8" stroke-width="3" stroke-linecap="round"/>
        <line x1="334" y1="230" x2="392" y2="230" stroke="#b9b1a3" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- wrench loosening the negative terminal first -->
      <g transform="rotate(-24 430 150)">
        <rect x="424" y="118" width="14" height="60" rx="6" fill="#b9b1a3"/>
        <circle cx="431" cy="118" r="13" fill="#b9b1a3"/>
        <circle cx="431" cy="118" r="6" fill="#26302c"/>
      </g>
      <!-- sparkle on the fresh battery -->
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="376" y1="138" x2="376" y2="148"/>
        <line x1="364" y1="143" x2="370" y2="150"/>
        <line x1="388" y1="143" x2="382" y2="150"/>
      </g>
      <!-- OLD swollen, corroded battery set aside on the floor -->
      <g transform="rotate(-7 150 350)">
        <!-- bulging case sides -->
        <path d="M86 318 q-8 32 0 64 l128 0 q8 -32 0 -64 z" fill="#8a6a4f"/>
        <path d="M86 318 q-8 32 0 64 l128 0 q8 -32 0 -64 z" fill="none" stroke="#6e5333" stroke-width="2.5"/>
        <rect x="86" y="312" width="128" height="12" rx="5" fill="#6e5333"/>
        <!-- old terminals with corrosion fuzz -->
        <rect x="104" y="302" width="18" height="14" rx="3" fill="#5a544a"/>
        <rect x="178" y="302" width="18" height="14" rx="3" fill="#5a544a"/>
        <circle cx="113" cy="300" r="7" fill="#b9b1a3"/>
        <circle cx="106" cy="296" r="4" fill="#dce8ee"/>
        <circle cx="120" cy="297" r="3.5" fill="#dce8ee"/>
        <circle cx="187" cy="300" r="6" fill="#b9b1a3"/>
        <circle cx="192" cy="296" r="3.5" fill="#dce8ee"/>
        <!-- grime streaks -->
        <circle cx="150" cy="352" r="4" fill="#5a544a"/>
        <circle cx="120" cy="364" r="3.5" fill="#5a544a"/>
        <circle cx="184" cy="346" r="3" fill="#5a544a"/>
      </g>
      <text x="150" y="406" font-size="14" font-weight="700" fill="#8a6a4f" text-anchor="middle" transform="rotate(-7 150 406)">5 years, swollen &amp; spent</text>
    </svg>
