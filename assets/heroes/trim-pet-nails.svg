<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a relaxed pet paw with one claw being trimmed by green-handled nail clippers, next to a jar of styptic powder, a bone-shaped treat, and a few more treats on a soft blue mat">
      <ellipse cx="280" cy="398" rx="245" ry="22" fill="#efe7d8"/>
      <circle cx="72" cy="64" r="24" fill="#f2cf7a"/>
      <ellipse cx="470" cy="70" rx="44" ry="20" fill="#dce8ee"/>
      <ellipse cx="430" cy="82" rx="26" ry="14" fill="#dce8ee"/>
      <!-- soft mat -->
      <ellipse cx="262" cy="330" rx="190" ry="58" fill="#dce8ee"/>
      <ellipse cx="262" cy="324" rx="170" ry="48" fill="#bfdce8"/>
      <!-- paw: wrist + main pad -->
      <path d="M180 360 q-14 -86 82 -88 q96 2 82 88 q-6 28 -82 28 q-76 0 -82 -28" fill="#c9a06b"/>
      <ellipse cx="262" cy="320" rx="54" ry="38" fill="#8a6a4f"/>
      <!-- toes -->
      <g>
        <ellipse cx="172" cy="238" rx="26" ry="34" fill="#c9a06b" transform="rotate(-22 172 238)"/>
        <ellipse cx="232" cy="206" rx="26" ry="36" fill="#c9a06b" transform="rotate(-8 232 206)"/>
        <ellipse cx="296" cy="206" rx="26" ry="36" fill="#c9a06b" transform="rotate(8 296 206)"/>
        <ellipse cx="354" cy="238" rx="26" ry="34" fill="#c9a06b" transform="rotate(22 354 238)"/>
      </g>
      <!-- toe pads -->
      <ellipse cx="176" cy="246" rx="13" ry="17" fill="#8a6a4f" transform="rotate(-22 176 246)"/>
      <ellipse cx="234" cy="216" rx="13" ry="18" fill="#8a6a4f" transform="rotate(-8 234 216)"/>
      <ellipse cx="294" cy="216" rx="13" ry="18" fill="#8a6a4f" transform="rotate(8 294 216)"/>
      <ellipse cx="350" cy="246" rx="13" ry="17" fill="#8a6a4f" transform="rotate(22 350 246)"/>
      <!-- claws -->
      <path d="M156 212 q-12 -22 -4 -36 q14 8 18 30 z" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2"/>
      <path d="M226 174 q-4 -24 6 -36 q11 11 8 35 z" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2"/>
      <path d="M292 173 q3 -24 14 -33 q8 13 1 34 z" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2"/>
      <path d="M352 213 q14 -21 8 -36 q-15 7 -20 29 z" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2"/>
      <!-- quick hint inside the claw being trimmed -->
      <path d="M298 172 q3 -14 9 -22 q4 8 1 21 z" fill="#c96f4a" opacity="0.55"/>
      <!-- dashed cut line on that claw -->
      <line x1="294" y1="152" x2="320" y2="142" stroke="#2c5a40" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>
      <!-- clippers -->
      <g transform="rotate(-26 366 116)">
        <rect x="330" y="108" width="46" height="14" rx="7" fill="#7fb3c8"/>
        <path d="M330 115 q-8 -12 4 -16 l8 8 z" fill="#7fb3c8"/>
        <rect x="370" y="98" width="74" height="13" rx="6.5" fill="#3e7c59"/>
        <rect x="370" y="118" width="74" height="13" rx="6.5" fill="#2c5a40"/>
        <circle cx="372" cy="115" r="7" fill="#e0a93d"/>
      </g>
      <!-- sparkle near the cut -->
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="330" y1="128" x2="338" y2="120"/>
        <line x1="338" y1="138" x2="348" y2="136"/>
      </g>
      <!-- styptic powder jar -->
      <rect x="64" y="318" width="56" height="62" rx="9" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2"/>
      <rect x="60" y="306" width="64" height="18" rx="7" fill="#d98e3b"/>
      <rect x="74" y="340" width="36" height="22" rx="4" fill="#fbe9e1"/>
      <circle cx="92" cy="351" r="6" fill="#c96f4a"/>
      <!-- bone treat -->
      <g transform="rotate(-14 462 340)">
        <rect x="432" y="334" width="60" height="13" rx="6.5" fill="#e0a93d"/>
        <circle cx="434" cy="334" r="8" fill="#e0a93d"/>
        <circle cx="434" cy="347" r="8" fill="#e0a93d"/>
        <circle cx="490" cy="334" r="8" fill="#e0a93d"/>
        <circle cx="490" cy="347" r="8" fill="#e0a93d"/>
      </g>
      <!-- treat crumbs -->
      <circle cx="430" cy="378" r="5" fill="#d98e3b"/>
      <circle cx="448" cy="388" r="4" fill="#c96f4a"/>
      <circle cx="118" cy="396" r="5" fill="#d98e3b"/>
      <!-- little plants -->
      <circle cx="508" cy="392" r="13" fill="#5e9a78"/>
      <circle cx="528" cy="396" r="10" fill="#3e7c59"/>
      <circle cx="44" cy="396" r="11" fill="#5e9a78"/>
    </svg>
