<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a kitchen counter with a drip coffee maker running a descaling cycle: pale vinegar solution dripping into the glass carafe with steam rising, a jug of white vinegar and a measuring cup beside the machine, a window with sun, and a small plant at the end of the counter">
      <ellipse cx="290" cy="400" rx="245" ry="22" fill="#efe7d8"/>
      <!-- window with sun -->
      <rect x="48" y="46" width="112" height="118" rx="8" fill="#dce8ee" stroke="#e6dccb" stroke-width="3"/>
      <line x1="104" y1="49" x2="104" y2="161" stroke="#fffdf8" stroke-width="4"/>
      <line x1="51" y1="105" x2="157" y2="105" stroke="#fffdf8" stroke-width="4"/>
      <circle cx="82" cy="80" r="15" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="82" y1="56" x2="82" y2="61"/>
        <line x1="106" y1="80" x2="101" y2="80"/>
        <line x1="99" y1="63" x2="95" y2="67"/>
      </g>
      <rect x="36" y="38" width="136" height="10" rx="5" fill="#8a6a4f"/>
      <!-- counter + cabinets -->
      <rect x="56" y="316" width="448" height="16" rx="6" fill="#c9a06b"/>
      <rect x="76" y="332" width="408" height="62" fill="#b9b1a3"/>
      <rect x="92" y="344" width="180" height="38" rx="5" fill="#8a6a4f"/>
      <rect x="288" y="344" width="180" height="38" rx="5" fill="#8a6a4f"/>
      <circle cx="182" cy="363" r="4" fill="#e0a93d"/>
      <circle cx="378" cy="363" r="4" fill="#e0a93d"/>
      <!-- coffee maker: reservoir tower at back right -->
      <rect x="392" y="158" width="42" height="158" rx="10" fill="#8a6a4f"/>
      <rect x="399" y="182" width="28" height="126" rx="8" fill="#dce8ee"/>
      <!-- 1:1 solution level in the reservoir -->
      <rect x="399" y="238" width="28" height="70" rx="8" fill="#7fb3c8"/>
      <g stroke="#fffdf8" stroke-width="2" stroke-linecap="round">
        <line x1="404" y1="256" x2="422" y2="256"/>
        <line x1="404" y1="278" x2="422" y2="278"/>
      </g>
      <rect x="386" y="148" width="54" height="14" rx="7" fill="#5a4634"/>
      <!-- brew head overhanging the carafe -->
      <rect x="282" y="158" width="124" height="34" rx="10" fill="#8a6a4f"/>
      <rect x="296" y="166" width="62" height="8" rx="4" fill="#c9a06b"/>
      <circle cx="386" cy="175" r="6" fill="#e0a93d"/>
      <!-- machine spine + warmer base -->
      <rect x="376" y="192" width="30" height="100" rx="6" fill="#8a6a4f"/>
      <rect x="276" y="292" width="158" height="24" rx="8" fill="#8a6a4f"/>
      <ellipse cx="328" cy="296" rx="40" ry="5" fill="#5a4634"/>
      <!-- descale drips from the brew head -->
      <g fill="#7fb3c8">
        <circle cx="324" cy="206" r="3.5"/>
        <circle cx="330" cy="222" r="3"/>
        <circle cx="325" cy="238" r="3.5"/>
      </g>
      <!-- carafe with pale descaling solution -->
      <path d="M296 252 l-8 40 h82 l-8 -40 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="3"/>
      <path d="M293 268 l-4 24 h80 l-4 -24 z" fill="#7fb3c8"/>
      <rect x="296" y="244" width="66" height="10" rx="5" fill="#8a6a4f"/>
      <path d="M372 256 q18 8 6 28" stroke="#8a6a4f" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- steam curling off the carafe -->
      <g stroke="#b9b1a3" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M306 232 q-7 -12 0 -24 q7 -12 0 -22"/>
        <path d="M348 230 q7 -12 0 -24 q-7 -12 0 -22"/>
      </g>
      <!-- vinegar jug on the counter, left of the machine -->
      <rect x="196" y="226" width="52" height="90" rx="10" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5"/>
      <rect x="210" y="206" width="24" height="24" rx="5" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5"/>
      <rect x="206" y="198" width="32" height="12" rx="5" fill="#2c5a40"/>
      <rect x="204" y="248" width="36" height="44" rx="6" fill="#3e7c59"/>
      <g stroke="#e3efe8" stroke-width="3" stroke-linecap="round">
        <line x1="212" y1="262" x2="232" y2="262"/>
        <line x1="212" y1="272" x2="226" y2="272"/>
      </g>
      <!-- measuring cup of vinegar -->
      <path d="M140 286 l6 30 h34 l6 -30 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2.5"/>
      <path d="M144 296 l3 20 h32 l3 -20 z" fill="#faf0da"/>
      <path d="M186 290 q14 4 4 18" stroke="#7fb3c8" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- mug waiting at the far left -->
      <rect x="92" y="288" width="34" height="28" rx="6" fill="#c96f4a"/>
      <path d="M126 294 q12 4 0 16" stroke="#c96f4a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- plant at right end of the counter -->
      <path d="M474 296 q-2 -18 -10 -26" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M474 296 q4 -16 12 -22" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="461" cy="266" rx="7" ry="11" fill="#5e9a78" transform="rotate(-28 461 266)"/>
      <ellipse cx="489" cy="270" rx="7" ry="11" fill="#3e7c59" transform="rotate(26 489 270)"/>
      <path d="M462 296 h24 l-4 22 h-16 z" fill="#c96f4a"/>
      <!-- scale flecks rinsing away near the drain-side -->
      <g fill="#b9b1a3">
        <circle cx="262" cy="306" r="2.5"/>
        <circle cx="270" cy="298" r="2"/>
        <circle cx="255" cy="296" r="2"/>
      </g>
      <!-- rug -->
      <ellipse cx="300" cy="404" rx="130" ry="10" fill="#b9b1a3" opacity="0.5"/>
    </svg>
