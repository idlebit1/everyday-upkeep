<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of deep-washing a backpack: a pack is submerged and soaking in a tub of soapy water and being hand-scrubbed with a soft brush, all its pockets emptied and turned out with a removed metal frame set aside on the floor, and to the right the washed pack hangs upside-down to air-dry with water dripping off it">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- back peg rail for the hanging pack -->
      <rect x="360" y="56" width="160" height="9" rx="4" fill="#c9a06b"/>
      <rect x="360" y="65" width="160" height="6" rx="2" fill="#b9b1a3"/>
      <circle cx="440" cy="78" r="7" fill="#8a6a4f"/>
      <rect x="437" y="78" width="6" height="16" rx="3" fill="#8a6a4f"/>

      <!-- LEFT: pack soaking in a tub of soapy water, being scrubbed -->
      <!-- the tub / basin -->
      <path d="M40 244 h230 l-20 130 h-190 z" fill="#7fb3c8"/>
      <path d="M34 236 h242 l-4 14 h-234 z" fill="#9cc3d4"/>
      <!-- soapy water surface line inside the tub -->
      <path d="M52 262 q108 -14 206 0 l-2 12 q-102 12 -202 0 z" fill="#bcdae6" opacity="0.85"/>
      <!-- submerged pack body, lower half under the water -->
      <path d="M92 176 q10 -20 34 -22 l58 0 q24 2 34 22 l8 150 q-8 18 -70 18 q-62 0 -70 -18 z" fill="#3e7c59"/>
      <!-- part of the pack under the waterline shown tinted -->
      <path d="M84 268 q66 14 132 0 l4 58 q-8 18 -70 18 q-62 0 -70 -18 z" fill="#357049" opacity="0.9"/>
      <!-- front pocket -->
      <path d="M116 214 q40 -10 78 0 l-4 46 q-34 8 -70 0 z" fill="#2c5a40"/>
      <!-- straps still attached, looped -->
      <path d="M120 182 q-16 34 -8 92" fill="none" stroke="#2c5a40" stroke-width="9" stroke-linecap="round"/>
      <path d="M188 182 q16 34 8 92" fill="none" stroke="#2c5a40" stroke-width="9" stroke-linecap="round"/>
      <!-- soap suds floating on the water and around the pack -->
      <g>
        <circle cx="70" cy="258" r="8" fill="#fffdf8"/>
        <circle cx="86" cy="252" r="6" fill="#eef4f7"/>
        <circle cx="238" cy="256" r="7" fill="#fffdf8"/>
        <circle cx="222" cy="250" r="5" fill="#eef4f7"/>
        <circle cx="150" cy="248" r="6" fill="#fffdf8"/>
      </g>
      <!-- soft scrub brush working the front panel -->
      <rect x="150" y="150" width="46" height="12" rx="4" fill="#e0a93d" transform="rotate(24 173 156)"/>
      <rect x="150" y="150" width="46" height="5" rx="3" fill="#d98e3b" transform="rotate(24 173 156)"/>
      <g stroke="#8a6a4f" stroke-width="1.8" stroke-linecap="round">
        <line x1="150" y1="176" x2="147" y2="184"/>
        <line x1="158" y1="180" x2="155" y2="188"/>
        <line x1="166" y1="182" x2="163" y2="190"/>
      </g>
      <!-- hand on the brush -->
      <ellipse cx="196" cy="140" rx="15" ry="11" fill="#e8b48f"/>
      <path d="M186 136 q-5 6 -1 13" stroke="#d99c73" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M196 150 q18 -8 40 -6" stroke="#3e7c59" stroke-width="11" fill="none" stroke-linecap="round"/>

      <!-- emptied contents & turned-out pockets on the floor, front-left -->
      <!-- turned-out inner pocket (little pouch showing lining) -->
      <path d="M46 372 q14 -10 30 0 l-2 20 q-13 6 -26 0 z" fill="#dce8ee"/>
      <path d="M46 372 q14 -10 30 0 l-1 6 q-14 5 -28 0 z" fill="#b9b1a3"/>
      <!-- stray contents: pen, receipt, crumbs -->
      <rect x="86" y="384" width="30" height="6" rx="3" fill="#c96f4a" transform="rotate(-12 101 387)"/>
      <path d="M120 378 l13 -3 l4 22 l-13 3 z" fill="#fffdf8" stroke="#e9e2d8" stroke-width="1.4" transform="rotate(14 126 389)"/>
      <g fill="#8a6a4f">
        <circle cx="70" cy="398" r="2.4"/>
        <circle cx="98" cy="400" r="2"/>
        <circle cx="140" cy="396" r="2.6"/>
      </g>

      <!-- the removed metal frame / stays set aside on the floor -->
      <g stroke="#a8aeb0" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M170 352 l0 46"/>
        <path d="M196 352 l0 46"/>
        <path d="M170 356 q13 -6 26 0"/>
        <path d="M170 394 q13 6 26 0"/>
      </g>
      <!-- highlight on the metal frame -->
      <line x1="174" y1="356" x2="174" y2="394" stroke="#cdd9de" stroke-width="1.6" stroke-linecap="round"/>
      <text x="150" y="416" font-size="11" fill="#6b7376" font-weight="700">frame removed</text>

      <!-- RIGHT: washed pack hanging upside-down to air-dry -->
      <!-- hanging loop over the hook (now at the pack's base, since inverted) -->
      <path d="M416 96 q0 -12 10 -12 q10 0 10 12" fill="none" stroke="#5e9a78" stroke-width="5" stroke-linecap="round"/>
      <!-- pack body, upside-down (rounded top now at the bottom) -->
      <path d="M356 116 q8 -18 30 -20 l52 0 q22 2 30 20 l8 150 q-8 18 -64 18 q-56 0 -64 -18 z" fill="#3e7c59" transform="rotate(180 426 200)"/>
      <!-- open zipper mouth at the bottom, airing out -->
      <path d="M392 300 q34 12 68 0 q-34 18 -68 0 z" fill="#dce8ee"/>
      <g stroke="#b9b1a3" stroke-width="2" stroke-linecap="round">
        <line x1="404" y1="302" x2="404" y2="308"/>
        <line x1="422" y1="304" x2="422" y2="310"/>
        <line x1="440" y1="304" x2="440" y2="310"/>
        <line x1="458" y1="302" x2="458" y2="308"/>
      </g>
      <!-- front pocket (now near the top since inverted) -->
      <path d="M396 118 q38 -8 74 0 l-3 42 q-32 8 -68 0 z" fill="#2c5a40" transform="rotate(180 433 139)"/>
      <!-- straps flopping down -->
      <path d="M402 130 q-16 24 -10 52" fill="none" stroke="#2c5a40" stroke-width="9" stroke-linecap="round"/>
      <path d="M450 130 q16 24 10 52" fill="none" stroke="#2c5a40" stroke-width="9" stroke-linecap="round"/>
      <!-- water dripping off the hanging pack -->
      <g fill="#7fb3c8">
        <path d="M410 316 q3 8 0 14 q-3 -6 0 -14 z"/>
        <path d="M440 322 q3 8 0 14 q-3 -6 0 -14 z"/>
      </g>
      <circle cx="410" cy="342" r="3" fill="#7fb3c8" opacity="0.8"/>
      <circle cx="440" cy="348" r="2.6" fill="#7fb3c8" opacity="0.8"/>
      <!-- breeze / drying marks rising from the open mouth -->
      <g stroke="#5e9a78" stroke-width="2.4" stroke-linecap="round" opacity="0.7" fill="none">
        <path d="M414 310 q7 8 0 16"/>
        <path d="M450 310 q7 8 0 16"/>
      </g>

      <!-- bottle of mild soap on the peg rail, right -->
      <rect x="494" y="30" width="24" height="30" rx="5" fill="#5e9a78"/>
      <rect x="498" y="20" width="16" height="12" rx="3" fill="#3e7c59"/>
      <path d="M514 22 l12 -4 l0 5 l-12 4 z" fill="#2c5a40"/>
      <rect x="497" y="40" width="18" height="14" rx="3" fill="#dce8ee" opacity="0.8"/>
    </svg>
