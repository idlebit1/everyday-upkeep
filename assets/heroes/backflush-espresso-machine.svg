<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of backflushing an espresso machine: the group head holds a portafilter fitted with a rubber blind basket, a small scoop of espresso detergent sits beside it, the brew lever is engaged with a hand on it, dirty brown coffee-oil water drains out below, a wisp of steam rises, and a clean shiny group head is shown alongside">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- counter -->
      <rect x="40" y="318" width="480" height="16" rx="6" fill="#c9a06b"/>
      <rect x="64" y="334" width="432" height="58" fill="#b9b1a3"/>
      <rect x="84" y="346" width="180" height="36" rx="5" fill="#8a6a4f"/>
      <rect x="296" y="346" width="180" height="36" rx="5" fill="#8a6a4f"/>
      <circle cx="174" cy="364" r="4" fill="#e0a93d"/>
      <circle cx="386" cy="364" r="4" fill="#e0a93d"/>

      <!-- ===== espresso machine body ===== -->
      <!-- main chassis -->
      <rect x="150" y="116" width="190" height="184" rx="14" fill="#d9663f"/>
      <rect x="150" y="116" width="190" height="44" rx="14" fill="#c96f4a"/>
      <!-- cup-warmer top rail -->
      <rect x="162" y="104" width="166" height="16" rx="8" fill="#8a6a4f"/>
      <!-- pressure gauge -->
      <circle cx="296" cy="150" r="16" fill="#fffdf8" stroke="#8a6a4f" stroke-width="3"/>
      <path d="M296 150 l9 -6" stroke="#d9663f" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="296" cy="150" r="2.4" fill="#8a6a4f"/>

      <!-- ===== brew lever / button, engaged, with a hand ===== -->
      <rect x="186" y="150" width="60" height="10" rx="5" fill="#5a4634"/>
      <rect x="234" y="138" width="14" height="34" rx="6" fill="#8a6a4f" transform="rotate(-22 241 155)"/>
      <ellipse cx="252" cy="146" rx="15" ry="11" fill="#e8b48f"/>
      <path d="M242 142 q-5 6 -1 13" stroke="#d99c73" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <text x="190" y="186" font-size="9.5" fill="#fffdf8" font-weight="700">brew ON</text>

      <!-- ===== group head with portafilter + blind basket ===== -->
      <!-- group head body -->
      <rect x="206" y="232" width="78" height="26" rx="7" fill="#8a6a4f"/>
      <rect x="206" y="232" width="78" height="10" rx="5" fill="#a07b56"/>
      <!-- shower screen hint -->
      <rect x="218" y="256" width="54" height="6" rx="3" fill="#5a4634"/>
      <g fill="#3e2e20">
        <circle cx="228" cy="259" r="1.2"/>
        <circle cx="238" cy="259" r="1.2"/>
        <circle cx="248" cy="259" r="1.2"/>
        <circle cx="258" cy="259" r="1.2"/>
      </g>
      <!-- portafilter cup + handle -->
      <rect x="222" y="262" width="46" height="20" rx="5" fill="#b9b1a3"/>
      <rect x="222" y="262" width="46" height="7" rx="3.5" fill="#cdbfa9"/>
      <!-- rubber blind basket (no holes) seated inside -->
      <rect x="229" y="266" width="32" height="13" rx="4" fill="#5a4634"/>
      <text x="271" y="272" font-size="9" fill="#3e7c59" font-weight="700">blind</text>
      <text x="271" y="282" font-size="9" fill="#3e7c59" font-weight="700">basket</text>
      <!-- portafilter handle to the front-right -->
      <rect x="266" y="270" width="56" height="11" rx="5" fill="#3e2e20" transform="rotate(8 294 275)"/>
      <circle cx="322" cy="282" r="7" fill="#5a4634"/>

      <!-- ===== dirty brown coffee-oil water draining out below ===== -->
      <path d="M236 282 q-3 18 -8 30" stroke="#5a4634" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
      <path d="M250 282 q2 16 0 30" stroke="#6b4a30" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
      <!-- drip tray catching the dirty water -->
      <rect x="196" y="312" width="120" height="14" rx="4" fill="#8a6a4f"/>
      <rect x="200" y="314" width="112" height="7" rx="3" fill="#6b4a30"/>
      <!-- brown oily flecks in the runoff -->
      <g fill="#6b4a30">
        <circle cx="226" cy="306" r="2.6"/>
        <circle cx="244" cy="308" r="2.2"/>
        <circle cx="236" cy="316" r="2.4"/>
        <circle cx="258" cy="314" r="2"/>
      </g>
      <text x="200" y="338" font-size="9.5" fill="#d9663f" font-weight="700">rancid oils flushed out</text>

      <!-- ===== steam wisp from a hot group ===== -->
      <g stroke="#b9b1a3" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="0.8">
        <path d="M210 226 q8 -12 1 -24 q-7 -11 1 -22"/>
        <path d="M222 224 q9 -12 2 -24"/>
      </g>

      <!-- ===== scoop of espresso detergent, left of the machine ===== -->
      <!-- detergent tub -->
      <rect x="64" y="246" width="48" height="54" rx="8" fill="#3e7c59"/>
      <rect x="62" y="238" width="52" height="12" rx="5" fill="#2c5a40"/>
      <rect x="70" y="258" width="36" height="30" rx="4" fill="#fffdf8"/>
      <text x="88" y="276" font-size="7.5" fill="#3e7c59" font-weight="700" text-anchor="middle">ESPRESSO</text>
      <text x="88" y="285" font-size="7.5" fill="#3e7c59" font-weight="700" text-anchor="middle">DETERGENT</text>
      <!-- little measuring scoop with white powder -->
      <path d="M120 274 q14 -2 26 4 l-3 12 q-12 -4 -23 -2 z" fill="#cdbfa9"/>
      <ellipse cx="133" cy="278" rx="13" ry="4" fill="#fffdf8"/>
      <path d="M145 280 l16 -6" stroke="#8a6a4f" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- ===== clean, shiny group head shown alongside, right ===== -->
      <rect x="408" y="232" width="74" height="26" rx="7" fill="#a07b56"/>
      <rect x="408" y="232" width="74" height="9" rx="4.5" fill="#c9a06b"/>
      <!-- shiny shower screen -->
      <ellipse cx="445" cy="262" rx="26" ry="6" fill="#cdbfa9"/>
      <ellipse cx="445" cy="262" rx="26" ry="6" fill="#fffdf8" opacity="0.4"/>
      <!-- sparkle shine on the clean group -->
      <g stroke="#5e9a78" stroke-width="2.4" stroke-linecap="round">
        <path d="M462 240 l0 9 M457.5 244.5 l9 0"/>
      </g>
      <g stroke="#fffdf8" stroke-width="3" stroke-linecap="round" opacity="0.85">
        <line x1="418" y1="252" x2="430" y2="240"/>
      </g>
      <text x="408" y="226" font-size="9.5" fill="#3e7c59" font-weight="700">clean group</text>

      <!-- small plant for warmth, right end -->
      <path d="M508 296 q-2 -18 -10 -26" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M508 296 q4 -16 12 -22" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="495" cy="266" rx="7" ry="11" fill="#5e9a78" transform="rotate(-28 495 266)"/>
      <ellipse cx="523" cy="270" rx="7" ry="11" fill="#3e7c59" transform="rotate(26 523 270)"/>
      <path d="M496 296 h24 l-4 22 h-16 z" fill="#c96f4a"/>
    </svg>
