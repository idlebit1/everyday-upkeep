<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a calm home-spa pedicure setup: a bare foot with neatly trimmed straight-across toenails soaks in a basin of warm water with a curl of steam, and on a folded towel beside it sit a foot file, a pair of toenail clippers, a cuticle pusher, and a jar of moisturizer, ready for a relaxed at-home pedicure">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- folded towel surface under the whole scene -->
      <rect x="48" y="292" width="464" height="86" rx="18" fill="#dce8ee"/>
      <rect x="48" y="292" width="464" height="16" rx="8" fill="#cdd9de"/>
      <g stroke="#9cc3d4" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <line x1="300" y1="330" x2="470" y2="330"/>
        <line x1="300" y1="344" x2="470" y2="344"/>
        <line x1="300" y1="358" x2="440" y2="358"/>
      </g>

      <!-- BASIN of warm water, left, foot soaking in it -->
      <path d="M64 236 h196 l-20 96 q-78 24 -156 0 z" fill="#7fb3c8"/>
      <ellipse cx="162" cy="236" rx="98" ry="24" fill="#9cc3d4"/>
      <ellipse cx="162" cy="234" rx="84" ry="18" fill="#dce8ee"/>
      <!-- gentle ripples -->
      <path d="M108 236 q14 -6 28 0 q14 6 28 0 q14 -6 28 0" fill="none" stroke="#7fb3c8" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
      <!-- curls of steam rising -->
      <g stroke="#cdd9de" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
        <path d="M120 222 q-8 -12 2 -22 q8 -8 0 -18"/>
        <path d="M162 218 q8 -12 -2 -22 q-6 -8 2 -16"/>
        <path d="M204 222 q-7 -12 3 -20 q7 -8 0 -14"/>
      </g>

      <!-- FOOT soaking, side-on, toenails straight across, heel toward us -->
      <!-- ankle/leg rising out of the water -->
      <path d="M172 150 q22 -10 44 -4 l6 66 q-26 8 -50 -2 z" fill="#e8b48f"/>
      <!-- foot body dipping into the basin -->
      <path d="M120 212 q4 -40 60 -46 q52 -6 74 8 q18 10 12 30 q-8 22 -40 26 q-60 6 -96 2 q-14 -20 -10 -50 z" fill="#e8b48f"/>
      <!-- rounded heel -->
      <path d="M118 216 q-14 6 -8 24 q10 12 30 6 q6 -18 -4 -30 z" fill="#dca27d"/>
      <!-- toes, big to small, dipping toward the water -->
      <g fill="#e8b48f">
        <ellipse cx="248" cy="196" rx="15" ry="17"/>
        <ellipse cx="234" cy="220" rx="11" ry="13"/>
        <ellipse cx="222" cy="240" rx="9.5" ry="11.5"/>
        <ellipse cx="212" cy="258" rx="8" ry="10"/>
        <ellipse cx="204" cy="274" rx="6.5" ry="8.5"/>
      </g>
      <!-- neatly trimmed STRAIGHT-across toenails (squared paper rectangles) -->
      <g fill="#fffdf8" stroke="#d99c73" stroke-width="1.4">
        <rect x="248" y="182" width="15" height="12" rx="3" transform="rotate(-6 255 188)"/>
        <rect x="234" y="208" width="12" height="10" rx="2.5" transform="rotate(-14 240 213)"/>
        <rect x="223" y="230" width="10" height="9" rx="2" transform="rotate(-20 228 234)"/>
        <rect x="213" y="250" width="9" height="8" rx="2" transform="rotate(-26 217 254)"/>
      </g>

      <!-- FOOT FILE (metal foot file / paddle) leaning front-center -->
      <g transform="rotate(-12 300 350)">
        <rect x="264" y="322" width="20" height="72" rx="9" fill="#c96f4a"/>
        <rect x="264" y="322" width="20" height="46" rx="9" fill="#b9b1a3"/>
        <!-- grit texture on the filing surface -->
        <g stroke="#8a6a4f" stroke-width="1" opacity="0.6">
          <line x1="268" y1="330" x2="280" y2="330"/>
          <line x1="268" y1="338" x2="280" y2="338"/>
          <line x1="268" y1="346" x2="280" y2="346"/>
          <line x1="268" y1="354" x2="280" y2="354"/>
        </g>
      </g>

      <!-- TOENAIL CLIPPERS on the towel, center-right -->
      <g transform="rotate(-6 360 360)">
        <rect x="326" y="356" width="70" height="14" rx="7" fill="#b9b1a3"/>
        <rect x="326" y="356" width="70" height="6" rx="3" fill="#cdd9de"/>
        <path d="M326 370 q34 12 70 0" fill="none" stroke="#8a6a4f" stroke-width="4" stroke-linecap="round"/>
        <rect x="350" y="344" width="32" height="8" rx="4" fill="#8a6a4f"/>
        <circle cx="366" cy="356" r="3.4" fill="#6b7376"/>
        <path d="M326 363 l-8 0" stroke="#5e9a78" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- CUTICLE PUSHER leaning front-right -->
      <g transform="rotate(18 440 348)">
        <rect x="404" y="330" width="72" height="9" rx="4.5" fill="#8a6a4f"/>
        <rect x="404" y="330" width="18" height="9" rx="4.5" fill="#cdd9de"/>
        <path d="M404 334 l-8 0 q-3 0.5 0 1 l8 0 z" fill="#b9b1a3"/>
        <ellipse cx="474" cy="334.5" rx="5" ry="4" fill="#cdd9de"/>
      </g>

      <!-- MOISTURIZER jar, back-right on the towel -->
      <rect x="452" y="252" width="56" height="46" rx="10" fill="#5e9a78"/>
      <rect x="452" y="252" width="56" height="16" rx="8" fill="#3e7c59"/>
      <rect x="464" y="238" width="32" height="16" rx="5" fill="#e3efe8"/>
      <!-- a soft dab of cream on the lid -->
      <ellipse cx="480" cy="238" rx="9" ry="5" fill="#fffdf8"/>
      <text x="480" y="282" font-size="10" fill="#fffdf8" font-weight="700" text-anchor="middle">cream</text>

      <!-- calm sparkle near the finished nails -->
      <g stroke="#e0a93d" stroke-width="2.4" stroke-linecap="round">
        <path d="M270 158 l0 9 M265.5 162.5 l9 0"/>
      </g>
      <g stroke="#5e9a78" stroke-width="2" stroke-linecap="round">
        <path d="M296 200 l0 7 M292.5 203.5 l7 0"/>
      </g>
    </svg>
