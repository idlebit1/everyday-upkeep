<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of seam-sealing a tent at a campsite: a pitched A-frame tent with a rainfly, one seam being brushed with seam sealer while old seam tape peels away on another seam, a bottle of seam sealer and a brush sit on the ground beside it, water beads roll off the freshly treated rainfly fabric, and pine trees frame the outdoor scene">
      <ellipse cx="285" cy="404" rx="252" ry="22" fill="#efe7d8"/>

      <!-- pine trees framing the scene -->
      <g>
        <rect x="42" y="230" width="9" height="34" rx="2" fill="#8a6a4f"/>
        <path d="M46 96 l30 66 h-60 z" fill="#2c5a40"/>
        <path d="M46 130 l26 56 h-52 z" fill="#3e7c59"/>
        <path d="M46 166 l22 50 h-44 z" fill="#5e9a78"/>
      </g>
      <g>
        <rect x="508" y="240" width="8" height="28" rx="2" fill="#8a6a4f"/>
        <path d="M512 140 l24 52 h-48 z" fill="#2c5a40"/>
        <path d="M512 170 l20 44 h-40 z" fill="#3e7c59"/>
        <path d="M512 200 l17 40 h-34 z" fill="#5e9a78"/>
      </g>

      <!-- ground shadow under the tent -->
      <ellipse cx="290" cy="352" rx="180" ry="20" fill="#e0d6c4"/>

      <!-- ==== the pitched A-frame tent ==== -->
      <!-- tent floor / groundsheet edge -->
      <path d="M150 348 L300 348 L430 348 L300 372 Z" fill="#b9b1a3"/>
      <!-- back wall of tent -->
      <path d="M290 150 L410 300 L410 344 L290 344 Z" fill="#5e9a78"/>
      <!-- front / rainfly face -->
      <path d="M290 150 L170 300 L170 344 L290 344 Z" fill="#3e7c59"/>
      <!-- rainfly ridge highlight -->
      <path d="M290 150 L170 300" fill="none" stroke="#2c5a40" stroke-width="5" stroke-linecap="round"/>
      <path d="M290 150 L410 300" fill="none" stroke="#2c5a40" stroke-width="5" stroke-linecap="round"/>

      <!-- door zipper seam down the front face -->
      <path d="M232 226 L232 344" fill="none" stroke="#2c5a40" stroke-width="3" stroke-dasharray="5 4"/>

      <!-- guy line + stake, front left -->
      <path d="M170 300 L112 352" stroke="#c9a06b" stroke-width="2.4"/>
      <rect x="108" y="350" width="5" height="16" rx="2" fill="#8a6a4f" transform="rotate(18 110 358)"/>
      <!-- guy line + stake, right -->
      <path d="M410 300 L466 352" stroke="#c9a06b" stroke-width="2.4"/>
      <rect x="462" y="350" width="5" height="16" rx="2" fill="#8a6a4f" transform="rotate(-18 464 358)"/>

      <!-- ==== SEAM BEING SEALED (front ridge seam) ==== -->
      <!-- fresh wet sealer stroke along the ridge seam -->
      <path d="M290 158 L214 254" fill="none" stroke="#dce8ee" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
      <path d="M290 158 L214 254" fill="none" stroke="#7fb3c8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <!-- application brush on that seam -->
      <rect x="196" y="250" width="40" height="9" rx="3" fill="#c96f4a" transform="rotate(-38 216 254)"/>
      <path d="M210 266 l-8 10" stroke="#8a6a4f" stroke-width="2" stroke-linecap="round"/>
      <g stroke="#e0a93d" stroke-width="2" stroke-linecap="round" transform="rotate(-38 216 254)">
        <line x1="234" y1="252" x2="242" y2="252"/>
        <line x1="234" y1="256" x2="242" y2="256"/>
      </g>

      <!-- ==== OLD SEAM TAPE PEELING (back ridge seam) ==== -->
      <path d="M300 168 L392 288" fill="none" stroke="#dce8ee" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
      <!-- a curling, lifted strip of failed tape -->
      <path d="M356 240 q18 -4 30 10 q-14 2 -22 14 q-2 -14 -8 -24 z" fill="#cdd9de"/>
      <path d="M356 240 q18 -4 30 10" fill="none" stroke="#b9b1a3" stroke-width="2" stroke-linecap="round"/>
      <text x="370" y="212" font-size="11" fill="#d9663f" font-weight="700">peeling tape</text>

      <!-- water beading & rolling off the treated fly -->
      <g fill="#7fb3c8">
        <circle cx="204" cy="286" r="5"/>
        <circle cx="222" cy="308" r="4"/>
        <circle cx="196" cy="316" r="3.4"/>
      </g>
      <g fill="#dce8ee">
        <circle cx="202" cy="284" r="1.8"/>
        <circle cx="220" cy="306" r="1.5"/>
      </g>
      <!-- a bead trailing down / rolling off -->
      <path d="M214 314 q3 8 -1 16" stroke="#7fb3c8" stroke-width="2.6" fill="none" stroke-linecap="round"/>

      <!-- ==== bottle of seam sealer + brush on the ground ==== -->
      <!-- sealer bottle -->
      <rect x="452" y="308" width="34" height="46" rx="6" fill="#c96f4a"/>
      <rect x="452" y="322" width="34" height="20" fill="#d9663f"/>
      <rect x="460" y="296" width="18" height="14" rx="3" fill="#8a6a4f"/>
      <rect x="464" y="286" width="10" height="12" rx="3" fill="#2c5a40"/>
      <text x="469" y="336" font-size="8" fill="#fffdf8" font-weight="700" text-anchor="middle">SEAM</text>
      <!-- a small brush resting beside the bottle -->
      <rect x="404" y="352" width="46" height="7" rx="3" fill="#c9a06b" transform="rotate(-8 427 355)"/>
      <path d="M400 356 l-10 3" stroke="#2c5a40" stroke-width="6" stroke-linecap="round" transform="rotate(-8 427 355)"/>

      <!-- folded cloth front-left for cleaning the seam -->
      <path d="M96 356 h64 l-6 20 h-52 z" fill="#7fb3c8"/>
      <path d="M96 356 h64 l-4 7 h-56 z" fill="#9cc3d4"/>
      <g stroke="#cdd9de" stroke-width="1.5">
        <line x1="110" y1="366" x2="146" y2="366"/>
        <line x1="108" y1="371" x2="144" y2="371"/>
      </g>

      <!-- rubbing-alcohol bottle for prep, far left -->
      <rect x="60" y="326" width="24" height="34" rx="4" fill="#dce8ee"/>
      <rect x="64" y="318" width="16" height="10" rx="2" fill="#9cc3d4"/>
      <rect x="66" y="336" width="12" height="14" rx="2" fill="#fffdf8" opacity="0.75"/>
    </svg>
