<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a friendly flat-style bicycle with its chain and drivetrain highlighted in gold, next to a bottle of chain lube dripping a single drop">
      <ellipse cx="280" cy="400" rx="250" ry="22" fill="#efe7d8"/>
      <circle cx="70" cy="62" r="24" fill="#f2cf7a"/>
      <ellipse cx="462" cy="66" rx="44" ry="20" fill="#dce8ee"/>
      <ellipse cx="420" cy="78" rx="26" ry="14" fill="#dce8ee"/>
      <ellipse cx="120" cy="110" rx="30" ry="15" fill="#dce8ee"/>
      <!-- drivetrain highlight glow -->
      <ellipse cx="208" cy="312" rx="118" ry="58" fill="#faf0da"/>
      <!-- wheels -->
      <circle cx="150" cy="312" r="76" fill="none" stroke="#2c5a40" stroke-width="11"/>
      <circle cx="150" cy="312" r="62" fill="none" stroke="#b9b1a3" stroke-width="3"/>
      <g stroke="#b9b1a3" stroke-width="2.5">
        <line x1="150" y1="252" x2="150" y2="372"/>
        <line x1="90" y1="312" x2="210" y2="312"/>
        <line x1="108" y1="270" x2="192" y2="354"/>
        <line x1="192" y1="270" x2="108" y2="354"/>
      </g>
      <circle cx="430" cy="312" r="76" fill="none" stroke="#2c5a40" stroke-width="11"/>
      <circle cx="430" cy="312" r="62" fill="none" stroke="#b9b1a3" stroke-width="3"/>
      <g stroke="#b9b1a3" stroke-width="2.5">
        <line x1="430" y1="252" x2="430" y2="372"/>
        <line x1="370" y1="312" x2="490" y2="312"/>
        <line x1="388" y1="270" x2="472" y2="354"/>
        <line x1="472" y1="270" x2="388" y2="354"/>
      </g>
      <!-- frame -->
      <g stroke="#c96f4a" stroke-width="10" stroke-linecap="round" fill="none">
        <line x1="265" y1="312" x2="243" y2="182"/>
        <line x1="265" y1="312" x2="392" y2="198"/>
        <line x1="246" y1="196" x2="388" y2="204"/>
        <line x1="150" y1="312" x2="243" y2="190"/>
        <line x1="392" y1="198" x2="430" y2="312"/>
        <line x1="392" y1="198" x2="398" y2="168"/>
      </g>
      <line x1="150" y1="306" x2="262" y2="306" stroke="#c96f4a" stroke-width="8" stroke-linecap="round"/>
      <!-- handlebar + saddle -->
      <path d="M398 168 q22 -8 30 8" stroke="#2c5a40" stroke-width="7" fill="none" stroke-linecap="round"/>
      <line x1="243" y1="182" x2="241" y2="170" stroke="#2c5a40" stroke-width="7" stroke-linecap="round"/>
      <rect x="214" y="160" width="54" height="13" rx="6.5" fill="#2c5a40"/>
      <!-- cassette + derailleur -->
      <circle cx="150" cy="312" r="20" fill="none" stroke="#e0a93d" stroke-width="7"/>
      <circle cx="150" cy="312" r="7" fill="#8a6a4f"/>
      <circle cx="158" cy="348" r="8" fill="none" stroke="#d98e3b" stroke-width="4"/>
      <circle cx="166" cy="368" r="7" fill="none" stroke="#d98e3b" stroke-width="4"/>
      <!-- chain -->
      <line x1="150" y1="293" x2="265" y2="282" stroke="#8a6a4f" stroke-width="7" stroke-linecap="round"/>
      <line x1="150" y1="293" x2="265" y2="282" stroke="#e0a93d" stroke-width="4" stroke-dasharray="6 5" stroke-linecap="round"/>
      <line x1="158" y1="356" x2="265" y2="342" stroke="#8a6a4f" stroke-width="7" stroke-linecap="round"/>
      <line x1="158" y1="356" x2="265" y2="342" stroke="#e0a93d" stroke-width="4" stroke-dasharray="6 5" stroke-linecap="round"/>
      <!-- chainring + crank + pedal -->
      <circle cx="265" cy="312" r="31" fill="none" stroke="#d98e3b" stroke-width="8"/>
      <circle cx="265" cy="312" r="9" fill="#8a6a4f"/>
      <line x1="265" y1="312" x2="288" y2="350" stroke="#2c5a40" stroke-width="7" stroke-linecap="round"/>
      <rect x="280" y="346" width="26" height="9" rx="4.5" fill="#33393b" transform="rotate(8 293 350)"/>
      <!-- lube bottle -->
      <rect x="508" y="332" width="26" height="46" rx="7" fill="#3e7c59"/>
      <rect x="515" y="318" width="12" height="16" rx="3" fill="#2c5a40"/>
      <path d="M521 296 c4 6 6 9 0 13 c-6 -4 -4 -7 0 -13" fill="#7fb3c8"/>
      <!-- greenery -->
      <circle cx="42" cy="386" r="14" fill="#5e9a78"/>
      <circle cx="62" cy="392" r="11" fill="#3e7c59"/>
      <circle cx="524" cy="392" r="10" fill="#5e9a78"/>
    </svg>
