<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a bright kitchen mid-deep-clean: a stove and range with a vent hood and upper cabinets above it, one stretch of counter sparkling clean while a greasy spot on the backsplash is being wiped with a cloth, a spray bottle and folded microfiber cloths on the counter, a bucket of soapy water on the floor, and the edge of a refrigerator at the side">
      <ellipse cx="285" cy="404" rx="252" ry="22" fill="#efe7d8"/>

      <!-- back wall / backsplash band -->
      <rect x="40" y="150" width="420" height="110" fill="#dce8ee"/>
      <!-- tile grout lines on backsplash -->
      <g stroke="#c7d6dd" stroke-width="2">
        <line x1="40" y1="186" x2="460" y2="186"/>
        <line x1="40" y1="222" x2="460" y2="222"/>
        <line x1="92" y1="150" x2="92" y2="260"/>
        <line x1="172" y1="150" x2="172" y2="260"/>
        <line x1="252" y1="150" x2="252" y2="260"/>
        <line x1="332" y1="150" x2="332" y2="260"/>
        <line x1="412" y1="150" x2="412" y2="260"/>
      </g>

      <!-- upper cabinets -->
      <rect x="44" y="44" width="170" height="96" rx="6" fill="#c9a06b" stroke="#8a6a4f" stroke-width="4"/>
      <rect x="54" y="54" width="72" height="76" rx="4" fill="#b9844f"/>
      <rect x="132" y="54" width="72" height="76" rx="4" fill="#b9844f"/>
      <circle cx="120" cy="92" r="3.5" fill="#8a6a4f"/>
      <circle cx="138" cy="92" r="3.5" fill="#8a6a4f"/>
      <!-- greasy film on the cabinet faces above the stove -->
      <rect x="132" y="54" width="72" height="76" rx="4" fill="#c9a06b" opacity="0.4"/>
      <g fill="#b9b1a3" opacity="0.4">
        <circle cx="150" cy="74" r="3"/>
        <circle cx="178" cy="88" r="2.4"/>
        <circle cx="164" cy="108" r="2.6"/>
      </g>

      <!-- range hood above the stove -->
      <path d="M232 80 h120 l-16 34 h-88 z" fill="#b9b1a3" stroke="#8a6a4f" stroke-width="3"/>
      <rect x="248" y="114" width="88" height="10" rx="3" fill="#8a6a4f"/>
      <!-- hood filter slats -->
      <g stroke="#6b7376" stroke-width="2">
        <line x1="262" y1="98" x2="322" y2="98"/>
        <line x1="266" y1="106" x2="318" y2="106"/>
      </g>
      <!-- grease film on the hood -->
      <path d="M250 92 q40 -8 84 0" fill="none" stroke="#c9a06b" stroke-width="4" opacity="0.5" stroke-linecap="round"/>

      <!-- counter slab spanning the scene -->
      <rect x="36" y="260" width="430" height="20" rx="4" fill="#b9b1a3"/>
      <rect x="36" y="278" width="430" height="60" fill="#c9a06b"/>
      <!-- lower cabinet doors -->
      <g stroke="#8a6a4f" stroke-width="3">
        <line x1="120" y1="280" x2="120" y2="338"/>
        <line x1="210" y1="280" x2="210" y2="338"/>
      </g>

      <!-- LEFT counter: sparkling clean -->
      <g stroke="#fffdf8" stroke-width="5" stroke-linecap="round" opacity="0.85">
        <line x1="58" y1="272" x2="96" y2="266"/>
        <line x1="70" y1="276" x2="100" y2="272"/>
      </g>
      <g stroke="#5e9a78" stroke-width="2.4" stroke-linecap="round">
        <path d="M84 250 l0 9 M79.5 254.5 l9 0"/>
      </g>
      <text x="48" y="244" font-size="11" fill="#3e7c59" font-weight="700">clean</text>

      <!-- stove / range under the hood -->
      <rect x="238" y="262" width="108" height="78" rx="6" fill="#fffdf8" stroke="#8a6a4f" stroke-width="4"/>
      <!-- cooktop burners -->
      <circle cx="266" cy="276" r="9" fill="#8a6a4f"/>
      <circle cx="318" cy="276" r="9" fill="#8a6a4f"/>
      <circle cx="266" cy="276" r="4" fill="#c96f4a"/>
      <circle cx="318" cy="276" r="4" fill="#c96f4a"/>
      <!-- oven door + handle -->
      <rect x="248" y="292" width="88" height="40" rx="5" fill="#dce8ee"/>
      <rect x="256" y="296" width="72" height="6" rx="3" fill="#8a6a4f"/>
      <rect x="284" y="284" width="22" height="5" rx="2.5" fill="#6b7376"/>

      <!-- RIGHT backsplash: greasy spot being wiped -->
      <rect x="356" y="158" width="80" height="60" rx="3" fill="#c9a06b" opacity="0.5"/>
      <g fill="#b9b1a3" opacity="0.55">
        <circle cx="372" cy="178" r="4"/>
        <circle cx="396" cy="170" r="3.4"/>
        <circle cx="410" cy="192" r="3.8"/>
        <circle cx="384" cy="198" r="3"/>
      </g>
      <!-- microfiber cloth wiping the greasy spot -->
      <rect x="386" y="182" width="40" height="28" rx="6" fill="#7fb3c8" transform="rotate(-8 406 196)"/>
      <rect x="386" y="182" width="40" height="9" rx="4" fill="#9cc3d4" transform="rotate(-8 406 196)"/>
      <!-- wiped clean streak -->
      <path d="M392 200 q24 -10 40 -4" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      <!-- arm reaching to wipe -->
      <path d="M408 210 q26 30 52 36" stroke="#c96f4a" stroke-width="12" fill="none" stroke-linecap="round"/>

      <!-- spray bottle on the counter -->
      <rect x="150" y="294" width="30" height="44" rx="6" fill="#5e9a78"/>
      <rect x="156" y="282" width="18" height="14" rx="3" fill="#3e7c59"/>
      <path d="M174 284 l16 -6 l0 6 l-16 4 z" fill="#2c5a40"/>
      <rect x="154" y="310" width="22" height="16" rx="3" fill="#dce8ee" opacity="0.8"/>

      <!-- folded microfiber cloths on the counter, left -->
      <path d="M64 312 h62 l-6 22 h-50 z" fill="#7fb3c8"/>
      <path d="M64 312 h62 l-4 8 h-54 z" fill="#9cc3d4"/>
      <g stroke="#cdd9de" stroke-width="1.6">
        <line x1="78" y1="324" x2="112" y2="324"/>
        <line x1="76" y1="330" x2="110" y2="330"/>
      </g>

      <!-- bucket of soapy water on the floor -->
      <path d="M170 350 h64 l-8 48 h-48 z" fill="#7fb3c8"/>
      <path d="M166 348 h72 l-3 10 h-66 z" fill="#9cc3d4"/>
      <path d="M172 344 q30 -16 58 0" fill="none" stroke="#5e9a78" stroke-width="3" stroke-linecap="round"/>
      <circle cx="186" cy="352" r="6" fill="#eef4f7"/>
      <circle cx="200" cy="348" r="7" fill="#fffdf8"/>
      <circle cx="214" cy="353" r="5" fill="#eef4f7"/>

      <!-- refrigerator edge at far right -->
      <rect x="468" y="120" width="60" height="270" rx="8" fill="#dce8ee" stroke="#b9b1a3" stroke-width="4"/>
      <rect x="476" y="200" width="6" height="44" rx="3" fill="#8a6a4f"/>
      <line x1="468" y1="252" x2="528" y2="252" stroke="#b9b1a3" stroke-width="4"/>
      <rect x="476" y="262" width="6" height="36" rx="3" fill="#8a6a4f"/>
    </svg>
