<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a freestanding kitchen range with the oven door open, the racks pulled out and leaning against the side, a baking-soda paste being spread inside with sparkles rising, and a box of baking soda, a spray bottle of vinegar, and gloves on the counter">
      <ellipse cx="290" cy="400" rx="245" ry="22" fill="#efe7d8"/>
      <!-- window with sun -->
      <rect x="48" y="40" width="100" height="100" rx="8" fill="#dce8ee" stroke="#e6dccb" stroke-width="3"/>
      <line x1="98" y1="43" x2="98" y2="137" stroke="#fffdf8" stroke-width="4"/>
      <line x1="51" y1="90" x2="145" y2="90" stroke="#fffdf8" stroke-width="4"/>
      <circle cx="476" cy="64" r="20" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="476" y1="34" x2="476" y2="40"/>
        <line x1="506" y1="64" x2="500" y2="64"/>
        <line x1="497" y1="43" x2="493" y2="47"/>
        <line x1="497" y1="85" x2="493" y2="81"/>
      </g>
      <!-- range body -->
      <rect x="170" y="120" width="220" height="252" rx="12" fill="#b9b1a3"/>
      <!-- control panel + dials -->
      <rect x="170" y="120" width="220" height="34" rx="12" fill="#8a6a4f"/>
      <circle cx="196" cy="137" r="7" fill="#e0a93d"/>
      <circle cx="222" cy="137" r="7" fill="#fffdf8"/>
      <circle cx="248" cy="137" r="7" fill="#fffdf8"/>
      <rect x="300" y="130" width="72" height="14" rx="7" fill="#33393b"/>
      <text x="336" y="141" font-size="10" fill="#5e9a78" text-anchor="middle" font-weight="700">CLEAN</text>
      <!-- cooktop edge -->
      <rect x="170" y="154" width="220" height="10" fill="#8a6a4f"/>
      <!-- open oven door folded down in front -->
      <polygon points="170,330 390,330 426,392 206,392" fill="#dce8ee" stroke="#b9b1a3" stroke-width="3"/>
      <rect x="232" y="338" width="132" height="22" rx="6" fill="#7fb3c8"/>
      <rect x="246" y="343" width="104" height="12" rx="3" fill="#dce8ee"/>
      <rect x="252" y="322" width="92" height="8" rx="4" fill="#8a6a4f"/>
      <!-- oven cavity interior -->
      <rect x="186" y="164" width="188" height="166" rx="6" fill="#5a4634"/>
      <rect x="194" y="172" width="172" height="150" rx="4" fill="#33393b"/>
      <!-- back wall + vents -->
      <g stroke="#8a6a4f" stroke-width="2">
        <line x1="210" y1="188" x2="350" y2="188"/>
        <line x1="210" y1="198" x2="350" y2="198"/>
      </g>
      <!-- baking-soda paste swiped on the interior walls -->
      <path d="M204 250 q40 -16 76 -4 q40 14 80 -2" fill="none" stroke="#fffdf8" stroke-width="13" stroke-linecap="round"/>
      <path d="M210 282 q44 -12 84 0 q34 10 66 -4" fill="none" stroke="#f2ede2" stroke-width="11" stroke-linecap="round"/>
      <!-- heating element along the floor -->
      <path d="M206 308 h36 q8 0 8 8 q0 8 8 8 h84 q8 0 8 -8 q0 -8 8 -8 h22" fill="none" stroke="#c96f4a" stroke-width="5" stroke-linecap="round"/>
      <!-- sparkles inside -->
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="240" y1="214" x2="240" y2="226"/>
        <line x1="234" y1="220" x2="246" y2="220"/>
        <line x1="320" y1="206" x2="320" y2="218"/>
        <line x1="314" y1="212" x2="326" y2="212"/>
      </g>
      <!-- two racks pulled out, leaning against the right of the range -->
      <g transform="rotate(8 410 280)">
        <rect x="392" y="196" width="58" height="84" rx="6" fill="none" stroke="#8a6a4f" stroke-width="4"/>
        <g stroke="#8a6a4f" stroke-width="2.5">
          <line x1="392" y1="214" x2="450" y2="214"/>
          <line x1="392" y1="232" x2="450" y2="232"/>
          <line x1="392" y1="250" x2="450" y2="250"/>
          <line x1="392" y1="268" x2="450" y2="268"/>
          <line x1="408" y1="196" x2="408" y2="280"/>
          <line x1="424" y1="196" x2="424" y2="280"/>
          <line x1="440" y1="196" x2="440" y2="280"/>
        </g>
      </g>
      <!-- soaking tub for the racks at the foot of the range -->
      <rect x="396" y="300" width="118" height="56" rx="10" fill="#dce8ee" stroke="#7fb3c8" stroke-width="3"/>
      <rect x="404" y="320" width="102" height="30" rx="6" fill="#7fb3c8"/>
      <g stroke="#fffdf8" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <circle cx="430" cy="312" r="3" fill="none"/>
        <circle cx="460" cy="316" r="4" fill="none"/>
        <circle cx="485" cy="310" r="2.5" fill="none"/>
      </g>
      <!-- baking-soda box on the counter, left -->
      <rect x="60" y="252" width="56" height="54" rx="4" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5"/>
      <rect x="60" y="252" width="56" height="18" rx="4" fill="#e0a93d"/>
      <rect x="68" y="278" width="40" height="6" rx="3" fill="#dce8ee"/>
      <rect x="68" y="288" width="28" height="5" rx="2.5" fill="#e9e2d8"/>
      <!-- vinegar spray bottle, right of the box -->
      <rect x="126" y="256" width="32" height="50" rx="6" fill="#3e7c59"/>
      <rect x="132" y="240" width="20" height="18" rx="4" fill="#2c5a40"/>
      <path d="M132 244 l-16 6 14 6 z" fill="#8a6a4f"/>
      <g stroke="#e3efe8" stroke-width="2.5" stroke-linecap="round">
        <line x1="133" y1="276" x2="151" y2="276"/>
        <line x1="133" y1="285" x2="146" y2="285"/>
      </g>
      <!-- rubber gloves draped on the counter -->
      <path d="M62 320 q-4 -16 4 -22 q4 14 12 10 q-2 16 6 18 q-10 8 -22 -6 z" fill="#c96f4a"/>
      <!-- drips -->
      <g fill="#7fb3c8">
        <circle cx="220" cy="384" r="3"/>
        <circle cx="394" cy="382" r="3"/>
        <circle cx="404" cy="374" r="2.5"/>
      </g>
    </svg>
