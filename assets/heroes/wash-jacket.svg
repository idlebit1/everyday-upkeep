<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of washing a jacket: a zipped-up jacket with its zippers closed going into a front-load washing machine, a hand holding up the sewn-in care label tag, a bottle of tech wash and a set of dryer balls on the floor, and off to the side a small waterproof rain shell with water beading off it, a fleece jacket, and a puffy down jacket to show the different types, all in a cozy laundry room">
      <ellipse cx="280" cy="404" rx="252" ry="20" fill="#efe7d8"/>

      <!-- laundry room back wall shelf -->
      <rect x="40" y="44" width="220" height="12" rx="4" fill="#c9a06b"/>
      <rect x="52" y="30" width="14" height="14" rx="2" fill="#7fb3c8"/>
      <rect x="72" y="26" width="14" height="18" rx="2" fill="#5e9a78"/>
      <rect x="92" y="32" width="16" height="12" rx="2" fill="#d9663f"/>

      <!-- front-load washer -->
      <rect x="70" y="150" width="180" height="210" rx="14" fill="#fffdf8" stroke="#b9b1a3" stroke-width="6"/>
      <!-- control panel -->
      <rect x="82" y="164" width="156" height="26" rx="6" fill="#dce8ee"/>
      <circle cx="220" cy="177" r="8" fill="#3e7c59"/>
      <rect x="92" y="173" width="40" height="7" rx="3.5" fill="#b9b1a3"/>
      <!-- door ring -->
      <circle cx="160" cy="278" r="72" fill="#e9e2d8"/>
      <circle cx="160" cy="278" r="60" fill="#7fb3c8"/>
      <circle cx="160" cy="278" r="52" fill="#dce8ee"/>
      <!-- jacket being tucked into the drum, zipped up -->
      <path d="M132 250 q-10 4 -12 22 q8 6 20 6 l0 30 q18 8 40 8 q22 0 40 -8 l0 -30 q12 0 20 -6 q-2 -18 -12 -22 l-24 -6 q-14 10 -48 0 z" fill="#3e7c59"/>
      <!-- zipper up the middle -->
      <line x1="160" y1="246" x2="160" y2="320" stroke="#e0a93d" stroke-width="3"/>
      <g stroke="#2c5a40" stroke-width="1.4">
        <line x1="156" y1="252" x2="164" y2="252"/>
        <line x1="156" y1="262" x2="164" y2="262"/>
        <line x1="156" y1="272" x2="164" y2="272"/>
        <line x1="156" y1="282" x2="164" y2="282"/>
        <line x1="156" y1="292" x2="164" y2="292"/>
      </g>
      <!-- zip pull tab -->
      <rect x="157" y="243" width="6" height="9" rx="2" fill="#d98e3b"/>
      <!-- collar -->
      <path d="M144 244 q16 -8 32 0 l-8 8 q-8 -4 -16 0 z" fill="#2c5a40"/>

      <!-- care label tag held up by a hand, top-right of washer -->
      <g transform="rotate(-8 320 130)">
        <rect x="300" y="96" width="40" height="60" rx="4" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2.5"/>
        <line x1="308" y1="108" x2="332" y2="108" stroke="#6b7376" stroke-width="1.8"/>
        <!-- wash tub symbol -->
        <path d="M309 118 q11 8 22 0 l0 8 q-11 5 -22 0 z" fill="none" stroke="#3e7c59" stroke-width="1.8"/>
        <circle cx="320" cy="118" r="1.6" fill="#3e7c59"/>
        <!-- no-tumble symbol -->
        <rect x="309" y="134" width="14" height="12" rx="2" fill="none" stroke="#d9663f" stroke-width="1.8"/>
        <circle cx="316" cy="140" r="3" fill="none" stroke="#d9663f" stroke-width="1.6"/>
        <line x1="326" y1="132" x2="336" y2="148" stroke="#d9663f" stroke-width="1.8"/>
      </g>
      <!-- hand holding the tag -->
      <ellipse cx="316" cy="160" rx="15" ry="11" fill="#e8b48f"/>
      <path d="M308 156 q-4 6 0 12" stroke="#d99c73" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <text x="292" y="180" font-size="11" fill="#3e7c59" font-weight="700">read the label</text>

      <!-- tech wash bottle, bottom-left in front of washer -->
      <rect x="60" y="330" width="32" height="52" rx="6" fill="#5e9a78"/>
      <rect x="66" y="316" width="20" height="16" rx="3" fill="#3e7c59"/>
      <rect x="64" y="344" width="24" height="24" rx="3" fill="#e3efe8"/>
      <rect x="68" y="350" width="16" height="5" rx="2.5" fill="#3e7c59"/>
      <text x="68" y="362" font-size="7.5" fill="#2c5a40" font-weight="700">TECH</text>

      <!-- dryer balls, bottom, in front -->
      <circle cx="118" cy="378" r="15" fill="#c9a06b"/>
      <circle cx="146" cy="384" r="13" fill="#d98e3b"/>
      <g stroke="#8a6a4f" stroke-width="1" opacity="0.5">
        <path d="M108 372 q10 6 20 0 M110 382 q8 4 16 0"/>
        <path d="M138 380 q8 5 16 0"/>
      </g>

      <!-- waterproof rain shell (top-right), water beading -->
      <g transform="translate(392 74)">
        <path d="M40 8 q28 -12 56 0 l14 20 l-16 12 l0 76 l-52 0 l0 -76 l-16 -12 z" fill="#7fb3c8"/>
        <path d="M40 8 q28 12 56 0 l-8 12 q-20 8 -40 0 z" fill="#5e9a78"/>
        <line x1="68" y1="26" x2="68" y2="112" stroke="#dce8ee" stroke-width="2.5"/>
        <!-- water beads rolling off -->
        <g fill="#dce8ee">
          <circle cx="52" cy="56" r="4"/>
          <circle cx="84" cy="70" r="3.4"/>
          <circle cx="60" cy="88" r="3"/>
          <circle cx="88" cy="46" r="2.6"/>
        </g>
        <text x="30" y="130" font-size="10" fill="#3e7c59" font-weight="700">rain shell</text>
      </g>

      <!-- fleece jacket (right, mid) -->
      <g transform="translate(408 232)">
        <path d="M30 6 q24 -10 48 0 l12 16 l-14 10 l0 60 l-44 0 l0 -60 l-14 -10 z" fill="#c96f4a"/>
        <path d="M30 6 q24 10 48 0 l-7 10 q-17 7 -34 0 z" fill="#8a6a4f"/>
        <!-- fuzzy texture dots -->
        <g fill="#d9663f" opacity="0.6">
          <circle cx="44" cy="44" r="2.2"/>
          <circle cx="60" cy="52" r="2.2"/>
          <circle cx="74" cy="46" r="2.2"/>
          <circle cx="52" cy="66" r="2.2"/>
          <circle cx="68" cy="72" r="2.2"/>
        </g>
        <text x="34" y="106" font-size="10" fill="#3e7c59" font-weight="700">fleece</text>
      </g>

      <!-- down puffer (bottom-right), quilted -->
      <g transform="translate(322 292)">
        <path d="M34 6 q28 -10 56 0 l14 16 l-16 12 l0 60 l-52 0 l0 -60 l-16 -12 z" fill="#e0a93d"/>
        <path d="M34 6 q28 10 56 0 l-8 12 q-20 8 -40 0 z" fill="#d98e3b"/>
        <!-- quilt lines -->
        <g stroke="#d98e3b" stroke-width="2">
          <line x1="34" y1="42" x2="90" y2="42"/>
          <line x1="34" y1="60" x2="90" y2="60"/>
          <line x1="34" y1="78" x2="90" y2="78"/>
        </g>
        <text x="40" y="108" font-size="10" fill="#3e7c59" font-weight="700">down</text>
      </g>
    </svg>
