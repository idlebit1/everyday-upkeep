<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a bedroom ceiling fan being cleaned: an old pillowcase is slipped over one blade to trap the dust, a dust-laden second blade still sits above, a person on a step stool reaches up with the pillowcase, and an extendable duster, a microfiber cloth, and a small plant stand nearby">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- ceiling slab -->
      <rect x="120" y="20" width="320" height="16" rx="6" fill="#f1e9dc"/>
      <!-- downrod + mount -->
      <rect x="274" y="36" width="12" height="40" rx="4" fill="#b9b1a3"/>
      <rect x="262" y="30" width="36" height="12" rx="5" fill="#8a6a4f"/>
      <!-- motor housing -->
      <ellipse cx="280" cy="86" rx="34" ry="20" fill="#fffdf8" stroke="#e6dccb" stroke-width="3"/>
      <ellipse cx="280" cy="84" rx="20" ry="11" fill="#eef4f7"/>
      <!-- light fixture / globe below the housing -->
      <path d="M266 104 q14 22 28 0 z" fill="#faf0da" stroke="#e0a93d" stroke-width="2"/>
      <circle cx="280" cy="118" r="5" fill="#e0a93d"/>
      <!-- pull chains -->
      <line x1="296" y1="100" x2="298" y2="128" stroke="#b9b1a3" stroke-width="1.6"/>
      <circle cx="298" cy="131" r="3" fill="#e0a93d"/>
      <line x1="264" y1="100" x2="262" y2="122" stroke="#b9b1a3" stroke-width="1.6"/>
      <circle cx="262" cy="125" r="3" fill="#b9b1a3"/>

      <!-- back blade, still dusty -->
      <path d="M246 82 l-92 -22 q-12 -2 -12 8 q0 9 12 9 l92 9 z" fill="#c9a06b"/>
      <!-- dust blanket on top of the dusty blade -->
      <path d="M168 64 q-9 -5 0 -7 q14 -2 28 1 q18 2 38 7 q-22 1 -38 1 q-16 0 -28 -3 z" fill="#d8cfbe"/>
      <circle cx="160" cy="61" r="3" fill="#e9e2d8"/>
      <circle cx="186" cy="58" r="2.6" fill="#e9e2d8"/>
      <circle cx="212" cy="62" r="2.4" fill="#d8cfbe"/>
      <text x="120" y="48" font-size="11" fill="#6b7376">dust on top</text>

      <!-- front blade with pillowcase slipped over it -->
      <path d="M314 86 l84 -18 q12 -2 12 8 q0 9 -12 9 l-84 9 z" fill="#c9a06b"/>
      <!-- the pillowcase sleeve over the blade -->
      <path d="M338 72 h66 q12 0 12 12 v8 q0 12 -12 12 h-66 q-9 0 -9 -16 q0 -16 9 -16 z" fill="#eef4f7" stroke="#cdd9de" stroke-width="2.5"/>
      <line x1="338" y1="76" x2="338" y2="100" stroke="#cdd9de" stroke-width="2"/>
      <!-- a faint fresh sparkle near the cleaned blade -->
      <g stroke="#5e9a78" stroke-width="2.2" stroke-linecap="round">
        <path d="M420 70 l0 8 M416 74 l8 0"/>
      </g>

      <!-- person on a step stool reaching up -->
      <!-- step stool -->
      <path d="M392 330 h44 v10 h-44 z" fill="#7fb3c8"/>
      <rect x="394" y="340" width="9" height="52" rx="2.5" fill="#5e9a78"/>
      <rect x="425" y="340" width="9" height="52" rx="2.5" fill="#5e9a78"/>
      <rect x="396" y="362" width="36" height="8" rx="2.5" fill="#9cc3d4"/>
      <!-- body -->
      <path d="M404 330 q8 -40 12 -64 q3 -16 14 -14 q10 2 7 18 q-5 30 -12 60 z" fill="#3e7c59"/>
      <!-- head -->
      <circle cx="430" cy="240" r="15" fill="#e8b48f"/>
      <path d="M418 234 q12 -14 25 -3 q-6 -9 -16 -8 q-9 1 -9 11 z" fill="#8a6a4f"/>
      <!-- raised arm reaching to the blade -->
      <path d="M428 256 q-18 -22 -38 -38" stroke="#3e7c59" stroke-width="11" fill="none" stroke-linecap="round"/>
      <ellipse cx="388" cy="216" rx="9" ry="7" fill="#e8b48f"/>

      <!-- extendable duster leaning, right -->
      <line x1="500" y1="392" x2="520" y2="150" stroke="#8a6a4f" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="520" cy="138" rx="13" ry="22" fill="#5e9a78"/>
      <g stroke="#3e7c59" stroke-width="1.8" stroke-linecap="round">
        <line x1="520" y1="120" x2="520" y2="106"/>
        <line x1="512" y1="124" x2="506" y2="112"/>
        <line x1="528" y1="124" x2="534" y2="112"/>
        <line x1="509" y1="138" x2="496" y2="136"/>
        <line x1="531" y1="138" x2="544" y2="136"/>
      </g>

      <!-- microfiber cloth folded on the floor, front-left -->
      <path d="M70 372 h74 l-6 24 h-62 z" fill="#7fb3c8"/>
      <path d="M70 372 h74 l-4 8 h-66 z" fill="#9cc3d4"/>
      <g stroke="#cdd9de" stroke-width="1.6">
        <line x1="86" y1="384" x2="128" y2="384"/>
        <line x1="84" y1="390" x2="126" y2="390"/>
      </g>

      <!-- small plant for warmth -->
      <path d="M150 350 h26 l-4 26 h-18 z" fill="#c96f4a"/>
      <path d="M162 350 q-3 -20 -12 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M162 350 q4 -18 14 -24" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="147" cy="318" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 147 318)"/>
      <ellipse cx="177" cy="322" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 177 322)"/>
    </svg>
