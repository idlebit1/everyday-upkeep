<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a kitchen counter where a warm wooden cutting board lies flat with a hand rubbing oil into the grain with a folded cloth, a bottle of food-grade mineral oil and a tin of board cream beside it, a window with sun and a small plant nearby">
      <ellipse cx="280" cy="400" rx="245" ry="22" fill="#efe7d8"/>
      <!-- window with sun -->
      <rect x="48" y="46" width="112" height="118" rx="8" fill="#dce8ee" stroke="#e6dccb" stroke-width="3"/>
      <line x1="104" y1="49" x2="104" y2="161" stroke="#fffdf8" stroke-width="4"/>
      <line x1="51" y1="105" x2="157" y2="105" stroke="#fffdf8" stroke-width="4"/>
      <circle cx="82" cy="80" r="15" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="82" y1="56" x2="82" y2="61"/>
        <line x1="106" y1="80" x2="101" y2="80"/>
        <line x1="99" y1="63" x2="95" y2="67"/>
      </g>
      <rect x="36" y="38" width="136" height="10" rx="5" fill="#8a6a4f"/>
      <!-- shelf with plant at right -->
      <rect x="372" y="96" width="150" height="10" rx="5" fill="#8a6a4f"/>
      <path d="M438 96 q-2 -22 -12 -30" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M438 96 q4 -20 14 -26" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="423" cy="60" rx="8" ry="12" fill="#5e9a78" transform="rotate(-28 423 60)"/>
      <ellipse cx="454" cy="64" rx="8" ry="12" fill="#3e7c59" transform="rotate(26 454 64)"/>
      <path d="M424 96 h28 l-4 10 h-20 z" fill="#c96f4a"/>
      <!-- counter -->
      <rect x="36" y="300" width="488" height="16" rx="8" fill="#c9a06b"/>
      <rect x="56" y="316" width="448" height="74" fill="#b9b1a3"/>
      <rect x="76" y="330" width="186" height="46" rx="5" fill="#8a6a4f"/>
      <rect x="298" y="330" width="186" height="46" rx="5" fill="#8a6a4f"/>
      <circle cx="172" cy="353" r="4" fill="#e0a93d"/>
      <circle cx="388" cy="353" r="4" fill="#e0a93d"/>
      <!-- the wooden cutting board, lying flat, freshly oiled and glowing -->
      <rect x="120" y="244" width="232" height="56" rx="14" fill="#c9a06b"/>
      <rect x="120" y="244" width="232" height="56" rx="14" fill="#b07d44" opacity="0.32"/>
      <!-- hanging hole -->
      <circle cx="335" cy="272" r="7" fill="#8a6a4f"/>
      <!-- wood grain lines -->
      <g stroke="#a07338" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
        <path d="M138 260 q90 -6 180 0"/>
        <path d="M138 272 q90 7 180 0"/>
        <path d="M138 284 q90 -5 170 0"/>
      </g>
      <!-- oil sheen highlight -->
      <ellipse cx="210" cy="262" rx="64" ry="9" fill="#faf0da" opacity="0.45"/>
      <!-- hand with folded cloth rubbing oil in -->
      <rect x="186" y="252" width="62" height="26" rx="8" fill="#fffdf8" stroke="#e6dccb" stroke-width="2" transform="rotate(-4 217 265)"/>
      <line x1="207" y1="251" x2="203" y2="277" stroke="#e9e2d8" stroke-width="2"/>
      <line x1="227" y1="252" x2="223" y2="278" stroke="#e9e2d8" stroke-width="2"/>
      <path d="M214 234 q22 -4 40 6 q10 6 6 18 q-3 8 -14 8 l-30 4 q-12 -2 -10 -16 q2 -16 8 -24 z" fill="#d9a978"/>
      <path d="M236 232 q10 -8 18 0" stroke="#b07d44" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- droplet motion arrows showing rubbing -->
      <path d="M170 230 q22 -8 44 -2" stroke="#d98e3b" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="3 4"/>
      <!-- bottle of food-grade mineral oil -->
      <rect x="392" y="206" width="44" height="94" rx="10" fill="#7fb3c8"/>
      <path d="M392 234 h44 v56 a10 10 0 0 1 -10 10 h-24 a10 10 0 0 1 -10 -10 z" fill="#5f93ad" opacity="0.55"/>
      <rect x="405" y="186" width="18" height="22" rx="4" fill="#dce8ee"/>
      <rect x="402" y="180" width="24" height="10" rx="4" fill="#5a4634"/>
      <rect x="399" y="246" width="30" height="36" rx="5" fill="#fffdf8"/>
      <g stroke="#7fb3c8" stroke-width="2.5" stroke-linecap="round">
        <line x1="405" y1="258" x2="423" y2="258"/>
        <line x1="405" y1="267" x2="417" y2="267"/>
        <line x1="405" y1="276" x2="421" y2="276"/>
      </g>
      <!-- small tin of board cream / wax -->
      <ellipse cx="468" cy="296" rx="30" ry="9" fill="#e0a93d"/>
      <rect x="438" y="278" width="60" height="18" fill="#e0a93d"/>
      <ellipse cx="468" cy="278" rx="30" ry="9" fill="#d98e3b"/>
      <ellipse cx="468" cy="278" rx="20" ry="5.5" fill="#faf0da"/>
      <!-- folded backup cloth on the far left -->
      <rect x="96" y="282" width="50" height="18" rx="4" fill="#fffdf8" stroke="#e6dccb" stroke-width="2"/>
      <line x1="113" y1="282" x2="113" y2="300" stroke="#e9e2d8" stroke-width="2"/>
      <line x1="130" y1="282" x2="130" y2="300" stroke="#e9e2d8" stroke-width="2"/>
      <!-- rug -->
      <ellipse cx="280" cy="404" rx="130" ry="10" fill="#b9b1a3" opacity="0.5"/>
    </svg>
