<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of an end-of-season coat clean: a wool winter coat hangs on a sturdy wooden hanger while a hand checks the collar for stains, a care-label tag is held up beside it, a dry-cleaning bag and a breathable cotton garment bag stand ready, a down puffer coat is going into a front-loading washer nearby, a cedar block rests on a shelf, and an open closet waits behind; the scene is tidy and warm">
      <ellipse cx="285" cy="404" rx="252" ry="22" fill="#efe7d8"/>

      <!-- closet behind, on the right -->
      <rect x="392" y="40" width="146" height="316" rx="10" fill="#fffdf8" stroke="#8a6a4f" stroke-width="6"/>
      <rect x="402" y="50" width="126" height="296" rx="5" fill="#efe7d8"/>
      <rect x="408" y="78" width="114" height="7" rx="3" fill="#8a6a4f"/>
      <!-- a couple of hung garments waiting in the closet -->
      <path d="M420 82 q5 -8 10 0" fill="none" stroke="#8a6a4f" stroke-width="2.2"/>
      <path d="M414 90 l11 -8 l11 8 l-4 6 l-4 -3 l0 64 l-6 0 l0 -64 l-4 3 z" fill="#5e9a78"/>
      <path d="M450 82 q5 -8 10 0" fill="none" stroke="#8a6a4f" stroke-width="2.2"/>
      <path d="M444 90 l11 -8 l11 8 l-4 6 l-4 -3 l0 58 l-6 0 l0 -58 l-4 3 z" fill="#c96f4a"/>
      <path d="M480 82 q5 -8 10 0" fill="none" stroke="#8a6a4f" stroke-width="2.2"/>
      <path d="M474 90 l11 -8 l11 8 l-4 6 l-4 -3 l0 54 l-6 0 l0 -54 l-4 3 z" fill="#7fb3c8"/>
      <!-- cedar block on the closet shelf -->
      <rect x="408" y="300" width="138" height="9" rx="2" fill="#8a6a4f"/>
      <rect x="436" y="280" width="42" height="20" rx="4" fill="#c9a06b"/>
      <rect x="436" y="280" width="42" height="7" rx="3" fill="#b9b1a3"/>
      <g stroke="#8a6a4f" stroke-width="1.2" opacity="0.7">
        <path d="M444 284 q9 4 0 10"/>
        <path d="M456 284 q8 4 0 10"/>
        <path d="M466 284 q8 4 0 10"/>
      </g>
      <text x="436" y="274" font-size="10" fill="#8a6a4f" font-weight="700">cedar</text>

      <!-- the wool coat on a sturdy hanger, center-left, being checked -->
      <!-- hook over a rail -->
      <rect x="150" y="44" width="150" height="7" rx="3" fill="#8a6a4f"/>
      <path d="M224 44 q9 -10 0 -18" fill="none" stroke="#8a6a4f" stroke-width="3" stroke-linecap="round"/>
      <!-- sturdy wooden hanger -->
      <path d="M176 64 q48 -16 96 0" fill="none" stroke="#8a6a4f" stroke-width="7" stroke-linecap="round"/>
      <!-- coat body (wool, terracotta) -->
      <path d="M180 70 l44 -10 l44 10 l-6 22 l-10 -6 l0 150 q0 8 -8 8 h-40 q-8 0 -8 -8 l0 -150 l-10 6 z" fill="#c96f4a"/>
      <!-- lapels -->
      <path d="M224 60 l-18 16 l8 70 l10 -78 z" fill="#b9572f"/>
      <path d="M224 60 l18 16 l-8 70 l-10 -78 z" fill="#d9663f"/>
      <!-- collar -->
      <path d="M206 76 l18 -12 l18 12 l-8 8 l-10 -6 l-10 6 z" fill="#b9572f"/>
      <!-- buttons -->
      <circle cx="224" cy="150" r="3.4" fill="#8a6a4f"/>
      <circle cx="224" cy="172" r="3.4" fill="#8a6a4f"/>
      <circle cx="224" cy="194" r="3.4" fill="#8a6a4f"/>
      <!-- a faint collar-oil stain being inspected -->
      <ellipse cx="212" cy="92" rx="7" ry="4" fill="#8a6a4f" opacity="0.4"/>
      <!-- hand checking the collar -->
      <ellipse cx="200" cy="96" rx="13" ry="10" fill="#e8b48f"/>
      <path d="M192 92 q-5 5 -1 12" stroke="#d99c73" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M188 100 q-22 14 -30 40" stroke="#3e7c59" stroke-width="11" fill="none" stroke-linecap="round"/>

      <!-- care-label tag held up beside the coat -->
      <g transform="rotate(-8 96 150)">
        <rect x="70" y="120" width="52" height="60" rx="5" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2.5"/>
        <circle cx="96" cy="128" r="3" fill="none" stroke="#8a6a4f" stroke-width="2"/>
        <line x1="78" y1="142" x2="114" y2="142" stroke="#8a6a4f" stroke-width="1.6"/>
        <line x1="78" y1="150" x2="114" y2="150" stroke="#8a6a4f" stroke-width="1.6"/>
        <line x1="78" y1="158" x2="106" y2="158" stroke="#8a6a4f" stroke-width="1.6"/>
        <!-- a little 'dry clean' circle symbol -->
        <circle cx="88" cy="170" r="5" fill="none" stroke="#3e7c59" stroke-width="2"/>
        <text x="100" y="173" font-size="7.5" fill="#6b7376">label</text>
      </g>

      <!-- dry-cleaning bag standing ready, left-foreground -->
      <path d="M40 230 h58 q4 0 4 6 l0 120 h-66 l0 -120 q0 -6 4 -6 z" fill="#dce8ee" opacity="0.85"/>
      <path d="M40 230 h58 q4 0 4 6 l0 8 h-66 l0 -8 q0 -6 4 -6 z" fill="#cdd9de"/>
      <line x1="69" y1="216" x2="69" y2="230" stroke="#8a6a4f" stroke-width="2.4"/>
      <path d="M62 216 q7 -8 14 0" fill="none" stroke="#8a6a4f" stroke-width="2.4" stroke-linecap="round"/>
      <!-- coat shoulders inside the plastic -->
      <path d="M52 244 l17 -8 l17 8 l-5 8 l-12 -5 l-12 5 z" fill="#5e9a78" opacity="0.8"/>
      <text x="42" y="368" font-size="10" fill="#6b7376">dry-clean bag</text>

      <!-- breathable cotton garment bag beside it -->
      <path d="M112 232 h54 q5 0 5 6 l0 118 q0 6 -5 6 h-54 q-5 0 -5 -6 l0 -118 q0 -6 5 -6 z" fill="#fffdf8" stroke="#b9b1a3" stroke-width="3.5"/>
      <g stroke="#e9e2d8" stroke-width="1.6">
        <line x1="113" y1="262" x2="166" y2="262"/>
        <line x1="113" y1="296" x2="166" y2="296"/>
        <line x1="113" y1="330" x2="166" y2="330"/>
      </g>
      <line x1="139" y1="236" x2="139" y2="358" stroke="#8a6a4f" stroke-width="2.2" stroke-dasharray="4 4"/>
      <circle cx="139" cy="300" r="4.5" fill="#e0a93d"/>
      <path d="M139 224 q8 -8 0 -14" fill="none" stroke="#8a6a4f" stroke-width="2.4" stroke-linecap="round"/>
      <text x="112" y="372" font-size="10" fill="#3e7c59" font-weight="700">breathable</text>

      <!-- down puffer going into a front-loading washer, center-bottom -->
      <rect x="252" y="262" width="116" height="116" rx="12" fill="#fffdf8" stroke="#8a6a4f" stroke-width="5"/>
      <!-- washer door -->
      <circle cx="310" cy="320" r="40" fill="#dce8ee" stroke="#b9b1a3" stroke-width="4"/>
      <circle cx="310" cy="320" r="30" fill="#cdd9de"/>
      <!-- puffer baffles / loft inside the drum -->
      <g fill="#7fb3c8">
        <rect x="288" y="302" width="44" height="9" rx="4"/>
        <rect x="286" y="314" width="48" height="9" rx="4"/>
        <rect x="288" y="326" width="44" height="9" rx="4"/>
      </g>
      <!-- dryer balls hint -->
      <circle cx="296" cy="312" r="4" fill="#fffdf8" opacity="0.85"/>
      <circle cx="324" cy="330" r="4" fill="#fffdf8" opacity="0.85"/>
      <!-- control knob -->
      <circle cx="356" cy="276" r="6" fill="#5e9a78"/>
      <text x="256" y="372" font-size="10" fill="#6b7376">down → washer</text>
    </svg>
