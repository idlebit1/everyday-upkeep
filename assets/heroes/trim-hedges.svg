<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a person trimming a neat green hedge with hedge shears, the hedge shaped slightly wider at the base than the top, with fresh clippings falling onto a tarp, under a bright sun with a fence behind">
      <ellipse cx="290" cy="402" rx="250" ry="22" fill="#efe7d8"/>
      <circle cx="478" cy="64" r="26" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="4" stroke-linecap="round">
        <line x1="478" y1="20" x2="478" y2="30"/>
        <line x1="478" y1="98" x2="478" y2="108"/>
        <line x1="434" y1="64" x2="444" y2="64"/>
        <line x1="512" y1="64" x2="522" y2="64"/>
        <line x1="447" y1="33" x2="454" y2="40"/>
        <line x1="502" y1="88" x2="509" y2="95"/>
        <line x1="509" y1="33" x2="502" y2="40"/>
      </g>
      <ellipse cx="120" cy="78" rx="46" ry="22" fill="#dce8ee"/>
      <ellipse cx="170" cy="92" rx="30" ry="16" fill="#dce8ee"/>
      <ellipse cx="330" cy="56" rx="34" ry="17" fill="#dce8ee"/>
      <!-- fence behind -->
      <g fill="#b9b1a3">
        <rect x="40" y="190" width="14" height="70" rx="4"/>
        <rect x="100" y="190" width="14" height="70" rx="4"/>
        <rect x="160" y="190" width="14" height="70" rx="4"/>
      </g>
      <rect x="32" y="204" width="156" height="9" rx="4.5" fill="#8a6a4f"/>
      <rect x="32" y="234" width="156" height="9" rx="4.5" fill="#8a6a4f"/>
      <!-- formal hedge: trapezoid, wider at base than top -->
      <path d="M60 360 L96 232 L300 232 L336 360 Z" fill="#2c5a40"/>
      <path d="M60 360 L96 232 L300 232 L312 282 Q198 264 84 282 Z" fill="#3e7c59"/>
      <path d="M84 300 Q198 284 312 300 L320 332 Q198 318 76 332 Z" fill="#5e9a78" opacity="0.5"/>
      <!-- clipped texture on the hedge -->
      <g stroke="#2c5a40" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
        <path d="M120 252 v-8 M150 248 v-8 M188 246 v-8 M228 248 v-8 M266 252 v-8"/>
        <path d="M108 286 v-7 M146 282 v-7 M198 280 v-7 M252 282 v-7 M290 286 v-7"/>
        <path d="M96 322 v-7 M150 318 v-7 M210 316 v-7 M268 318 v-7"/>
      </g>
      <!-- freshly trimmed sprigs on top -->
      <g stroke="#5e9a78" stroke-width="2.5" stroke-linecap="round" fill="none">
        <path d="M150 232 l-4 -10 M158 232 l3 -9"/>
        <path d="M236 232 l-4 -10 M244 232 l3 -9"/>
      </g>
      <!-- tarp with clippings at the base -->
      <ellipse cx="200" cy="376" rx="120" ry="16" fill="#7fb3c8" opacity="0.55"/>
      <g stroke="#3e7c59" stroke-width="2.5" stroke-linecap="round">
        <line x1="150" y1="372" x2="162" y2="378"/>
        <line x1="186" y1="378" x2="200" y2="372"/>
        <line x1="226" y1="374" x2="240" y2="380"/>
        <line x1="170" y1="382" x2="184" y2="382"/>
      </g>
      <g fill="#5e9a78"><circle cx="172" cy="376" r="2.5"/><circle cx="214" cy="380" r="2.5"/><circle cx="156" cy="382" r="2.5"/></g>
      <!-- person trimming with shears -->
      <g>
        <circle cx="430" cy="216" r="16" fill="#e0a93d"/>
        <path d="M418 206 q12 -12 24 0 q-2 -8 -12 -8 q-10 0 -12 8" fill="#8a6a4f"/>
        <path d="M422 258 L416 320 L448 320 L442 258 Z" fill="#c96f4a"/>
        <rect x="417" y="318" width="12" height="40" rx="4" fill="#33393b"/>
        <rect x="435" y="318" width="12" height="40" rx="4" fill="#33393b"/>
        <!-- arms reaching toward the hedge top with shears -->
        <line x1="426" y1="266" x2="356" y2="244" stroke="#5e9a78" stroke-width="9" stroke-linecap="round"/>
        <line x1="438" y1="266" x2="360" y2="252" stroke="#5e9a78" stroke-width="9" stroke-linecap="round"/>
      </g>
      <!-- hedge shears -->
      <g>
        <line x1="360" y1="248" x2="316" y2="234" stroke="#33393b" stroke-width="5" stroke-linecap="round"/>
        <line x1="360" y1="254" x2="318" y2="246" stroke="#b9b1a3" stroke-width="5" stroke-linecap="round"/>
        <circle cx="360" cy="251" r="6" fill="#e0a93d"/>
        <circle cx="360" cy="251" r="2.5" fill="#fffdf8"/>
      </g>
      <!-- a few clippings flying off the cut -->
      <g stroke="#5e9a78" stroke-width="2.5" stroke-linecap="round">
        <line x1="324" y1="226" x2="318" y2="218"/>
        <line x1="332" y1="222" x2="330" y2="212"/>
      </g>
      <!-- ground tufts -->
      <g stroke="#3e7c59" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M70 392 q-3 -12 -8 -17"/>
        <path d="M500 394 q-3 -12 -8 -17"/>
        <path d="M512 392 q2 -13 7 -19"/>
      </g>
    </svg>
