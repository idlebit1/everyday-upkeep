<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of contact case and solution care on a clean bathroom counter: a grimy old two-well contact case is going into a small bin, while fresh solution is poured from a tall bottle into a brand-new clean case beside it, the bottle showing a discard-after-opening date, and a pair of freshly washed hands nearby">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- bathroom counter surface -->
      <rect x="36" y="330" width="498" height="14" rx="5" fill="#c9a06b"/>
      <rect x="36" y="344" width="498" height="10" rx="4" fill="#b9b1a3"/>

      <!-- tall bottle of contact solution, pouring, center -->
      <rect x="246" y="70" width="66" height="150" rx="14" fill="#7fb3c8" transform="rotate(28 279 145)"/>
      <rect x="246" y="70" width="66" height="52" rx="14" fill="#9cc3d4" transform="rotate(28 279 145)"/>
      <!-- cap, tipped -->
      <rect x="300" y="52" width="30" height="30" rx="6" fill="#5e9a78" transform="rotate(28 315 67)"/>
      <!-- discard-after-opening label on the bottle -->
      <rect x="238" y="150" width="52" height="44" rx="6" fill="#fffdf8" transform="rotate(28 264 172)"/>
      <text x="264" y="170" font-size="9" fill="#d9663f" font-weight="700" text-anchor="middle" transform="rotate(28 264 170)">discard</text>
      <text x="264" y="182" font-size="9" fill="#6b7376" text-anchor="middle" transform="rotate(28 264 182)">90 days</text>
      <!-- the pour stream, into the new case -->
      <path d="M336 150 q22 34 30 74" fill="none" stroke="#9cc3d4" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
      <path d="M340 150 q20 30 26 66" fill="none" stroke="#dce8ee" stroke-width="2.4" stroke-linecap="round"/>

      <!-- brand-new clean case, receiving fresh solution, center-front -->
      <ellipse cx="360" cy="304" rx="60" ry="17" fill="#5e9a78"/>
      <ellipse cx="360" cy="300" rx="60" ry="15" fill="#3e7c59"/>
      <ellipse cx="338" cy="298" rx="18" ry="8" fill="#2c5a40"/>
      <ellipse cx="338" cy="296" rx="14" ry="6" fill="#7fb3c8"/>
      <ellipse cx="382" cy="298" rx="18" ry="8" fill="#2c5a40"/>
      <ellipse cx="382" cy="296" rx="14" ry="6" fill="#7fb3c8"/>
      <!-- little sparkle marking the fresh case -->
      <g stroke="#e0a93d" stroke-width="2.2" stroke-linecap="round">
        <path d="M410 268 l0 10 M405 273 l10 0"/>
      </g>
      <text x="360" y="328" font-size="10" fill="#2c5a40" font-weight="700" text-anchor="middle">fresh case</text>

      <!-- small bin, left, with grimy old case going in -->
      <path d="M70 288 h74 l-8 74 h-58 z" fill="#b9b1a3"/>
      <path d="M64 282 h86 l-2 12 h-82 z" fill="#8a6a4f"/>
      <rect x="98" y="272" width="18" height="8" rx="3" fill="#8a6a4f"/>
      <!-- old grimy case tipping into the bin -->
      <ellipse cx="108" cy="266" rx="34" ry="11" fill="#8a6a4f" transform="rotate(-18 108 266)"/>
      <ellipse cx="108" cy="262" rx="34" ry="9" fill="#6b5844" transform="rotate(-18 108 262)"/>
      <g fill="#5a4636" opacity="0.7" transform="rotate(-18 108 262)">
        <circle cx="94" cy="260" r="3"/>
        <circle cx="116" cy="263" r="2.6"/>
        <circle cx="106" cy="258" r="2"/>
      </g>
      <!-- little "germy" wisps off the old case -->
      <g stroke="#8a6a4f" stroke-width="2" stroke-linecap="round" opacity="0.6">
        <path d="M88 240 q-4 -8 2 -14"/>
        <path d="M100 234 q-3 -8 3 -13"/>
      </g>
      <text x="108" y="378" font-size="10" fill="#8a6a4f" font-weight="700" text-anchor="middle">old case → bin</text>

      <!-- freshly washed hands, upper-right -->
      <!-- forearm -->
      <path d="M470 250 q18 30 12 74" stroke="#e8b48f" stroke-width="24" fill="none" stroke-linecap="round"/>
      <!-- palm cupped -->
      <path d="M452 214 q-14 14 -8 38 q4 18 26 22 q26 4 38 -14 q8 -14 0 -30 z" fill="#e8b48f"/>
      <!-- fingers -->
      <path d="M460 208 q4 -14 14 -12 q8 2 6 16" fill="#e8b48f"/>
      <path d="M476 202 q4 -14 14 -12 q8 2 6 16" fill="#e8b48f"/>
      <path d="M492 202 q4 -12 13 -10 q7 2 5 14" fill="#e8b48f"/>
      <!-- soap suds on the hands -->
      <g fill="#fffdf8">
        <circle cx="466" cy="220" r="6"/>
        <circle cx="482" cy="214" r="7"/>
        <circle cx="498" cy="220" r="5"/>
      </g>
      <text x="484" y="298" font-size="10" fill="#3e7c59" font-weight="700" text-anchor="middle">clean hands</text>

      <!-- folded towel, front-left corner of the counter -->
      <path d="M44 356 h80 l-6 24 h-68 z" fill="#7fb3c8"/>
      <path d="M44 356 h80 l-4 9 h-72 z" fill="#9cc3d4"/>
      <g stroke="#cdd9de" stroke-width="1.6">
        <line x1="58" y1="370" x2="108" y2="370"/>
        <line x1="56" y1="376" x2="106" y2="376"/>
      </g>

      <!-- bar of soap by the towel -->
      <rect x="176" y="358" width="40" height="20" rx="8" fill="#c96f4a"/>
      <rect x="176" y="358" width="40" height="9" rx="6" fill="#d9663f"/>
      <circle cx="188" cy="352" r="4" fill="#fffdf8" opacity="0.85"/>
      <circle cx="198" cy="348" r="3" fill="#fffdf8" opacity="0.7"/>
    </svg>
