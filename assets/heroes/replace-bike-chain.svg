<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a bike drivetrain in a workshop: a rear cassette and front chainring linked by a chain, a chain-wear checker tool dropped onto the chain, a hand holding chain-breaker and quick-link pliers nearby, and a fresh replacement chain coiled on the bench">
      <ellipse cx="280" cy="402" rx="252" ry="22" fill="#efe7d8"/>
      <!-- workshop pegboard / wall -->
      <rect x="36" y="30" width="180" height="120" rx="8" fill="#fffdf8" stroke="#b9b1a3" stroke-width="3"/>
      <g fill="#c9a06b" opacity="0.6">
        <circle cx="64" cy="58" r="3"/><circle cx="96" cy="58" r="3"/><circle cx="128" cy="58" r="3"/><circle cx="160" cy="58" r="3"/><circle cx="192" cy="58" r="3"/>
        <circle cx="64" cy="92" r="3"/><circle cx="96" cy="92" r="3"/><circle cx="128" cy="92" r="3"/><circle cx="160" cy="92" r="3"/><circle cx="192" cy="92" r="3"/>
        <circle cx="64" cy="126" r="3"/><circle cx="96" cy="126" r="3"/><circle cx="128" cy="126" r="3"/><circle cx="160" cy="126" r="3"/><circle cx="192" cy="126" r="3"/>
      </g>
      <!-- hung tool silhouette on the wall -->
      <rect x="84" y="64" width="9" height="40" rx="3" fill="#5e9a78"/>
      <rect x="78" y="58" width="21" height="9" rx="3" fill="#3e7c59"/>
      <!-- workbench top -->
      <rect x="0" y="346" width="560" height="22" rx="4" fill="#8a6a4f"/>
      <rect x="0" y="368" width="560" height="8" fill="#6f543c"/>

      <!-- ===== drivetrain glow ===== -->
      <ellipse cx="300" cy="246" rx="200" ry="96" fill="#faf0da" opacity="0.7"/>

      <!-- rear cassette (stack of cogs) -->
      <g>
        <circle cx="150" cy="250" r="62" fill="#dce8ee"/>
        <circle cx="150" cy="250" r="62" fill="none" stroke="#b9b1a3" stroke-width="3"/>
        <circle cx="150" cy="250" r="48" fill="none" stroke="#8a6a4f" stroke-width="4"/>
        <circle cx="150" cy="250" r="35" fill="none" stroke="#8a6a4f" stroke-width="4"/>
        <circle cx="150" cy="250" r="22" fill="none" stroke="#8a6a4f" stroke-width="4"/>
        <circle cx="150" cy="250" r="9" fill="#6f543c"/>
        <!-- cog teeth on the outer ring -->
        <g stroke="#8a6a4f" stroke-width="4" stroke-linecap="round">
          <line x1="150" y1="188" x2="150" y2="180"/>
          <line x1="194" y1="206" x2="200" y2="200"/>
          <line x1="212" y1="250" x2="220" y2="250"/>
          <line x1="194" y1="294" x2="200" y2="300"/>
          <line x1="150" y1="312" x2="150" y2="320"/>
          <line x1="106" y1="294" x2="100" y2="300"/>
          <line x1="88" y1="250" x2="80" y2="250"/>
          <line x1="106" y1="206" x2="100" y2="200"/>
        </g>
      </g>

      <!-- front chainring -->
      <g>
        <circle cx="408" cy="262" r="56" fill="none" stroke="#d98e3b" stroke-width="9"/>
        <circle cx="408" cy="262" r="11" fill="#8a6a4f"/>
        <g stroke="#d98e3b" stroke-width="5" stroke-linecap="round">
          <line x1="408" y1="200" x2="408" y2="192"/>
          <line x1="452" y1="218" x2="458" y2="212"/>
          <line x1="470" y1="262" x2="478" y2="262"/>
          <line x1="452" y1="306" x2="458" y2="312"/>
          <line x1="408" y1="324" x2="408" y2="332"/>
          <line x1="364" y1="306" x2="358" y2="312"/>
          <line x1="346" y1="262" x2="338" y2="262"/>
          <line x1="364" y1="218" x2="358" y2="212"/>
        </g>
        <!-- crank arm -->
        <line x1="408" y1="262" x2="436" y2="312" stroke="#2c5a40" stroke-width="8" stroke-linecap="round"/>
      </g>

      <!-- chain spanning cassette to chainring -->
      <line x1="150" y1="190" x2="408" y2="206" stroke="#6b7376" stroke-width="8" stroke-linecap="round"/>
      <line x1="150" y1="190" x2="408" y2="206" stroke="#b9b1a3" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round"/>
      <line x1="150" y1="312" x2="408" y2="318" stroke="#6b7376" stroke-width="8" stroke-linecap="round"/>
      <line x1="150" y1="312" x2="408" y2="318" stroke="#b9b1a3" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round"/>

      <!-- chain-wear checker dropped onto the lower span -->
      <rect x="232" y="296" width="96" height="16" rx="6" fill="#e0a93d" transform="rotate(2 280 304)"/>
      <path d="M242 312 v18" stroke="#d98e3b" stroke-width="7" stroke-linecap="round"/>
      <path d="M318 314 v22" stroke="#d98e3b" stroke-width="7" stroke-linecap="round"/>
      <rect x="262" y="284" width="36" height="13" rx="5" fill="#d9663f"/>
      <text x="280" y="294" font-size="10" font-weight="700" fill="#fffdf8" text-anchor="middle">0.5%</text>

      <!-- a hand holding quick-link / chain-breaker pliers, upper right -->
      <rect x="448" y="118" width="58" height="13" rx="5" fill="#5e9a78" transform="rotate(34 477 124)"/>
      <rect x="452" y="146" width="58" height="13" rx="5" fill="#3e7c59" transform="rotate(20 481 152)"/>
      <circle cx="450" cy="138" r="6" fill="#2c5a40"/>
      <!-- hand grip -->
      <ellipse cx="492" cy="176" rx="20" ry="15" fill="#c9a06b"/>
      <path d="M480 170 q-6 7 -1 15" stroke="#8a6a4f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M500 198 q14 22 34 26" stroke="#3e7c59" stroke-width="12" fill="none" stroke-linecap="round"/>

      <!-- fresh replacement chain, coiled on the bench (right) -->
      <ellipse cx="470" cy="336" rx="44" ry="16" fill="none" stroke="#7fb3c8" stroke-width="9"/>
      <ellipse cx="470" cy="336" rx="44" ry="16" fill="none" stroke="#dce8ee" stroke-width="4" stroke-dasharray="6 5"/>
      <ellipse cx="478" cy="330" rx="30" ry="11" fill="none" stroke="#7fb3c8" stroke-width="8"/>
      <ellipse cx="478" cy="330" rx="30" ry="11" fill="none" stroke="#dce8ee" stroke-width="3.5" stroke-dasharray="6 5"/>
      <text x="470" y="362" font-size="11" fill="#3e7c59" font-weight="700" text-anchor="middle">new chain</text>

      <!-- quick link on the bench, front -->
      <rect x="208" y="354" width="40" height="14" rx="7" fill="none" stroke="#5e9a78" stroke-width="4"/>
      <circle cx="216" cy="361" r="4" fill="#5e9a78"/>
      <circle cx="240" cy="361" r="4" fill="#5e9a78"/>

      <!-- small greenery for warmth -->
      <circle cx="40" cy="384" r="14" fill="#5e9a78"/>
      <circle cx="60" cy="390" r="11" fill="#3e7c59"/>
      <ellipse cx="520" cy="388" rx="8" ry="12" fill="#5e9a78" transform="rotate(-22 520 388)"/>
    </svg>
