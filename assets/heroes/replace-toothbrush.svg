<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a bathroom counter with a cup holding a fresh toothbrush and a worn, splayed toothbrush, an electric toothbrush on its charger, a toothpaste tube, and a wall calendar marking the three-month swap">
      <ellipse cx="280" cy="400" rx="240" ry="22" fill="#efe7d8"/>
      <!-- mirror -->
      <rect x="208" y="48" width="168" height="128" rx="16" fill="#dce8ee" stroke="#b9b1a3" stroke-width="5"/>
      <line x1="244" y1="156" x2="332" y2="68" stroke="#fffdf8" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
      <line x1="270" y1="160" x2="346" y2="84" stroke="#fffdf8" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
      <!-- wall calendar -->
      <rect x="72" y="80" width="92" height="100" rx="8" fill="#fffdf8" stroke="#e6dccb" stroke-width="2"/>
      <rect x="72" y="80" width="92" height="24" rx="8" fill="#c96f4a"/>
      <rect x="72" y="96" width="92" height="8" fill="#c96f4a"/>
      <g fill="#b9b1a3">
        <circle cx="90" cy="120" r="3.5"/><circle cx="108" cy="120" r="3.5"/><circle cx="126" cy="120" r="3.5"/><circle cx="144" cy="120" r="3.5"/>
        <circle cx="90" cy="138" r="3.5"/><circle cx="108" cy="138" r="3.5"/><circle cx="126" cy="138" r="3.5"/><circle cx="144" cy="138" r="3.5"/>
        <circle cx="90" cy="156" r="3.5"/><circle cx="108" cy="156" r="3.5"/>
      </g>
      <circle cx="126" cy="138" r="3.5" fill="#3e7c59"/>
      <circle cx="126" cy="138" r="9" fill="none" stroke="#e0a93d" stroke-width="3"/>
      <!-- counter -->
      <rect x="56" y="300" width="448" height="16" rx="8" fill="#b9b1a3"/>
      <rect x="84" y="316" width="14" height="72" fill="#8a6a4f"/>
      <rect x="462" y="316" width="14" height="72" fill="#8a6a4f"/>
      <!-- plant -->
      <polygon points="106,300 142,300 136,264 112,264" fill="#c96f4a"/>
      <circle cx="112" cy="248" r="14" fill="#5e9a78"/>
      <circle cx="136" cy="244" r="15" fill="#3e7c59"/>
      <circle cx="124" cy="230" r="12" fill="#5e9a78"/>
      <!-- cup with two brushes -->
      <rect x="236" y="242" width="68" height="58" rx="9" fill="#c96f4a"/>
      <rect x="236" y="242" width="68" height="12" rx="6" fill="#d9663f"/>
      <!-- fresh brush (green) -->
      <rect x="250" y="168" width="11" height="84" rx="5.5" fill="#3e7c59"/>
      <rect x="248" y="142" width="15" height="30" rx="7" fill="#5e9a78"/>
      <g stroke="#7fb3c8" stroke-width="2.6" stroke-linecap="round">
        <line x1="250" y1="140" x2="250" y2="126"/>
        <line x1="255.5" y1="140" x2="255.5" y2="124"/>
        <line x1="261" y1="140" x2="261" y2="126"/>
      </g>
      <!-- worn brush (gold, splayed) -->
      <rect x="280" y="172" width="11" height="80" rx="5.5" fill="#e0a93d"/>
      <rect x="278" y="148" width="15" height="28" rx="7" fill="#d98e3b"/>
      <g stroke="#b9b1a3" stroke-width="2.6" stroke-linecap="round">
        <line x1="281" y1="146" x2="272" y2="134"/>
        <line x1="285.5" y1="146" x2="282" y2="130"/>
        <line x1="285.5" y1="146" x2="290" y2="131"/>
        <line x1="290" y1="146" x2="299" y2="135"/>
      </g>
      <!-- toothpaste tube -->
      <rect x="330" y="278" width="76" height="22" rx="11" fill="#dce8ee"/>
      <rect x="322" y="282" width="12" height="14" rx="3" fill="#e0a93d"/>
      <path d="M348 289 q8 -6 16 0 q8 6 16 0" stroke="#7fb3c8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- electric brush on charger -->
      <rect x="420" y="286" width="58" height="14" rx="7" fill="#8a6a4f"/>
      <rect x="436" y="196" width="26" height="94" rx="12" fill="#7fb3c8"/>
      <circle cx="449" cy="244" r="4.5" fill="#fffdf8"/>
      <rect x="444" y="172" width="10" height="28" rx="5" fill="#dce8ee"/>
      <rect x="440" y="142" width="18" height="34" rx="9" fill="#5e9a78"/>
      <g stroke="#dce8ee" stroke-width="2.4" stroke-linecap="round">
        <line x1="445" y1="146" x2="445" y2="138"/>
        <line x1="449" y1="146" x2="449" y2="136"/>
        <line x1="453" y1="146" x2="453" y2="138"/>
      </g>
      <!-- sparkles -->
      <g stroke="#e0a93d" stroke-width="2.5" stroke-linecap="round">
        <line x1="222" y1="206" x2="222" y2="218"/>
        <line x1="216" y1="212" x2="228" y2="212"/>
        <line x1="316" y1="190" x2="316" y2="200"/>
        <line x1="311" y1="195" x2="321" y2="195"/>
      </g>
      <circle cx="206" cy="262" r="3" fill="#7fb3c8"/>
      <circle cx="326" cy="232" r="3" fill="#7fb3c8"/>
      <!-- soap dish -->
      <circle cx="190" cy="386" r="13" fill="#5e9a78"/>
      <circle cx="212" cy="390" r="10" fill="#3e7c59"/>
    </svg>
