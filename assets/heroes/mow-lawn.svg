<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a person pushing a green lawn mower across a striped lawn, leaving a freshly cut light-green stripe behind, under a bright sun with a fence and shrubs in the background">
      <ellipse cx="290" cy="402" rx="250" ry="22" fill="#efe7d8"/>
      <circle cx="478" cy="64" r="26" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="4" stroke-linecap="round">
        <line x1="478" y1="20" x2="478" y2="30"/>
        <line x1="478" y1="98" x2="478" y2="108"/>
        <line x1="434" y1="64" x2="444" y2="64"/>
        <line x1="512" y1="64" x2="522" y2="64"/>
        <line x1="447" y1="33" x2="454" y2="40"/>
        <line x1="502" y1="88" x2="509" y2="95"/>
        <line x1="509" y1="33" x2="502" y2="40"/>
      </g>
      <ellipse cx="120" cy="78" rx="46" ry="22" fill="#dce8ee"/>
      <ellipse cx="170" cy="92" rx="30" ry="16" fill="#dce8ee"/>
      <ellipse cx="330" cy="56" rx="34" ry="17" fill="#dce8ee"/>
      <!-- fence -->
      <g fill="#b9b1a3">
        <rect x="36" y="196" width="14" height="74" rx="4"/>
        <rect x="76" y="196" width="14" height="74" rx="4"/>
        <rect x="116" y="196" width="14" height="74" rx="4"/>
        <rect x="156" y="196" width="14" height="74" rx="4"/>
        <rect x="196" y="196" width="14" height="74" rx="4"/>
      </g>
      <rect x="28" y="208" width="190" height="10" rx="5" fill="#8a6a4f"/>
      <rect x="28" y="240" width="190" height="10" rx="5" fill="#8a6a4f"/>
      <!-- shrubs -->
      <circle cx="262" cy="248" r="28" fill="#2c5a40"/>
      <circle cx="296" cy="258" r="22" fill="#3e7c59"/>
      <circle cx="510" cy="262" r="26" fill="#5e9a78"/>
      <circle cx="540" cy="272" r="18" fill="#3e7c59"/>
      <!-- lawn -->
      <path d="M10 290 Q280 262 550 290 L550 392 Q280 412 10 392 Z" fill="#3e7c59"/>
      <!-- freshly cut light stripe behind the mower -->
      <path d="M150 300 Q280 286 470 300 L460 392 Q300 408 168 392 Z" fill="#5e9a78" opacity="0.7"/>
      <!-- mowing-stripe banding -->
      <g fill="#2c5a40" opacity="0.18">
        <path d="M30 296 Q90 290 150 296 L150 388 Q90 402 30 388 Z"/>
        <path d="M470 300 Q510 296 548 300 L548 388 Q510 402 470 388 Z"/>
      </g>
      <!-- grass tufts -->
      <g stroke="#2c5a40" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M60 340 v-12 M67 340 l4 -10 M53 340 l-4 -10"/>
        <path d="M90 384 v-11 M97 384 l4 -9 M83 384 l-4 -9"/>
        <path d="M520 376 v-12 M527 376 l4 -10 M513 376 l-4 -10"/>
      </g>
      <!-- person -->
      <g>
        <circle cx="368" cy="244" r="16" fill="#e0a93d"/>
        <path d="M356 234 q12 -12 24 0 q-2 -8 -12 -8 q-10 0 -12 8" fill="#8a6a4f"/>
        <path d="M362 286 L356 318 L388 318 L382 286 Z" fill="#7fb3c8"/>
        <rect x="357" y="316" width="12" height="34" rx="4" fill="#33393b"/>
        <rect x="375" y="316" width="12" height="34" rx="4" fill="#33393b"/>
        <!-- arms reaching to the handle -->
        <line x1="366" y1="290" x2="318" y2="318" stroke="#c96f4a" stroke-width="9" stroke-linecap="round"/>
        <line x1="380" y1="290" x2="324" y2="312" stroke="#c96f4a" stroke-width="9" stroke-linecap="round"/>
      </g>
      <!-- mower -->
      <g>
        <!-- handle -->
        <line x1="318" y1="320" x2="246" y2="362" stroke="#33393b" stroke-width="8" stroke-linecap="round"/>
        <line x1="246" y1="362" x2="226" y2="372" stroke="#33393b" stroke-width="8" stroke-linecap="round"/>
        <!-- grass catcher -->
        <path d="M246 370 L300 364 L296 392 L240 392 Z" fill="#5e9a78"/>
        <path d="M246 370 L300 364 L298 374 L246 380 Z" fill="#3e7c59"/>
        <!-- deck -->
        <rect x="288" y="360" width="78" height="30" rx="8" fill="#3e7c59"/>
        <rect x="294" y="350" width="40" height="16" rx="5" fill="#2c5a40"/>
        <circle cx="352" cy="358" r="6" fill="#fffdf8" stroke="#2c5a40" stroke-width="2"/>
        <!-- wheels -->
        <circle cx="298" cy="392" r="16" fill="#33393b"/>
        <circle cx="298" cy="392" r="6" fill="#b9b1a3"/>
        <circle cx="360" cy="392" r="16" fill="#33393b"/>
        <circle cx="360" cy="392" r="6" fill="#b9b1a3"/>
      </g>
      <!-- clippings spray -->
      <g fill="#5e9a78">
        <path d="M286 372 l-8 -3 M280 378 l-9 -1 M284 384 l-8 1"/>
      </g>
      <g stroke="#3e7c59" stroke-width="2.5" stroke-linecap="round">
        <line x1="284" y1="372" x2="274" y2="368"/>
        <line x1="282" y1="380" x2="271" y2="380"/>
        <line x1="284" y1="386" x2="274" y2="390"/>
      </g>
      <circle cx="120" cy="392" r="13" fill="#5e9a78"/>
      <circle cx="142" cy="396" r="10" fill="#3e7c59"/>
    </svg>
