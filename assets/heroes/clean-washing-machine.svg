<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a laundry room with a front-loading washing machine: its round glass door is open, a hand-held microfiber cloth wipes the rubber door gasket where black mold collects, the detergent drawer is pulled out beside it, a bottle of white vinegar and a washer-cleaning tablet sit on top, and a laundry basket and a small plant stand nearby">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- wall shelf with supplies -->
      <rect x="40" y="86" width="150" height="10" rx="5" fill="#8a6a4f"/>
      <rect x="56" y="50" width="26" height="46" rx="5" fill="#5e9a78"/>
      <rect x="62" y="42" width="14" height="10" rx="2.5" fill="#2c5a40"/>
      <rect x="94" y="60" width="34" height="36" rx="4" fill="#dce8ee"/>
      <rect x="100" y="68" width="22" height="6" rx="3" fill="#fffdf8"/>
      <rect x="140" y="56" width="22" height="40" rx="4" fill="#c96f4a"/>
      <!-- a faint fresh sparkle near the shelf -->
      <g stroke="#5e9a78" stroke-width="2.2" stroke-linecap="round">
        <path d="M176 64 l0 8 M172 68 l8 0"/>
      </g>

      <!-- detergent bottle + cleaning tablet on top of the washer -->
      <rect x="446" y="120" width="30" height="42" rx="6" fill="#7fb3c8"/>
      <rect x="452" y="112" width="14" height="10" rx="3" fill="#5e9a78"/>
      <rect x="450" y="134" width="22" height="14" rx="3" fill="#dce8ee"/>
      <!-- white vinegar bottle -->
      <rect x="486" y="116" width="26" height="46" rx="6" fill="#eef4f7" stroke="#cdd9de" stroke-width="2"/>
      <rect x="492" y="108" width="14" height="9" rx="3" fill="#e0a93d"/>
      <rect x="490" y="130" width="18" height="16" rx="3" fill="#fffdf8"/>
      <line x1="494" y1="136" x2="504" y2="136" stroke="#b9b1a3" stroke-width="1.6"/>
      <line x1="494" y1="141" x2="502" y2="141" stroke="#b9b1a3" stroke-width="1.6"/>
      <!-- round cleaning tablet -->
      <circle cx="522" cy="152" r="11" fill="#fffdf8" stroke="#d8cfbe" stroke-width="2"/>
      <circle cx="522" cy="152" r="4.5" fill="#e3efe8"/>

      <!-- washer body -->
      <rect x="300" y="162" width="190" height="204" rx="20" fill="#fffdf8" stroke="#e6dccb" stroke-width="3"/>
      <!-- control panel -->
      <rect x="312" y="172" width="166" height="30" rx="9" fill="#eef4f7"/>
      <circle cx="330" cy="187" r="11" fill="#e0a93d" stroke="#8a6a4f" stroke-width="2"/>
      <line x1="330" y1="187" x2="330" y2="180" stroke="#33393b" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="352" y="183" width="40" height="8" rx="4" fill="#dce8ee"/>
      <rect x="400" y="183" width="22" height="8" rx="4" fill="#dce8ee"/>
      <!-- detergent dispenser drawer, pulled open -->
      <rect x="430" y="173" width="42" height="26" rx="5" fill="#dce8ee" stroke="#b9b1a3" stroke-width="2"/>
      <rect x="436" y="180" width="12" height="12" rx="2.5" fill="#eef4f7"/>
      <rect x="452" y="180" width="14" height="12" rx="2.5" fill="#eef4f7"/>
      <rect x="446" y="197" width="10" height="5" rx="2.5" fill="#b9b1a3"/>
      <!-- open round door -->
      <circle cx="384" cy="284" r="70" fill="#dce8ee" stroke="#b9b1a3" stroke-width="3"/>
      <circle cx="384" cy="284" r="52" fill="#eef4f7"/>
      <!-- the open glass door swung to the side -->
      <path d="M454 284 a70 70 0 0 1 -8 35 l-22 -12 a44 44 0 0 0 6 -23 z" fill="#cfe0e8" opacity="0.6"/>
      <!-- the rubber door gasket fold being wiped -->
      <circle cx="384" cy="284" r="52" fill="none" stroke="#8a6a4f" stroke-width="6"/>
      <!-- black mold spots tucked in the gasket fold -->
      <circle cx="350" cy="318" r="4" fill="#33393b" opacity="0.55"/>
      <circle cx="362" cy="326" r="3" fill="#33393b" opacity="0.5"/>
      <circle cx="340" cy="306" r="2.5" fill="#33393b" opacity="0.45"/>
      <!-- feet -->
      <rect x="320" y="362" width="16" height="14" rx="3" fill="#b9b1a3"/>
      <rect x="454" y="362" width="16" height="14" rx="3" fill="#b9b1a3"/>

      <!-- hand with microfiber cloth wiping the gasket -->
      <path d="M236 332 q34 -10 70 -22 q22 -7 38 6 q10 9 -2 18 q-30 22 -66 26 q-26 3 -40 -8 q-12 -10 0 -20 z" fill="#c96f4a"/>
      <path d="M250 326 q30 -8 58 -18" stroke="#a85638" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <ellipse cx="232" cy="346" rx="20" ry="14" fill="#e8b48f"/>
      <path d="M222 340 q-6 6 -2 14" stroke="#d99c73" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- laundry basket front-left -->
      <path d="M70 344 h84 l-9 46 h-66 z" fill="#e0a93d"/>
      <path d="M66 342 h92 l-3 11 h-86 z" fill="#d98e3b"/>
      <g stroke="#b27e22" stroke-width="2" stroke-linecap="round">
        <line x1="88" y1="356" x2="85" y2="388"/>
        <line x1="112" y1="356" x2="112" y2="388"/>
        <line x1="136" y1="356" x2="139" y2="388"/>
      </g>
      <ellipse cx="96" cy="342" rx="20" ry="11" fill="#7fb3c8"/>
      <ellipse cx="126" cy="339" rx="17" ry="10" fill="#fffdf8"/>
      <ellipse cx="110" cy="333" rx="15" ry="9" fill="#5e9a78"/>

      <!-- small plant for warmth -->
      <path d="M508 350 h26 l-4 26 h-18 z" fill="#c96f4a"/>
      <path d="M520 350 q-3 -20 -12 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M520 350 q4 -18 14 -24" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="505" cy="318" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 505 318)"/>
      <ellipse cx="535" cy="322" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 535 322)"/>
    </svg>
