<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of someone re-spooling a string trimmer: the trimmer head is opened up with the spool lifted out, two hands wind fresh green-and-yellow line onto the spool in the direction of an arrow stamped on it, the battery and spark-plug wire sit disconnected and set aside on a workbench, and a freshly cut strip of grass edge runs along the bottom of a garage and yard scene">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- garage / yard backdrop -->
      <rect x="40" y="60" width="200" height="150" rx="8" fill="#fffdf8" stroke="#b9b1a3" stroke-width="4"/>
      <line x1="40" y1="110" x2="240" y2="110" stroke="#e9e2d8" stroke-width="3"/>
      <line x1="40" y1="160" x2="240" y2="160" stroke="#e9e2d8" stroke-width="3"/>
      <line x1="106" y1="60" x2="106" y2="210" stroke="#e9e2d8" stroke-width="3"/>
      <line x1="173" y1="60" x2="173" y2="210" stroke="#e9e2d8" stroke-width="3"/>
      <!-- pegboard tool hanging -->
      <rect x="376" y="50" width="150" height="96" rx="6" fill="#f4ede0" stroke="#c9a06b" stroke-width="3"/>
      <g fill="#c9a06b"><circle cx="396" cy="70" r="2"/><circle cx="426" cy="70" r="2"/><circle cx="456" cy="70" r="2"/><circle cx="486" cy="70" r="2"/></g>
      <!-- a spare bulk spool of line hanging on a peg -->
      <circle cx="446" cy="104" r="26" fill="#e3efe8" stroke="#5e9a78" stroke-width="4"/>
      <circle cx="446" cy="104" r="9" fill="#fffdf8" stroke="#8a6a4f" stroke-width="3"/>
      <g stroke="#3e7c59" stroke-width="2" fill="none" opacity="0.7">
        <circle cx="446" cy="104" r="15"/>
        <circle cx="446" cy="104" r="20"/>
      </g>
      <path d="M446 78 v-8" stroke="#8a6a4f" stroke-width="3" stroke-linecap="round"/>

      <!-- workbench surface -->
      <rect x="60" y="300" width="440" height="20" rx="4" fill="#c9a06b"/>
      <rect x="60" y="320" width="440" height="10" rx="3" fill="#8a6a4f"/>

      <!-- battery set aside on the bench, left -->
      <rect x="92" y="262" width="60" height="38" rx="6" fill="#5e9a78"/>
      <rect x="100" y="252" width="20" height="12" rx="3" fill="#3e7c59"/>
      <rect x="126" y="252" width="20" height="12" rx="3" fill="#3e7c59"/>
      <g stroke="#2c5a40" stroke-width="2.4" stroke-linecap="round">
        <line x1="104" y1="280" x2="116" y2="280"/>
        <line x1="110" y1="274" x2="110" y2="286"/>
        <line x1="130" y1="280" x2="142" y2="280"/>
      </g>
      <text x="98" y="296" font-size="9.5" fill="#fffdf8" font-weight="700">removed</text>

      <!-- spark-plug wire / boot, disconnected, set aside right -->
      <path d="M448 296 q-18 -14 -38 -10 q-22 4 -30 -14" fill="none" stroke="#33393b" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="450" cy="296" rx="11" ry="9" fill="#8a6a4f"/>
      <ellipse cx="450" cy="296" rx="5" ry="4" fill="#33393b"/>
      <text x="408" y="288" font-size="9.5" fill="#6b7376">plug wire off</text>

      <!-- the trimmer head, opened up, center of the bench -->
      <!-- cap popped off, to the side -->
      <ellipse cx="178" cy="294" rx="34" ry="12" fill="#b9b1a3"/>
      <ellipse cx="178" cy="290" rx="34" ry="12" fill="#c96f4a"/>
      <ellipse cx="178" cy="290" rx="14" ry="5" fill="#a9542f"/>
      <text x="150" y="318" font-size="9.5" fill="#6b7376">cap</text>

      <!-- the spool, lifted out, being wound -->
      <!-- spool body -->
      <ellipse cx="300" cy="248" rx="70" ry="26" fill="#dce8ee"/>
      <ellipse cx="300" cy="240" rx="70" ry="26" fill="#7fb3c8"/>
      <ellipse cx="300" cy="240" rx="70" ry="26" fill="none" stroke="#5e9a78" stroke-width="3"/>
      <!-- center hub -->
      <ellipse cx="300" cy="238" rx="16" ry="7" fill="#fffdf8" stroke="#8a6a4f" stroke-width="2.5"/>
      <!-- fresh line wound on, green & yellow strands -->
      <g fill="none" stroke-linecap="round">
        <ellipse cx="300" cy="240" rx="56" ry="20" stroke="#5e9a78" stroke-width="4"/>
        <ellipse cx="300" cy="240" rx="46" ry="16" stroke="#e0a93d" stroke-width="4"/>
        <ellipse cx="300" cy="240" rx="36" ry="12" stroke="#5e9a78" stroke-width="4"/>
        <ellipse cx="300" cy="240" rx="26" ry="9" stroke="#e0a93d" stroke-width="4"/>
      </g>
      <!-- winding-direction arrow stamped on the spool -->
      <path d="M256 232 a46 16 0 0 1 88 0" fill="none" stroke="#2c5a40" stroke-width="3"/>
      <path d="M344 232 l-9 -5 m9 5 l-5 9" fill="none" stroke="#2c5a40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- fresh line feeding up off the spool toward the hands -->
      <path d="M356 236 q40 -30 70 -86" fill="none" stroke="#e0a93d" stroke-width="4" stroke-linecap="round"/>
      <path d="M352 244 q44 -22 78 -74" fill="none" stroke="#5e9a78" stroke-width="4" stroke-linecap="round"/>

      <!-- two hands winding the line -->
      <!-- right hand, pulling line -->
      <ellipse cx="432" cy="150" rx="17" ry="13" fill="#e8b48f" transform="rotate(-22 432 150)"/>
      <path d="M422 142 q-6 5 -2 12" stroke="#d99c73" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M432 162 q22 26 40 40" stroke="#c96f4a" stroke-width="12" fill="none" stroke-linecap="round"/>
      <!-- left hand, steadying the spool -->
      <ellipse cx="248" cy="214" rx="16" ry="12" fill="#e8b48f" transform="rotate(18 248 214)"/>
      <path d="M256 206 q6 5 3 12" stroke="#d99c73" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M240 222 q-26 22 -44 40" stroke="#3e7c59" stroke-width="12" fill="none" stroke-linecap="round"/>

      <!-- the rest of the trimmer head base, set down right of spool -->
      <ellipse cx="408" cy="296" rx="40" ry="14" fill="#b9b1a3"/>
      <ellipse cx="408" cy="290" rx="40" ry="14" fill="#d9663f"/>
      <ellipse cx="408" cy="288" rx="16" ry="6" fill="#a9542f"/>
      <!-- eyelets on the head -->
      <circle cx="376" cy="290" r="3.5" fill="#fffdf8" stroke="#8a6a4f" stroke-width="1.6"/>
      <circle cx="440" cy="290" r="3.5" fill="#fffdf8" stroke="#8a6a4f" stroke-width="1.6"/>

      <!-- fresh-cut grass edge along the front of the scene -->
      <g stroke="#3e7c59" stroke-width="4" stroke-linecap="round">
        <path d="M70 384 q4 -22 8 -28"/>
        <path d="M90 386 q-2 -20 2 -30"/>
        <path d="M112 384 q4 -20 9 -26"/>
        <path d="M150 386 q-3 -22 1 -30"/>
        <path d="M190 384 q5 -20 9 -26"/>
      </g>
      <g stroke="#5e9a78" stroke-width="4" stroke-linecap="round">
        <path d="M80 386 q-3 -18 1 -26"/>
        <path d="M132 386 q3 -18 8 -24"/>
        <path d="M170 384 q4 -18 8 -24"/>
      </g>
      <!-- clean cut line edge (where trimming stopped) -->
      <path d="M230 392 q120 -8 300 0" fill="none" stroke="#c9a06b" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
      <!-- a couple of clipped clippings -->
      <g stroke="#5e9a78" stroke-width="2.4" stroke-linecap="round">
        <line x1="300" y1="378" x2="312" y2="374"/>
        <line x1="356" y1="382" x2="368" y2="377"/>
        <line x1="412" y1="378" x2="424" y2="374"/>
      </g>
    </svg>
