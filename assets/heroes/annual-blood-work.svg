<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="A warm, friendly clinic lab scene: a labeled blood-draw vial and a lab-order checklist, a glass of water for fasting and hydration, a calendar with a yearly reminder marked, and a reassuring nurse in scrubs giving a thumbs-up">
      <ellipse cx="285" cy="404" rx="250" ry="22" fill="#efe7d8"/>
      <!-- warm window / sun for warmth -->
      <circle cx="500" cy="66" r="26" fill="#f2cf7a"/>
      <ellipse cx="96" cy="70" rx="42" ry="20" fill="#dce8ee"/>

      <!-- reassuring nurse at left -->
      <g>
        <!-- head -->
        <circle cx="126" cy="150" r="30" fill="#e8b48f"/>
        <path d="M96 146 q0 -34 30 -34 q30 0 30 34 q-8 -14 -30 -14 q-22 0 -30 14 z" fill="#5a4632"/>
        <!-- friendly face -->
        <circle cx="115" cy="150" r="3.4" fill="#33393b"/>
        <circle cx="137" cy="150" r="3.4" fill="#33393b"/>
        <path d="M115 162 q11 9 22 0" stroke="#33393b" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- scrubs body -->
        <path d="M84 320 q0 -110 42 -132 q42 22 42 132 z" fill="#3e7c59"/>
        <!-- v-neck -->
        <path d="M112 190 l14 20 l14 -20" fill="none" stroke="#2c5a40" stroke-width="4" stroke-linecap="round"/>
        <!-- little heart badge -->
        <path d="M104 232 c-6 -6 -14 -2 -14 6 c0 8 14 16 14 16 c0 0 14 -8 14 -16 c0 -8 -8 -12 -14 -6 z" fill="#fffdf8"/>
        <!-- arm giving a friendly thumbs-up -->
        <path d="M162 236 q30 6 42 -14" stroke="#3e7c59" stroke-width="16" fill="none" stroke-linecap="round"/>
        <circle cx="210" cy="214" r="15" fill="#e8b48f"/>
        <path d="M210 200 l0 -14" stroke="#e8b48f" stroke-width="7" fill="none" stroke-linecap="round"/>
      </g>

      <!-- blood-draw vial, front-center on a small tray -->
      <g>
        <rect x="248" y="332" width="120" height="14" rx="6" fill="#cdd9de"/>
        <!-- vial body -->
        <rect x="286" y="252" width="30" height="86" rx="12" fill="#fffdf8" stroke="#b9b1a3" stroke-width="3"/>
        <!-- blood fill -->
        <path d="M289 302 h24 v24 a12 12 0 0 1 -24 0 z" fill="#c14f2c"/>
        <rect x="289" y="292" width="24" height="12" fill="#d9663f"/>
        <!-- lavender-style cap -->
        <rect x="284" y="242" width="34" height="16" rx="6" fill="#9b7fb0"/>
        <!-- label -->
        <rect x="288" y="266" width="26" height="18" rx="3" fill="#fffdf8" stroke="#e9e2d8" stroke-width="1.5"/>
        <g stroke="#b9b1a3" stroke-width="1.6" stroke-linecap="round">
          <line x1="292" y1="272" x2="310" y2="272"/>
          <line x1="292" y1="278" x2="304" y2="278"/>
        </g>
      </g>

      <!-- glass of water (fasting / hydration), front-left of vial -->
      <g>
        <path d="M214 296 l6 44 q1 8 9 8 h8 q8 0 9 -8 l6 -44 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2.5"/>
        <path d="M218 320 l3 20 q1 6 7 6 h6 q6 0 7 -6 l3 -20 z" fill="#7fb3c8"/>
        <ellipse cx="233" cy="296" rx="20" ry="5" fill="#eef4f7" stroke="#7fb3c8" stroke-width="2"/>
        <!-- a little drop of shine -->
        <circle cx="226" cy="312" r="2.4" fill="#fffdf8"/>
      </g>

      <!-- lab-order checklist / clipboard, center-right -->
      <g>
        <rect x="330" y="150" width="112" height="150" rx="10" fill="#fffdf8" stroke="#dcd3c2" stroke-width="3"/>
        <rect x="366" y="140" width="40" height="16" rx="6" fill="#8a6a4f"/>
        <!-- title bar -->
        <rect x="344" y="166" width="60" height="9" rx="4.5" fill="#3e7c59"/>
        <!-- checklist rows -->
        <g>
          <rect x="344" y="188" width="14" height="14" rx="3" fill="#e3efe8" stroke="#3e7c59" stroke-width="2"/>
          <path d="M347 195 l3 3 l6 -7" stroke="#3e7c59" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="366" y="191" width="60" height="8" rx="4" fill="#e9e2d8"/>
        </g>
        <g>
          <rect x="344" y="212" width="14" height="14" rx="3" fill="#e3efe8" stroke="#3e7c59" stroke-width="2"/>
          <path d="M347 219 l3 3 l6 -7" stroke="#3e7c59" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="366" y="215" width="52" height="8" rx="4" fill="#e9e2d8"/>
        </g>
        <g>
          <rect x="344" y="236" width="14" height="14" rx="3" fill="#e3efe8" stroke="#3e7c59" stroke-width="2"/>
          <rect x="366" y="239" width="58" height="8" rx="4" fill="#e9e2d8"/>
        </g>
        <g>
          <rect x="344" y="260" width="14" height="14" rx="3" fill="#e3efe8" stroke="#3e7c59" stroke-width="2"/>
          <rect x="366" y="263" width="46" height="8" rx="4" fill="#e9e2d8"/>
        </g>
      </g>

      <!-- calendar card at right with yearly reminder -->
      <g>
        <rect x="430" y="252" width="112" height="120" rx="12" fill="#fffdf8" stroke="#dcd3c2" stroke-width="3"/>
        <rect x="430" y="252" width="112" height="30" rx="12" fill="#c96f4a"/>
        <rect x="430" y="270" width="112" height="12" fill="#c96f4a"/>
        <rect x="450" y="242" width="8" height="20" rx="4" fill="#8a6a4f"/>
        <rect x="514" y="242" width="8" height="20" rx="4" fill="#8a6a4f"/>
        <g fill="#e9e2d8">
          <rect x="444" y="296" width="16" height="13" rx="3"/>
          <rect x="468" y="296" width="16" height="13" rx="3"/>
          <rect x="492" y="296" width="16" height="13" rx="3"/>
          <rect x="444" y="316" width="16" height="13" rx="3"/>
          <rect x="492" y="316" width="16" height="13" rx="3"/>
          <rect x="444" y="336" width="16" height="13" rx="3"/>
          <rect x="492" y="336" width="16" height="13" rx="3"/>
        </g>
        <rect x="468" y="316" width="16" height="13" rx="3" fill="#3e7c59"/>
        <path d="M471 322 l3 3 l6 -6" stroke="#fffdf8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="500" cy="342" r="12" fill="#e0a93d"/>
        <text x="500" y="346" font-size="10" font-weight="700" fill="#fffdf8" text-anchor="middle">1yr</text>
      </g>

      <!-- reassuring sparkles -->
      <g fill="#e0a93d">
        <path d="M256 200 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z"/>
        <path d="M470 190 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
      </g>
      <!-- ground greenery for warmth -->
      <circle cx="404" cy="388" r="11" fill="#5e9a78"/>
      <circle cx="422" cy="392" r="8" fill="#3e7c59"/>
      <path d="M60 390 q4 -16 0 -28 M60 390 q-8 -10 -18 -14 M60 390 q10 -10 20 -12" stroke="#5e9a78" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
