<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a pantry clean-out: an open pantry cabinet with shelves half-emptied, canned goods and boxes pulled out onto the kitchen counter, a dented bulging can and a moth-infested bag of flour heading toward a trash bin, a row of clear airtight storage jars of flour, rice, and pasta being lined up front-to-back on a shelf, and a handwritten checklist on the counter">
      <ellipse cx="285" cy="404" rx="255" ry="22" fill="#efe7d8"/>

      <!-- open pantry cabinet, left -->
      <rect x="24" y="34" width="196" height="330" rx="10" fill="#fffdf8" stroke="#8a6a4f" stroke-width="6"/>
      <!-- open door swung out to the left -->
      <path d="M24 40 l-18 -8 v320 l18 -6 z" fill="#c9a06b" stroke="#8a6a4f" stroke-width="4"/>
      <circle cx="14" cy="200" r="3.5" fill="#8a6a4f"/>
      <!-- shelves -->
      <rect x="30" y="112" width="184" height="7" rx="2" fill="#b9b1a3"/>
      <rect x="30" y="196" width="184" height="7" rx="2" fill="#b9b1a3"/>
      <rect x="30" y="280" width="184" height="7" rx="2" fill="#b9b1a3"/>

      <!-- top shelf: a few airtight jars lined front-to-back -->
      <rect x="42" y="70" width="26" height="40" rx="4" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
      <rect x="45" y="66" width="20" height="8" rx="3" fill="#5e9a78"/>
      <rect x="46" y="88" width="18" height="18" rx="2" fill="#e0a93d" opacity="0.7"/>
      <rect x="78" y="72" width="26" height="38" rx="4" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
      <rect x="81" y="68" width="20" height="8" rx="3" fill="#5e9a78"/>
      <rect x="82" y="90" width="18" height="16" rx="2" fill="#c9a06b" opacity="0.8"/>
      <!-- top shelf: cereal box -->
      <rect x="120" y="66" width="34" height="44" rx="3" fill="#c96f4a"/>
      <rect x="120" y="66" width="34" height="12" rx="3" fill="#d9663f"/>

      <!-- middle shelf: mixed cans & a jar -->
      <rect x="44" y="158" width="28" height="34" rx="3" fill="#b9b1a3"/>
      <rect x="44" y="158" width="28" height="9" rx="3" fill="#8a6a4f"/>
      <rect x="80" y="158" width="28" height="34" rx="3" fill="#5e9a78"/>
      <rect x="80" y="158" width="28" height="9" rx="3" fill="#3e7c59"/>
      <rect x="118" y="150" width="26" height="42" rx="4" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
      <rect x="121" y="146" width="20" height="8" rx="3" fill="#5e9a78"/>
      <rect x="122" y="168" width="18" height="22" rx="2" fill="#e0a93d" opacity="0.6"/>
      <!-- a lonely duplicate spice jar tucked at the back -->
      <rect x="184" y="164" width="16" height="28" rx="3" fill="#d98e3b"/>
      <rect x="184" y="164" width="16" height="7" rx="3" fill="#8a6a4f"/>

      <!-- bottom shelf: bag & box, partly cleared -->
      <path d="M46 240 q4 -16 22 -16 q18 0 22 16 v40 h-44 z" fill="#c9a06b"/>
      <path d="M46 240 q4 -16 22 -16 q18 0 22 16 h-44 z" fill="#b9995b"/>
      <rect x="104" y="234" width="36" height="46" rx="3" fill="#7fb3c8"/>
      <rect x="104" y="234" width="36" height="12" rx="3" fill="#5e9a78"/>

      <!-- counter, center-right -->
      <rect x="236" y="300" width="316" height="16" rx="4" fill="#c9a06b"/>
      <rect x="236" y="316" width="316" height="10" rx="3" fill="#8a6a4f"/>

      <!-- items pulled onto the counter -->
      <!-- grouped cans -->
      <rect x="250" y="256" width="30" height="44" rx="3" fill="#b9b1a3"/>
      <rect x="250" y="256" width="30" height="11" rx="3" fill="#8a6a4f"/>
      <rect x="254" y="272" width="22" height="18" rx="2" fill="#c96f4a" opacity="0.55"/>
      <rect x="286" y="264" width="30" height="36" rx="3" fill="#5e9a78"/>
      <rect x="286" y="264" width="30" height="11" rx="3" fill="#3e7c59"/>
      <!-- a jar of pasta -->
      <rect x="324" y="248" width="30" height="52" rx="5" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
      <rect x="327" y="243" width="24" height="9" rx="3" fill="#5e9a78"/>
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round" opacity="0.75">
        <line x1="331" y1="262" x2="331" y2="294"/>
        <line x1="338" y1="260" x2="338" y2="294"/>
        <line x1="345" y1="262" x2="345" y2="294"/>
      </g>

      <!-- row of airtight jars being lined up front-to-back on a shelf ledge, right -->
      <rect x="404" y="196" width="148" height="8" rx="3" fill="#b9b1a3"/>
      <rect x="410" y="150" width="30" height="46" rx="5" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
      <rect x="413" y="145" width="24" height="9" rx="3" fill="#5e9a78"/>
      <rect x="415" y="170" width="20" height="24" rx="2" fill="#fffdf8" opacity="0.8"/>
      <text x="414" y="188" font-size="8.5" fill="#3e7c59" font-weight="700">flour</text>
      <rect x="448" y="146" width="30" height="50" rx="5" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
      <rect x="451" y="141" width="24" height="9" rx="3" fill="#5e9a78"/>
      <rect x="453" y="164" width="20" height="30" rx="2" fill="#fffdf8" opacity="0.75"/>
      <text x="453" y="188" font-size="8.5" fill="#3e7c59" font-weight="700">rice</text>
      <rect x="486" y="150" width="30" height="46" rx="5" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
      <rect x="489" y="145" width="24" height="9" rx="3" fill="#5e9a78"/>
      <rect x="491" y="170" width="20" height="24" rx="2" fill="#e0a93d" opacity="0.6"/>
      <text x="486" y="188" font-size="8.5" fill="#3e7c59" font-weight="700">pasta</text>
      <!-- little arrows showing FIFO front-to-back order -->
      <path d="M425 128 l30 0 m-8 -5 l8 5 l-8 5" stroke="#3e7c59" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="458" y="126" font-size="9.5" fill="#6b7376">oldest to front</text>

      <!-- trash bin with the bad stuff, far right -->
      <path d="M470 340 h60 l-7 58 h-46 z" fill="#8a6a4f"/>
      <path d="M466 336 h68 l-2 10 h-64 z" fill="#b9b1a3"/>
      <!-- dented, bulging can going into the bin -->
      <path d="M484 316 q14 -4 26 0 l-2 22 q-11 4 -22 0 z" fill="#b9b1a3"/>
      <ellipse cx="497" cy="316" rx="13" ry="5" fill="#c96f4a"/>
      <path d="M486 328 q11 5 22 0" stroke="#8a6a4f" stroke-width="2" fill="none"/>
      <!-- a moth-infested flour bag also going in -->
      <path d="M512 320 q4 -12 16 -12 q12 0 16 12 v20 h-32 z" fill="#c9a06b"/>
      <!-- webbing / moths on the bag -->
      <g stroke="#8a6a4f" stroke-width="1" opacity="0.7">
        <path d="M518 326 q6 3 12 0 M520 332 q5 3 10 0"/>
      </g>
      <ellipse cx="516" cy="304" rx="5" ry="3" fill="#8a6a4f" opacity="0.85" transform="rotate(-18 516 304)"/>
      <ellipse cx="540" cy="300" rx="5" ry="3" fill="#8a6a4f" opacity="0.7" transform="rotate(20 540 300)"/>
      <text x="470" y="332" font-size="9.5" fill="#d9663f" font-weight="700">toss</text>

      <!-- handwritten checklist on the counter, center -->
      <rect x="250" y="336" width="86" height="56" rx="5" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2" transform="rotate(-5 293 364)"/>
      <g transform="rotate(-5 293 364)">
        <path d="M258 348 l4 4 l7 -8" stroke="#3e7c59" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="274" y1="350" x2="326" y2="350" stroke="#d8cfbe" stroke-width="3" stroke-linecap="round"/>
        <path d="M258 362 l4 4 l7 -8" stroke="#3e7c59" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="274" y1="364" x2="320" y2="364" stroke="#e9e2d8" stroke-width="3" stroke-linecap="round"/>
        <rect x="258" y="374" width="9" height="9" rx="2" fill="none" stroke="#b9b1a3" stroke-width="2"/>
        <line x1="274" y1="379" x2="322" y2="379" stroke="#e9e2d8" stroke-width="3" stroke-linecap="round"/>
      </g>
    </svg>
