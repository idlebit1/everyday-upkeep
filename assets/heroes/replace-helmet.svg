<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a flat-style green bike helmet resting on a wooden bench with its straps hanging over the edge, a bright sun shining rays onto it, and a calendar beside it reading five years">
      <ellipse cx="290" cy="400" rx="240" ry="22" fill="#efe7d8"/>
      <!-- sun + UV rays -->
      <circle cx="76" cy="68" r="26" fill="#f2cf7a"/>
      <g stroke="#e0a93d" stroke-width="4" stroke-linecap="round">
        <line x1="104" y1="86" x2="126" y2="102"/>
        <line x1="112" y1="64" x2="138" y2="70"/>
        <line x1="96" y1="104" x2="110" y2="126"/>
        <line x1="76" y1="106" x2="76" y2="128"/>
      </g>
      <!-- clouds -->
      <ellipse cx="452" cy="66" rx="46" ry="20" fill="#dce8ee"/>
      <ellipse cx="414" cy="80" rx="28" ry="14" fill="#dce8ee"/>
      <!-- wooden bench -->
      <rect x="128" y="330" width="288" height="16" rx="8" fill="#8a6a4f"/>
      <rect x="152" y="346" width="14" height="50" rx="6" fill="#8a6a4f"/>
      <rect x="378" y="346" width="14" height="50" rx="6" fill="#8a6a4f"/>
      <!-- helmet shell -->
      <path d="M158 326 Q150 224 254 190 Q352 160 404 232 Q426 262 420 302 Q418 326 396 326 Z" fill="#3e7c59"/>
      <!-- top highlight -->
      <path d="M196 232 Q236 192 300 186 Q272 182 240 196 Q206 210 196 232" fill="#5e9a78"/>
      <!-- vents -->
      <g fill="#2c5a40">
        <ellipse cx="234" cy="244" rx="10" ry="30" transform="rotate(24 234 244)"/>
        <ellipse cx="288" cy="226" rx="10" ry="32" transform="rotate(8 288 226)"/>
        <ellipse cx="342" cy="234" rx="10" ry="28" transform="rotate(-12 342 234)"/>
      </g>
      <!-- foam liner edge -->
      <rect x="166" y="308" width="244" height="12" rx="6" fill="#e0a93d"/>
      <!-- pads peeking out -->
      <rect x="190" y="318" width="36" height="8" rx="4" fill="#fffdf8"/>
      <rect x="312" y="318" width="36" height="8" rx="4" fill="#fffdf8"/>
      <!-- visor -->
      <path d="M404 232 Q436 248 428 274 Q420 254 396 246 Z" fill="#2c5a40"/>
      <!-- straps hanging over bench edge -->
      <path d="M226 330 q-8 26 -2 52" stroke="#8a6a4f" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M348 330 q10 24 4 50" stroke="#8a6a4f" stroke-width="9" fill="none" stroke-linecap="round"/>
      <rect x="214" y="378" width="20" height="16" rx="4" fill="#33393b"/>
      <rect x="219" y="382" width="10" height="8" rx="2" fill="#fffdf8"/>
      <!-- calendar card -->
      <rect x="448" y="252" width="84" height="80" rx="10" fill="#fffdf8" stroke="#e6dccb" stroke-width="2"/>
      <rect x="448" y="252" width="84" height="22" rx="10" fill="#c96f4a"/>
      <rect x="448" y="264" width="84" height="10" fill="#c96f4a"/>
      <circle cx="468" cy="263" r="3.5" fill="#fffdf8"/>
      <circle cx="512" cy="263" r="3.5" fill="#fffdf8"/>
      <text x="490" y="308" font-size="26" font-weight="800" fill="#2c5a40" text-anchor="middle">5</text>
      <text x="490" y="324" font-size="11" font-weight="700" fill="#8a6a4f" text-anchor="middle">YEARS</text>
      <!-- sparkle -->
      <path d="M150 150 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" fill="#e0a93d"/>
      <path d="M438 178 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" fill="#d98e3b"/>
      <!-- greenery -->
      <circle cx="92" cy="390" r="14" fill="#5e9a78"/>
      <circle cx="114" cy="394" r="11" fill="#3e7c59"/>
      <circle cx="476" cy="392" r="12" fill="#5e9a78"/>
      <circle cx="496" cy="396" r="9" fill="#3e7c59"/>
    </svg>
