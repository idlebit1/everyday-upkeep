<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of an open engine airbox under the hood with a clean pleated engine air filter dropping into it on a beam of fresh air through the intake tube, while a dark dust-clogged old filter sits to the side">
      <ellipse cx="280" cy="402" rx="250" ry="22" fill="#efe7d8"/>
      <!-- engine block slab -->
      <rect x="56" y="150" width="448" height="118" rx="18" fill="#3e7c59"/>
      <rect x="56" y="244" width="448" height="24" rx="10" fill="#2c5a40"/>
      <!-- valve-cover ribs on the engine -->
      <g stroke="#5e9a78" stroke-width="6" stroke-linecap="round">
        <line x1="92" y1="170" x2="92" y2="232"/>
        <line x1="112" y1="170" x2="112" y2="232"/>
        <line x1="132" y1="170" x2="132" y2="232"/>
        <line x1="152" y1="170" x2="152" y2="232"/>
      </g>
      <!-- intake tube feeding the airbox, with fresh-air breeze -->
      <path d="M190 110 q60 -6 96 30" stroke="#2c5a40" stroke-width="22" fill="none" stroke-linecap="round"/>
      <g stroke="#7fb3c8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
        <path d="M150 96 q26 -8 50 2"/>
        <path d="M148 108 q30 8 56 -2"/>
        <path d="M150 120 q24 10 48 4"/>
      </g>
      <!-- airbox base (dark cavity) -->
      <rect x="278" y="120" width="190" height="120" rx="14" fill="#26302c"/>
      <!-- airbox lid, flipped open and set above -->
      <rect x="284" y="74" width="178" height="36" rx="12" fill="#5e9a78"/>
      <rect x="284" y="74" width="178" height="12" rx="6" fill="#3e7c59"/>
      <!-- spring clips on the box edge -->
      <rect x="272" y="172" width="14" height="22" rx="4" fill="#b9b1a3"/>
      <rect x="460" y="172" width="14" height="22" rx="4" fill="#b9b1a3"/>
      <!-- filter seat inside cavity -->
      <rect x="296" y="138" width="156" height="86" rx="6" fill="#1d2521"/>
      <!-- NEW clean filter dropping in -->
      <g>
        <rect x="306" y="146" width="136" height="68" rx="5" fill="#dce8ee"/>
        <rect x="306" y="146" width="136" height="68" rx="5" fill="none" stroke="#7fb3c8" stroke-width="2.5"/>
        <g stroke="#7fb3c8" stroke-width="3">
          <line x1="320" y1="148" x2="320" y2="212"/>
          <line x1="334" y1="148" x2="334" y2="212"/>
          <line x1="348" y1="148" x2="348" y2="212"/>
          <line x1="362" y1="148" x2="362" y2="212"/>
          <line x1="376" y1="148" x2="376" y2="212"/>
          <line x1="390" y1="148" x2="390" y2="212"/>
          <line x1="404" y1="148" x2="404" y2="212"/>
          <line x1="418" y1="148" x2="418" y2="212"/>
          <line x1="432" y1="148" x2="432" y2="212"/>
        </g>
        <!-- airflow arrow into the engine -->
        <line x1="320" y1="228" x2="428" y2="228" stroke="#e0a93d" stroke-width="4" stroke-linecap="round"/>
        <polygon points="428,228 416,221 416,235" fill="#e0a93d"/>
      </g>
      <!-- sparkle on the fresh filter -->
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="374" y1="128" x2="374" y2="138"/>
        <line x1="362" y1="133" x2="368" y2="140"/>
        <line x1="386" y1="133" x2="380" y2="140"/>
      </g>
      <!-- OLD clogged filter set aside on the floor -->
      <g transform="rotate(-7 150 350)">
        <rect x="86" y="318" width="128" height="64" rx="6" fill="#8a6a4f"/>
        <rect x="86" y="318" width="128" height="64" rx="6" fill="none" stroke="#6e5333" stroke-width="2.5"/>
        <g stroke="#6e5333" stroke-width="3">
          <line x1="100" y1="320" x2="100" y2="380"/>
          <line x1="114" y1="320" x2="114" y2="380"/>
          <line x1="128" y1="320" x2="128" y2="380"/>
          <line x1="142" y1="320" x2="142" y2="380"/>
          <line x1="156" y1="320" x2="156" y2="380"/>
          <line x1="170" y1="320" x2="170" y2="380"/>
          <line x1="184" y1="320" x2="184" y2="380"/>
          <line x1="198" y1="320" x2="198" y2="380"/>
        </g>
        <!-- trapped grit & grime on the old one -->
        <circle cx="150" cy="348" r="4" fill="#5a544a"/>
        <circle cx="108" cy="362" r="3.5" fill="#5a544a"/>
        <circle cx="190" cy="336" r="3" fill="#5a544a"/>
        <circle cx="130" cy="330" r="3" fill="#6e5333"/>
        <circle cx="172" cy="368" r="3.5" fill="#6e5333"/>
      </g>
      <text x="150" y="406" font-size="14" font-weight="700" fill="#8a6a4f" text-anchor="middle" transform="rotate(-7 150 406)">15k miles of grit</text>
    </svg>
