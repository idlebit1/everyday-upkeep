<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of an open laptop on a desk with heat shimmering off it and a loud fan, a can of compressed air blowing a burst of dust out of the side exhaust vent, a soft brush and a small screwdriver nearby, and a plant by a sunny window">
      <ellipse cx="280" cy="400" rx="245" ry="22" fill="#efe7d8"/>
      <!-- window with sun -->
      <rect x="406" y="44" width="110" height="124" rx="8" fill="#dce8ee" stroke="#e6dccb" stroke-width="3"/>
      <line x1="461" y1="47" x2="461" y2="165" stroke="#fffdf8" stroke-width="4"/>
      <line x1="409" y1="106" x2="513" y2="106" stroke="#fffdf8" stroke-width="4"/>
      <circle cx="486" cy="78" r="15" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="486" y1="54" x2="486" y2="60"/>
        <line x1="508" y1="78" x2="502" y2="78"/>
        <line x1="502" y1="62" x2="498" y2="66"/>
      </g>
      <rect x="394" y="36" width="134" height="10" rx="5" fill="#8a6a4f"/>
      <!-- desk -->
      <rect x="36" y="336" width="488" height="16" rx="8" fill="#c9a06b"/>
      <rect x="60" y="352" width="14" height="44" rx="6" fill="#8a6a4f"/>
      <rect x="486" y="352" width="14" height="44" rx="6" fill="#8a6a4f"/>
      <!-- laptop: open, three-quarter view -->
      <!-- screen -->
      <path d="M150 130 h200 l14 130 h-228 z" fill="#2c5a40"/>
      <path d="M161 142 h178 l11 106 h-200 z" fill="#dce8ee"/>
      <!-- a hot temperature reading on screen -->
      <text x="262" y="206" font-size="34" font-weight="800" fill="#d9663f" text-anchor="middle" font-family="Georgia, serif">94°</text>
      <text x="262" y="228" font-size="12" fill="#6b7376" text-anchor="middle">CPU running hot</text>
      <!-- base / keyboard deck -->
      <path d="M120 260 h288 l30 38 h-348 z" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5"/>
      <path d="M120 260 h288 l8 10 h-304 z" fill="#e3efe8"/>
      <!-- keyboard keys -->
      <g fill="#e9e2d8">
        <rect x="150" y="276" width="180" height="6" rx="3"/>
        <rect x="148" y="286" width="186" height="6" rx="3"/>
        <rect x="146" y="296" width="192" height="6" rx="3"/>
      </g>
      <!-- trackpad -->
      <rect x="206" y="306" width="74" height="14" rx="4" fill="#e3efe8"/>
      <!-- side exhaust vent on the left edge of the base -->
      <g stroke="#b9b1a3" stroke-width="3" stroke-linecap="round">
        <line x1="118" y1="266" x2="104" y2="266"/>
        <line x1="116" y1="272" x2="100" y2="272"/>
        <line x1="114" y1="278" x2="98" y2="278"/>
      </g>
      <!-- heat shimmer rising off the laptop -->
      <g stroke="#d9663f" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.7">
        <path d="M300 252 q5 -8 0 -16 q-5 -8 0 -16"/>
        <path d="M322 252 q5 -8 0 -16 q-5 -8 0 -16"/>
        <path d="M344 252 q5 -8 0 -16 q-5 -8 0 -16"/>
      </g>
      <!-- compressed air can, upright, blowing into the vent -->
      <rect x="44" y="248" width="40" height="84" rx="9" fill="#7fb3c8"/>
      <rect x="44" y="266" width="40" height="14" fill="#5e9a78"/>
      <rect x="56" y="234" width="16" height="16" rx="4" fill="#8a6a4f"/>
      <rect x="60" y="220" width="4" height="18" rx="2" fill="#8a6a4f"/>
      <!-- straw + burst of air -->
      <line x1="62" y1="220" x2="92" y2="262" stroke="#b9b1a3" stroke-width="3" stroke-linecap="round"/>
      <g stroke="#7fb3c8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
        <path d="M94 264 q8 -2 14 -6"/>
        <path d="M94 270 q9 0 16 0"/>
        <path d="M94 276 q8 2 14 6"/>
      </g>
      <!-- dust puffing out of the vent -->
      <g fill="#b9b1a3">
        <circle cx="120" cy="262" r="4"/>
        <circle cx="132" cy="256" r="3"/>
        <circle cx="130" cy="270" r="3.5"/>
        <circle cx="144" cy="262" r="2.5"/>
      </g>
      <g fill="#d8cfbe">
        <circle cx="150" cy="252" r="3"/>
        <circle cx="156" cy="268" r="2.5"/>
        <circle cx="140" cy="248" r="2"/>
      </g>
      <!-- soft brush leaning on the desk -->
      <line x1="332" y1="320" x2="372" y2="298" stroke="#d98e3b" stroke-width="7" stroke-linecap="round"/>
      <g stroke="#3e7c59" stroke-width="3" stroke-linecap="round">
        <line x1="368" y1="290" x2="380" y2="298"/>
        <line x1="374" y1="286" x2="386" y2="294"/>
        <line x1="380" y1="282" x2="392" y2="290"/>
      </g>
      <!-- small precision screwdriver -->
      <line x1="350" y1="330" x2="398" y2="322" stroke="#c96f4a" stroke-width="6" stroke-linecap="round"/>
      <line x1="398" y1="322" x2="416" y2="319" stroke="#b9b1a3" stroke-width="3" stroke-linecap="round"/>
      <!-- plant -->
      <path d="M514 388 q-2 -22 -12 -32" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M514 388 q4 -20 14 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="498" cy="352" rx="8" ry="13" fill="#5e9a78" transform="rotate(-30 498 352)"/>
      <ellipse cx="532" cy="356" rx="8" ry="13" fill="#3e7c59" transform="rotate(28 532 356)"/>
      <path d="M500 388 h30 l-5 30 h-20 z" fill="#c96f4a"/>
      <!-- floor shadow -->
      <ellipse cx="270" cy="392" rx="150" ry="10" fill="#b9b1a3" opacity="0.4"/>
    </svg>
