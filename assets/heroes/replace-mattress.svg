<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a bedroom comparing an old sagging mattress that dips in the middle and shows allergen specks, beside a fresh new mattress standing upright with a sparkle and a delivery tag, with a window, sun, and a plant in the corner">
      <ellipse cx="290" cy="400" rx="245" ry="22" fill="#efe7d8"/>
      <!-- window with sun -->
      <rect x="46" y="46" width="108" height="126" rx="8" fill="#dce8ee" stroke="#e6dccb" stroke-width="3"/>
      <line x1="100" y1="49" x2="100" y2="169" stroke="#fffdf8" stroke-width="4"/>
      <line x1="49" y1="109" x2="151" y2="109" stroke="#fffdf8" stroke-width="4"/>
      <circle cx="78" cy="82" r="16" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="78" y1="56" x2="78" y2="62"/>
        <line x1="104" y1="82" x2="98" y2="82"/>
        <line x1="96" y1="64" x2="92" y2="68"/>
      </g>
      <rect x="34" y="38" width="132" height="10" rx="5" fill="#8a6a4f"/>
      <!-- OLD sagging mattress on a low frame (left) -->
      <rect x="78" y="312" width="186" height="22" rx="7" fill="#c9a06b"/>
      <rect x="90" y="334" width="12" height="34" rx="5" fill="#8a6a4f"/>
      <rect x="240" y="334" width="12" height="34" rx="5" fill="#8a6a4f"/>
      <!-- the sagging mattress body: dips in the middle -->
      <path d="M82 286 q0 -14 14 -14 h152 q14 0 14 14 q-20 4 -36 4 q-30 18 -54 18 q-24 0 -54 -18 q-16 0 -36 -4 z" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2.5"/>
      <path d="M82 286 q20 4 36 4 q30 18 54 18 q24 0 54 -18 q16 0 36 -4" fill="none" stroke="#b9b1a3" stroke-width="2" stroke-dasharray="4 4"/>
      <!-- yellow stain in the sag -->
      <ellipse cx="172" cy="298" rx="40" ry="9" fill="#e0a93d" opacity="0.35"/>
      <!-- allergen specks rising -->
      <g fill="#b9b1a3">
        <circle cx="132" cy="262" r="2.6"/>
        <circle cx="160" cy="252" r="2.2"/>
        <circle cx="188" cy="258" r="2.6"/>
        <circle cx="210" cy="248" r="2"/>
        <circle cx="148" cy="244" r="1.8"/>
      </g>
      <!-- sad droop face line on old mattress -->
      <path d="M150 300 q22 12 44 0" stroke="#b9b1a3" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- arrow ushering old one out / new one in -->
      <path d="M286 296 q22 -6 40 4" stroke="#d98e3b" stroke-width="6" fill="none" stroke-linecap="round"/>
      <polygon points="330,294 342,308 318,310" fill="#d98e3b"/>
      <!-- NEW mattress standing upright (right), fresh and plump -->
      <rect x="356" y="150" width="150" height="186" rx="20" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5"/>
      <rect x="356" y="150" width="150" height="34" rx="17" fill="#dce8ee"/>
      <!-- quilting tufts -->
      <g fill="#b9b1a3">
        <circle cx="386" cy="220" r="3"/>
        <circle cx="431" cy="220" r="3"/>
        <circle cx="476" cy="220" r="3"/>
        <circle cx="386" cy="268" r="3"/>
        <circle cx="431" cy="268" r="3"/>
        <circle cx="476" cy="268" r="3"/>
      </g>
      <!-- side band -->
      <rect x="364" y="312" width="134" height="14" rx="7" fill="#dce8ee"/>
      <!-- delivery tag -->
      <rect x="448" y="172" width="52" height="30" rx="6" fill="#3e7c59" transform="rotate(-8 474 187)"/>
      <text x="474" y="191" font-size="12" font-weight="700" fill="#fffdf8" text-anchor="middle" transform="rotate(-8 474 187)">NEW</text>
      <!-- fresh sparkles over the new mattress -->
      <g stroke="#7fb3c8" stroke-width="2.5" stroke-linecap="round">
        <path d="M520 168 v12 M514 174 h12"/>
        <path d="M512 232 v10 M507 237 h10"/>
        <path d="M524 290 v8 M520 294 h8"/>
      </g>
      <!-- nightstand between -->
      <rect x="300" y="318" width="36" height="50" rx="5" fill="#c9a06b"/>
      <rect x="294" y="310" width="48" height="10" rx="5" fill="#8a6a4f"/>
      <circle cx="318" cy="340" r="4" fill="#8a6a4f"/>
      <!-- plant -->
      <path d="M318 298 q-2 -22 -12 -32" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M318 298 q4 -20 14 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="302" cy="262" rx="8" ry="13" fill="#5e9a78" transform="rotate(-30 302 262)"/>
      <ellipse cx="336" cy="266" rx="8" ry="13" fill="#3e7c59" transform="rotate(28 336 266)"/>
      <path d="M304 298 h28 l-4 14 h-20 z" fill="#c96f4a"/>
      <!-- rug -->
      <ellipse cx="200" cy="384" rx="132" ry="11" fill="#b9b1a3" opacity="0.5"/>
    </svg>
