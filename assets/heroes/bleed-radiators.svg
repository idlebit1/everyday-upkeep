<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of bleeding a radiator: a tall panel radiator with its top half cooler-toned and its bottom half warm and glowing, a hand at the top corner turning a small bleed key in the valve, a thin hiss of air escaping, and a cloth and a small cup held underneath to catch the dribble of water, in a cozy room with a window and a plant">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- back wall / cozy room: window -->
      <rect x="372" y="42" width="150" height="150" rx="8" fill="#fffdf8" stroke="#8a6a4f" stroke-width="6"/>
      <rect x="382" y="52" width="60" height="130" rx="3" fill="#dce8ee"/>
      <rect x="452" y="52" width="60" height="130" rx="3" fill="#dce8ee"/>
      <rect x="372" y="186" width="150" height="14" rx="4" fill="#b9b1a3"/>
      <!-- soft sun in the window -->
      <circle cx="412" cy="84" r="13" fill="#faf0da"/>
      <g stroke="#e0a93d" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
        <line x1="412" y1="60" x2="412" y2="66"/>
        <line x1="430" y1="84" x2="436" y2="84"/>
        <line x1="425" y1="71" x2="429" y2="67"/>
      </g>

      <!-- skirting line -->
      <rect x="20" y="356" width="530" height="10" rx="3" fill="#c9a06b" opacity="0.55"/>

      <!-- ===== panel/column radiator ===== -->
      <!-- top valve manifold -->
      <rect x="92" y="120" width="236" height="18" rx="6" fill="#b9b1a3"/>
      <rect x="92" y="312" width="236" height="18" rx="6" fill="#b9b1a3"/>
      <!-- radiator body (column fins) -->
      <g>
        <!-- bottom (warm) glow behind the body -->
        <rect x="98" y="220" width="224" height="110" rx="8" fill="#f6dcca" opacity="0.6"/>
      </g>
      <rect x="98" y="132" width="224" height="186" rx="10" fill="#fffdf8" stroke="#8a6a4f" stroke-width="5"/>
      <!-- TOP HALF: cooler tint (trapped air, cold) -->
      <rect x="103" y="137" width="214" height="86" rx="6" fill="#dce8ee"/>
      <text x="208" y="170" font-size="12" fill="#7fb3c8" font-weight="700" text-anchor="middle">cold (air)</text>
      <!-- BOTTOM HALF: warm tint -->
      <rect x="103" y="225" width="214" height="88" rx="6" fill="#f3c9a8"/>
      <text x="208" y="278" font-size="12" fill="#c96f4a" font-weight="700" text-anchor="middle">warm</text>
      <!-- vertical column fins -->
      <g stroke="#b9b1a3" stroke-width="3">
        <line x1="138" y1="137" x2="138" y2="313"/>
        <line x1="173" y1="137" x2="173" y2="313"/>
        <line x1="208" y1="137" x2="208" y2="313"/>
        <line x1="243" y1="137" x2="243" y2="313"/>
        <line x1="278" y1="137" x2="278" y2="313"/>
      </g>
      <!-- dividing line where warm meets cold -->
      <line x1="103" y1="223" x2="317" y2="223" stroke="#c96f4a" stroke-width="2" stroke-dasharray="6 5" opacity="0.7"/>
      <!-- legs -->
      <rect x="120" y="330" width="12" height="22" rx="3" fill="#8a6a4f"/>
      <rect x="288" y="330" width="12" height="22" rx="3" fill="#8a6a4f"/>

      <!-- bleed valve at top corner -->
      <circle cx="312" cy="129" r="11" fill="#c9a06b" stroke="#8a6a4f" stroke-width="3"/>
      <rect x="308" y="118" width="8" height="8" rx="1.5" fill="#8a6a4f"/>
      <!-- the bleed key on the valve -->
      <rect x="306" y="96" width="12" height="26" rx="3" fill="#5e9a78"/>
      <rect x="298" y="90" width="28" height="10" rx="3" fill="#3e7c59"/>
      <!-- turn arrow (anticlockwise) -->
      <path d="M338 104 a18 18 0 1 0 -10 22" fill="none" stroke="#3e7c59" stroke-width="3" stroke-linecap="round"/>
      <path d="M328 126 l-2 -10 l10 4" fill="none" stroke="#3e7c59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- hiss of escaping air -->
      <g stroke="#7fb3c8" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
        <path d="M326 108 q10 -6 18 -2"/>
        <path d="M328 116 q12 -3 22 2"/>
      </g>
      <g fill="#dce8ee">
        <circle cx="352" cy="104" r="3"/>
        <circle cx="360" cy="112" r="2.2"/>
        <circle cx="356" cy="120" r="1.8"/>
      </g>
      <text x="362" y="100" font-size="10.5" fill="#6b7376">hiss</text>

      <!-- hand turning the key -->
      <ellipse cx="312" cy="76" rx="17" ry="13" fill="#e8b48f"/>
      <path d="M302 72 q-5 6 -1 13" stroke="#d99c73" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M312 64 q22 -22 52 -16" stroke="#c96f4a" stroke-width="12" fill="none" stroke-linecap="round"/>

      <!-- cloth held under the valve -->
      <path d="M286 150 h44 l-6 26 h-32 z" fill="#7fb3c8"/>
      <path d="M286 150 h44 l-3 8 h-38 z" fill="#9cc3d4"/>
      <g stroke="#cdd9de" stroke-width="1.4">
        <line x1="296" y1="160" x2="320" y2="160"/>
        <line x1="294" y1="166" x2="318" y2="166"/>
      </g>

      <!-- small cup catching the dribble -->
      <path d="M300 182 h40 l-5 34 h-30 z" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2.5"/>
      <ellipse cx="320" cy="182" rx="20" ry="5" fill="#dce8ee"/>
      <!-- a dribble of water from valve into the cup -->
      <path d="M316 142 q-2 18 2 36" stroke="#7fb3c8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
      <circle cx="318" cy="178" r="2.4" fill="#7fb3c8"/>

      <!-- small plant for warmth, front-left -->
      <path d="M44 330 h30 l-4 28 h-22 z" fill="#c96f4a"/>
      <path d="M58 330 q-3 -22 -13 -30" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M58 330 q4 -20 15 -26" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="42" cy="296" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 42 296)"/>
      <ellipse cx="74" cy="300" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 74 300)"/>
    </svg>
