<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of someone cleaning a patio set in bright outdoor light: a chair is half-scrubbed clean and half grimy with green mildew, a bucket of soapy water with a soft brush sits beside it, a coiled garden hose lies on the ground, two cushions air over a railing, an open umbrella shades a small table, and leafy greenery frames the scene">
      <!-- bright sky wash -->
      <rect x="0" y="0" width="560" height="300" fill="#dce8ee" opacity="0.5"/>
      <!-- ground -->
      <ellipse cx="285" cy="404" rx="262" ry="24" fill="#efe7d8"/>
      <rect x="0" y="360" width="560" height="70" fill="#efe7d8"/>
      <!-- paving lines -->
      <g stroke="#b9b1a3" stroke-width="2" opacity="0.6">
        <line x1="120" y1="370" x2="120" y2="412"/>
        <line x1="300" y1="372" x2="300" y2="414"/>
        <line x1="450" y1="370" x2="450" y2="410"/>
      </g>

      <!-- greenery behind, left -->
      <g>
        <path d="M40 360 q-12 -60 8 -96" stroke="#2c5a40" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="34" cy="282" rx="12" ry="22" fill="#3e7c59" transform="rotate(-26 34 282)"/>
        <ellipse cx="56" cy="296" rx="11" ry="20" fill="#5e9a78" transform="rotate(22 56 296)"/>
        <ellipse cx="44" cy="320" rx="11" ry="20" fill="#3e7c59" transform="rotate(-8 44 320)"/>
      </g>
      <!-- greenery behind, right -->
      <g>
        <path d="M520 360 q14 -56 -6 -92" stroke="#2c5a40" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="528" cy="288" rx="12" ry="22" fill="#3e7c59" transform="rotate(24 528 288)"/>
        <ellipse cx="506" cy="300" rx="11" ry="20" fill="#5e9a78" transform="rotate(-20 506 300)"/>
        <ellipse cx="520" cy="324" rx="11" ry="20" fill="#3e7c59" transform="rotate(8 520 324)"/>
      </g>

      <!-- umbrella over a small table, back-right -->
      <rect x="406" y="190" width="6" height="150" fill="#8a6a4f"/>
      <path d="M352 192 q57 -52 114 0 z" fill="#c96f4a"/>
      <path d="M352 192 q57 -22 114 0" fill="none" stroke="#d9663f" stroke-width="2.5"/>
      <g stroke="#a85638" stroke-width="2">
        <line x1="380" y1="178" x2="380" y2="192"/>
        <line x1="409" y1="170" x2="409" y2="192"/>
        <line x1="438" y1="178" x2="438" y2="192"/>
      </g>
      <circle cx="409" cy="170" r="5" fill="#d9663f"/>
      <!-- small round table top -->
      <ellipse cx="409" cy="338" rx="44" ry="11" fill="#b9b1a3"/>
      <rect x="405" y="340" width="8" height="26" fill="#8a6a4f"/>

      <!-- cushions airing on a railing, back-left -->
      <rect x="92" y="244" width="150" height="8" rx="3" fill="#8a6a4f"/>
      <rect x="100" y="252" width="10" height="40" fill="#8a6a4f"/>
      <rect x="224" y="252" width="10" height="40" fill="#8a6a4f"/>
      <!-- cushion 1 draped over railing -->
      <path d="M114 224 h48 v52 q-24 8 -48 0 z" fill="#5e9a78"/>
      <path d="M114 224 h48 v10 h-48 z" fill="#3e7c59"/>
      <line x1="138" y1="224" x2="138" y2="272" stroke="#3e7c59" stroke-width="2" opacity="0.6"/>
      <!-- cushion 2 draped over railing -->
      <path d="M176 224 h46 v52 q-23 8 -46 0 z" fill="#7fb3c8"/>
      <path d="M176 224 h46 v10 h-46 z" fill="#5e9a78"/>
      <line x1="199" y1="224" x2="199" y2="272" stroke="#5e9a78" stroke-width="2" opacity="0.6"/>
      <!-- sun drips drying off cushions -->
      <g stroke="#7fb3c8" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
        <path d="M126 278 q2 6 0 11"/>
        <path d="M210 278 q2 6 0 11"/>
      </g>

      <!-- the star: a chair, half clean / half grimy, front-center -->
      <!-- chair back -->
      <rect x="214" y="150" width="120" height="14" rx="6" fill="#fffdf8" stroke="#8a6a4f" stroke-width="4"/>
      <rect x="220" y="170" width="108" height="12" rx="5" fill="#fffdf8" stroke="#8a6a4f" stroke-width="3.5"/>
      <!-- seat -->
      <rect x="206" y="252" width="140" height="20" rx="6" fill="#fffdf8" stroke="#8a6a4f" stroke-width="4"/>
      <!-- back posts -->
      <rect x="216" y="150" width="10" height="104" rx="4" fill="#fffdf8" stroke="#8a6a4f" stroke-width="3"/>
      <rect x="322" y="150" width="10" height="104" rx="4" fill="#fffdf8" stroke="#8a6a4f" stroke-width="3"/>
      <!-- front legs -->
      <rect x="214" y="270" width="11" height="92" rx="4" fill="#fffdf8" stroke="#8a6a4f" stroke-width="3"/>
      <rect x="324" y="270" width="11" height="92" rx="4" fill="#fffdf8" stroke="#8a6a4f" stroke-width="3"/>

      <!-- GRIMY HALF overlay (left side of the chair) -->
      <g opacity="0.9">
        <rect x="214" y="270" width="11" height="92" rx="4" fill="#b9b1a3"/>
        <rect x="216" y="150" width="10" height="104" rx="4" fill="#b9b1a3"/>
        <rect x="206" y="252" width="70" height="20" rx="6" fill="#c9c2b2"/>
        <rect x="214" y="150" width="60" height="14" rx="6" fill="#c9c2b2"/>
      </g>
      <!-- green mildew bloom on the grimy leg -->
      <g fill="#5e9a78" opacity="0.7">
        <ellipse cx="219" cy="330" rx="6" ry="9"/>
        <ellipse cx="221" cy="348" rx="5" ry="7"/>
        <circle cx="217" cy="316" r="3"/>
      </g>
      <!-- pollen / dirt specks on grimy seat -->
      <g fill="#e0a93d" opacity="0.7">
        <circle cx="232" cy="262" r="2.4"/>
        <circle cx="250" cy="259" r="2"/>
        <circle cx="264" cy="264" r="2.2"/>
      </g>
      <!-- bird mess streak -->
      <path d="M238 165 q3 6 -1 12" stroke="#dce8ee" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="216" y="146" font-size="11" fill="#6b7376">grimy</text>

      <!-- CLEAN HALF shine (right side of chair) -->
      <g stroke="#fffdf8" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <line x1="300" y1="266" x2="328" y2="258"/>
        <line x1="328" y1="346" x2="332" y2="320"/>
      </g>
      <g stroke="#5e9a78" stroke-width="2.4" stroke-linecap="round">
        <path d="M312 240 l0 9 M307 244 l9 0"/>
      </g>
      <text x="296" y="146" font-size="11" fill="#3e7c59" font-weight="700">clean</text>

      <!-- soapy water bucket with a soft brush, front-center -->
      <path d="M250 330 h66 l-9 56 h-48 z" fill="#7fb3c8"/>
      <path d="M246 328 h74 l-3 10 h-68 z" fill="#9cc3d4"/>
      <path d="M252 324 q31 -16 62 0" fill="none" stroke="#5e9a78" stroke-width="3" stroke-linecap="round"/>
      <!-- suds in the bucket -->
      <circle cx="266" cy="332" r="6" fill="#eef4f7"/>
      <circle cx="282" cy="328" r="7" fill="#fffdf8"/>
      <circle cx="298" cy="333" r="5" fill="#eef4f7"/>
      <!-- soft brush resting in the bucket -->
      <rect x="296" y="300" width="40" height="9" rx="3" fill="#c96f4a" transform="rotate(-22 316 304)"/>
      <g stroke="#8a6a4f" stroke-width="1.6" stroke-linecap="round">
        <line x1="300" y1="326" x2="299" y2="332"/>
        <line x1="306" y1="324" x2="305" y2="330"/>
        <line x1="312" y1="322" x2="311" y2="328"/>
      </g>

      <!-- coiled garden hose, front-left on the ground -->
      <g fill="none" stroke="#3e7c59" stroke-width="7" stroke-linecap="round">
        <circle cx="120" cy="378" r="26"/>
        <circle cx="120" cy="378" r="14"/>
      </g>
      <path d="M146 378 q40 -6 64 -28" stroke="#5e9a78" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- hose nozzle -->
      <rect x="206" y="344" width="22" height="9" rx="4" fill="#8a6a4f" transform="rotate(-26 217 348)"/>
      <!-- a couple of water drops from the nozzle -->
      <g fill="#7fb3c8" opacity="0.8">
        <circle cx="224" cy="338" r="2.6"/>
        <circle cx="231" cy="346" r="2"/>
      </g>

      <!-- a few falling pollen / leaf bits in the bright air -->
      <g fill="#e0a93d" opacity="0.55">
        <circle cx="160" cy="120" r="2.6"/>
        <circle cx="440" cy="140" r="2.2"/>
        <circle cx="380" cy="96" r="2"/>
      </g>
    </svg>
