<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a sunny bathroom shelf with sunscreen bottles being checked: a fresh green bottle and a tube on the shelf, a hand-marked bottle by an open beach bag with a towel, and an old separated bottle dripping into a wastebasket, with sun streaming through a window">
      <ellipse cx="280" cy="400" rx="245" ry="22" fill="#efe7d8"/>
      <!-- window with big sun -->
      <rect x="60" y="44" width="128" height="136" rx="10" fill="#dce8ee" stroke="#e6dccb" stroke-width="3"/>
      <line x1="124" y1="47" x2="124" y2="177" stroke="#fffdf8" stroke-width="4"/>
      <line x1="63" y1="112" x2="185" y2="112" stroke="#fffdf8" stroke-width="4"/>
      <circle cx="96" cy="82" r="19" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="3.5" stroke-linecap="round">
        <line x1="96" y1="52" x2="96" y2="59"/>
        <line x1="126" y1="82" x2="119" y2="82"/>
        <line x1="117" y1="61" x2="112" y2="66"/>
        <line x1="117" y1="103" x2="112" y2="98"/>
      </g>
      <rect x="48" y="36" width="152" height="10" rx="5" fill="#8a6a4f"/>
      <!-- shelf -->
      <rect x="236" y="196" width="280" height="13" rx="6" fill="#c9a06b"/>
      <rect x="252" y="209" width="11" height="20" rx="4" fill="#8a6a4f"/>
      <rect x="488" y="209" width="11" height="20" rx="4" fill="#8a6a4f"/>
      <!-- fresh pump bottle on shelf -->
      <rect x="262" y="118" width="42" height="78" rx="9" fill="#5e9a78"/>
      <rect x="262" y="150" width="42" height="26" fill="#fffdf8"/>
      <circle cx="283" cy="163" r="8" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="2" stroke-linecap="round">
        <line x1="283" y1="151" x2="283" y2="154"/>
        <line x1="283" y1="172" x2="283" y2="175"/>
        <line x1="271" y1="163" x2="274" y2="163"/>
        <line x1="292" y1="163" x2="295" y2="163"/>
      </g>
      <rect x="276" y="104" width="14" height="16" rx="3" fill="#2c5a40"/>
      <rect x="283" y="96" width="16" height="8" rx="4" fill="#2c5a40"/>
      <!-- squeeze tube standing on cap -->
      <rect x="322" y="132" width="34" height="52" rx="8" fill="#7fb3c8"/>
      <path d="M324 136 q15 -8 30 0 l-2 -10 q-13 -6 -26 0 z" fill="#dce8ee"/>
      <rect x="330" y="184" width="18" height="12" rx="4" fill="#dce8ee"/>
      <path d="M328 156 q5 -5 11 0 q5 5 11 0" stroke="#fffdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- small face stick -->
      <rect x="372" y="148" width="20" height="48" rx="7" fill="#c96f4a"/>
      <rect x="375" y="140" width="14" height="10" rx="4" fill="#d9663f"/>
      <!-- marked bottle with handwritten month -->
      <rect x="416" y="126" width="42" height="70" rx="9" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5"/>
      <rect x="429" y="112" width="16" height="16" rx="4" fill="#e0a93d"/>
      <rect x="424" y="146" width="26" height="18" rx="4" fill="#faf0da" stroke="#e0a93d" stroke-width="2"/>
      <path d="M428 155 h6 M437 151 v8 M441 151 l5 8 M446 151 l-5 8" stroke="#8a6a4f" stroke-width="2" stroke-linecap="round"/>
      <!-- marker resting on shelf -->
      <rect x="468" y="186" width="40" height="9" rx="4.5" fill="#33393b"/>
      <rect x="462" y="186" width="10" height="9" rx="4" fill="#8a6a4f"/>
      <!-- beach bag on floor -->
      <path d="M250 308 q4 -16 18 -16 h78 q14 0 18 16 l8 70 q1 12 -11 12 h-108 q-12 0 -11 -12 z" fill="#c96f4a"/>
      <path d="M250 308 q4 -16 18 -16 h78 q14 0 18 16 z" fill="#d9663f"/>
      <path d="M278 296 q0 -26 29 -26 q29 0 29 26" stroke="#8a6a4f" stroke-width="8" fill="none" stroke-linecap="round"/>
      <!-- rolled towel peeking from bag -->
      <rect x="268" y="270" width="22" height="34" rx="10" fill="#dce8ee"/>
      <path d="M271 280 h16 M271 290 h16" stroke="#7fb3c8" stroke-width="3" stroke-linecap="round"/>
      <!-- bottle peeking from bag -->
      <rect x="318" y="268" width="20" height="34" rx="6" fill="#5e9a78"/>
      <rect x="323" y="260" width="10" height="10" rx="3" fill="#2c5a40"/>
      <!-- wastebasket with the bad bottle -->
      <path d="M448 318 h76 l-9 70 q-1 8 -9 8 h-40 q-8 0 -9 -8 z" fill="#b9b1a3"/>
      <path d="M448 318 h76 l-2 14 h-72 z" fill="#8a6a4f"/>
      <!-- old bottle tipped into basket -->
      <g transform="rotate(32 488 300)">
        <rect x="468" y="268" width="36" height="60" rx="8" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5"/>
        <rect x="478" y="256" width="16" height="14" rx="4" fill="#b9b1a3"/>
        <!-- separated contents showing through label window -->
        <rect x="474" y="286" width="24" height="32" rx="4" fill="#faf0da"/>
        <path d="M474 298 q6 4 12 0 q6 -4 12 0 v16 q0 4 -4 4 h-16 q-4 0 -4 -4 z" fill="#e0a93d" opacity="0.6"/>
      </g>
      <!-- drips -->
      <path d="M462 348 q-2 6 2 8 q4 -2 2 -8 l-2 -5 z" fill="#e0a93d" opacity="0.7"/>
      <path d="M476 360 q-2 5 1.5 7 q3.5 -2 1.5 -7 l-1.5 -4 z" fill="#e0a93d" opacity="0.7"/>
      <!-- plant -->
      <path d="M212 388 q-2 -22 -12 -32" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M212 388 q4 -20 14 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="196" cy="352" rx="8" ry="13" fill="#5e9a78" transform="rotate(-30 196 352)"/>
      <ellipse cx="230" cy="356" rx="8" ry="13" fill="#3e7c59" transform="rotate(28 230 356)"/>
      <path d="M198 388 h30 l-5 30 h-20 z" fill="#c96f4a"/>
      <!-- floor mat -->
      <ellipse cx="310" cy="392" rx="110" ry="10" fill="#b9b1a3" opacity="0.5"/>
      <!-- sparkles near fresh bottle -->
      <g stroke="#e0a93d" stroke-width="2.5" stroke-linecap="round">
        <line x1="244" y1="138" x2="244" y2="150"/>
        <line x1="238" y1="144" x2="250" y2="144"/>
        <line x1="316" y1="102" x2="316" y2="112"/>
        <line x1="311" y1="107" x2="321" y2="107"/>
      </g>
    </svg>
