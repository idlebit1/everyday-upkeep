<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a kitchen range hood above a stovetop with a pot steaming, the metal mesh grease filter glowing as it slides out of the hood, with sparkles, a soaking tub of soapy water, and a scrub brush nearby">
      <ellipse cx="290" cy="400" rx="240" ry="22" fill="#efe7d8"/>
      <!-- window + sun -->
      <rect x="58" y="40" width="86" height="74" rx="6" fill="#dce8ee" stroke="#e6dccb" stroke-width="2"/>
      <line x1="101" y1="40" x2="101" y2="114" stroke="#fffdf8" stroke-width="3"/>
      <line x1="58" y1="77" x2="144" y2="77" stroke="#fffdf8" stroke-width="3"/>
      <circle cx="478" cy="56" r="22" fill="#f2cf7a"/>
      <!-- range hood canopy -->
      <polygon points="196,96 424,96 404,150 216,150" fill="#b9b1a3"/>
      <rect x="216" y="150" width="188" height="20" rx="4" fill="#8a6a4f"/>
      <!-- hood chimney up to ceiling -->
      <rect x="284" y="50" width="52" height="48" fill="#b9b1a3"/>
      <rect x="284" y="50" width="52" height="48" fill="none" stroke="#8a6a4f" stroke-width="2"/>
      <!-- hood underside light -->
      <circle cx="252" cy="160" r="5" fill="#e0a93d"/>
      <circle cx="368" cy="160" r="5" fill="#e0a93d"/>
      <!-- mesh filter sliding out of the hood underside, highlighted -->
      <g transform="translate(266,150) rotate(-12)">
        <rect x="0" y="0" width="120" height="56" rx="8" fill="#e0a93d"/>
        <rect x="7" y="7" width="106" height="42" rx="5" fill="#fffdf8"/>
        <g stroke="#8a6a4f" stroke-width="1.4">
          <line x1="16" y1="7" x2="16" y2="49"/>
          <line x1="32" y1="7" x2="32" y2="49"/>
          <line x1="48" y1="7" x2="48" y2="49"/>
          <line x1="64" y1="7" x2="64" y2="49"/>
          <line x1="80" y1="7" x2="80" y2="49"/>
          <line x1="96" y1="7" x2="96" y2="49"/>
          <line x1="7" y1="18" x2="113" y2="18"/>
          <line x1="7" y1="28" x2="113" y2="28"/>
          <line x1="7" y1="38" x2="113" y2="38"/>
        </g>
        <!-- pull handle -->
        <rect x="48" y="48" width="24" height="9" rx="4.5" fill="#8a6a4f"/>
      </g>
      <!-- sparkles around the filter -->
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="244" y1="118" x2="244" y2="130"/>
        <line x1="238" y1="124" x2="250" y2="124"/>
        <line x1="406" y1="120" x2="406" y2="134"/>
        <line x1="399" y1="127" x2="413" y2="127"/>
        <line x1="412" y1="176" x2="412" y2="186"/>
        <line x1="407" y1="181" x2="417" y2="181"/>
      </g>
      <!-- stovetop -->
      <rect x="206" y="296" width="208" height="60" rx="8" fill="#8a6a4f"/>
      <rect x="206" y="296" width="208" height="60" rx="8" fill="none" stroke="#6b5640" stroke-width="2"/>
      <circle cx="258" cy="326" r="22" fill="#b9b1a3"/>
      <circle cx="258" cy="326" r="13" fill="#6b5640"/>
      <circle cx="362" cy="326" r="22" fill="#b9b1a3"/>
      <circle cx="362" cy="326" r="13" fill="#6b5640"/>
      <!-- pot on the burner with steam -->
      <rect x="300" y="248" width="76" height="44" rx="6" fill="#5e9a78"/>
      <rect x="294" y="244" width="88" height="10" rx="5" fill="#2c5a40"/>
      <rect x="332" y="234" width="12" height="12" rx="3" fill="#2c5a40"/>
      <g stroke="#dce8ee" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9">
        <path d="M318 232 q-6 -12 2 -22 q6 -8 0 -18"/>
        <path d="M340 230 q6 -12 -2 -22 q-6 -8 0 -18"/>
        <path d="M358 232 q-6 -12 2 -22 q6 -8 0 -18"/>
      </g>
      <!-- soaking tub with soapy water + filter corner + brush -->
      <rect x="56" y="318" width="118" height="56" rx="10" fill="#7fb3c8"/>
      <rect x="56" y="318" width="118" height="14" rx="7" fill="#dce8ee"/>
      <g fill="#fffdf8">
        <circle cx="78" cy="320" r="7"/>
        <circle cx="98" cy="316" r="9"/>
        <circle cx="120" cy="319" r="6"/>
        <circle cx="140" cy="316" r="8"/>
      </g>
      <!-- a soaking filter peeking in the tub -->
      <rect x="86" y="332" width="58" height="30" rx="4" fill="#e0a93d"/>
      <g stroke="#8a6a4f" stroke-width="1.2">
        <line x1="98" y1="332" x2="98" y2="362"/>
        <line x1="112" y1="332" x2="112" y2="362"/>
        <line x1="126" y1="332" x2="126" y2="362"/>
        <line x1="86" y1="344" x2="144" y2="344"/>
        <line x1="86" y1="354" x2="144" y2="354"/>
      </g>
      <!-- scrub brush leaning on the tub -->
      <rect x="160" y="300" width="40" height="11" rx="5" fill="#c9a06b" transform="rotate(34 180 305)"/>
      <g stroke="#8a6a4f" stroke-width="2" stroke-linecap="round" transform="rotate(34 180 305)">
        <line x1="166" y1="311" x2="166" y2="320"/>
        <line x1="174" y1="311" x2="174" y2="321"/>
        <line x1="182" y1="311" x2="182" y2="320"/>
        <line x1="190" y1="311" x2="190" y2="321"/>
      </g>
      <!-- soap bottle on the floor -->
      <rect x="496" y="320" width="26" height="54" rx="8" fill="#3e7c59"/>
      <rect x="503" y="308" width="12" height="14" rx="4" fill="#2c5a40"/>
      <rect x="500" y="336" width="18" height="20" rx="3" fill="#e3efe8"/>
      <!-- drips -->
      <g fill="#7fb3c8">
        <circle cx="232" cy="380" r="3"/>
        <circle cx="452" cy="384" r="3"/>
        <circle cx="462" cy="376" r="2.5"/>
      </g>
    </svg>
