<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of caring for a mattress protector: it is being stripped off a tidy bed along with the sheets and carried toward a front-load washing machine, a care-label tag dangles from one corner, and a low-heat dryer sits beside the washer in a calm bedroom-laundry scene">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- ===== tidy bed, left ===== -->
      <!-- headboard -->
      <rect x="30" y="150" width="20" height="150" rx="8" fill="#8a6a4f"/>
      <rect x="40" y="168" width="14" height="92" rx="7" fill="#c9a06b"/>
      <!-- mattress block -->
      <rect x="46" y="248" width="220" height="48" rx="12" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5"/>
      <rect x="46" y="296" width="220" height="22" rx="7" fill="#c9a06b"/>
      <rect x="58" y="318" width="13" height="46" rx="5" fill="#8a6a4f"/>
      <rect x="244" y="318" width="13" height="46" rx="5" fill="#8a6a4f"/>
      <!-- the protector being peeled up off the mattress -->
      <path d="M46 248 q-2 -26 22 -34 q70 -22 150 -14 q40 4 60 -4 q-6 22 -34 30 q-86 22 -180 26 q-12 0 -18 -4 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2.5"/>
      <!-- quilted stitch lines on the protector -->
      <g stroke="#9cc3d4" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M86 224 q4 14 0 26"/>
        <path d="M130 216 q4 14 0 26"/>
        <path d="M174 214 q4 14 0 26"/>
        <path d="M218 216 q4 14 0 26"/>
      </g>
      <!-- waterproof backing edge shown peeling -->
      <path d="M236 222 q22 -6 30 -12 q-2 12 -14 18 q-8 4 -16 2 z" fill="#7fb3c8"/>
      <!-- a care-label tag dangling from the corner -->
      <rect x="60" y="206" width="22" height="16" rx="3" fill="#fffdf8" stroke="#b9b1a3" stroke-width="1.6" transform="rotate(-12 71 214)"/>
      <g stroke="#8a6a4f" stroke-width="1.3" stroke-linecap="round" transform="rotate(-12 71 214)">
        <line x1="64" y1="211" x2="78" y2="211"/>
        <line x1="64" y1="215" x2="76" y2="215"/>
        <line x1="64" y1="219" x2="74" y2="219"/>
      </g>
      <line x1="70" y1="208" x2="78" y2="234" stroke="#b9b1a3" stroke-width="1.4"/>

      <!-- a folded sheet going along with it -->
      <path d="M188 188 q34 -10 58 -2 q-4 16 -22 22 q-26 8 -50 2 q6 -14 14 -22 z" fill="#fffdf8" stroke="#e6dccb" stroke-width="2"/>

      <!-- motion arrow from bed to washer -->
      <path d="M280 196 q34 -6 64 6" fill="none" stroke="#5e9a78" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 9"/>
      <path d="M344 202 l-10 -7 l1 12 z" fill="#5e9a78"/>

      <!-- ===== front-load washer, center-right ===== -->
      <rect x="316" y="196" width="120" height="156" rx="12" fill="#fffdf8" stroke="#b9b1a3" stroke-width="3"/>
      <!-- control panel -->
      <rect x="328" y="208" width="96" height="22" rx="6" fill="#e3efe8"/>
      <circle cx="412" cy="219" r="6" fill="#3e7c59"/>
      <rect x="336" y="215" width="34" height="5" rx="2.5" fill="#9cc3d4"/>
      <rect x="336" y="222" width="22" height="5" rx="2.5" fill="#cdd9de"/>
      <!-- round door -->
      <circle cx="376" cy="292" r="44" fill="#dce8ee" stroke="#b9b1a3" stroke-width="3"/>
      <circle cx="376" cy="292" r="32" fill="#7fb3c8" opacity="0.55"/>
      <!-- tumbling protector + sheets behind the glass -->
      <path d="M356 282 q20 -10 40 0 q-6 18 -20 22 q-16 -2 -20 -22 z" fill="#fffdf8" opacity="0.85"/>
      <path d="M362 300 q14 -6 26 2" fill="none" stroke="#9cc3d4" stroke-width="2.4" stroke-linecap="round"/>
      <!-- warm-water droplets cue -->
      <g fill="#7fb3c8" opacity="0.8">
        <path d="M364 274 q3 5 0 8 q-3 -3 0 -8z"/>
        <path d="M388 270 q3 5 0 8 q-3 -3 0 -8z"/>
      </g>
      <text x="376" y="178" font-size="11" fill="#3e7c59" font-weight="700" text-anchor="middle">WARM — not hot</text>

      <!-- ===== low-heat dryer, right ===== -->
      <rect x="448" y="232" width="92" height="120" rx="12" fill="#fffdf8" stroke="#b9b1a3" stroke-width="3"/>
      <rect x="458" y="242" width="72" height="16" rx="5" fill="#e3efe8"/>
      <circle cx="520" cy="250" r="4.5" fill="#e0a93d"/>
      <circle cx="494" cy="306" r="34" fill="#faf0da" stroke="#b9b1a3" stroke-width="3"/>
      <circle cx="494" cy="306" r="24" fill="#fbe9e1" opacity="0.7"/>
      <!-- gentle low-heat waves -->
      <g stroke="#d98e3b" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.85">
        <path d="M484 314 q5 -6 0 -12"/>
        <path d="M494 316 q5 -6 0 -12"/>
        <path d="M504 314 q5 -6 0 -12"/>
      </g>
      <text x="494" y="214" font-size="11" fill="#d9663f" font-weight="700" text-anchor="middle">LOW heat</text>

      <!-- small plant for warmth, foreground right -->
      <path d="M512 360 h26 l-4 24 h-18 z" fill="#c96f4a"/>
      <path d="M524 360 q-3 -18 -12 -24" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M524 360 q4 -16 14 -22" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="510" cy="332" rx="6.5" ry="10" fill="#5e9a78" transform="rotate(-30 510 332)"/>
      <ellipse cx="538" cy="336" rx="6.5" ry="10" fill="#3e7c59" transform="rotate(28 538 336)"/>

      <!-- folded laundry basket, foreground left -->
      <path d="M150 350 h96 l-10 40 h-76 z" fill="#c9a06b"/>
      <path d="M150 350 h96 l-3 8 h-90 z" fill="#b9b1a3"/>
      <g stroke="#8a6a4f" stroke-width="1.6">
        <line x1="166" y1="362" x2="160" y2="384"/>
        <line x1="186" y1="362" x2="182" y2="384"/>
        <line x1="206" y1="362" x2="204" y2="384"/>
        <line x1="226" y1="362" x2="228" y2="384"/>
        <line x1="156" y1="370" x2="240" y2="370"/>
      </g>
    </svg>
