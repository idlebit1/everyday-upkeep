<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of replacing a pet bed: a flattened, worn old dog bed with a frayed, torn cover sits on the left with stuffing poking out, and a fresh, plump orthopedic bed with a zippered washable cover sits on the right; a happy dog steps toward the new bed in a cozy living-room corner with a lamp and a plant">
      <ellipse cx="285" cy="402" rx="255" ry="22" fill="#efe7d8"/>

      <!-- cozy living-room corner: walls & floor -->
      <rect x="30" y="60" width="500" height="250" fill="#fffdf8"/>
      <rect x="30" y="60" width="500" height="10" fill="#efe7d8"/>
      <rect x="30" y="300" width="500" height="12" fill="#c9a06b"/>
      <!-- baseboard -->
      <rect x="30" y="288" width="500" height="14" fill="#e9e2d8"/>

      <!-- floor lamp in the corner for warmth -->
      <rect x="486" y="150" width="8" height="140" rx="3" fill="#8a6a4f"/>
      <rect x="466" y="288" width="48" height="8" rx="3" fill="#8a6a4f"/>
      <path d="M470 150 h40 l-10 -34 h-20 z" fill="#e0a93d"/>
      <path d="M470 150 h40 l-3 8 h-34 z" fill="#d98e3b"/>
      <ellipse cx="490" cy="120" rx="6" ry="5" fill="#faf0da"/>

      <!-- small potted plant, back-left -->
      <path d="M56 288 h34 l-5 -30 h-24 z" fill="#c96f4a"/>
      <path d="M73 258 q-4 -26 -14 -36" stroke="#3e7c59" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M73 258 q5 -24 16 -32" stroke="#3e7c59" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="55" cy="222" rx="8" ry="13" fill="#5e9a78" transform="rotate(-28 55 222)"/>
      <ellipse cx="90" cy="228" rx="8" ry="13" fill="#3e7c59" transform="rotate(28 90 228)"/>

      <!-- OLD BED (left): flattened, frayed, torn cover with stuffing -->
      <!-- flattened base, low profile -->
      <ellipse cx="150" cy="352" rx="98" ry="24" fill="#b9b1a3"/>
      <path d="M56 352 q94 -18 188 0 q-6 20 -94 20 q-88 0 -94 -20 z" fill="#c9c1b3"/>
      <!-- worn low bolster, sagging -->
      <path d="M62 344 q88 -30 176 0" fill="none" stroke="#8a6a4f" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
      <!-- frayed / torn patch with stuffing poking out -->
      <path d="M110 340 l6 -8 l7 7 l6 -8 l6 9 l7 -7 l4 9 z" fill="#8a6a4f" opacity="0.55"/>
      <circle cx="118" cy="332" r="4" fill="#fffdf8"/>
      <circle cx="128" cy="329" r="5" fill="#fffdf8"/>
      <circle cx="138" cy="333" r="4" fill="#fffdf8"/>
      <!-- fray threads -->
      <g stroke="#8a6a4f" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
        <line x1="96" y1="346" x2="90" y2="352"/>
        <line x1="102" y1="348" x2="98" y2="356"/>
        <line x1="200" y1="346" x2="206" y2="353"/>
      </g>
      <!-- odor / dust waft above old bed -->
      <g stroke="#b9b1a3" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.6">
        <path d="M132 310 q-6 -8 2 -14 q8 -6 2 -14"/>
        <path d="M158 314 q-6 -8 2 -14 q8 -6 2 -14"/>
      </g>
      <text x="112" y="384" font-size="12" fill="#d9663f" font-weight="700">worn out</text>

      <!-- NEW BED (right): plump, supportive orthopedic, zippered cover -->
      <!-- thick supportive base -->
      <ellipse cx="410" cy="356" rx="108" ry="26" fill="#3e7c59"/>
      <path d="M304 356 q106 -14 212 0 l0 6 q-6 24 -106 24 q-100 0 -106 -24 z" fill="#3e7c59"/>
      <!-- tall plush bolster -->
      <path d="M308 350 q102 -66 204 0 q-10 26 -102 26 q-92 0 -102 -26 z" fill="#5e9a78"/>
      <!-- inner mattress cushion -->
      <ellipse cx="410" cy="352" rx="74" ry="17" fill="#e3efe8"/>
      <!-- quilted stitching on the cushion -->
      <g stroke="#5e9a78" stroke-width="1.6" opacity="0.6">
        <line x1="380" y1="344" x2="372" y2="360"/>
        <line x1="410" y1="340" x2="410" y2="362"/>
        <line x1="440" y1="344" x2="448" y2="360"/>
      </g>
      <!-- zipper along the front of the washable cover -->
      <line x1="318" y1="366" x2="502" y2="366" stroke="#2c5a40" stroke-width="3"/>
      <g stroke="#fffdf8" stroke-width="1.6">
        <line x1="330" y1="363" x2="330" y2="369"/>
        <line x1="346" y1="363" x2="346" y2="369"/>
        <line x1="362" y1="363" x2="362" y2="369"/>
        <line x1="378" y1="363" x2="378" y2="369"/>
        <line x1="442" y1="363" x2="442" y2="369"/>
        <line x1="458" y1="363" x2="458" y2="369"/>
        <line x1="474" y1="363" x2="474" y2="369"/>
      </g>
      <!-- zipper pull -->
      <rect x="408" y="360" width="7" height="12" rx="2" fill="#e0a93d"/>
      <!-- fresh sparkle on the new bed -->
      <g stroke="#e0a93d" stroke-width="2.6" stroke-linecap="round">
        <path d="M470 320 l0 11 M464.5 325.5 l11 0"/>
      </g>
      <g stroke="#5e9a78" stroke-width="2.2" stroke-linecap="round">
        <path d="M336 322 l0 8 M332 326 l8 0"/>
      </g>
      <text x="366" y="392" font-size="12" fill="#3e7c59" font-weight="700">fresh support</text>

      <!-- HAPPY DOG stepping toward the new bed, center -->
      <!-- body -->
      <ellipse cx="268" cy="286" rx="46" ry="30" fill="#c9a06b"/>
      <!-- chest/front -->
      <ellipse cx="300" cy="298" rx="22" ry="24" fill="#c9a06b"/>
      <!-- head turned toward new bed (right) -->
      <ellipse cx="322" cy="262" rx="24" ry="21" fill="#c9a06b"/>
      <!-- muzzle -->
      <ellipse cx="342" cy="270" rx="13" ry="10" fill="#d9b784"/>
      <ellipse cx="352" cy="270" rx="4" ry="3.5" fill="#33393b"/>
      <!-- happy eye -->
      <circle cx="326" cy="256" r="3" fill="#33393b"/>
      <!-- floppy ear -->
      <path d="M306 250 q-10 6 -6 22 q10 -2 14 -16 z" fill="#8a6a4f"/>
      <!-- open, happy mouth -->
      <path d="M338 278 q6 6 12 2" stroke="#33393b" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- stepping front leg reaching to new bed -->
      <path d="M298 312 q10 22 26 30" stroke="#c9a06b" stroke-width="14" fill="none" stroke-linecap="round"/>
      <ellipse cx="326" cy="344" rx="9" ry="6" fill="#d9b784"/>
      <!-- back leg -->
      <path d="M244 306 q-2 20 6 34" stroke="#c9a06b" stroke-width="15" fill="none" stroke-linecap="round"/>
      <ellipse cx="250" cy="342" rx="9" ry="6" fill="#d9b784"/>
      <!-- wagging tail up -->
      <path d="M224 278 q-22 -12 -30 -30" stroke="#c9a06b" stroke-width="12" fill="none" stroke-linecap="round"/>
      <!-- little motion/happy marks near tail -->
      <g stroke="#e0a93d" stroke-width="2.2" stroke-linecap="round" opacity="0.8">
        <line x1="182" y1="252" x2="176" y2="246"/>
        <line x1="192" y1="244" x2="188" y2="236"/>
      </g>
    </svg>
