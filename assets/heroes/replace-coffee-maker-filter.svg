<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a drip coffee maker on a kitchen counter with its water reservoir lid open and a hand slotting a fresh round charcoal water-filter disc into its holder inside the tank, an old grey spent filter resting on the counter beside it, and a fresh mug of coffee with steam rising nearby">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- counter surface -->
      <rect x="40" y="332" width="490" height="16" rx="6" fill="#c9a06b"/>
      <rect x="58" y="348" width="454" height="50" fill="#b9b1a3"/>

      <!-- coffee maker body -->
      <rect x="150" y="120" width="170" height="212" rx="16" fill="#8a6a4f"/>
      <!-- warming base -->
      <rect x="142" y="312" width="186" height="22" rx="8" fill="#5a4634"/>
      <ellipse cx="235" cy="316" rx="62" ry="6" fill="#5a4634"/>

      <!-- brew head overhang -->
      <rect x="150" y="120" width="170" height="30" rx="12" fill="#5a4634"/>
      <circle cx="300" cy="135" r="6" fill="#e0a93d"/>

      <!-- water reservoir, lid open -->
      <rect x="330" y="150" width="78" height="170" rx="12" fill="#8a6a4f"/>
      <rect x="338" y="168" width="62" height="146" rx="9" fill="#dce8ee"/>
      <!-- water in reservoir -->
      <rect x="338" y="226" width="62" height="88" rx="9" fill="#7fb3c8" opacity="0.85"/>
      <g stroke="#fffdf8" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <line x1="344" y1="248" x2="394" y2="248"/>
        <line x1="344" y1="272" x2="384" y2="272"/>
      </g>
      <!-- open hinged lid lifted up and back -->
      <rect x="330" y="120" width="78" height="14" rx="6" fill="#5a4634" transform="rotate(-26 369 127)"/>

      <!-- filter holder basket inside the reservoir -->
      <rect x="352" y="200" width="34" height="40" rx="6" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2.5"/>
      <g stroke="#b9b1a3" stroke-width="1.6">
        <line x1="358" y1="210" x2="380" y2="210"/>
        <line x1="358" y1="220" x2="380" y2="220"/>
        <line x1="358" y1="230" x2="380" y2="230"/>
      </g>

      <!-- fresh charcoal filter disc being slotted in (held by hand) -->
      <ellipse cx="369" cy="196" rx="17" ry="10" fill="#5a4634"/>
      <ellipse cx="369" cy="194" rx="17" ry="10" fill="#33393b"/>
      <g fill="#5a4634" opacity="0.7">
        <circle cx="362" cy="193" r="1.4"/>
        <circle cx="370" cy="190" r="1.6"/>
        <circle cx="376" cy="195" r="1.3"/>
      </g>
      <g stroke="#5e9a78" stroke-width="2" stroke-linecap="round">
        <path d="M386 178 l0 7 M382.5 181.5 l7 0"/>
      </g>
      <text x="392" y="186" font-size="10" fill="#3e7c59" font-weight="700">fresh</text>

      <!-- hand placing the disc -->
      <ellipse cx="392" cy="206" rx="17" ry="13" fill="#e8b48f"/>
      <path d="M380 200 q-6 6 -1 14" stroke="#d99c73" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M392 218 q26 26 60 26" stroke="#c96f4a" stroke-width="13" fill="none" stroke-linecap="round"/>

      <!-- old grey spent filter on the counter -->
      <ellipse cx="118" cy="318" rx="26" ry="13" fill="#b9b1a3"/>
      <ellipse cx="118" cy="315" rx="26" ry="13" fill="#cdd9de"/>
      <g fill="#b9b1a3" opacity="0.8">
        <circle cx="108" cy="313" r="2.2"/>
        <circle cx="120" cy="310" r="2.6"/>
        <circle cx="128" cy="316" r="2"/>
        <circle cx="114" cy="319" r="1.8"/>
      </g>
      <text x="92" y="298" font-size="11" fill="#6b7376" font-weight="700">old &amp; grey</text>

      <!-- fresh mug of coffee with steam -->
      <rect x="430" y="282" width="46" height="38" rx="8" fill="#c96f4a"/>
      <rect x="434" y="286" width="38" height="12" rx="4" fill="#5a4634"/>
      <path d="M476 290 q16 6 0 22" stroke="#c96f4a" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g stroke="#b9b1a3" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
        <path d="M444 276 q-6 -11 0 -22 q6 -11 0 -20"/>
        <path d="M462 276 q6 -11 0 -22 q-6 -11 0 -20"/>
      </g>

      <!-- carafe under the brew head -->
      <path d="M168 250 l-8 62 h70 l-8 -62 z" fill="#dce8ee" stroke="#7fb3c8" stroke-width="3"/>
      <path d="M165 278 l-4 34 h66 l-4 -34 z" fill="#5a4634"/>
      <rect x="166" y="242" width="62" height="10" rx="5" fill="#5a4634"/>
      <path d="M236 256 q18 8 6 30" stroke="#5a4634" stroke-width="6" fill="none" stroke-linecap="round"/>

      <!-- small plant for warmth -->
      <path d="M486 348 h26 l-4 26 h-18 z" fill="#c96f4a"/>
      <path d="M498 348 q-3 -20 -12 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M498 348 q4 -18 14 -24" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="483" cy="316" rx="7" ry="11" fill="#5e9a78" transform="rotate(-30 483 316)"/>
      <ellipse cx="513" cy="320" rx="7" ry="11" fill="#3e7c59" transform="rotate(28 513 320)"/>
    </svg>
