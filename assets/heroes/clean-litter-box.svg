<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a laundry-room corner where a litter box is being scrubbed with a brush in a utility sink full of suds, while a curious cat watches from the floor next to a bag of fresh litter, a scoop, and a clean litter mat">
      <ellipse cx="280" cy="400" rx="245" ry="22" fill="#efe7d8"/>
      <!-- window -->
      <rect x="56" y="40" width="104" height="118" rx="8" fill="#dce8ee" stroke="#e6dccb" stroke-width="3"/>
      <line x1="108" y1="43" x2="108" y2="155" stroke="#fffdf8" stroke-width="4"/>
      <line x1="59" y1="99" x2="157" y2="99" stroke="#fffdf8" stroke-width="4"/>
      <circle cx="86" cy="72" r="14" fill="#e0a93d"/>
      <!-- shelf with supplies -->
      <rect x="384" y="58" width="148" height="10" rx="5" fill="#8a6a4f"/>
      <rect x="396" y="22" width="34" height="36" rx="6" fill="#7fb3c8"/>
      <rect x="402" y="14" width="22" height="10" rx="4" fill="#5e9a78"/>
      <rect x="442" y="28" width="30" height="30" rx="6" fill="#c96f4a"/>
      <rect x="482" y="20" width="36" height="38" rx="6" fill="#e0a93d"/>
      <rect x="488" y="30" width="24" height="16" rx="3" fill="#fffdf8"/>
      <!-- utility sink -->
      <rect x="196" y="206" width="216" height="118" rx="14" fill="#b9b1a3"/>
      <rect x="208" y="218" width="192" height="80" rx="10" fill="#dce8ee"/>
      <rect x="220" y="324" width="14" height="56" rx="6" fill="#8a6a4f"/>
      <rect x="374" y="324" width="14" height="56" rx="6" fill="#8a6a4f"/>
      <!-- faucet -->
      <path d="M388 206 v-44 q0 -16 -18 -16 h-26" stroke="#8a6a4f" stroke-width="11" fill="none" stroke-linecap="round"/>
      <rect x="338" y="140" width="12" height="18" rx="5" fill="#8a6a4f"/>
      <!-- water stream -->
      <line x1="346" y1="158" x2="346" y2="216" stroke="#7fb3c8" stroke-width="7" stroke-linecap="round"/>
      <!-- litter box tilted in sink, being scrubbed -->
      <g transform="rotate(-10 296 252)">
        <path d="M226 232 l12 52 q2 10 12 10 h92 q10 0 12 -10 l12 -52 z" fill="#7fb3c8"/>
        <rect x="220" y="222" width="152" height="16" rx="8" fill="#5e9a78"/>
      </g>
      <!-- suds in sink -->
      <g fill="#fffdf8">
        <circle cx="238" cy="290" r="12"/>
        <circle cx="258" cy="296" r="9"/>
        <circle cx="350" cy="292" r="11"/>
        <circle cx="370" cy="286" r="8"/>
        <circle cx="300" cy="300" r="9"/>
      </g>
      <!-- floating bubbles -->
      <g fill="none" stroke="#7fb3c8" stroke-width="2.5">
        <circle cx="206" cy="178" r="7"/>
        <circle cx="226" cy="156" r="5"/>
        <circle cx="416" cy="186" r="6"/>
      </g>
      <!-- scrub brush over the box -->
      <g transform="rotate(24 282 196)">
        <rect x="246" y="188" width="68" height="15" rx="7" fill="#c96f4a"/>
        <rect x="306" y="184" width="44" height="23" rx="8" fill="#d98e3b"/>
        <g stroke="#e9e2d8" stroke-width="4" stroke-linecap="round">
          <line x1="314" y1="207" x2="314" y2="218"/>
          <line x1="326" y1="207" x2="326" y2="218"/>
          <line x1="338" y1="207" x2="338" y2="218"/>
        </g>
      </g>
      <!-- bag of fresh litter -->
      <path d="M58 268 h84 q8 0 8 9 v94 q0 9 -8 9 h-84 q-8 0 -8 -9 v-94 q0 -9 8 -9" fill="#c9a06b"/>
      <rect x="50" y="256" width="100" height="20" rx="8" fill="#8a6a4f"/>
      <rect x="64" y="294" width="72" height="44" rx="8" fill="#fffdf8"/>
      <circle cx="100" cy="316" r="14" fill="#e0a93d"/>
      <path d="M94 316 l4.5 4.5 l8 -9" stroke="#fffdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- scoop leaning on bag -->
      <g transform="rotate(18 162 330)">
        <rect x="154" y="290" width="11" height="58" rx="5" fill="#5e9a78"/>
        <path d="M142 348 h35 l-4 26 h-27 z" fill="#3e7c59"/>
        <g stroke="#e3efe8" stroke-width="2.5" stroke-linecap="round">
          <line x1="150" y1="354" x2="149" y2="368"/>
          <line x1="159" y1="354" x2="159" y2="368"/>
          <line x1="168" y1="354" x2="169" y2="368"/>
        </g>
      </g>
      <!-- curious cat watching -->
      <g>
        <ellipse cx="476" cy="352" rx="46" ry="34" fill="#8a6a4f"/>
        <circle cx="448" cy="306" r="26" fill="#8a6a4f"/>
        <polygon points="430,292 426,266 448,282" fill="#8a6a4f"/>
        <polygon points="466,292 472,266 450,282" fill="#8a6a4f"/>
        <polygon points="432,288 430,274 442,282" fill="#c96f4a"/>
        <polygon points="464,288 468,274 456,282" fill="#c96f4a"/>
        <circle cx="440" cy="304" r="3.5" fill="#33393b"/>
        <circle cx="456" cy="304" r="3.5" fill="#33393b"/>
        <path d="M444 314 q4 4 8 0" stroke="#33393b" stroke-width="2" fill="none" stroke-linecap="round"/>
        <g stroke="#b9b1a3" stroke-width="1.8" stroke-linecap="round">
          <line x1="430" y1="312" x2="414" y2="310"/>
          <line x1="430" y1="316" x2="415" y2="318"/>
          <line x1="466" y1="312" x2="482" y2="310"/>
        </g>
        <path d="M518 348 q22 -8 16 -32" stroke="#8a6a4f" stroke-width="11" fill="none" stroke-linecap="round"/>
        <ellipse cx="452" cy="382" rx="12" ry="6" fill="#6e543e"/>
        <ellipse cx="494" cy="382" rx="12" ry="6" fill="#6e543e"/>
      </g>
      <!-- litter mat waiting -->
      <ellipse cx="300" cy="392" rx="86" ry="10" fill="#5e9a78" opacity="0.6"/>
    </svg>
