<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a garage workbench with a cordless drill, a battery pack charging on a charger with a green light, a spare battery labeled with the year 2022, a pegboard with tools, and a recycling box for dead packs under the bench">
      <ellipse cx="282" cy="402" rx="248" ry="22" fill="#efe7d8"/>
      <!-- pegboard -->
      <rect x="60" y="40" width="252" height="170" rx="10" fill="#c9a06b"/>
      <rect x="72" y="52" width="228" height="146" rx="6" fill="#fffdf8" opacity="0.25"/>
      <g fill="#8a6a4f">
        <circle cx="96" cy="72" r="3.5"/><circle cx="136" cy="72" r="3.5"/><circle cx="176" cy="72" r="3.5"/><circle cx="216" cy="72" r="3.5"/><circle cx="256" cy="72" r="3.5"/>
        <circle cx="96" cy="178" r="3.5"/><circle cx="256" cy="178" r="3.5"/><circle cx="216" cy="178" r="3.5"/>
      </g>
      <!-- hanging wrench -->
      <g transform="translate(110 92)">
        <rect x="-5" y="6" width="10" height="58" rx="5" fill="#b9b1a3"/>
        <circle cx="0" cy="6" r="11" fill="none" stroke="#b9b1a3" stroke-width="7"/>
      </g>
      <!-- hanging screwdriver -->
      <g transform="translate(168 92)">
        <rect x="-7" y="0" width="14" height="34" rx="6" fill="#c96f4a"/>
        <rect x="-2.5" y="34" width="5" height="40" rx="2.5" fill="#b9b1a3"/>
      </g>
      <!-- hanging saw blade -->
      <circle cx="236" cy="124" r="30" fill="#b9b1a3"/>
      <circle cx="236" cy="124" r="9" fill="#fffdf8"/>
      <g fill="#8a6a4f">
        <polygon points="236,90 242,98 230,98"/>
        <polygon points="236,158 230,150 242,150"/>
        <polygon points="202,124 210,118 210,130"/>
        <polygon points="270,124 262,130 262,118"/>
      </g>
      <!-- window -->
      <rect x="386" y="46" width="120" height="104" rx="8" fill="#dce8ee" stroke="#e6dccb" stroke-width="3"/>
      <line x1="446" y1="49" x2="446" y2="147" stroke="#fffdf8" stroke-width="4"/>
      <line x1="389" y1="98" x2="503" y2="98" stroke="#fffdf8" stroke-width="4"/>
      <circle cx="420" cy="76" r="13" fill="#e0a93d"/>
      <!-- workbench -->
      <rect x="40" y="262" width="480" height="22" rx="8" fill="#c9a06b"/>
      <rect x="46" y="284" width="468" height="9" rx="4" fill="#8a6a4f"/>
      <rect x="64" y="293" width="16" height="100" rx="6" fill="#8a6a4f"/>
      <rect x="480" y="293" width="16" height="100" rx="6" fill="#8a6a4f"/>
      <!-- drill on bench -->
      <g transform="translate(96 196)">
        <rect x="22" y="14" width="74" height="34" rx="12" fill="#3e7c59"/>
        <rect x="0" y="20" width="26" height="20" rx="7" fill="#b9b1a3"/>
        <rect x="-8" y="25" width="12" height="10" rx="4" fill="#8a6a4f"/>
        <rect x="62" y="44" width="24" height="32" rx="7" fill="#2c5a40"/>
        <rect x="56" y="72" width="38" height="16" rx="5" fill="#e0a93d"/>
        <circle cx="86" cy="28" r="6" fill="#5e9a78"/>
        <rect x="58" y="46" width="8" height="10" rx="3" fill="#c96f4a"/>
      </g>
      <!-- charger with pack and green light -->
      <g transform="translate(256 214)">
        <rect x="0" y="32" width="104" height="20" rx="8" fill="#b9b1a3"/>
        <rect x="14" y="0" width="50" height="36" rx="8" fill="#2c5a40"/>
        <rect x="20" y="8" width="38" height="9" rx="4" fill="#5e9a78"/>
        <circle cx="86" cy="42" r="5" fill="#3e7c59"/>
        <path d="M104 42 q26 0 26 22" stroke="#8a6a4f" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
      <!-- spare pack labeled with year -->
      <g transform="translate(398 218)">
        <rect x="0" y="10" width="62" height="36" rx="8" fill="#2c5a40"/>
        <rect x="10" y="0" width="42" height="14" rx="5" fill="#3e7c59"/>
        <rect x="8" y="20" width="46" height="16" rx="4" fill="#fffdf8"/>
        <text x="31" y="32.5" font-size="11.5" font-weight="700" fill="#33393b" text-anchor="middle">2022</text>
      </g>
      <!-- recycle box under bench -->
      <g transform="translate(330 318)">
        <path d="M0 0 h118 l-9 64 h-100 z" fill="#c96f4a"/>
        <rect x="-6" y="-8" width="130" height="14" rx="6" fill="#d9663f"/>
        <g stroke="#fffdf8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M48 24 l10 -14 l10 14"/>
          <path d="M70 34 l16 4 l-8 14"/>
          <path d="M48 44 l-10 12 l16 4"/>
        </g>
        <!-- dead packs peeking out -->
        <rect x="14" y="-22" width="34" height="18" rx="5" fill="#8a6a4f" transform="rotate(-8 31 -13)"/>
        <rect x="76" y="-20" width="32" height="16" rx="5" fill="#b9b1a3" transform="rotate(6 92 -12)"/>
      </g>
      <!-- stool -->
      <rect x="120" y="330" width="64" height="11" rx="5" fill="#8a6a4f"/>
      <rect x="128" y="341" width="9" height="52" rx="4" fill="#8a6a4f"/>
      <rect x="167" y="341" width="9" height="52" rx="4" fill="#8a6a4f"/>
      <!-- plant -->
      <ellipse cx="520" cy="232" rx="8" ry="14" fill="#5e9a78" transform="rotate(-24 520 232)"/>
      <ellipse cx="538" cy="234" rx="8" ry="14" fill="#3e7c59" transform="rotate(22 538 234)"/>
      <path d="M522 262 h28 l-5 -22 h-18 z" fill="#c96f4a" transform="translate(0 -14)"/>
      <!-- floor mat -->
      <ellipse cx="282" cy="396" rx="140" ry="10" fill="#b9b1a3" opacity="0.5"/>
    </svg>
