<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of an eyeglass nose-pad swap on a clean desk: a pair of metal-frame glasses with a yellowed, hardened old nose pad beside a fresh clear silicone one, a tiny eyeglass screwdriver, a small pack of replacement pads, and a magnified close-up of a nose-pad arm">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- desk surface -->
      <rect x="40" y="330" width="480" height="14" rx="6" fill="#c9a06b"/>
      <rect x="40" y="344" width="480" height="8" rx="4" fill="#8a6a4f"/>

      <!-- ===== the eyeglasses (metal frame) ===== -->
      <!-- left lens -->
      <circle cx="196" cy="150" r="58" fill="#dce8ee" opacity="0.85"/>
      <circle cx="196" cy="150" r="58" fill="none" stroke="#5e9a78" stroke-width="8"/>
      <!-- lens shine -->
      <path d="M168 122 q18 -14 40 -6" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      <!-- right lens -->
      <circle cx="330" cy="150" r="58" fill="#dce8ee" opacity="0.85"/>
      <circle cx="330" cy="150" r="58" fill="none" stroke="#5e9a78" stroke-width="8"/>
      <path d="M302 122 q18 -14 40 -6" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      <!-- bridge -->
      <path d="M250 132 q42 -22 26 0" fill="none" stroke="#5e9a78" stroke-width="8" stroke-linecap="round"/>
      <!-- temple arms -->
      <path d="M138 150 q-42 4 -70 22" fill="none" stroke="#3e7c59" stroke-width="8" stroke-linecap="round"/>
      <path d="M388 150 q42 4 70 22" fill="none" stroke="#3e7c59" stroke-width="8" stroke-linecap="round"/>
      <!-- nose-pad arms + pads -->
      <path d="M244 178 q-8 14 -16 20" fill="none" stroke="#b9b1a3" stroke-width="4" stroke-linecap="round"/>
      <path d="M282 178 q8 14 16 20" fill="none" stroke="#b9b1a3" stroke-width="4" stroke-linecap="round"/>
      <!-- LEFT pad: old, yellowed, hardened -->
      <ellipse cx="224" cy="204" rx="10" ry="14" fill="#e0a93d" transform="rotate(-18 224 204)"/>
      <ellipse cx="224" cy="204" rx="10" ry="14" fill="#d98e3b" opacity="0.4" transform="rotate(-18 224 204)"/>
      <!-- crack on the old pad -->
      <path d="M222 196 l3 8 l-2 8" stroke="#8a6a4f" stroke-width="1.4" fill="none"/>
      <!-- RIGHT pad: fresh, clear silicone -->
      <ellipse cx="302" cy="204" rx="10" ry="14" fill="#dce8ee" transform="rotate(18 302 204)"/>
      <ellipse cx="302" cy="204" rx="10" ry="14" fill="none" stroke="#7fb3c8" stroke-width="1.8" transform="rotate(18 302 204)"/>

      <!-- loose spare pads on the desk (old yellow next to fresh clear) -->
      <ellipse cx="120" cy="316" rx="11" ry="15" fill="#e0a93d" transform="rotate(-10 120 316)"/>
      <path d="M118 308 l3 8 l-2 7" stroke="#8a6a4f" stroke-width="1.3" fill="none"/>
      <text x="94" y="298" font-size="11" fill="#d98e3b" font-weight="700">old</text>
      <ellipse cx="152" cy="318" rx="11" ry="15" fill="#dce8ee" transform="rotate(10 152 318)"/>
      <ellipse cx="152" cy="318" rx="11" ry="15" fill="none" stroke="#7fb3c8" stroke-width="1.8" transform="rotate(10 152 318)"/>
      <text x="146" y="298" font-size="11" fill="#7fb3c8" font-weight="700">new</text>

      <!-- tiny eyeglass screwdriver -->
      <g transform="rotate(24 400 300)">
        <rect x="360" y="292" width="70" height="12" rx="6" fill="#c96f4a"/>
        <rect x="360" y="292" width="24" height="12" rx="6" fill="#d9663f"/>
        <rect x="430" y="295" width="34" height="6" rx="2" fill="#b9b1a3"/>
        <rect x="462" y="296" width="6" height="4" fill="#8a6a4f"/>
      </g>

      <!-- pack of replacement pads (blister card) -->
      <rect x="410" y="230" width="86" height="74" rx="8" fill="#fffdf8" stroke="#8a6a4f" stroke-width="3"/>
      <rect x="410" y="230" width="86" height="20" rx="8" fill="#3e7c59"/>
      <text x="453" y="244" font-size="10" fill="#fffdf8" font-weight="700" text-anchor="middle">NOSE PADS</text>
      <!-- pads in blister bubbles -->
      <g>
        <circle cx="432" cy="270" r="9" fill="#dce8ee" stroke="#7fb3c8" stroke-width="1.4"/>
        <circle cx="458" cy="270" r="9" fill="#dce8ee" stroke="#7fb3c8" stroke-width="1.4"/>
        <circle cx="484" cy="270" r="9" fill="#dce8ee" stroke="#7fb3c8" stroke-width="1.4"/>
        <circle cx="432" cy="292" r="9" fill="#dce8ee" stroke="#7fb3c8" stroke-width="1.4"/>
        <circle cx="458" cy="292" r="9" fill="#dce8ee" stroke="#7fb3c8" stroke-width="1.4"/>
        <circle cx="484" cy="292" r="9" fill="#dce8ee" stroke="#7fb3c8" stroke-width="1.4"/>
      </g>

      <!-- magnified close-up of a nose-pad arm (circle inset) -->
      <circle cx="112" cy="128" r="60" fill="#fbf8f2" stroke="#b9b1a3" stroke-width="4"/>
      <circle cx="112" cy="128" r="60" fill="none" stroke="#fffdf8" stroke-width="1.5"/>
      <!-- magnifier handle -->
      <rect x="150" y="166" width="40" height="12" rx="6" fill="#8a6a4f" transform="rotate(45 170 172)"/>
      <!-- inside the lens: the wire arm + pad + tiny screw -->
      <path d="M92 96 q6 26 22 40" fill="none" stroke="#b9b1a3" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="120" cy="146" rx="14" ry="19" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
      <!-- the tiny screw -->
      <circle cx="100" cy="112" r="6" fill="#e0a93d" stroke="#d98e3b" stroke-width="1.4"/>
      <path d="M97 112 l6 0 M100 109 l0 6" stroke="#8a6a4f" stroke-width="1.4"/>
      <text x="76" y="180" font-size="10" fill="#6b7376" font-weight="700">nose-pad arm</text>
    </svg>
