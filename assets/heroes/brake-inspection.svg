<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a brake inspection: a car's front wheel with the spokes revealing the brake caliper clamped over a vented rotor and a brake pad, a person crouched beside the wheel measuring the pad thickness with a small gauge, brake dust visible on the wheel face, and the car body raised on a jack stand in the background">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- car body / fender arch in the background -->
      <path d="M70 220 q40 -120 200 -120 q150 0 200 96 l0 40 l-400 0 z" fill="#7fb3c8"/>
      <path d="M70 220 q40 -120 200 -120 q150 0 200 96 l0 14 l-400 0 z" fill="#5e9a78" opacity="0.35"/>
      <!-- door seam + handle on the body -->
      <line x1="360" y1="116" x2="360" y2="236" stroke="#2c5a40" stroke-width="3" opacity="0.5"/>
      <rect x="384" y="150" width="26" height="7" rx="3.5" fill="#dce8ee"/>
      <!-- wheel-arch cut-out over the tire -->
      <path d="M118 250 a96 96 0 0 1 192 0 z" fill="#8a6a4f"/>

      <!-- jack stand supporting the car at the rear -->
      <g>
        <path d="M450 248 l18 0 l8 70 l-34 0 z" fill="#b9b1a3"/>
        <path d="M452 256 l14 0 l0 -16 l-7 -8 l-7 8 z" fill="#8a6a4f"/>
        <rect x="438" y="316" width="58" height="10" rx="3" fill="#8a6a4f"/>
        <line x1="466" y1="240" x2="466" y2="232" stroke="#8a6a4f" stroke-width="4"/>
      </g>

      <!-- TIRE -->
      <circle cx="214" cy="262" r="118" fill="#33393b"/>
      <circle cx="214" cy="262" r="118" fill="none" stroke="#22272a" stroke-width="6"/>
      <!-- tread ticks around the tire -->
      <g stroke="#22272a" stroke-width="4">
        <line x1="214" y1="144" x2="214" y2="160"/>
        <line x1="296" y1="180" x2="285" y2="191"/>
        <line x1="332" y1="262" x2="316" y2="262"/>
        <line x1="296" y1="344" x2="285" y2="333"/>
        <line x1="214" y1="380" x2="214" y2="364"/>
        <line x1="132" y1="344" x2="143" y2="333"/>
        <line x1="96" y1="262" x2="112" y2="262"/>
        <line x1="132" y1="180" x2="143" y2="191"/>
      </g>

      <!-- WHEEL face with brake dust -->
      <circle cx="214" cy="262" r="86" fill="#b9b1a3"/>
      <circle cx="214" cy="262" r="86" fill="#8a6a4f" opacity="0.25"/>
      <!-- brake dust film on the wheel face -->
      <g fill="#8a6a4f" opacity="0.5">
        <circle cx="180" cy="232" r="3"/>
        <circle cx="246" cy="240" r="2.4"/>
        <circle cx="262" cy="284" r="3.2"/>
        <circle cx="172" cy="296" r="2.6"/>
        <circle cx="222" cy="312" r="2.2"/>
      </g>

      <!-- five spokes, with gaps you can see the brake through -->
      <g fill="#dce8ee" stroke="#9cc3d4" stroke-width="2">
        <path d="M214 262 L214 188 q14 6 22 18 z"/>
        <path d="M214 262 L284 240 q-2 16 -12 26 z"/>
        <path d="M214 262 L258 322 q-16 6 -30 2 z"/>
        <path d="M214 262 L170 322 q-12 -10 -16 -24 z"/>
        <path d="M214 262 L156 218 q8 -14 22 -22 z"/>
      </g>
      <!-- hub + lug nuts -->
      <circle cx="214" cy="262" r="22" fill="#9cc3d4"/>
      <circle cx="214" cy="262" r="22" fill="none" stroke="#7fb3c8" stroke-width="3"/>
      <g fill="#6b7376">
        <circle cx="214" cy="246" r="3.2"/>
        <circle cx="229" cy="257" r="3.2"/>
        <circle cx="223" cy="275" r="3.2"/>
        <circle cx="205" cy="275" r="3.2"/>
        <circle cx="199" cy="257" r="3.2"/>
      </g>

      <!-- BRAKE assembly visible through a spoke gap (between spokes, lower-right) -->
      <!-- vented rotor edge peeking through -->
      <path d="M240 268 a64 64 0 0 1 -20 44" fill="none" stroke="#c9a06b" stroke-width="14" opacity="0.9"/>
      <path d="M240 268 a64 64 0 0 1 -20 44" fill="none" stroke="#fffdf8" stroke-width="3" opacity="0.6"/>
      <!-- the CALIPER clamped over the rotor (terracotta, the most visible brake part) -->
      <rect x="246" y="276" width="40" height="56" rx="9" fill="#c96f4a" transform="rotate(26 266 304)"/>
      <rect x="246" y="276" width="40" height="20" rx="9" fill="#d9663f" transform="rotate(26 266 304)"/>
      <!-- bleeder bolt on the caliper -->
      <circle cx="288" cy="290" r="4" fill="#8a6a4f"/>
      <!-- brake PAD edge between caliper and rotor -->
      <rect x="252" y="298" width="26" height="8" rx="2" fill="#5e9a78" transform="rotate(26 265 302)"/>

      <!-- PERSON crouched beside the wheel, measuring the pad -->
      <!-- crouched body -->
      <path d="M392 360 q4 -70 36 -96 q22 -18 44 -10" fill="none" stroke="#2c5a40" stroke-width="22" stroke-linecap="round"/>
      <!-- thigh / seat -->
      <path d="M392 360 q-2 -28 18 -42" fill="none" stroke="#3e7c59" stroke-width="24" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="476" cy="248" r="20" fill="#e8b48f"/>
      <path d="M460 240 q16 -16 34 -2 q2 -16 -16 -18 q-18 -2 -18 20 z" fill="#8a6a4f"/>
      <!-- arm reaching to the wheel with a small gauge -->
      <path d="M468 262 q-60 14 -150 30" fill="none" stroke="#3e7c59" stroke-width="13" stroke-linecap="round"/>
      <!-- hand -->
      <circle cx="320" cy="294" r="11" fill="#e8b48f"/>
      <!-- a small pad-thickness gauge / feeler in hand -->
      <rect x="300" y="288" width="26" height="7" rx="3" fill="#e0a93d" transform="rotate(-12 313 291)"/>
      <line x1="300" y1="290" x2="288" y2="294" stroke="#d98e3b" stroke-width="3" stroke-linecap="round"/>

      <!-- measurement callout near the pad -->
      <g>
        <line x1="300" y1="346" x2="346" y2="346" stroke="#d9663f" stroke-width="2.4"/>
        <line x1="300" y1="342" x2="300" y2="350" stroke="#d9663f" stroke-width="2.4"/>
        <line x1="346" y1="342" x2="346" y2="350" stroke="#d9663f" stroke-width="2.4"/>
        <text x="323" y="366" font-size="12" fill="#d9663f" font-weight="700" text-anchor="middle">pad ≈ 3 mm?</text>
      </g>
    </svg>
