      <circle cx="300" cy="252" r="34" fill="#2c5a40"/>
      <circle cx="272" cy="266" r="22" fill="#3e7c59"/>
      <circle cx="330" cy="264" r="24" fill="#5e9a78"/>
      <circle cx="300" cy="232" r="22" fill="#3e7c59"/>
