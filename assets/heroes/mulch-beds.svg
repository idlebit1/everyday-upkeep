        <line x1="150" y1="338" x2="190" y2="352" stroke="#8a6a4f" stroke-width="8" stroke-linecap="round"/>
        <line x1="56" y1="338" x2="30" y2="356" stroke="#8a6a4f" stroke-width="8" stroke-linecap="round"/>
        <circle cx="92" cy="392" r="17" fill="#33393b"/>
        <circle cx="92" cy="392" r="6.5" fill="#b9b1a3"/>
