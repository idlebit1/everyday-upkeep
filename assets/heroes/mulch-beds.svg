        <ellipse cx="288" cy="346" rx="6" ry="2.4" transform="rotate(12 288 346)"/>
        <ellipse cx="352" cy="352" rx="6" ry="2.4" transform="rotate(-10 352 352)"/>
        <ellipse cx="412" cy="358" rx="6" ry="2.4" transform="rotate(20 412 358)"/>
        <ellipse cx="258" cy="372" rx="6" ry="2.4" transform="rotate(8 258 372)"/>
        <ellipse cx="330" cy="376" rx="6" ry="2.4" transform="rotate(-22 330 376)"/>
        <ellipse cx="396" cy="378" rx="6" ry="2.4" transform="rotate(14 396 378)"/>
