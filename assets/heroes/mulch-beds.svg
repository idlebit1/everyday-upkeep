<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a tidy garden bed with a shrub and flowers ringed by a fresh layer of brown mulch, a wheelbarrow of mulch and a rake beside it, under a bright sun">
