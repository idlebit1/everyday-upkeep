      <!-- rake leaning -->
      <g>
        <line x1="506" y1="372" x2="476" y2="270" stroke="#8a6a4f" stroke-width="7" stroke-linecap="round"/>
        <path d="M462 268 h30" stroke="#b9b1a3" stroke-width="5" stroke-linecap="round"/>
        <g stroke="#b9b1a3" stroke-width="3" stroke-linecap="round">
          <line x1="464" y1="268" x2="462" y2="280"/>
          <line x1="472" y1="268" x2="471" y2="280"/>
          <line x1="480" y1="268" x2="481" y2="280"/>
          <line x1="488" y1="268" x2="490" y2="280"/>
