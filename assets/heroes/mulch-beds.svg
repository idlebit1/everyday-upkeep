        <circle cx="392" cy="320" r="8" fill="#c96f4a"/>
        <circle cx="392" cy="320" r="3" fill="#e0a93d"/>
      </g>
      <g>
        <line x1="416" y1="358" x2="416" y2="334" stroke="#3e7c59" stroke-width="3" stroke-linecap="round"/>
        <circle cx="416" cy="328" r="7" fill="#d9663f"/>
