<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of staying ahead on prescription refills: a nearly-empty amber pill bottle with a refills-remaining label sits next to a fresh full bottle on a kitchen counter, a phone shows a pharmacy app with an auto-refill ready notice, a weekly pill organizer with seven day compartments sits nearby, and a wall calendar has a refill reminder circled">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- kitchen counter -->
      <rect x="40" y="356" width="490" height="14" rx="4" fill="#b9b1a3"/>
      <rect x="40" y="370" width="490" height="10" rx="3" fill="#8a6a4f"/>

      <!-- calendar on the wall with a reminder circled -->
      <rect x="392" y="46" width="132" height="120" rx="10" fill="#fffdf8" stroke="#8a6a4f" stroke-width="5"/>
      <rect x="392" y="46" width="132" height="26" rx="10" fill="#3e7c59"/>
      <rect x="392" y="60" width="132" height="12" fill="#3e7c59"/>
      <rect x="414" y="38" width="8" height="18" rx="4" fill="#8a6a4f"/>
      <rect x="494" y="38" width="8" height="18" rx="4" fill="#8a6a4f"/>
      <!-- calendar grid dots -->
      <g fill="#cdd9de">
        <circle cx="410" cy="90" r="4"/><circle cx="432" cy="90" r="4"/><circle cx="454" cy="90" r="4"/><circle cx="476" cy="90" r="4"/><circle cx="498" cy="90" r="4"/>
        <circle cx="410" cy="112" r="4"/><circle cx="432" cy="112" r="4"/><circle cx="454" cy="112" r="4"/><circle cx="476" cy="112" r="4"/><circle cx="498" cy="112" r="4"/>
        <circle cx="410" cy="134" r="4"/><circle cx="432" cy="134" r="4"/>
      </g>
      <!-- reminder circled in gold -->
      <circle cx="476" cy="134" r="12" fill="none" stroke="#e0a93d" stroke-width="3.5"/>
      <circle cx="476" cy="134" r="4" fill="#e0a93d"/>
      <text x="404" y="158" font-size="10" fill="#3e7c59" font-weight="700">refill day</text>

      <!-- phone showing pharmacy app: auto-refill ready -->
      <rect x="60" y="150" width="118" height="196" rx="18" fill="#33393b"/>
      <rect x="68" y="164" width="102" height="168" rx="8" fill="#fffdf8"/>
      <!-- app header -->
      <rect x="68" y="164" width="102" height="30" rx="8" fill="#3e7c59"/>
      <rect x="68" y="178" width="102" height="16" fill="#3e7c59"/>
      <text x="119" y="185" font-size="10" fill="#fffdf8" font-weight="700" text-anchor="middle">Pharmacy</text>
      <!-- pill row in the app -->
      <rect x="78" y="204" width="24" height="14" rx="7" fill="#e0a93d"/>
      <rect x="90" y="204" width="12" height="14" rx="0" fill="#d98e3b"/>
      <rect x="110" y="207" width="52" height="6" rx="3" fill="#d8cfbe"/>
      <rect x="110" y="217" width="36" height="5" rx="2.5" fill="#e9e2d8"/>
      <!-- auto-refill ready badge -->
      <rect x="78" y="236" width="84" height="26" rx="8" fill="#e3efe8"/>
      <path d="M86 249 l5 5 l10 -11" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="130" y="252" font-size="9" fill="#2c5a40" font-weight="700" text-anchor="middle">Auto-refill</text>
      <!-- toggle switch on -->
      <rect x="78" y="272" width="40" height="18" rx="9" fill="#5e9a78"/>
      <circle cx="108" cy="281" r="7" fill="#fffdf8"/>
      <rect x="126" y="277" width="36" height="6" rx="3" fill="#e9e2d8"/>
      <rect x="78" y="300" width="84" height="20" rx="8" fill="#3e7c59"/>
      <text x="120" y="314" font-size="9.5" fill="#fffdf8" font-weight="700" text-anchor="middle">Ready to pick up</text>

      <!-- nearly-empty amber pill bottle with refills-remaining label -->
      <rect x="210" y="250" width="70" height="96" rx="10" fill="#d98e3b" opacity="0.9"/>
      <rect x="210" y="250" width="70" height="96" rx="10" fill="#e0a93d" opacity="0.5"/>
      <!-- white childproof cap -->
      <rect x="204" y="234" width="82" height="22" rx="6" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2"/>
      <!-- label -->
      <rect x="216" y="272" width="58" height="66" rx="4" fill="#fffdf8"/>
      <rect x="222" y="280" width="46" height="5" rx="2.5" fill="#8a6a4f"/>
      <rect x="222" y="290" width="36" height="4" rx="2" fill="#cdd9de"/>
      <text x="245" y="312" font-size="9" fill="#d9663f" font-weight="700" text-anchor="middle">Refills: 1</text>
      <rect x="222" y="320" width="46" height="4" rx="2" fill="#e9e2d8"/>
      <rect x="222" y="328" width="30" height="4" rx="2" fill="#e9e2d8"/>
      <!-- one lonely pill left inside near the bottom -->
      <ellipse cx="248" cy="342" rx="6" ry="4" fill="#e3efe8"/>
      <text x="245" y="360" font-size="10" fill="#d9663f" font-weight="700" text-anchor="middle">nearly empty</text>

      <!-- fresh, full pill bottle -->
      <rect x="300" y="228" width="72" height="118" rx="10" fill="#3e7c59"/>
      <rect x="300" y="228" width="72" height="118" rx="10" fill="#5e9a78" opacity="0.4"/>
      <rect x="294" y="210" width="84" height="22" rx="6" fill="#fffdf8" stroke="#b9b1a3" stroke-width="2"/>
      <!-- label -->
      <rect x="308" y="252" width="56" height="64" rx="4" fill="#fffdf8"/>
      <rect x="314" y="260" width="44" height="5" rx="2.5" fill="#8a6a4f"/>
      <rect x="314" y="270" width="34" height="4" rx="2" fill="#cdd9de"/>
      <text x="336" y="292" font-size="9" fill="#2c5a40" font-weight="700" text-anchor="middle">90-day</text>
      <rect x="314" y="300" width="44" height="4" rx="2" fill="#e9e2d8"/>
      <rect x="314" y="308" width="28" height="4" rx="2" fill="#e9e2d8"/>
      <!-- full of pills -->
      <g fill="#e3efe8">
        <ellipse cx="322" cy="330" rx="6" ry="4"/>
        <ellipse cx="338" cy="334" rx="6" ry="4"/>
        <ellipse cx="352" cy="330" rx="6" ry="4"/>
        <ellipse cx="330" cy="340" rx="6" ry="4"/>
        <ellipse cx="346" cy="341" rx="6" ry="4"/>
      </g>
      <text x="336" y="360" font-size="10" fill="#3e7c59" font-weight="700" text-anchor="middle">fresh supply</text>

      <!-- weekly pill organizer with seven compartments -->
      <rect x="392" y="300" width="150" height="46" rx="8" fill="#7fb3c8"/>
      <rect x="392" y="300" width="150" height="14" rx="8" fill="#9cc3d4"/>
      <g stroke="#5e9a78" stroke-width="2.5">
        <line x1="413" y1="316" x2="413" y2="344"/>
        <line x1="434" y1="316" x2="434" y2="344"/>
        <line x1="455" y1="316" x2="455" y2="344"/>
        <line x1="476" y1="316" x2="476" y2="344"/>
        <line x1="497" y1="316" x2="497" y2="344"/>
        <line x1="518" y1="316" x2="518" y2="344"/>
      </g>
      <!-- day letters -->
      <g font-size="8" fill="#2c5a40" font-weight="700" text-anchor="middle">
        <text x="402" y="311">S</text><text x="423" y="311">M</text><text x="444" y="311">T</text>
        <text x="465" y="311">W</text><text x="487" y="311">T</text><text x="508" y="311">F</text><text x="530" y="311">S</text>
      </g>
      <!-- a couple of pills in compartments -->
      <ellipse cx="402" cy="330" rx="4" ry="3" fill="#e0a93d"/>
      <ellipse cx="444" cy="330" rx="4" ry="3" fill="#e0a93d"/>
      <ellipse cx="487" cy="330" rx="4" ry="3" fill="#e0a93d"/>
    </svg>
