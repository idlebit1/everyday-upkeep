<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of checking engine coolant: a car with its hood propped open shows the engine bay, where a translucent coolant overflow reservoir with MIN and MAX marks sits beside the radiator cap, a hand checks the level against the marks on a cold engine, and a jug of green coolant stands ready on the ground nearby">
      <ellipse cx="285" cy="404" rx="255" ry="22" fill="#efe7d8"/>

      <!-- car body, front three-quarter -->
      <path d="M70 322 q4 -56 60 -64 l150 -10 q40 -2 70 24 l54 46 h70 q20 0 20 22 v22 q0 12 -14 12 h-470 q-12 0 -12 -12 v-44 q0 -16 22 -18 z" fill="#7fb3c8"/>
      <path d="M130 258 l150 -10 q40 -2 70 24 l40 34 h-300 q6 -42 40 -48 z" fill="#9cc3d4"/>
      <!-- windshield glint -->
      <path d="M196 254 l84 -6 q26 -1 46 16 l22 18 h-168 z" fill="#dce8ee"/>
      <!-- front wheel -->
      <circle cx="160" cy="370" r="34" fill="#33393b"/>
      <circle cx="160" cy="370" r="15" fill="#b9b1a3"/>
      <!-- rear wheel -->
      <circle cx="404" cy="370" r="34" fill="#33393b"/>
      <circle cx="404" cy="370" r="15" fill="#b9b1a3"/>

      <!-- open hood, propped up over the engine bay -->
      <path d="M70 258 l8 -120 q1 -14 16 -14 l150 4 q12 0 10 14 l-22 124 z" fill="#9cc3d4" stroke="#5e9a78" stroke-width="4"/>
      <path d="M82 252 l6 -104 l136 4 l-18 102 z" fill="#dce8ee"/>
      <!-- prop rod -->
      <line x1="120" y1="246" x2="100" y2="150" stroke="#8a6a4f" stroke-width="4" stroke-linecap="round"/>

      <!-- engine bay opening -->
      <rect x="232" y="190" width="176" height="74" rx="8" fill="#b9b1a3"/>
      <rect x="240" y="198" width="160" height="58" rx="5" fill="#8a6a4f"/>
      <!-- engine block detail -->
      <rect x="300" y="206" width="60" height="42" rx="4" fill="#6b7376"/>
      <g stroke="#33393b" stroke-width="3">
        <line x1="310" y1="206" x2="310" y2="248"/>
        <line x1="324" y1="206" x2="324" y2="248"/>
        <line x1="338" y1="206" x2="338" y2="248"/>
        <line x1="352" y1="206" x2="352" y2="248"/>
      </g>
      <!-- radiator cap -->
      <circle cx="384" cy="214" r="11" fill="#c96f4a"/>
      <circle cx="384" cy="214" r="5" fill="#8a6a4f"/>
      <text x="384" y="236" font-size="9" fill="#fffdf8" text-anchor="middle">cap</text>

      <!-- translucent overflow reservoir with MIN/MAX -->
      <rect x="246" y="196" width="44" height="62" rx="7" fill="#dce8ee" stroke="#7fb3c8" stroke-width="3" opacity="0.92"/>
      <!-- coolant inside, sitting between MIN and MAX -->
      <rect x="249" y="224" width="38" height="31" rx="4" fill="#5e9a78" opacity="0.85"/>
      <!-- MAX mark -->
      <line x1="290" y1="214" x2="300" y2="214" stroke="#2c5a40" stroke-width="2.4"/>
      <text x="302" y="217" font-size="8.5" fill="#2c5a40" font-weight="700">MAX</text>
      <!-- MIN mark -->
      <line x1="290" y1="246" x2="300" y2="246" stroke="#d9663f" stroke-width="2.4"/>
      <text x="302" y="249" font-size="8.5" fill="#d9663f" font-weight="700">MIN</text>
      <!-- reservoir cap -->
      <rect x="258" y="190" width="20" height="9" rx="3" fill="#e0a93d"/>

      <!-- hand checking the level, pointing at the reservoir -->
      <ellipse cx="218" cy="232" rx="17" ry="12" fill="#e8b48f"/>
      <path d="M232 230 q12 -2 18 4" stroke="#d99c73" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M204 238 q-22 18 -40 50" stroke="#3e7c59" stroke-width="13" fill="none" stroke-linecap="round"/>

      <!-- jug of coolant on the ground -->
      <rect x="446" y="320" width="56" height="62" rx="8" fill="#5e9a78"/>
      <rect x="446" y="320" width="56" height="14" rx="6" fill="#3e7c59"/>
      <rect x="460" y="300" width="20" height="22" rx="4" fill="#3e7c59"/>
      <rect x="458" y="294" width="24" height="9" rx="3" fill="#2c5a40"/>
      <!-- label on the jug -->
      <rect x="452" y="340" width="44" height="28" rx="4" fill="#fffdf8"/>
      <text x="474" y="352" font-size="8.5" fill="#3e7c59" text-anchor="middle" font-weight="700">COOLANT</text>
      <text x="474" y="362" font-size="7" fill="#6b7376" text-anchor="middle">50/50</text>
      <!-- a bright coolant droplet on the cap -->
      <path d="M470 296 q3 5 0 9" stroke="#5e9a78" stroke-width="2.4" fill="none" stroke-linecap="round"/>

      <!-- "COLD" reminder tag -->
      <rect x="92" y="300" width="78" height="26" rx="13" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2"/>
      <text x="131" y="317" font-size="12" fill="#2c5a40" text-anchor="middle" font-weight="700">engine COLD</text>
    </svg>
