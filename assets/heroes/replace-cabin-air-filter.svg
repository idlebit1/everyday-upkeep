<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of an open glovebox in a car dashboard with a clean pleated cabin air filter sliding into the housing on a beam of fresh air, while a dark, leaf-clogged old filter sits to the side">
      <ellipse cx="280" cy="402" rx="250" ry="22" fill="#efe7d8"/>
      <!-- dashboard slab -->
      <rect x="60" y="64" width="440" height="150" rx="20" fill="#3e7c59"/>
      <rect x="60" y="190" width="440" height="30" rx="12" fill="#2c5a40"/>
      <!-- dash vents blowing clean air -->
      <rect x="92" y="92" width="96" height="40" rx="8" fill="#2c5a40"/>
      <g stroke="#5e9a78" stroke-width="6" stroke-linecap="round">
        <line x1="104" y1="100" x2="104" y2="124"/>
        <line x1="120" y1="100" x2="120" y2="124"/>
        <line x1="136" y1="100" x2="136" y2="124"/>
        <line x1="152" y1="100" x2="152" y2="124"/>
        <line x1="168" y1="100" x2="168" y2="124"/>
      </g>
      <!-- fresh-air breeze from the vent -->
      <g stroke="#7fb3c8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
        <path d="M196 104 q26 -8 50 2"/>
        <path d="M196 116 q30 8 56 -2"/>
        <path d="M196 128 q24 10 48 4"/>
      </g>
      <!-- glovebox opening (dark cavity) -->
      <rect x="300" y="86" width="170" height="116" rx="12" fill="#26302c"/>
      <!-- open glovebox door, dropped down -->
      <rect x="296" y="206" width="180" height="92" rx="12" fill="#5e9a78"/>
      <rect x="296" y="206" width="180" height="14" rx="7" fill="#3e7c59"/>
      <rect x="356" y="248" width="60" height="10" rx="5" fill="#2c5a40"/>
      <!-- filter housing slot inside cavity -->
      <rect x="320" y="108" width="130" height="74" rx="6" fill="#1d2521"/>
      <!-- NEW clean filter sliding in -->
      <g>
        <rect x="332" y="116" width="112" height="58" rx="5" fill="#dce8ee"/>
        <rect x="332" y="116" width="112" height="58" rx="5" fill="none" stroke="#7fb3c8" stroke-width="2.5"/>
        <g stroke="#7fb3c8" stroke-width="3">
          <line x1="346" y1="118" x2="346" y2="172"/>
          <line x1="360" y1="118" x2="360" y2="172"/>
          <line x1="374" y1="118" x2="374" y2="172"/>
          <line x1="388" y1="118" x2="388" y2="172"/>
          <line x1="402" y1="118" x2="402" y2="172"/>
          <line x1="416" y1="118" x2="416" y2="172"/>
          <line x1="430" y1="118" x2="430" y2="172"/>
        </g>
        <!-- airflow arrow on the frame -->
        <line x1="350" y1="190" x2="426" y2="190" stroke="#e0a93d" stroke-width="4" stroke-linecap="round"/>
        <polygon points="426,190 414,183 414,197" fill="#e0a93d"/>
      </g>
      <!-- sparkle on the fresh filter -->
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="388" y1="98" x2="388" y2="108"/>
        <line x1="376" y1="103" x2="382" y2="110"/>
        <line x1="400" y1="103" x2="394" y2="110"/>
      </g>
      <!-- OLD clogged filter set aside on the floor -->
      <g transform="rotate(-7 150 332)">
        <rect x="86" y="300" width="128" height="64" rx="6" fill="#8a6a4f"/>
        <rect x="86" y="300" width="128" height="64" rx="6" fill="none" stroke="#6e5333" stroke-width="2.5"/>
        <g stroke="#6e5333" stroke-width="3">
          <line x1="100" y1="302" x2="100" y2="362"/>
          <line x1="114" y1="302" x2="114" y2="362"/>
          <line x1="128" y1="302" x2="128" y2="362"/>
          <line x1="142" y1="302" x2="142" y2="362"/>
          <line x1="156" y1="302" x2="156" y2="362"/>
          <line x1="170" y1="302" x2="170" y2="362"/>
          <line x1="184" y1="302" x2="184" y2="362"/>
          <line x1="198" y1="302" x2="198" y2="362"/>
        </g>
        <!-- trapped leaves & grime on the old one -->
        <path d="M120 312 q8 -10 16 0 q-8 6 -16 0" fill="#c96f4a"/>
        <path d="M168 348 q9 -11 18 0 q-9 7 -18 0" fill="#d9663f"/>
        <circle cx="150" cy="330" r="4" fill="#5a544a"/>
        <circle cx="108" cy="344" r="3.5" fill="#5a544a"/>
        <circle cx="190" cy="318" r="3" fill="#5a544a"/>
      </g>
      <text x="150" y="388" font-size="14" font-weight="700" fill="#8a6a4f" text-anchor="middle" transform="rotate(-7 150 388)">a year of dust</text>
    </svg>
