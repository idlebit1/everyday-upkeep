<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a person testing a GFCI outlet on a bathroom wall: a white wall receptacle shows two slotted plugs and two clearly labeled buttons marked TEST and RESET, a finger presses the TEST button with a small click-pop mark beside it, and a sink with a faucet and water droplets sits nearby to show this is a wet area">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- wall -->
      <rect x="40" y="30" width="480" height="350" rx="8" fill="#fffdf8"/>
      <rect x="40" y="30" width="480" height="350" rx="8" fill="none" stroke="#e9e2d8" stroke-width="3"/>
      <!-- subtle wall tile lines -->
      <g stroke="#efe7d8" stroke-width="2">
        <line x1="40" y1="120" x2="280" y2="120"/>
        <line x1="40" y1="210" x2="280" y2="210"/>
      </g>

      <!-- ===== sink / vanity at right, the wet area ===== -->
      <!-- counter -->
      <rect x="356" y="246" width="180" height="20" rx="5" fill="#b9b1a3"/>
      <rect x="372" y="266" width="148" height="70" rx="6" fill="#c9a06b"/>
      <!-- basin -->
      <ellipse cx="446" cy="252" rx="62" ry="16" fill="#dce8ee"/>
      <ellipse cx="446" cy="250" rx="50" ry="11" fill="#fffdf8"/>
      <!-- faucet -->
      <path d="M446 196 v22 q0 14 -22 14" fill="none" stroke="#8a6a4f" stroke-width="7" stroke-linecap="round"/>
      <rect x="438" y="190" width="16" height="10" rx="3" fill="#8a6a4f"/>
      <!-- running water -->
      <path d="M424 234 q-2 12 0 22" stroke="#7fb3c8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
      <!-- water droplets near outlet to flag wet area -->
      <g fill="#7fb3c8" opacity="0.8">
        <path d="M330 150 q-5 8 0 12 q5 -4 0 -12 z"/>
        <path d="M352 178 q-4 6 0 9 q4 -3 0 -9 z"/>
        <path d="M312 196 q-4 6 0 9 q4 -3 0 -9 z"/>
      </g>

      <!-- ===== the GFCI outlet, the star, clearly drawn ===== -->
      <!-- shadow -->
      <rect x="120" y="124" width="138" height="206" rx="14" fill="#efe7d8" opacity="0.6"/>
      <!-- cover plate -->
      <rect x="112" y="116" width="138" height="206" rx="14" fill="#fffdf8" stroke="#b9b1a3" stroke-width="3"/>
      <!-- mounting screws -->
      <circle cx="181" cy="130" r="4" fill="#b9b1a3"/>
      <line x1="178" y1="130" x2="184" y2="130" stroke="#8a6a4f" stroke-width="1.4"/>
      <circle cx="181" cy="308" r="4" fill="#b9b1a3"/>
      <line x1="178" y1="308" x2="184" y2="308" stroke="#8a6a4f" stroke-width="1.4"/>

      <!-- ==== RESET button (top), red ==== -->
      <rect x="156" y="146" width="50" height="26" rx="5" fill="#fbe9e1" stroke="#c96f4a" stroke-width="2.5"/>
      <text x="181" y="164" font-size="12.5" fill="#c96f4a" font-weight="800" text-anchor="middle">RESET</text>

      <!-- ==== TEST button (below reset), being pressed ==== -->
      <rect x="156" y="180" width="50" height="26" rx="5" fill="#e3efe8" stroke="#3e7c59" stroke-width="2.5"/>
      <text x="181" y="198" font-size="13" fill="#2c5a40" font-weight="800" text-anchor="middle">TEST</text>

      <!-- ==== the two receptacle faces (slots) ==== -->
      <!-- upper face -->
      <rect x="150" y="220" width="62" height="42" rx="8" fill="#fbf8f2" stroke="#d8cfbe" stroke-width="2"/>
      <rect x="166" y="228" width="6" height="16" rx="2" fill="#8a6a4f"/>
      <rect x="190" y="228" width="6" height="16" rx="2" fill="#8a6a4f"/>
      <path d="M181 250 l-5 9 h10 z" fill="#8a6a4f"/>
      <!-- lower face -->
      <rect x="150" y="270" width="62" height="42" rx="8" fill="#fbf8f2" stroke="#d8cfbe" stroke-width="2"/>
      <rect x="166" y="278" width="6" height="16" rx="2" fill="#8a6a4f"/>
      <rect x="190" y="278" width="6" height="16" rx="2" fill="#8a6a4f"/>
      <path d="M181 300 l-5 9 h10 z" fill="#8a6a4f"/>

      <!-- ==== finger pressing TEST ==== -->
      <!-- arm -->
      <path d="M120 360 q60 -40 96 -148" stroke="#3e7c59" stroke-width="14" fill="none" stroke-linecap="round"/>
      <!-- hand -->
      <ellipse cx="224" cy="204" rx="22" ry="16" fill="#e8b48f" transform="rotate(-28 224 204)"/>
      <!-- pointing fingertip onto TEST -->
      <path d="M210 196 q-8 -2 -12 -3" stroke="#e8b48f" stroke-width="11" fill="none" stroke-linecap="round"/>
      <ellipse cx="200" cy="193" rx="6" ry="5" fill="#d99c73"/>

      <!-- ==== click / pop mark ==== -->
      <g stroke="#e0a93d" stroke-width="3.5" stroke-linecap="round">
        <line x1="226" y1="172" x2="238" y2="160"/>
        <line x1="234" y1="182" x2="250" y2="178"/>
        <line x1="222" y1="188" x2="232" y2="196"/>
      </g>
      <text x="256" y="166" font-size="13" fill="#e0a93d" font-weight="800">click!</text>
      <!-- tiny lightning, the protection -->
      <path d="M286 90 l-10 22 h9 l-8 20 22 -28 h-10 z" fill="#e0a93d"/>
    </svg>
