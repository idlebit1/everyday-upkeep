<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a large phone on a desk displaying a battery health screen with a gauge arc reading 87 percent maximum capacity, next to a charging cable, a coffee mug, a notebook for logging the number, and a plant by a sunny window">
      <ellipse cx="285" cy="400" rx="245" ry="22" fill="#efe7d8"/>
      <!-- window with sun -->
      <rect x="406" y="44" width="110" height="124" rx="8" fill="#dce8ee" stroke="#e6dccb" stroke-width="3"/>
      <line x1="461" y1="47" x2="461" y2="165" stroke="#fffdf8" stroke-width="4"/>
      <line x1="409" y1="106" x2="513" y2="106" stroke="#fffdf8" stroke-width="4"/>
      <circle cx="486" cy="78" r="15" fill="#e0a93d"/>
      <g stroke="#e0a93d" stroke-width="3" stroke-linecap="round">
        <line x1="486" y1="54" x2="486" y2="60"/>
        <line x1="508" y1="78" x2="502" y2="78"/>
        <line x1="502" y1="62" x2="498" y2="66"/>
      </g>
      <rect x="394" y="36" width="134" height="10" rx="5" fill="#8a6a4f"/>
      <!-- desk -->
      <rect x="36" y="336" width="488" height="16" rx="8" fill="#c9a06b"/>
      <rect x="60" y="352" width="14" height="44" rx="6" fill="#8a6a4f"/>
      <rect x="486" y="352" width="14" height="44" rx="6" fill="#8a6a4f"/>
      <!-- big phone with battery health screen -->
      <rect x="170" y="58" width="180" height="290" rx="26" fill="#2c5a40"/>
      <rect x="182" y="74" width="156" height="258" rx="14" fill="#fffdf8"/>
      <rect x="232" y="64" width="56" height="8" rx="4" fill="#2c5a40"/>
      <!-- status bar -->
      <rect x="194" y="86" width="34" height="6" rx="3" fill="#b9b1a3"/>
      <rect x="298" y="86" width="30" height="9" rx="3" fill="#e3efe8" stroke="#b9b1a3" stroke-width="1.5"/>
      <rect x="300" y="88" width="20" height="5" rx="2" fill="#3e7c59"/>
      <!-- screen title -->
      <rect x="206" y="106" width="108" height="9" rx="4.5" fill="#b9b1a3"/>
      <!-- gauge: background arc + filled arc + needle -->
      <path d="M204 226 A56 56 0 0 1 316 226" stroke="#dce8ee" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M204 226 A56 56 0 0 1 296 182" stroke="#3e7c59" stroke-width="16" fill="none" stroke-linecap="round"/>
      <circle cx="260" cy="226" r="8" fill="#2c5a40"/>
      <line x1="260" y1="226" x2="294" y2="186" stroke="#2c5a40" stroke-width="5" stroke-linecap="round"/>
      <text x="260" y="254" font-size="30" font-weight="800" fill="#2c5a40" text-anchor="middle" font-family="Georgia, serif">87%</text>
      <text x="260" y="272" font-size="11" fill="#6b7376" text-anchor="middle">maximum capacity</text>
      <!-- screen rows -->
      <rect x="198" y="286" width="124" height="14" rx="7" fill="#e3efe8"/>
      <circle cx="208" cy="293" r="4" fill="#3e7c59"/>
      <rect x="218" y="290" width="64" height="6" rx="3" fill="#5e9a78"/>
      <rect x="198" y="308" width="124" height="14" rx="7" fill="#faf0da"/>
      <circle cx="208" cy="315" r="4" fill="#e0a93d"/>
      <rect x="218" y="312" width="52" height="6" rx="3" fill="#d98e3b"/>
      <!-- charging cable curling off the desk -->
      <path d="M350 318 q44 -8 58 18 q10 20 -16 24" stroke="#b9b1a3" stroke-width="6" fill="none" stroke-linecap="round"/>
      <rect x="344" y="310" width="18" height="12" rx="4" fill="#8a6a4f"/>
      <!-- notebook with pencil: where the number gets logged -->
      <rect x="70" y="296" width="84" height="44" rx="6" fill="#fffdf8" stroke="#e6dccb" stroke-width="2.5" transform="rotate(-4 112 318)"/>
      <line x1="84" y1="308" x2="138" y2="304" stroke="#b9b1a3" stroke-width="3" stroke-linecap="round"/>
      <line x1="85" y1="320" x2="128" y2="317" stroke="#dce8ee" stroke-width="3" stroke-linecap="round"/>
      <rect x="118" y="324" width="44" height="6" rx="3" fill="#e0a93d" transform="rotate(-18 140 327)"/>
      <polygon points="160,313 170,309 165,319" fill="#8a6a4f"/>
      <!-- mug -->
      <rect x="396" y="296" width="40" height="42" rx="7" fill="#c96f4a"/>
      <path d="M436 306 q16 4 0 22" stroke="#c96f4a" stroke-width="7" fill="none"/>
      <path d="M408 284 q3 -8 0 -14 M422 284 q3 -8 0 -14" stroke="#b9b1a3" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- plant -->
      <path d="M514 388 q-2 -22 -12 -32" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M514 388 q4 -20 14 -28" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="498" cy="352" rx="8" ry="13" fill="#5e9a78" transform="rotate(-30 498 352)"/>
      <ellipse cx="532" cy="356" rx="8" ry="13" fill="#3e7c59" transform="rotate(28 532 356)"/>
      <path d="M500 388 h30 l-5 30 h-20 z" fill="#c96f4a"/>
      <!-- floor shadow -->
      <ellipse cx="280" cy="392" rx="120" ry="10" fill="#b9b1a3" opacity="0.4"/>
    </svg>
