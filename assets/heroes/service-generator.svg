<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of servicing a portable generator outdoors, well away from the house: the red-and-green generator sits on the ground under an open canopy at a safe distance from a house in the far background, a hand drains and refills the oil from a spout, a fresh spark plug and a new air filter rest on a cloth beside it, and a fuel can with a bottle of fuel stabilizer stands nearby">
      <ellipse cx="280" cy="402" rx="252" ry="22" fill="#efe7d8"/>

      <!-- house far in the background, small, to show distance -->
      <g opacity="0.7">
        <rect x="392" y="86" width="96" height="64" rx="3" fill="#fffdf8" stroke="#b9b1a3" stroke-width="3"/>
        <path d="M386 88 L440 56 L494 88 Z" fill="#c96f4a"/>
        <rect x="404" y="110" width="20" height="20" rx="2" fill="#dce8ee" stroke="#8a6a4f" stroke-width="2"/>
        <rect x="456" y="110" width="20" height="40" rx="2" fill="#8a6a4f"/>
        <rect x="468" y="62" width="9" height="18" rx="2" fill="#b9b1a3"/>
      </g>
      <!-- distance line / shrub between house and generator to read "well away" -->
      <text x="330" y="74" font-size="11" fill="#6b7376">house — keep clear</text>
      <path d="M360 150 q-6 -16 6 -22 q-2 -10 10 -8" fill="none" stroke="#5e9a78" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="362" cy="156" rx="14" ry="9" fill="#5e9a78"/>
      <ellipse cx="346" cy="160" rx="10" ry="7" fill="#3e7c59"/>

      <!-- open canopy over the generator (rain cover, open sides) -->
      <path d="M40 120 L196 96 L196 96" fill="none"/>
      <path d="M44 124 L208 100 L208 112 L44 136 Z" fill="#7fb3c8"/>
      <path d="M44 124 L208 100" stroke="#5e9a78" stroke-width="3" stroke-linecap="round"/>
      <line x1="56" y1="132" x2="56" y2="248" stroke="#8a6a4f" stroke-width="6" stroke-linecap="round"/>
      <line x1="198" y1="108" x2="198" y2="244" stroke="#8a6a4f" stroke-width="6" stroke-linecap="round"/>
      <text x="88" y="118" font-size="11" fill="#3e7c59" font-weight="700">open-air canopy</text>

      <!-- portable generator body -->
      <!-- frame / roll cage -->
      <rect x="78" y="252" width="186" height="96" rx="14" fill="none" stroke="#b9b1a3" stroke-width="6"/>
      <!-- fuel tank on top -->
      <rect x="92" y="232" width="158" height="34" rx="12" fill="#d9663f"/>
      <rect x="92" y="232" width="158" height="12" rx="8" fill="#c96f4a"/>
      <!-- fuel cap -->
      <rect x="150" y="224" width="26" height="14" rx="6" fill="#8a6a4f"/>
      <!-- engine block -->
      <rect x="100" y="262" width="86" height="72" rx="10" fill="#3e7c59"/>
      <!-- cooling fins -->
      <g stroke="#2c5a40" stroke-width="3" stroke-linecap="round">
        <line x1="108" y1="272" x2="108" y2="324"/>
        <line x1="118" y1="272" x2="118" y2="324"/>
        <line x1="128" y1="272" x2="128" y2="324"/>
      </g>
      <!-- recoil starter -->
      <circle cx="160" cy="298" r="20" fill="#5e9a78"/>
      <circle cx="160" cy="298" r="8" fill="#e3efe8"/>
      <!-- pull handle -->
      <rect x="184" y="290" width="26" height="9" rx="4.5" fill="#2c5a40"/>
      <rect x="208" y="286" width="11" height="17" rx="4" fill="#b9b1a3"/>
      <!-- control panel with outlets -->
      <rect x="196" y="266" width="56" height="62" rx="8" fill="#2c5a40"/>
      <circle cx="212" cy="284" r="6" fill="#e0a93d"/>
      <circle cx="234" cy="284" r="6" fill="#e0a93d"/>
      <rect x="206" y="300" width="40" height="10" rx="3" fill="#5e9a78"/>
      <rect x="206" y="314" width="26" height="8" rx="3" fill="#7fb3c8"/>
      <!-- exhaust muffler pointing away from house -->
      <rect x="68" y="296" width="32" height="16" rx="6" fill="#8a6a4f"/>
      <rect x="56" y="300" width="14" height="8" rx="4" fill="#b9b1a3"/>
      <!-- wheels -->
      <circle cx="106" cy="350" r="16" fill="#8a6a4f"/>
      <circle cx="106" cy="350" r="6" fill="#efe7d8"/>
      <circle cx="236" cy="350" r="16" fill="#8a6a4f"/>
      <circle cx="236" cy="350" r="6" fill="#efe7d8"/>

      <!-- hand draining / adding oil from a spouted bottle into the engine -->
      <path d="M150 200 q26 -10 44 6 l-8 14 q-16 -10 -34 -4 z" fill="#e0a93d"/>
      <rect x="186" y="206" width="22" height="9" rx="3" fill="#d98e3b" transform="rotate(30 197 210)"/>
      <!-- oil stream into engine fill -->
      <path d="M178 232 q-4 14 -10 24" fill="none" stroke="#d98e3b" stroke-width="4" stroke-linecap="round"/>
      <!-- hand on the bottle -->
      <ellipse cx="150" cy="204" rx="15" ry="11" fill="#e8b48f"/>
      <path d="M140 200 q-5 6 -1 12" stroke="#d99c73" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M150 215 q-18 14 -34 24" stroke="#c96f4a" stroke-width="11" fill="none" stroke-linecap="round"/>

      <!-- cloth with fresh spark plug and new air filter laid out front-left -->
      <rect x="60" y="356" width="120" height="40" rx="6" fill="#dce8ee"/>
      <rect x="60" y="356" width="120" height="9" rx="4" fill="#cdd9de"/>
      <!-- fresh spark plug -->
      <rect x="78" y="364" width="10" height="20" rx="3" fill="#b9b1a3"/>
      <rect x="80" y="360" width="6" height="8" rx="2" fill="#8a6a4f"/>
      <path d="M83 384 l0 6" stroke="#c9a06b" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="83" cy="376" rx="6" ry="3" fill="#fffdf8"/>
      <text x="74" y="394" font-size="8.5" fill="#3e7c59" font-weight="700">plug</text>
      <!-- new air filter (pleated) -->
      <rect x="112" y="362" width="52" height="26" rx="5" fill="#fffdf8" stroke="#e0a93d" stroke-width="2.5"/>
      <g stroke="#e0a93d" stroke-width="2">
        <line x1="122" y1="364" x2="122" y2="386"/>
        <line x1="132" y1="364" x2="132" y2="386"/>
        <line x1="142" y1="364" x2="142" y2="386"/>
        <line x1="152" y1="364" x2="152" y2="386"/>
      </g>
      <text x="118" y="396" font-size="8.5" fill="#3e7c59" font-weight="700">air filter</text>

      <!-- fuel can with stabilizer bottle, front-right -->
      <rect x="296" y="312" width="56" height="64" rx="8" fill="#d9663f"/>
      <rect x="296" y="312" width="56" height="14" rx="8" fill="#c96f4a"/>
      <rect x="312" y="300" width="24" height="16" rx="5" fill="#8a6a4f"/>
      <path d="M336 304 l18 -8 l0 8 l-18 6 z" fill="#2c5a40"/>
      <!-- flame-free label -->
      <rect x="306" y="338" width="36" height="22" rx="4" fill="#fffdf8"/>
      <path d="M324 342 l-4 7 h4 l-5 8 l1.5 -6 h-3.5 z" fill="#d9663f"/>
      <!-- stabilizer bottle leaning beside the can -->
      <rect x="362" y="328" width="22" height="48" rx="6" fill="#5e9a78"/>
      <rect x="366" y="316" width="14" height="14" rx="3" fill="#3e7c59"/>
      <rect x="366" y="344" width="14" height="20" rx="3" fill="#e3efe8" opacity="0.85"/>
      <text x="300" y="392" font-size="10" fill="#3e7c59" font-weight="700">fuel + stabilizer</text>
    </svg>
