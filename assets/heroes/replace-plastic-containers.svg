<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Illustration of a kitchen cupboard of food-storage containers: a warped, stained, cloudy old container is being tossed toward a recycling bin, a clear fresh container and a glass container sit ready on the counter beside it, and a recycling-number triangle shows on the base of the old tub">
      <ellipse cx="285" cy="402" rx="250" ry="22" fill="#efe7d8"/>

      <!-- cupboard / shelf of containers, upper left -->
      <rect x="40" y="34" width="230" height="150" rx="10" fill="#fffdf8" stroke="#8a6a4f" stroke-width="6"/>
      <rect x="40" y="106" width="230" height="8" fill="#8a6a4f"/>
      <!-- shelf shadow -->
      <rect x="48" y="42" width="214" height="60" rx="4" fill="#efe7d8" opacity="0.5"/>
      <rect x="48" y="120" width="214" height="56" rx="4" fill="#efe7d8" opacity="0.5"/>

      <!-- containers on the top shelf -->
      <rect x="58" y="66" width="46" height="36" rx="5" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2.4"/>
      <rect x="56" y="60" width="50" height="8" rx="3" fill="#7fb3c8"/>
      <rect x="116" y="60" width="40" height="42" rx="5" fill="#e3efe8" stroke="#5e9a78" stroke-width="2.4"/>
      <rect x="114" y="54" width="44" height="8" rx="3" fill="#5e9a78"/>
      <rect x="168" y="72" width="44" height="30" rx="5" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2.4"/>
      <rect x="166" y="66" width="48" height="8" rx="3" fill="#7fb3c8"/>
      <!-- a lone lid leaning -->
      <rect x="222" y="60" width="38" height="8" rx="3" fill="#9cc3d4" transform="rotate(-16 241 64)"/>

      <!-- containers on the lower shelf -->
      <rect x="60" y="132" width="52" height="40" rx="5" fill="#e3efe8" stroke="#5e9a78" stroke-width="2.4"/>
      <rect x="58" y="126" width="56" height="8" rx="3" fill="#5e9a78"/>
      <rect x="124" y="140" width="44" height="32" rx="5" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2.4"/>
      <rect x="122" y="134" width="48" height="8" rx="3" fill="#7fb3c8"/>
      <rect x="180" y="132" width="46" height="40" rx="5" fill="#dce8ee" stroke="#7fb3c8" stroke-width="2.4"/>
      <rect x="178" y="126" width="50" height="8" rx="3" fill="#7fb3c8"/>

      <!-- counter surface -->
      <rect x="20" y="300" width="530" height="14" rx="4" fill="#c9a06b"/>
      <rect x="20" y="314" width="530" height="10" rx="3" fill="#8a6a4f"/>

      <!-- OLD warped, stained, cloudy container being tossed toward the bin (center) -->
      <g transform="rotate(-18 300 210)">
        <!-- body, cloudy/hazy with a wavy warped rim -->
        <path d="M262 200 q40 -10 76 0 l-8 66 q-30 8 -60 0 z" fill="#cdd9de"/>
        <path d="M262 200 q40 -10 76 0 l-8 66 q-30 8 -60 0 z" fill="#d8cfbe" opacity="0.5"/>
        <!-- warped wavy rim -->
        <path d="M258 200 q20 -14 42 -4 q22 -12 44 2" fill="none" stroke="#b9b1a3" stroke-width="6" stroke-linecap="round"/>
        <!-- baked-in tomato/curry stain -->
        <ellipse cx="300" cy="238" rx="18" ry="14" fill="#d9663f" opacity="0.5"/>
        <ellipse cx="288" cy="252" rx="8" ry="6" fill="#c96f4a" opacity="0.5"/>
        <!-- crack / craze lines -->
        <path d="M320 214 l8 22 M326 220 l-6 6" stroke="#8a6a4f" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <!-- deep scratches -->
        <g stroke="#b9b1a3" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
          <line x1="272" y1="216" x2="292" y2="212"/>
          <line x1="270" y1="230" x2="286" y2="228"/>
        </g>
        <!-- recycling-number triangle on the base -->
        <g transform="translate(300 262)">
          <path d="M-9 6 l9 -12 l9 12 z" fill="none" stroke="#5e9a78" stroke-width="2.2" stroke-linejoin="round"/>
          <text x="0" y="6" font-size="9" fill="#3e7c59" text-anchor="middle" font-weight="700">5</text>
        </g>
      </g>
      <!-- motion arc toward the bin -->
      <path d="M336 176 q60 -6 108 40" fill="none" stroke="#c96f4a" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 8" opacity="0.7"/>

      <!-- RECYCLING BIN, right -->
      <path d="M440 236 h84 l-10 78 h-64 z" fill="#5e9a78"/>
      <path d="M436 232 h92 l-3 12 h-86 z" fill="#3e7c59"/>
      <!-- recycling arrows symbol on the bin -->
      <g transform="translate(482 274)" stroke="#fffdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-11 -4 l6 -10 l6 3"/>
        <path d="M12 -1 l-2 11 l-7 -1"/>
        <path d="M-4 12 l-9 -6 l4 -6"/>
      </g>

      <!-- FRESH clear container on the counter, left of bin -->
      <path d="M360 262 q34 -8 64 0 l-6 50 q-26 6 -52 0 z" fill="#dce8ee"/>
      <path d="M356 262 q32 -12 72 0" fill="none" stroke="#7fb3c8" stroke-width="5" stroke-linecap="round"/>
      <!-- shine on the clear container -->
      <g stroke="#fffdf8" stroke-width="4" stroke-linecap="round" opacity="0.85">
        <line x1="372" y1="300" x2="382" y2="276"/>
        <line x1="384" y1="304" x2="392" y2="284"/>
      </g>
      <g stroke="#5e9a78" stroke-width="2.2" stroke-linecap="round">
        <path d="M406 280 l0 8 M402 284 l8 0"/>
      </g>

      <!-- GLASS container on the counter, front-left -->
      <path d="M104 258 q52 -8 100 0 l-4 54 q-44 8 -92 0 z" fill="#dce8ee" opacity="0.7"/>
      <path d="M100 258 h108 l-2 10 h-104 z" fill="#7fb3c8"/>
      <!-- glass lid clip / band -->
      <rect x="100" y="250" width="108" height="9" rx="3" fill="#5e9a78"/>
      <!-- glass sheen -->
      <g stroke="#fffdf8" stroke-width="5" stroke-linecap="round" opacity="0.8">
        <line x1="122" y1="304" x2="136" y2="272"/>
        <line x1="140" y1="308" x2="150" y2="284"/>
      </g>
      <text x="154" y="298" font-size="12" fill="#3e7c59" font-weight="700">glass</text>

      <!-- little herb / plant on the counter for warmth, far right -->
      <path d="M526 300 h24 l-4 22 h-16 z" fill="#c96f4a"/>
      <path d="M537 300 q-3 -18 -11 -24" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M537 300 q4 -16 13 -21" stroke="#3e7c59" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="522" cy="272" rx="6" ry="10" fill="#5e9a78" transform="rotate(-30 522 272)"/>
      <ellipse cx="550" cy="276" rx="6" ry="10" fill="#3e7c59" transform="rotate(28 550 276)"/>
    </svg>
